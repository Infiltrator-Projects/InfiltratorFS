# SPDX-License-Identifier: GPL-3.0-or-later
name: Fix Linux 7 UUID parser compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-linux7-hex-parser.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace kernel hex_to_bin dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/infiltratorfs_linux_meta.inc')
          s = p.read_text()
          anchor = '''static bool infilfs_linux_meta_parse_uuid_name(\n    const u8 *name, size_t length, u8 object_id[16])\n{\n'''
          helper = '''static int infilfs_linux_meta_hex_nibble(u8 c)\n{\n    if (c >= '0' && c <= '9')\n        return c - '0';\n    if (c >= 'a' && c <= 'f')\n        return c - 'a' + 10;\n    if (c >= 'A' && c <= 'F')\n        return c - 'A' + 10;\n    return -EINVAL;\n}\n\nstatic bool infilfs_linux_meta_parse_uuid_name(\n    const u8 *name, size_t length, u8 object_id[16])\n{\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'parse anchor count={s.count(anchor)}')
          s = s.replace(anchor, helper, 1)
          old = '        value = hex_to_bin(name[i]);\n'
          new = '        value = infilfs_linux_meta_hex_nibble(name[i]);\n'
          if s.count(old) != 1:
              raise SystemExit(f'hex_to_bin anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          ! grep -R -n '\bhex_to_bin\b' kernel/infiltratorfs_linux_meta.inc
          grep -Fq 'static int infilfs_linux_meta_hex_nibble(u8 c)' kernel/infiltratorfs_linux_meta.inc
          grep -Fq 'value = infilfs_linux_meta_hex_nibble(name[i]);' kernel/infiltratorfs_linux_meta.inc

      - name: Compile native kernel module
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) dwarves
          make -C kernel clean
          make -C kernel KDIR=/lib/modules/$(uname -r)/build -j"$(nproc)"
          test -s kernel/infiltratorfs.ko

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_linux_meta.inc
          git commit -m 'Fix Linux 7 UUID sidecar parser build'
          git push origin HEAD:main
