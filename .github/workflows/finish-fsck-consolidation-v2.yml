# SPDX-License-Identifier: GPL-3.0-or-later
name: Finish fsck command consolidation v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-fsck-consolidation-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply complete consolidation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def need(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing required pattern: {label}')
              return text.replace(old, new)

          p = '.github/workflows/kernel-module.yml'
          s = load(p)
          s = need(s, 'infilfs-tool infilfs-scrub infilfs-forensic',
                   'infilfs-tool fsck.infiltratorfs infilfs-forensic',
                   'kernel build target')
          s = need(s, 'build/infilfs-scrub ',
                   'build/fsck.infiltratorfs --scrub ',
                   'kernel scrub invocations')
          save(p, s)

          p = 'tests/root-boot-qemu.sh'
          s = load(p)
          s = need(s, '"$build/infilfs-scrub" ',
                   '"$build/fsck.infiltratorfs" --scrub ',
                   'root boot scrub invocations')
          save(p, s)

          p = 'tests/native-complete-qualification.sh'
          s = load(p)
          s = need(s, '"$BUILD/infilfs-scrub" ',
                   '"$BUILD/fsck.infiltratorfs" --scrub ',
                   'native complete scrub invocation')
          save(p, s)

          p = 'tests/native-partition22-qualification.sh'
          s = load(p)
          s = s.replace('command -v infilfs-scrub', 'command -v fsck.infiltratorfs')
          s = s.replace('infilfs-scrub "$TARGET"',
                        'fsck.infiltratorfs --scrub "$TARGET"')
          s = s.replace('fsck wrapper is clean', 'structural fsck is clean')
          s = s.replace('fsck wrapper failed', 'structural fsck failed')
          if 'infilfs-scrub' in s:
              raise SystemExit('native-partition22 still refers to retired infilfs-scrub')
          save(p, s)

          p = 'tools/infiltratorfs-manager-helper'
          s = load(p)
          old = '''    scrub-block)\n        (( $# == 1 )) || fail "scrub-block requires a target"\n        validate_partition "$1"\n        [[ -z "$(findmnt -rn -S "$1")" ]] || fail "unmount the partition before running integrity verification"\n        exec /usr/sbin/fsck.infiltratorfs --scrub "$1"\n        ;;\n'''
          new = '''    check-block)\n        (( $# == 1 )) || fail "check-block requires a target"\n        validate_partition "$1"\n        [[ -z "$(findmnt -rn -S "$1")" ]] || fail "unmount the partition before running filesystem checking"\n        exec /usr/sbin/fsck.infiltratorfs "$1"\n        ;;\n    scrub-block)\n        (( $# == 1 )) || fail "scrub-block requires a target"\n        validate_partition "$1"\n        [[ -z "$(findmnt -rn -S "$1")" ]] || fail "unmount the partition before running deep integrity verification"\n        exec /usr/sbin/fsck.infiltratorfs --scrub "$1"\n        ;;\n'''
          s = need(s, old, new, 'manager helper check/scrub split')
          save(p, s)

          p = 'tools/infiltratorfs-manager'
          s = load(p)
          s = need(s, '    "scrub": "/usr/bin/infilfs-scrub",',
                   '    "fsck": "/usr/sbin/fsck.infiltratorfs",',
                   'manager tool map')
          old = '''        self.scrub = self._action_row(\n            maintenance,\n            "emblem-ok-symbolic",\n            "Verify integrity",\n            "Run the read-only scrub and integrity checker.",\n            "Verify",\n            self.do_scrub,\n        )\n'''
          new = '''        self.check = self._action_row(\n            maintenance,\n            "emblem-ok-symbolic",\n            "Check filesystem",\n            "Run the fast structural consistency check without reading every file payload.",\n            "Check",\n            self.do_check,\n        )\n        self.scrub = self._action_row(\n            maintenance,\n            "system-run-symbolic",\n            "Deep scrub",\n            "Read file payloads, recompute checksums and verify retained generations.",\n            "Scrub",\n            self.do_scrub,\n        )\n'''
          s = need(s, old, new, 'manager action rows')
          s = need(s,
                   '        for button in (self.inspect, self.scrub, self.forensic):',
                   '        for button in (self.inspect, self.check, self.scrub, self.forensic):',
                   'manager enabled controls')
          old = '''    def tool_command(self, blockop, tool):\n        if not self.target:\n            return None\n        return (\n            ["pkexec", HELPER, blockop, self.target.path]\n            if self.target.block\n            else [tool, self.target.path]\n        )\n'''
          new = '''    def tool_command(self, blockop, tool, *tool_args):\n        if not self.target:\n            return None\n        return (\n            ["pkexec", HELPER, blockop, self.target.path]\n            if self.target.block\n            else [tool, *tool_args, self.target.path]\n        )\n'''
          s = need(s, old, new, 'manager tool args')
          old = '''    def do_scrub(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("scrub-block", TOOLS["scrub"])\n        if command:\n            self.run("Verify filesystem", [command], "Integrity check completed.")\n'''
          new = '''    def do_check(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("check-block", TOOLS["fsck"])\n        if command:\n            self.run("Check filesystem", [command], "Structural filesystem check completed.")\n\n    def do_scrub(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("scrub-block", TOOLS["fsck"], "--scrub")\n        if command:\n            self.run("Deep scrub", [command], "Deep integrity scrub completed.")\n'''
          s = need(s, old, new, 'manager operations')
          save(p, s)

          p = 'README.md'
          s = load(p)
          s = need(
              s,
              'The standalone `infilfs-scrub` command remains available for forensic, qualification and deliberate deep-integrity work.',
              'There is no separate scrub executable: deep verification is intentionally a secondary mode of `fsck.infiltratorfs`.',
              'README scrub command contract')
          s = s.replace(
              'inspection/scrub/forensic tools, `mount.infiltratorfs`, `fsck.infiltratorfs`',
              'inspection/forensic tools, the unified `fsck.infiltratorfs` checker with optional `--scrub`, `mount.infiltratorfs`')
          save(p, s)

          for p in ('docs/FORENSICS.md', 'docs/ON_DISK_FORMAT.md'):
              s = load(p)
              s = need(s, '`infilfs-scrub`', '`fsck.infiltratorfs --scrub`', p)
              save(p, s)

          allowed = {
              'docs/FSCK-SCRUB-SEPARATION.md',
              'tests/root-volume-integration-policy.sh',
              'tests/system-utilities.sh',
              '.github/workflows/root-volume-qualification.yml',
              '.github/workflows/finish-fsck-consolidation.yml',
              '.github/workflows/finish-fsck-consolidation-v2.yml',
          }
          bad = []
          for f in Path('.').rglob('*'):
              if not f.is_file() or '.git' in f.parts:
                  continue
              try:
                  t = f.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              rel = f.as_posix().removeprefix('./')
              if 'infilfs-scrub' in t and rel not in allowed:
                  bad.append(rel)
          if bad:
              raise SystemExit('unexpected retired scrub references: ' + ', '.join(sorted(bad)))
          PY

          python3 -m py_compile tools/infiltratorfs-manager
          bash -n tools/infiltratorfs-manager-helper \
                  tests/root-boot-qemu.sh \
                  tests/native-complete-qualification.sh \
                  tests/native-partition22-qualification.sh
          git diff --check

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add .github/workflows/kernel-module.yml \
                  tests/root-boot-qemu.sh \
                  tests/native-complete-qualification.sh \
                  tests/native-partition22-qualification.sh \
                  tools/infiltratorfs-manager \
                  tools/infiltratorfs-manager-helper \
                  README.md docs/FORENSICS.md docs/ON_DISK_FORMAT.md
          git diff --cached --quiet && exit 0
          git commit -m 'Finish fsck scrub command consolidation'
          git push origin HEAD:main
