# SPDX-License-Identifier: GPL-3.0-or-later
name: Fix buffered project assignment quota accounting

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-buffered-project-set-quota.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply buffered project quota repair
        run: |
          set -euo pipefail
          python3 .github/fix-buffered-project-set-quota.py
          rm -f .github/fix-buffered-project-set-quota.py
          rm -f .github/workflows/fix-buffered-project-set-quota.yml
          git diff --check
          grep -Fq 'Quota admission and project-domain' kernel/infiltratorfs_quota.inc
          bash tests/native-quota-policy.sh .
          bash tests/native-kernel-maintainability-policy.sh .
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Account buffered data in project assignment quotas'
          git push origin HEAD:main
