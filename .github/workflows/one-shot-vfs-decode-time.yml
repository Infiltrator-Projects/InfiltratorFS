# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot dead VFS time helper cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-vfs-decode-time.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove dead VFS time helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git grep -n 'infilfs_vfs_decode_time' -- kernel/infiltratorfs_rw.inc | wc -l)" -eq 1
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kernel/infiltratorfs_rw.inc')
          text = path.read_text()
          marker = 'static __maybe_unused struct timespec64 infilfs_vfs_decode_time('
          if text.count(marker) != 1:
              raise SystemExit('dead VFS time helper declaration changed')
          n = text.index(marker)
          start = text.rfind('\n/*', 0, n)
          if start < 0:
              raise SystemExit('helper comment start not found')
          start += 1
          brace = text.find('{', n)
          if brace < 0:
              raise SystemExit('helper body not found')
          depth = 0
          end = None
          for i in range(brace, len(text)):
              if text[i] == '{':
                  depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('helper body unterminated')
          while end < len(text) and text[end] in ' \t\n':
              end += 1
          path.write_text(text[:start] + text[end:])

          policy = Path('tests/native-kernel-maintainability-policy.sh')
          text = policy.read_text()
          anchor = "for retired in \\\n    infilfs_checkpoint_bitmap_get \\\n    infilfs_vfs_attributes \\\n    infilfs_native_available_data_blocks; do\n"
          replacement = "for retired in \\\n    infilfs_checkpoint_bitmap_get \\\n    infilfs_vfs_attributes \\\n    infilfs_vfs_decode_time \\\n    infilfs_native_available_data_blocks; do\n"
          if text.count(anchor) != 1:
              raise SystemExit('retired helper policy list changed')
          policy.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Validate dead helper cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git grep -n 'infilfs_vfs_decode_time' -- kernel
          bash tests/native-kernel-maintainability-policy.sh .

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/one-shot-vfs-decode-time.yml
          git add kernel/infiltratorfs_rw.inc tests/native-kernel-maintainability-policy.sh
          git diff --cached --check
          git commit -m 'kernel: remove dead VFS time helper'
          git push origin HEAD:main
