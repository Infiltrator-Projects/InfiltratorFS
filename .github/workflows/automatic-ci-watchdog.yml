# SPDX-License-Identifier: GPL-3.0-or-later
name: Automatic CI ten-minute watchdog

# Native kernel qualification contains exhaustive mounted checks whose normal
# runtime is short but whose internal safety allowances are deliberately longer.
# Ordinary automatic runs are therefore stopped at the project-wide ten-minute
# ceiling. Manual workflow_dispatch runs are exempt so HAL can deliberately run
# the exhaustive qualification when its coverage is warranted.
on:
  workflow_run:
    workflows: ["Native Linux kernel module"]
    types: [in_progress]

permissions:
  actions: write
  contents: read

jobs:
  enforce:
    if: github.event.workflow_run.event != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel automatic kernel qualification at ten-minute boundary
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u -d "$TARGET_STARTED_AT" +%s)"
          now="$(date -u +%s)"
          elapsed=$((now - started))
          # Leave enough margin for the cancellation request itself so the
          # target cannot silently turn into a >10-minute automatic test.
          target_seconds=570
          if (( elapsed < target_seconds )); then
            sleep $((target_seconds - elapsed))
          fi

          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq .status)"
          if [[ "$status" == completed ]]; then
            echo "Automatic kernel qualification completed inside ten minutes."
            exit 0
          fi

          echo "Automatic kernel qualification is still ${status}; cancelling at the ten-minute ceiling."
          code="$(curl -sS -o /tmp/cancel.txt -w '%{http_code}' \
            -L -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel")"
          if [[ "$code" != 202 && "$code" != 409 ]]; then
            cat /tmp/cancel.txt >&2 || true
            echo "Cancellation failed: HTTP ${code}" >&2
            exit 1
          fi
          echo "Cancellation request accepted (HTTP ${code})."
