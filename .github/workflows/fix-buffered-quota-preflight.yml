# SPDX-License-Identifier: GPL-3.0-or-later
name: Fix buffered quota preflight

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-buffered-quota-preflight.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repair buffered write quota semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs_rw_data.inc')
          text = p.read_text(encoding='utf-8')
          old = "static ssize_t infilfs_file_write_iter(struct kiocb *iocb,\n                                       struct iov_iter *from)\n{\n    /*\n     * Ordinary Linux writes use the page cache.  Integrity/compression and\n     * CoW publication happen from clustered writeback, so a userspace writer\n     * no longer serially performs codec and metadata work in write(2).\n     */\n    return generic_file_write_iter(iocb, from);\n}\n"
          new = "static ssize_t infilfs_file_write_iter(struct kiocb *iocb,\n                                       struct iov_iter *from)\n{\n    struct file *filep = iocb->ki_filp;\n    struct inode *inode = file_inode(filep);\n    struct infilfs_quota_reservation preflight = {0};\n    size_t requested;\n    loff_t pos;\n    loff_t old_size;\n    u64 quota_growth = 0;\n    ssize_t ret;\n\n    if (!iov_iter_count(from))\n        return 0;\n\n    /*\n     * Keep ordinary writes buffered, but retain whole-request quota admission.\n     * Per-folio reservations remain authoritative; this preflight only rejects\n     * an append that is already impossible before any part becomes visible.\n     */\n    inode_lock(inode);\n    ret = generic_write_checks(iocb, from);\n    if (ret <= 0)\n        goto out_unlock;\n    requested = (size_t)ret;\n    pos = iocb->ki_pos;\n    if (pos < 0 || (u64)requested > (u64)LLONG_MAX - (u64)pos) {\n        ret = -EFBIG;\n        goto out_unlock;\n    }\n    old_size = i_size_read(inode);\n    if (pos + (loff_t)requested > old_size)\n        quota_growth = (u64)(pos + (loff_t)requested - old_size);\n\n    ret = infilfs_quota_reserve_inode(inode, quota_growth, 0, &preflight);\n    if (ret)\n        goto out_unlock;\n    infilfs_quota_reservation_abort(&preflight);\n\n    /* generic_file_write_iter(), with quota admission after write checks. */\n    ret = __generic_file_write_iter(iocb, from);\n\nout_unlock:\n    inode_unlock(inode);\n    if (ret > 0)\n        ret = generic_write_sync(iocb, ret);\n    return ret;\n}\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'buffered write function: expected one match, got {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-buffered-quota-preflight.yml
          git diff --check
          grep -Fq '__generic_file_write_iter(iocb, from)' kernel/infiltratorfs_rw_data.inc
          grep -Fq 'struct infilfs_quota_reservation preflight' kernel/infiltratorfs_rw_data.inc
          bash tests/native-quota-policy.sh .
          bash tests/native-sequential-write-scaling-policy.sh .
          bash tests/native-deferred-publication-policy.sh .
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Preserve quota rejection with buffered writes'
          git push origin HEAD:main
