# SPDX-License-Identifier: GPL-3.0-or-later
name: Linux metadata qualification

# Run every required exact-source gate on every main revision. Path filters
# can otherwise deadlock immutable release publication after CI-only fixes.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-metadata-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Quota ACL and high-scale xattr durability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake kmod libcap2-bin \
            linux-headers-$(uname -r) util-linux

      - name: Build native metadata qualification targets
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target \
            mkfs.infilfs fsck.infiltratorfs infilfs-tool infiltratorfs-quota
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"

      - name: Prove quota and POSIX ACL remount durability
        env:
          INFILFS_REQUIRE_SETFACL: '1'
        run: sudo -E bash tests/native-quota-qualification.sh build kernel/infiltratorfs.ko

      - name: Prove high-scale Linux xattr performance and durability
        env:
          INFILFS_XATTR_MAX_SECONDS: '60'
        run: sudo -E bash tests/native-linux-metadata-performance-qualification.sh build kernel/infiltratorfs.ko
