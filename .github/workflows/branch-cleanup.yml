name: Remove merged branch debris

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch-cleanup.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete branches only after exact merged-PR proof
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr branch; do
            [[ -n "$pr" && -n "$branch" ]] || continue
            readarray -t fields < <(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
              --json state,mergedAt,headRefName \
              --jq '[.state, (.mergedAt // ""), .headRefName] | .[]')
            [[ "${fields[0]}" == MERGED || ( "${fields[0]}" == CLOSED && -n "${fields[1]}" ) ]]
            [[ -n "${fields[1]}" ]]
            [[ "${fields[2]}" == "$branch" ]]
            git push origin --delete "$branch"
          done <<'EOF'
          40	hal/release-request-identity
          41	hal/release-policy-centralization
          42	hal/simplify-release-machinery
          EOF
