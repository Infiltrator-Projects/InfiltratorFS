# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot dead RW callback cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-rw-dead-callback-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unreachable legacy VFS paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          legacy_path = Path('kernel/infiltratorfs_rw_legacy.inc')
          legacy = legacy_path.read_text()

          def function_names(block):
              names = set()
              for line in block.splitlines():
                  stripped = line.lstrip()
                  if not stripped.startswith('static ') or 'infilfs_' not in line or '(' not in line:
                      continue
                  match = re.search(r'(infilfs_[A-Za-z0-9_]+)\s*\(', line)
                  if match:
                      names.add(match.group(1))
              return names

          create_start = legacy.find('static int infilfs_rw_create_object(')
          load_inline = legacy.find('static int infilfs_rw_load_inline(', create_start)
          if create_start < 0 or load_inline < 0:
              raise SystemExit('dead create-chain boundary not found')
          create_block = legacy[create_start:load_inline]
          expected_create = {
              'infilfs_rw_create_object',
              'infilfs_rw_create_named_child',
              'infilfs_rw_create_child',
          }
          found_create = function_names(create_block)
          if found_create != expected_create:
              raise SystemExit(f'unexpected create-chain functions: {sorted(found_create)}')
          legacy = legacy[:create_start] + legacy[load_inline:]

          replace_start = legacy.find('static int infilfs_rw_replace_inline_locked(')
          if replace_start < 0:
              raise SystemExit('dead inline replacement tail not found')
          tail = legacy[replace_start:]
          expected_tail = {
              'infilfs_rw_replace_inline_locked',
              'infilfs_file_write_iter_legacy',
              'infilfs_rw_create_legacy',
              'infilfs_rw_mkdir_legacy',
              'infilfs_rw_setattr_legacy',
          }
          found_tail = function_names(tail)
          if found_tail != expected_tail:
              raise SystemExit(f'unexpected functions after inline replacement: {sorted(found_tail)}')
          if not tail.rstrip().endswith('}'):
              raise SystemExit('legacy tail no longer ends at a function boundary')
          legacy = legacy[:replace_start].rstrip() + '\n'

          for retired in sorted(expected_create | expected_tail):
              if retired in legacy:
                  raise SystemExit(f'retired function survived cleanup: {retired}')
          for required in (
              'static int infilfs_rw_load_inline(',
              'static int infilfs_rw_tx_begin_legacy(',
              'static int infilfs_rw_mount_init_legacy(',
              'static void infilfs_rw_mount_destroy_legacy(',
          ):
              if required not in legacy:
                  raise SystemExit(f'live legacy primitive lost: {required}')
          legacy_path.write_text(legacy)

          policy_path = Path('tests/native-kernel-maintainability-policy.sh')
          policy = policy_path.read_text()
          start = policy.find('# The include-time symbol-renaming bridge is retired.')
          end = policy.find('grep -Fq \'#include "infiltratorfs_rw_data.inc"\' "$rw" || \\\n', start)
          if start < 0 or end < 0:
              raise SystemExit('maintainability legacy-name block not found')
          replacement = '''# The include-time symbol-renaming bridge is retired. Only the transaction and
          # mount-lifecycle compatibility primitives remain explicitly named _legacy;
          # obsolete VFS callbacks and their private helper chains must stay deleted.
          for name in \\
              infilfs_rw_tx_begin \\
              infilfs_rw_mount_init \\
              infilfs_rw_mount_destroy; do
              ! grep -Eq "^#(define|undef)[[:space:]]+${name}([[:space:]]|$)" "$rw" || \\
                  fail "retired legacy alias bridge returned for $name"
              grep -Fq "${name}_legacy" "$kernel/infiltratorfs_rw_legacy.inc" || \\
                  fail "explicit live legacy primitive missing for $name"
          done
          for retired in \\
              infilfs_file_write_iter_legacy \\
              infilfs_rw_create_legacy \\
              infilfs_rw_mkdir_legacy \\
              infilfs_rw_setattr_legacy \\
              infilfs_rw_create_object \\
              infilfs_rw_create_named_child \\
              infilfs_rw_create_child \\
              infilfs_rw_replace_inline_locked; do
              ! grep -Fq "$retired" "$kernel/infiltratorfs_rw_legacy.inc" || \\
                  fail "dead legacy RW path returned: $retired"
          done
          grep -Fq 'static int infilfs_rw_load_inline(' "$kernel/infiltratorfs_rw_legacy.inc" || \\
              fail 'live inline reader was removed with dead inline writer'
          ! grep -Fq '#define simple_statfs infilfs_statfs' "$rw" || \\
              fail 'VFS statfs callback injection macro returned'
          ! grep -Fq '#define infilfs_get_link infilfs_get_link' "$rw" || \\
              fail 'VFS symlink callback injection macro returned'
          grep -Fq '.statfs = infilfs_statfs,' "$driver" || \\
              fail 'superblock statfs callback is no longer explicit'
          grep -Fq '.create = infilfs_posix_acl_create,' "$driver" || \\
              fail 'directory create callback is no longer explicit'
          grep -Fq '.mknod = infilfs_posix_acl_mknod,' "$driver" || \\
              fail 'directory mknod callback is no longer explicit'
          grep -Fq '.tmpfile = infilfs_posix_acl_tmpfile,' "$driver" || \\
              fail 'directory tmpfile callback is no longer explicit'
          grep -Fq '.rename = infilfs_ns_rename,' "$driver" || \\
              fail 'directory rename callback is no longer explicit'

          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          ) + '\n'
          policy_path.write_text(policy[:start] + replacement + policy[end:])
          PY

      - name: Validate dead-code removal
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash tests/native-kernel-maintainability-policy.sh .
          bash tests/native-free-extent-index-policy.sh .
          bash tests/native-small-file-scaling-policy.sh .
          bash tests/native-deferred-publication-policy.sh .
          for retired in \
            infilfs_file_write_iter_legacy \
            infilfs_rw_create_legacy \
            infilfs_rw_mkdir_legacy \
            infilfs_rw_setattr_legacy \
            infilfs_rw_create_object \
            infilfs_rw_create_named_child \
            infilfs_rw_create_child \
            infilfs_rw_replace_inline_locked; do
            ! grep -Fq "$retired" kernel/infiltratorfs_rw_legacy.inc
          done
          git diff --stat
          git diff -- kernel/infiltratorfs_rw_legacy.inc tests/native-kernel-maintainability-policy.sh

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/one-shot-rw-dead-callback-cleanup.yml
          git add kernel/infiltratorfs_rw_legacy.inc tests/native-kernel-maintainability-policy.sh
          git diff --cached --check
          git commit -m 'kernel: remove unreachable legacy RW callbacks'
          git push origin HEAD:main
