# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot kernel verified-read refactor

on:
  push:
    paths:
      - '.github/workflows/kernel-read-cache-object-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply verified-read refactor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/kernel-read-cache-object-refactor.py')
          data = path.read_text()
          start = data.index('# Move the two small read-integrity state records')
          end = data.index('# Read-cache services supplied by the data path', start)
          replacement = '''# Move the small read-integrity records using explicit source delimiters.\n'''
          replacement += '''dt = data_path.read_text()\n\n'''
          replacement += '''def take_before(text, start_marker, next_marker):\n    start = text.index(start_marker)\n    end = text.index(next_marker, start)\n    return text[start:end], text[:start] + text[end:]\n\n'''
          replacement += '''payload_block, dt = take_before(\n    dt, 'struct infilfs_native_checksum_payload_disk {',\n    'struct infilfs_native_index_change {')\nentry_block, dt = take_before(\n    dt, 'struct infilfs_native_checksum_cache_entry {',\n    'struct infilfs_native_checksum_node {')\ncursor_block, dt = take_before(\n    dt, '#define INFILFS_NATIVE_READ_INTEGRITY_PARITY 1\\n',\n    'static int infilfs_native_read_expected_digest(')\n\n'''
          path.write_text(data[:start] + replacement + data[end:])
          PY
          python3 tools/kernel-read-cache-object-refactor.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('kernel/infiltratorfs_read_cache.c')
          data = source.read_text()
          old = 'static ssize_t infilfs_native_read_iter_cached('
          assert data.count(old) == 1
          source.write_text(data.replace(old, 'ssize_t infilfs_native_read_iter_cached(', 1))

          header = Path('kernel/infiltratorfs_internal.h')
          data = header.read_text()
          anchor = 'ssize_t infilfs_file_read_iter_cached(struct kiocb *iocb, struct iov_iter *to);\n'
          assert anchor in data
          proto = '''ssize_t infilfs_native_read_iter_cached(
              struct inode *inode, loff_t *position, struct iov_iter *to);
          '''
          header.write_text(data.replace(anchor, proto + anchor, 1))
          PY
          rm -f tools/kernel-read-cache-object-refactor.py
          rm -f .github/workflows/kernel-read-cache-object-refactor.yml
          git diff --check

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic kmod

      - name: Verify read/integrity policies
        run: |
          set -euo pipefail
          bash tests/native-kernel-maintainability-policy.sh .
          bash tests/native-random-write-optimization-policy.sh .
          bash tests/native-sequential-write-scaling-policy.sh .
          bash tests/native-transaction-durability-policy.sh .
          bash tests/native-index-tree-policy.sh .

      - name: Build seven-object kernel module
        shell: bash
        run: |
          set -euo pipefail
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n 1)"
          test -f "$KDIR/Makefile"
          make -C kernel KDIR="$KDIR"
          test -s kernel/infiltratorfs.ko
          test "$(modinfo -F name kernel/infiltratorfs.ko)" = infiltratorfs

      - name: Commit qualified refactor
        shell: bash
        run: |
          set -euo pipefail
          find kernel -maxdepth 1 -type f \( \
            -name '*.o' -o -name '*.ko' -o -name '*.mod' -o \
            -name '*.mod.c' -o -name '*.cmd' -o -name '.*.cmd' -o \
            -name 'Module.symvers' -o -name 'modules.order' \
          \) -delete
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Kernel: split verified-read cache into Kbuild object'
          git push origin HEAD:main
