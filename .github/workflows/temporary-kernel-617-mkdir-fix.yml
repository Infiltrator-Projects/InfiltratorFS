name: Temporary Linux 6.17 mkdir compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-kernel-617-mkdir-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch Linux 6.17 mkdir return type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs_rw.inc')
          s = p.read_text()
          old = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 3, 0)\nstatic int infilfs_rw_mkdir(struct mnt_idmap *idmap, struct inode *dir,\n                            struct dentry *dentry, umode_t mode)\n#else\nstatic int infilfs_rw_mkdir(struct user_namespace *idmap, struct inode *dir,\n                            struct dentry *dentry, umode_t mode)\n#endif\n{\n    struct inode *inode;\n    u8 id[16];\n    u64 block;\n    int ret;\n\n    (void)idmap;\n    ret = infilfs_rw_create_child(dir, dentry, mode, INFILFS_OBJECT_DIRECTORY,\n                                  id, &block);\n    if (ret)\n        return ret;\n    inode = infilfs_get_inode(dir->i_sb, block, INFILFS_OBJECT_DIRECTORY, id);\n    if (IS_ERR(inode))\n        return PTR_ERR(inode);\n    d_instantiate(dentry, inode);\n    inc_nlink(dir);\n    return 0;\n}\n'''
          new = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 17, 0)\nstatic struct dentry *infilfs_rw_mkdir(struct mnt_idmap *idmap,\n                                       struct inode *dir,\n                                       struct dentry *dentry, umode_t mode)\n#elif LINUX_VERSION_CODE >= KERNEL_VERSION(6, 3, 0)\nstatic int infilfs_rw_mkdir(struct mnt_idmap *idmap, struct inode *dir,\n                            struct dentry *dentry, umode_t mode)\n#else\nstatic int infilfs_rw_mkdir(struct user_namespace *idmap, struct inode *dir,\n                            struct dentry *dentry, umode_t mode)\n#endif\n{\n    struct inode *inode;\n    u8 id[16];\n    u64 block;\n    int ret;\n\n    (void)idmap;\n    ret = infilfs_rw_create_child(dir, dentry, mode, INFILFS_OBJECT_DIRECTORY,\n                                  id, &block);\n    if (ret) {\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 17, 0)\n        return ERR_PTR(ret);\n#else\n        return ret;\n#endif\n    }\n    inode = infilfs_get_inode(dir->i_sb, block, INFILFS_OBJECT_DIRECTORY, id);\n    if (IS_ERR(inode)) {\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 17, 0)\n        return ERR_PTR(PTR_ERR(inode));\n#else\n        return PTR_ERR(inode);\n#endif\n    }\n    d_instantiate(dentry, inode);\n    inc_nlink(dir);\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 17, 0)\n    return NULL;\n#else\n    return 0;\n#endif\n}\n'''
          if new in s:
              raise SystemExit('Linux 6.17 mkdir fix already present')
          if old not in s:
              raise SystemExit('mkdir implementation marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential kmod linux-headers-generic
      - name: Build generic module
        shell: bash
        run: |
          set -euo pipefail
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n1)"
          test -f "$KDIR/Makefile"
          make -C kernel clean KDIR="$KDIR" || true
          make -C kernel KDIR="$KDIR"
          test -s kernel/infiltratorfs.ko
      - name: Build running-kernel module when headers exist
        shell: bash
        run: |
          set -euo pipefail
          KDIR="/lib/modules/$(uname -r)/build"
          if [[ -f "$KDIR/Makefile" ]]; then
            make -C kernel clean KDIR="$KDIR"
            make -C kernel KDIR="$KDIR"
            test -s kernel/infiltratorfs.ko
          else
            echo "Running-kernel headers unavailable; permanent kernel workflow will report that condition."
          fi
      - name: Commit compatibility fix
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_rw.inc
          git commit -m 'Support Linux 6.17 mkdir VFS API'
          git push origin HEAD:main
