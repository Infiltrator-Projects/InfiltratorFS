# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot CI maintainability repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-repair.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-ci-maintainability-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate and validate maintenance-safe CI blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')

          old_trigger = "\n".join([
              "on:",
              "  push:",
              "    branches:",
              "      - main",
              "  schedule:",
              "",
          ])
          new_trigger = "\n".join([
              "on:",
              "  push:",
              "    branches:",
              "      - main",
              "  pull_request:",
              "  schedule:",
              "",
          ])
          if text.count(old_trigger) != 1:
              raise SystemExit('expected exactly one CI trigger block to update')
          text = text.replace(old_trigger, new_trigger, 1)

          anchor = "          grep -Fq 'workflows: [\"Build and conformance\"]' \"$release\"\n"
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one obsolete release-workflow compatibility grep')
          text = text.replace(anchor, '', 1)

          start_marker = "          # A published/tagged version is immutable."
          end_marker = "          if grep -Eq '^  workflow_dispatch:|^  pull_request:|^  schedule:' \"$release\"; then"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('tagged-version policy markers are missing or ambiguous')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          indent = "          "
          policy_lines = [
              "# Published releases remain immutable, but ordinary development commits",
              "# are allowed to continue from the last released source identity. A",
              "# new Release x.y.z commit must still use a version whose existing tag",
              "# either does not exist or already points at this exact commit. The",
              "# publisher independently refuses duplicate tags/releases as a second",
              "# safety boundary.",
              "subject=\"$(git log -1 --format=%s)\"",
              "tag_refs=\"$(git ls-remote --tags origin \\",
              "  \"refs/tags/v${source_version}\" \"refs/tags/v${source_version}^{}\")\"",
              "if [[ -n \"$tag_refs\" ]]; then",
              "  tag_commit=\"$(awk '$2 ~ /\\^\\{\\}$/ { print $1 }' <<<\"$tag_refs\" | tail -n1)\"",
              "  if [[ -z \"$tag_commit\" ]]; then",
              "    tag_commit=\"$(awk 'NR == 1 { print $1 }' <<<\"$tag_refs\")\"",
              "  fi",
              "  head_commit=\"$(git rev-parse HEAD)\"",
              "  if [[ \"$tag_commit\" != \"$head_commit\" && \\",
              "        ( \"$subject\" == \"Release ${source_version}\" || \\",
              "          \"$subject\" == \"Release ${source_version}:\"* ) ]]; then",
              "    printf 'Release version %s is already tagged at %s; current release candidate is %s. Choose a new release version.\\n' \\",
              "      \"$source_version\" \"$tag_commit\" \"$head_commit\" >&2",
              "    exit 1",
              "  fi",
              "fi",
              "",
          ]
          new_policy = "\n".join(indent + line if line else "" for line in policy_lines)
          text = text[:start] + new_policy + text[end:]
          ci.write_text(text, encoding='utf-8')

          release = Path('.github/workflows/release-packages.yml')
          rtext = release.read_text(encoding='utf-8')
          obsolete = "\n".join([
              "# Compatibility anchor for the older release-policy grep in ci.yml; the actual",
              "# publisher trigger is the four prerequisite workflows below.",
              "# workflows: [\"Build and conformance\"]",
              "",
          ])
          if rtext.count(obsolete) != 1:
              raise SystemExit('expected exactly one obsolete compatibility anchor')
          release.write_text(rtext.replace(obsolete, '', 1), encoding='utf-8')
          PY

          grep -Fq '  pull_request:' .github/workflows/ci.yml
          ! grep -Fq 'workflows: ["Build and conformance"]' .github/workflows/ci.yml
          ! grep -Fq 'Compatibility anchor for the older release-policy grep' .github/workflows/release-packages.yml
          grep -Fq 'ordinary development commits' .github/workflows/ci.yml
          grep -Fq 'publisher independently refuses duplicate tags/releases' .github/workflows/ci.yml
          grep -Fq "startsWith(github.event.workflow_run.head_commit.message, 'Release ')" .github/workflows/release-packages.yml
          grep -Fq "github.event.workflow_run.head_branch == 'main'" .github/workflows/release-packages.yml
          grep -Fq '! git rev-parse -q --verify "refs/tags/${tag}"' .github/workflows/release-packages.yml
          grep -Fq '! gh release view "$tag"' .github/workflows/release-packages.yml
          git diff --check

          ci_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' .github/workflows/ci.yml | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          release_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' .github/workflows/release-packages.yml | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          printf 'VALIDATED_CI_BLOB=%s\n' "$ci_blob"
          printf 'VALIDATED_RELEASE_BLOB=%s\n' "$release_blob"
          git diff --stat
