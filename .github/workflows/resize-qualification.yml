# SPDX-License-Identifier: GPL-3.0-or-later
name: Native resize qualification

on:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'tests/native-resize-qualification.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/resize-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-resize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resize:
    name: Mounted online grow and bounded shrink
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake kmod linux-headers-generic

      - name: Resolve running-kernel headers
        id: headers
        shell: bash
        run: |
          set -euo pipefail
          runtime_release="$(uname -r)"
          runtime_kdir="/lib/modules/${runtime_release}/build"
          if [[ ! -f "$runtime_kdir/Makefile" ]]; then
            sudo apt-get install -y "linux-headers-${runtime_release}" || true
          fi
          if [[ -f "$runtime_kdir/Makefile" ]]; then
            printf 'runtime_kdir=%s\n' "$runtime_kdir" >> "$GITHUB_OUTPUT"
            printf 'Mounted resize qualification available on %s.\n' "$runtime_release"
          else
            printf 'runtime_kdir=\n' >> "$GITHUB_OUTPUT"
            printf 'Running-kernel headers for %s are unavailable on this hosted runner.\n' \
              "$runtime_release"
          fi

      - name: Build resize userspace tools
        if: steps.headers.outputs.runtime_kdir != ''
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target \
            mkfs.infilfs infilfs-scrub infiltratorfs-resize

      - name: Build module for running kernel
        if: steps.headers.outputs.runtime_kdir != ''
        env:
          KDIR: ${{ steps.headers.outputs.runtime_kdir }}
        run: |
          make -C kernel clean KDIR="$KDIR"
          make -C kernel KDIR="$KDIR"
          test "$(modinfo -F vermagic kernel/infiltratorfs.ko | awk '{print $1}')" = \
               "$(uname -r)"

      - name: Mounted resize qualification
        if: steps.headers.outputs.runtime_kdir != ''
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/native-resize-qualification.sh
          bash tests/native-resize-qualification.sh build kernel/infiltratorfs.ko

      - name: Require mounted qualification availability
        if: steps.headers.outputs.runtime_kdir == ''
        run: |
          echo 'Mounted resize qualification could not run because matching hosted-runner kernel headers were unavailable.' >&2
          exit 1
