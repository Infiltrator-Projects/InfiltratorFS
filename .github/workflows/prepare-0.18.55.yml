# SPDX-License-Identifier: GPL-3.0-or-later
name: Prepare 0.18.55 release metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.18.55.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update source and documentation version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          replace_once('CMakeLists.txt',
                       'project(InfiltratorFS VERSION 0.18.54 LANGUAGES C)',
                       'project(InfiltratorFS VERSION 0.18.55 LANGUAGES C)')
          replace_once('CMakeLists.txt',
                       '# Development qualification anchor: 0.18.54',
                       '# Development qualification anchor: 0.18.55')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          for old, new in (
              ('**Current source version:** 0.18.54 (Format 0.18)<br>',
               '**Current source version:** 0.18.55 (Format 0.18)<br>'),
              ('**Current source:** 0.18.54<br>',
               '**Current source:** 0.18.55<br>'),
              ('**Latest published release:** v0.18.53<br>',
               '**Latest published release:** v0.18.54<br>'),
          ):
              if old not in text:
                  raise SystemExit(f'missing expected README text: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          replace_once('docs/FSCK-SCRUB-SEPARATION.md',
                       'Status: implementation correction in progress after 0.18.54 exposed an incomplete consolidation.',
                       'Status: corrected for 0.18.55; fsck is the single maintenance command and deep scrub is an explicit mode.')
          PY
          git diff --check
          grep -Fq 'project(InfiltratorFS VERSION 0.18.55 LANGUAGES C)' CMakeLists.txt
          grep -Fq '**Current source version:** 0.18.55 (Format 0.18)<br>' README.md
          grep -Fq '**Latest published release:** v0.18.54<br>' README.md
      - name: Commit preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add CMakeLists.txt README.md docs/FSCK-SCRUB-SEPARATION.md
          git commit -m 'Prepare 0.18.55 unified fsck release'
          git push origin HEAD:main
