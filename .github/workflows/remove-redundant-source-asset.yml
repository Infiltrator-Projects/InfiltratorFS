# SPDX-License-Identifier: GPL-3.0-or-later
name: Remove redundant source release asset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-redundant-source-asset.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove separately uploaded source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_name='InfiltratorFS-0.9.13-source.zip'
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.9.13" \
            --jq ".assets[] | select(.name == \"${asset_name}\") | .id")"
          if [[ -z "$asset_id" ]]; then
            printf '%s is already absent.\n' "$asset_name"
            exit 0
          fi
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          if gh release view v0.9.13 --json assets \
            --jq '.assets[].name' | grep -Fqx "$asset_name"; then
            printf 'Failed to remove %s.\n' "$asset_name" >&2
            exit 1
          fi
          printf 'Removed %s.\n' "$asset_name"
