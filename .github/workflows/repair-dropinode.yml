# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot cross-kernel inode repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-dropinode.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Keep inode eviction compatible across supported kernels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs.c')
          s = p.read_text()
          old = '    .drop_inode = inode_just_drop,\n'
          if s.count(old) != 1:
              raise SystemExit('expected inode_just_drop hook exactly once')
          p.write_text(s.replace(old, '', 1))

          p = Path('README.md')
          s = p.read_text()
          old = 'Implementation 0.16.11 ports the packaged native Linux read-only module to the current fs_context/get_tree_bdev VFS mount API used by Linux 7.0, replaces the removed generic_delete_inode drop hook with inode_just_drop, and makes a DKMS build failure non-fatal to installation of the userspace/FUSE tools. Format 0.12 is unchanged.'
          new = 'Implementation 0.16.11 ports the packaged native Linux read-only module to the current fs_context/get_tree_bdev VFS mount API used by Linux 7.0, relies on the VFS default inode-drop policy for compatibility across supported kernel generations, and makes a DKMS build failure non-fatal to installation of the userspace/FUSE tools. Format 0.12 is unchanged.'
          if s.count(old) != 1:
              raise SystemExit('expected 0.16.11 README note exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add kernel/infiltratorfs.c README.md
          git diff --cached --check
          git commit -m "Fix native inode drop compatibility"
          git push origin HEAD:main
