# SPDX-License-Identifier: GPL-3.0-or-later
name: Forensic repository repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/forensic-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply reviewed repairs
        run: python3 tools/forensic-repair.py
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/forensic-repair.yml tools/forensic-repair.py
          git add -A
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Forensic architecture and release cleanup for 0.18.98'
          git push origin HEAD:main
