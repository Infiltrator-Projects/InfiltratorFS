# SPDX-License-Identifier: GPL-3.0-or-later
name: Temporary Linux reflink repair

on:
  push:
    branches:
      - fix/v0.18.94-linux-release

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.18.94-linux-release

      - name: Repair compressed FICLONERANGE boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kernel/infiltratorfs_defrag.inc')
          s = path.read_text()

          marker = '''static int infilfs_native_reflink_range(\n    struct file *source_file, loff_t pos_in,\n'''
          helper = r'''/*
           * FICLONERANGE is expressed in logical file blocks, while an IAC1
           * compressed extent is an indivisible physical stream.  When a
           * clone boundary cuts through such a stream, materialize only that
           * boundary extent inside the same transaction before sharing it.
           * Fully covered compressed extents remain compressed and shared.
           */
          static int infilfs_reflink_materialize_boundaries(
              struct infilfs_native_pending *pending, struct inode *inode,
              const struct infilfs_file_payload_disk *file,
              struct infilfs_extent_disk **extents_inout,
              u32 *extent_count_inout, u64 logical_blocks,
              u64 range_start, u64 range_blocks, bool *changed_out)
          {
              u64 range_end;
              u64 physical;
              u64 extent_start;
              u32 flags;
              u32 extent_blocks;
              bool changed = false;
              int ret;

              if (!range_blocks || range_start > U64_MAX - range_blocks)
                  return -EINVAL;
              range_end = range_start + range_blocks;

              if (range_start < logical_blocks) {
                  ret = infilfs_native_map_extent_detail(
                      *extents_inout, *extent_count_inout, range_start,
                      &physical, &flags, &extent_start, &extent_blocks);
                  if (ret)
                      return ret;
                  if (extent_start > U64_MAX - extent_blocks)
                      return -EFSCORRUPTED;
                  if (infilfs_extent_is_compressed(flags) &&
                      extent_start < range_start) {
                      ret = infilfs_native_materialize_compressed_at_locked(
                          pending, inode, file, extents_inout,
                          extent_count_inout, logical_blocks, range_start);
                      if (ret)
                          return ret;
                      changed = true;
                  }
              }

              if (range_end && range_end < logical_blocks) {
                  ret = infilfs_native_map_extent_detail(
                      *extents_inout, *extent_count_inout, range_end - 1u,
                      &physical, &flags, &extent_start, &extent_blocks);
                  if (ret)
                      return ret;
                  if (extent_start > U64_MAX - extent_blocks)
                      return -EFSCORRUPTED;
                  if (infilfs_extent_is_compressed(flags) &&
                      extent_start + extent_blocks > range_end) {
                      ret = infilfs_native_materialize_compressed_at_locked(
                          pending, inode, file, extents_inout,
                          extent_count_inout, logical_blocks, range_end - 1u);
                      if (ret)
                          return ret;
                      changed = true;
                  }
              }

              if (changed_out)
                  *changed_out = changed;
              return 0;
          }

          static int infilfs_native_reflink_range(
              struct file *source_file, loff_t pos_in,
'''
          if s.count(marker) != 1:
              raise SystemExit('reflink range marker count changed')
          s = s.replace(marker, helper, 1)

          old = '''    struct infilfs_native_index_change *changes = NULL;\n    struct infilfs_file_payload_disk working_file;\n    struct infilfs_object_header_disk *source_header;\n'''
          new = '''    struct infilfs_native_index_change *changes = NULL;\n    struct infilfs_native_index_change source_change = {0};\n    struct infilfs_file_payload_disk working_file;\n    struct infilfs_file_payload_disk source_working_file;\n    struct infilfs_object_header_disk *source_header;\n'''
          if s.count(old) != 1:
              raise SystemExit('declaration marker 1 changed')
          s = s.replace(old, new, 1)

          old = '''    struct infilfs_native_read_checksum_cursor checksum_cursor = {0};\n    u8 *source_object = NULL;\n    u8 *destination_object = NULL;\n    u8 *new_object = NULL;\n'''
          new = '''    struct infilfs_native_read_checksum_cursor checksum_cursor = {0};\n    struct timespec64 source_mtime;\n    struct timespec64 source_ctime;\n    u8 *source_object = NULL;\n    u8 *source_new_object = NULL;\n    u8 *destination_object = NULL;\n    u8 *new_object = NULL;\n'''
          if s.count(old) != 1:
              raise SystemExit('declaration marker 2 changed')
          s = s.replace(old, new, 1)

          old = '''    u64 new_size;\n    u64 new_file_block = 0;\n    u64 allocated_blocks;\n'''
          new = '''    u64 new_size;\n    u64 new_file_block = 0;\n    u64 source_new_file_block = 0;\n    u64 allocated_blocks;\n'''
          if s.count(old) != 1:
              raise SystemExit('declaration marker 3 changed')
          s = s.replace(old, new, 1)

          old = '''    bool source_inline = false;\n    bool destination_inline = false;\n    bool file_repoint = false;\n'''
          new = '''    bool source_inline = false;\n    bool destination_inline = false;\n    bool source_materialized = false;\n    bool source_file_repoint = false;\n    bool file_repoint = false;\n'''
          if s.count(old) != 1:
              raise SystemExit('declaration marker 4 changed')
          s = s.replace(old, new, 1)

          old = '''    source_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    destination_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    new_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    checksum_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    if (!source_object || !destination_object ||\n        !new_object || !checksum_object) {\n'''
          new = '''    source_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    source_new_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    destination_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    new_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    checksum_object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);\n    if (!source_object || !source_new_object || !destination_object ||\n        !new_object || !checksum_object) {\n'''
          if s.count(old) != 1:
              raise SystemExit('allocation marker changed')
          s = s.replace(old, new, 1)

          old = '''    start_block = (u64)pos_in >> INFILFS_DISK_BLOCK_SHIFT;\n    destination_start = (u64)pos_out >> INFILFS_DISK_BLOCK_SHIFT;\n    block_count = DIV_ROUND_UP_ULL((u64)len, INFILFS_DISK_BLOCK_SIZE);\n    if (!block_count || block_count > U32_MAX) {\n        ret = -EFBIG;\n        goto finish;\n    }\n\n    ret = infilfs_reflink_extract_range(\n'''
          new = '''    start_block = (u64)pos_in >> INFILFS_DISK_BLOCK_SHIFT;\n    destination_start = (u64)pos_out >> INFILFS_DISK_BLOCK_SHIFT;\n    block_count = DIV_ROUND_UP_ULL((u64)len, INFILFS_DISK_BLOCK_SIZE);\n    if (!block_count || block_count > U32_MAX) {\n        ret = -EFBIG;\n        goto finish;\n    }\n\n    source_header = (struct infilfs_object_header_disk *)source_object;\n    source_disk_file =\n        (struct infilfs_file_payload_disk *)(source_header + 1);\n    destination_header =\n        (struct infilfs_object_header_disk *)destination_object;\n    destination_disk_file =\n        (struct infilfs_file_payload_disk *)(destination_header + 1);\n    memcpy(&source_working_file, source_disk_file, sizeof(source_working_file));\n    source_mtime = inode_get_mtime(source_inode);\n    source_ctime = inode_get_ctime(source_inode);\n    source_new_file_block = source_ii->object_block;\n\n    ret = infilfs_reflink_materialize_boundaries(\n        pending, source_inode, &source_working_file,\n        &source_extents, &source_count, source_blocks,\n        start_block, block_count, &source_materialized);\n    if (ret)\n        goto finish;\n    ret = infilfs_reflink_materialize_boundaries(\n        pending, destination_inode, destination_disk_file,\n        &destination_extents, &destination_count, destination_blocks,\n        destination_start, block_count, NULL);\n    if (ret)\n        goto finish;\n\n    if (source_materialized) {\n        struct infilfs_object_header_disk *materialized_header;\n        struct infilfs_file_payload_disk *materialized_file;\n\n        ret = infilfs_native_build_file_object(\n            pending, source_inode, source_object, &source_working_file,\n            source_extents, source_count,\n            le64_to_cpu(source_disk_file->attributes.logical_size),\n            source_new_object, &source_new_file_block,\n            &source_file_repoint);\n        if (ret)\n            goto finish;\n\n        /* Storage representation changes must not look like content writes. */\n        materialized_header =\n            (struct infilfs_object_header_disk *)source_new_object;\n        materialized_file =\n            (struct infilfs_file_payload_disk *)(materialized_header + 1);\n        infilfs_timestamp_encode(\n            &materialized_file->attributes.modification_time, source_mtime);\n        infilfs_timestamp_encode(\n            &materialized_file->attributes.change_time, source_ctime);\n        ret = infilfs_rw_finalize_object(source_new_object);\n        if (!ret)\n            ret = infilfs_native_stage_block(\n                pending->sb, source_new_file_block, source_new_object);\n        if (ret)\n            goto finish;\n\n        if (source_file_repoint) {\n            memcpy(source_change.object_id, source_ii->object_id, 16);\n            source_change.object_block = source_new_file_block;\n            source_change.object_type = INFILFS_OBJECT_FILE;\n            ret = infilfs_native_index_update(pending, &source_change, 1);\n            if (ret)\n                goto finish;\n        }\n    }\n\n    ret = infilfs_reflink_extract_range(\n'''
          if s.count(old) != 1:
              raise SystemExit('range insertion marker changed')
          s = s.replace(old, new, 1)

          old = '''    if (!ret) {\n        destination_ii->object_block = new_file_block;\n        WRITE_ONCE(destination_ii->persisted_size, new_size);\n'''
          new = '''    if (!ret) {\n        if (source_materialized) {\n            source_ii->object_block = source_new_file_block;\n            WRITE_ONCE(source_ii->persisted_size,\n                       (u64)i_size_read(source_inode));\n            source_inode->i_blocks =\n                infilfs_native_extent_allocated_blocks(\n                    source_extents, source_count) *\n                (INFILFS_DISK_BLOCK_SIZE >> 9);\n            inode_set_mtime_to_ts(source_inode, source_mtime);\n            inode_set_ctime_to_ts(source_inode, source_ctime);\n        }\n        destination_ii->object_block = new_file_block;\n        WRITE_ONCE(destination_ii->persisted_size, new_size);\n'''
          if s.count(old) != 1:
              raise SystemExit('success marker changed')
          s = s.replace(old, new, 1)

          old = '''    kfree(checksum_object);\n    kfree(changes);\n'''
          new = '''    kfree(checksum_object);\n    kfree(source_new_object);\n    kfree(changes);\n'''
          if s.count(old) != 1:
              raise SystemExit('cleanup marker changed')
          s = s.replace(old, new, 1)

          path.write_text(s)
          PY

          bash tests/native-reflink-scaling-policy.sh .

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-linux-reflink.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/infiltratorfs_defrag.inc .github/workflows/repair-linux-reflink.yml
          git commit -m 'kernel: materialize compressed reflink range boundaries'
          git push origin HEAD:fix/v0.18.94-linux-release
