name: Apply kernel modularization

on:
  push:
    paths:
      - '.github/workflows/apply-kernel-modularization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract checksum cache object
        run: python3 tools/kernel-checksum-cache-object-refactor.py

      - name: Extract Linux metadata codec object
        run: python3 tools/kernel-linux-meta-codec-object-refactor.py

      - name: Enforce kernel maintainability policy
        run: bash tests/native-kernel-maintainability-policy.sh .

      - name: Show structural delta
        run: |
          git diff --stat
          grep '^infiltratorfs-y :=' kernel/Makefile
          wc -c kernel/infiltratorfs_rw_data.inc kernel/infiltratorfs_linux_meta.inc kernel/infiltratorfs_rw.inc

      - name: Commit behaviour-preserving extraction to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No modularization changes produced.'
            exit 1
          fi
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Extract kernel checksum and Linux metadata codec objects'
          git push origin HEAD:main
