name: Apply kernel modularization

on:
  push:
    paths:
      - '.github/workflows/apply-kernel-modularization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-workflow-blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate exact kernel workflow with extracted sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/kernel-module.yml').read_text()
          anchor = '             kernel/infiltratorfs_directory_tree.c \\\n'
          addition = (
              anchor +
              '             kernel/infiltratorfs_checksum_cache.c \\\n' +
              '             kernel/infiltratorfs_linux_meta_codec.c \\\n'
          )
          if 'kernel/infiltratorfs_checksum_cache.c' in source:
              raise SystemExit('kernel workflow already contains extracted source entries')
          if source.count(anchor) != 1:
              raise SystemExit('expected DKMS copy anchor exactly once')
          generated = source.replace(anchor, addition, 1)
          Path('tools/generated-kernel-module.yml').write_text(generated)
          PY
          diff -u .github/workflows/kernel-module.yml tools/generated-kernel-module.yml || true

      - name: Commit staged blob outside workflows
        shell: bash
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add tools/generated-kernel-module.yml
          git commit -m 'Stage exact kernel workflow manifest blob'
          git push origin HEAD:main
