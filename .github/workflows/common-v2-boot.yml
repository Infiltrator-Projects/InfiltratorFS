# SPDX-License-Identifier: GPL-3.0-or-later
name: Common V2 firmware boot

on:
  push:
    branches: [main]
    paths:
      - 'module/**'
      - 'include/**'
      - 'src/**'
      - 'tests/common-v2-uefi.sh'
      - 'tests/format-019-image.c'
      - '.github/workflows/common-v2-boot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-v2-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          submodules: recursive
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf busybox-static cpio dosfstools gdisk mtools
      - name: Obtain the released BOOT and a distribution test kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/boot" "$RUNNER_TEMP/kernel"
          deb="$RUNNER_TEMP/boot.deb"
          curl -fsSL --retry 3 -o "$deb" https://github.com/Infiltrator-Projects/Boot/releases/download/v0.1.50/infiltrator-boot_0.1.50_amd64.deb
          printf '%s  %s\n' a4acd0bec605d0680f173f537e8f8a818b9b071cfc5c356e0fc5eaf0dfcb86e7 "$deb" | sha256sum -c -
          dpkg-deb -x "$deb" "$RUNNER_TEMP/boot"
          image=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ { image=$2 } END { print image }')
          release=${image#linux-image-}
          [[ -n $release && $release != "$image" ]]
          (cd "$RUNNER_TEMP/kernel" && apt-get download "linux-image-unsigned-$release")
          dpkg-deb -x "$RUNNER_TEMP/kernel/"*.deb "$RUNNER_TEMP/kernel"
          printf '%s\n' "$release" > "$RUNNER_TEMP/kernel/release"
      - name: Boot the V2 provider from a disposable filesystem
        shell: bash
        run: |
          set -euo pipefail
          release=$(cat "$RUNNER_TEMP/kernel/release")
          bash tests/common-v2-uefi.sh \
            "$RUNNER_TEMP/boot/usr/lib/infiltrator-boot/EFI/BOOT/BOOTX64.EFI" \
            "$RUNNER_TEMP/kernel/boot/vmlinuz-$release" "$RUNNER_TEMP/v2-boot"
