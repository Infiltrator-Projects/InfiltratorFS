# SPDX-License-Identifier: GPL-3.0-or-later
name: Linux root-volume qualification

on:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'tests/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/release-trigger'
      - '.github/workflows/root-volume-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-volume:
    name: ACL, metadata, initramfs and root-safe package qualification
    concurrency:
      group: root-volume-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install root-volume qualification dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake dkms e2fsprogs fontconfig initramfs-tools \
            kmod libcap2-bin libgtk-3-dev linux-headers-generic pkg-config policykit-1 \
            rsync util-linux xdg-utils python3

      - name: Download qualified managed desktop integration packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release list --limit 100 --json tagName,isPrerelease,publishedAt --jq '[.[] | select(.isPrerelease == true and (.tagName | startswith("desktop-integration-ubuntu24.04-")))] | sort_by(.publishedAt) | last | .tagName')"
          test -n "$tag"
          dir="$RUNNER_TEMP/desktop-integration"
          mkdir -p "$dir"
          gh release download "$tag" --dir "$dir" \
            --pattern 'infiltratorfs-libblockdev-fs3_*.deb' \
            --pattern 'infiltratorfs-gnome-disk-utility_*.deb' \
            --pattern 'infiltratorfs-desktop-integration_*.deb' \
            --pattern 'infiltratorfs-desktop-integration.manifest'
          manifest="$dir/infiltratorfs-desktop-integration.manifest"
          test -s "$manifest"
          expected_patch="$(cat packaging/libblockdev-3.1-infiltratorfs.patch packaging/gnome-disks-46-infiltratorfs.patch packaging/build-noble-desktop-packages.sh | sha256sum | awk '{print $1}')"
          test "$(sed -n 's/^patch_sha256=//p' "$manifest")" = "$expected_patch"
          test "$(sed -n 's/^target=//p' "$manifest")" = ubuntu-24.04-linuxmint-22.x
          for pattern in \
            'infiltratorfs-libblockdev-fs3_*.deb' \
            'infiltratorfs-gnome-disk-utility_*.deb' \
            'infiltratorfs-desktop-integration_*.deb'; do
            file="$(find "$dir" -maxdepth 1 -type f -name "$pattern" -print -quit)"
            test -s "$file"
            dpkg-deb --info "$file" >/dev/null
          done

      - name: Resolve kernel headers
        id: headers
        shell: bash
        run: |
          set -euo pipefail
          generic_kdir="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n 1)"
          test -n "$generic_kdir"
          test -f "$generic_kdir/Makefile"
          printf 'generic_kdir=%s\n' "$generic_kdir" >> "$GITHUB_OUTPUT"

          runtime_release="$(uname -r)"
          runtime_kdir="/lib/modules/${runtime_release}/build"
          if [[ ! -f "$runtime_kdir/Makefile" ]]; then
            sudo apt-get install -y --no-install-recommends "linux-headers-${runtime_release}" || true
          fi
          if [[ -f "$runtime_kdir/Makefile" ]]; then
            printf 'runtime_kdir=%s\n' "$runtime_kdir" >> "$GITHUB_OUTPUT"
          else
            printf 'runtime_kdir=\n' >> "$GITHUB_OUTPUT"
            echo "Runtime headers unavailable for $runtime_release; mounted qualification will be reported unavailable."
          fi

      - name: Validate root-volume policy and scripts
        run: |
          set -euo pipefail
          bash tests/root-volume-integration-policy.sh .
          bash tests/root-readiness-policy.sh .
          bash -n packaging/initramfs/infiltratorfs-hook \
                  packaging/debian/preinst.in \
                  packaging/debian/postinst.in \
                  packaging/debian/prerm.in \
                  tests/native-root-metadata-qualification.sh
          python3 -m py_compile tests/native-posix-acl-qualification.py
          command -v setfacl
          command -v getfacl
          command -v setfattr
          command -v getfattr
          command -v setcap
          command -v getcap
          command -v rsync
          command -v update-initramfs
          command -v lsinitramfs

      - name: Configure and build userspace tools
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target \
            mkfs.infilfs fsck.infiltratorfs infilfs-tool infiltratorfs-quota infilfs-compression
          ctest --test-dir build --output-on-failure -R \
            'infilfs-root-volume-integration-policy|infilfs-system-utilities'

      - name: Compile generic native module
        env:
          KDIR: ${{ steps.headers.outputs.generic_kdir }}
        run: |
          set -euo pipefail
          make -C kernel KDIR="$KDIR"
          test -s kernel/infiltratorfs.ko
          test "$(modinfo -F name kernel/infiltratorfs.ko)" = infiltratorfs
          test "$(modinfo -F license kernel/infiltratorfs.ko)" = GPL
          cp kernel/infiltratorfs.ko kernel/infiltratorfs-generic.ko

      - name: Compile running-kernel native module
        if: steps.headers.outputs.runtime_kdir != ''
        env:
          KDIR: ${{ steps.headers.outputs.runtime_kdir }}
        run: |
          set -euo pipefail
          make -C kernel clean KDIR="$KDIR"
          make -C kernel KDIR="$KDIR"
          test "$(modinfo -F vermagic kernel/infiltratorfs.ko | awk '{print $1}')" = "$(uname -r)"

      - name: Require real setfacl/getfacl mounted ACL semantics
        if: steps.headers.outputs.runtime_kdir != ''
        env:
          INFILFS_REQUIRE_SETFACL: "1"
        run: |
          set -euo pipefail
          bash tests/native-quota-policy.sh .
          bash -n tests/native-quota-qualification.sh
          sudo -E bash tests/native-quota-qualification.sh build kernel/infiltratorfs.ko

      - name: Require full Linux root metadata and API semantics
        if: steps.headers.outputs.runtime_kdir != ''
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            bash tests/native-root-metadata-qualification.sh \
              build kernel/infiltratorfs.ko

      - name: Build Debian package with root-volume integration
        run: |
          set -euo pipefail
          rm -rf dist
          cmake --build build --parallel
          bash packaging/build-linux-packages.sh build dist
          deb="$(find dist -maxdepth 1 -type f -name 'infiltratorfs_*_amd64.deb' -print -quit)"
          test -n "$deb"

          contents_file="$RUNNER_TEMP/infiltratorfs-root-deb-contents.txt"
          control_dir="$RUNNER_TEMP/infiltratorfs-root-control"
          rm -rf "$control_dir"
          dpkg-deb --contents "$deb" > "$contents_file"
          grep -q 'usr/share/initramfs-tools/hooks/infiltratorfs$' "$contents_file"
          depends="$(dpkg-deb --field "$deb" Depends)"
          grep -Eq '(^|, )initramfs-tools([ ,]|$)' <<<"$depends"
          grep -Eq '(^|, )infiltratorfs-desktop-integration([ ,]|$)' <<<"$depends"
          dpkg-deb -e "$deb" "$control_dir"
          grep -Fq 'live root remains mounted' "$control_dir/preinst"
          grep -Fq 'root-volume upgrade staged safely' "$control_dir/postinst"
          grep -Fq 'refusing to remove the filesystem package while / is mounted as InfiltratorFS' "$control_dir/prerm"

      - name: Install package and prove initramfs root payload
        if: steps.headers.outputs.runtime_kdir != ''
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -maxdepth 1 -type f -name 'infiltratorfs_*_amd64.deb' -print -quit)"
          deb="$(readlink -f "$deb")"
          desktop_dir="$RUNNER_TEMP/desktop-integration"
          lib="$(find "$desktop_dir" -maxdepth 1 -type f -name 'infiltratorfs-libblockdev-fs3_*.deb' -print -quit)"
          gdu="$(find "$desktop_dir" -maxdepth 1 -type f -name 'infiltratorfs-gnome-disk-utility_*.deb' -print -quit)"
          meta="$(find "$desktop_dir" -maxdepth 1 -type f -name 'infiltratorfs-desktop-integration_*.deb' -print -quit)"
          test -s "$lib"
          test -s "$gdu"
          test -s "$meta"
          sudo apt-get install -y "$lib" "$gdu" "$meta" "$deb"
          dpkg-query -W -f='${Status}\n' infiltratorfs-desktop-integration | grep -Fxq 'install ok installed'
          test -x /usr/share/initramfs-tools/hooks/infiltratorfs
          grep -Fq 'manual_add_modules infiltratorfs' /usr/share/initramfs-tools/hooks/infiltratorfs
          initrd="/boot/initrd.img-$(uname -r)"
          test -s "$initrd"
          contents="$(lsinitramfs "$initrd")"
          grep -Eq '(^|/)infiltratorfs\.ko(\.(gz|xz|zst))?$' <<<"$contents"
          grep -Eq '(^|/)infilfs-inspect$' <<<"$contents"
          grep -Eq '(^|/)59-infiltratorfs\.rules$' <<<"$contents"
          grep -Eq '(^|/)fsck\.infiltratorfs$' <<<"$contents"
          if grep -Eq '(^|/)infilfs-scrub$' <<<"$contents"; then
            echo 'retired standalone infilfs-scrub unexpectedly present in initramfs' >&2
            exit 1
          fi
          modinfo infiltratorfs >/dev/null
          grep -qw infiltratorfs /proc/filesystems
          echo 'Linux root-volume package/initramfs qualification: PASS'

      - name: Require mounted qualification availability
        run: |
          if [[ -z '${{ steps.headers.outputs.runtime_kdir }}' ]]; then
            echo 'Root-volume release qualification requires runtime kernel headers and mounted execution.' >&2
            exit 1
          fi
