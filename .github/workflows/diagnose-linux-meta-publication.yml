# SPDX-License-Identifier: GPL-3.0-or-later
name: Diagnose Linux metadata publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-linux-meta-publication.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl attr build-essential cmake kmod linux-headers-$(uname -r) util-linux
      - name: Build
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
          sudo insmod kernel/infiltratorfs.ko
      - name: Isolate metadata publication cases
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/infilfs-meta-diag"
          mkdir -p "$work/mnt"

          run_case() {
            name="$1"; shift
            img="$work/$name.img"
            truncate -s 256M "$img"
            build/mkfs.infilfs --force -L "$name" "$img" >/dev/null
            loop="$(sudo losetup --find --show "$img")"
            sudo mount -t infiltratorfs -o rw "$loop" "$work/mnt"
            set +e
            "$@" "$work/mnt"
            op_rc=$?
            sync
            sudo umount "$work/mnt"
            set -e
            echo "===== CASE $name operation_rc=$op_rc ====="
            if build/infilfs-scrub "$img" >"$work/$name.scrub" 2>&1; then
              echo "CASE $name: CLEAN"
            else
              echo "CASE $name: CORRUPT"
              cat "$work/$name.scrub"
            fi
            sudo losetup -d "$loop"
          }

          case_plain() { sudo sh -c 'printf x > "$1/plain"' sh "$1"; }
          case_one_user_xattr() {
            sudo sh -c 'printf x > "$1/file"' sh "$1"
            sudo setfattr -n user.test -v value "$1/file"
          }
          case_root_xattr() { sudo setfattr -n user.test -v value "$1"; }
          case_one_acl() {
            sudo sh -c 'printf x > "$1/file"' sh "$1"
            sudo setfacl -m u:12345:r-- "$1/file"
          }
          case_many_xattr() {
            for i in $(seq 1 100); do
              sudo sh -c 'printf x > "$1/f$2"' sh "$1" "$i"
            done
            for i in $(seq 1 100); do
              sudo setfattr -n user.test -v value "$1/f$i"
            done
          }
          case_replace_xattr() {
            sudo sh -c 'printf x > "$1/file"' sh "$1"
            sudo setfattr -n user.test -v one "$1/file"
            sudo setfattr -n user.test -v two "$1/file"
          }
          case_remove_xattr() {
            sudo sh -c 'printf x > "$1/file"' sh "$1"
            sudo setfattr -n user.test -v one "$1/file"
            sudo setfattr -x user.test "$1/file"
          }
          case_interleave_root_xattr_create() {
            for i in $(seq 1 100); do
              sudo setfattr -n user.test -v "$i" "$1"
              sudo sh -c 'printf x > "$1/f$2"' sh "$1" "$i"
            done
          }
          case_interleave_root_xattr_dirs() {
            for i in $(seq 1 80); do
              sudo setfattr -n user.test -v "$i" "$1"
              sudo mkdir "$1/d$i"
              sudo sh -c 'printf x > "$1/d$2/f"' sh "$1" "$i"
              if (( i % 2 == 0 )); then sudo mv "$1/d$i" "$1/r$i"; fi
            done
          }
          case_interleave_root_remove() {
            for i in $(seq 1 60); do
              sudo setfattr -n user.test -v "$i" "$1"
              sudo mkdir "$1/d$i"
              sudo setfattr -x user.test "$1"
              sudo rmdir "$1/d$i"
            done
          }
          case_acl_namespace_interleave() {
            for i in $(seq 1 80); do
              sudo sh -c 'printf x > "$1/f$2"' sh "$1" "$i"
              sudo setfacl -m u:12345:r-- "$1/f$i"
              if (( i % 3 == 0 )); then sudo mv "$1/f$i" "$1/r$i"; fi
            done
          }

          run_case plain case_plain
          run_case one-user-xattr case_one_user_xattr
          run_case root-xattr case_root_xattr
          run_case one-acl case_one_acl
          run_case many-xattr case_many_xattr
          run_case replace-xattr case_replace_xattr
          run_case remove-xattr case_remove_xattr
          run_case interleave-root-create case_interleave_root_xattr_create
          run_case interleave-root-dirs case_interleave_root_xattr_dirs
          run_case interleave-root-remove case_interleave_root_remove
          run_case acl-namespace-interleave case_acl_namespace_interleave

          echo '===== dmesg tail ====='
          sudo dmesg | tail -n 200 || true
