# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply unlink ownership index fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-unlink-ownership-index.yml'

permissions:
  contents: write

jobs:
  qualify-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake kmod linux-headers-$(uname -r) \
            python3 util-linux

      - name: Apply shared-range ownership accelerator
        run: |
          python3 tools/apply-unlink-ownership-index.py
          git diff --check
          bash tests/native-unlink-ownership-index-policy.sh .
          bash tests/native-kernel-maintainability-policy.sh .
          git diff --stat

      - name: Build candidate
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"

      - name: Run userspace conformance
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Prove bulk unlink scaling and clean reclaim
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          image="$work/unlink.img"
          mnt="$work/mnt"
          loop=""
          cleanup() {
            set +e
            sync
            mountpoint -q "$mnt" && sudo umount "$mnt"
            [[ -n "$loop" ]] && sudo losetup -d "$loop" 2>/dev/null
            sudo rmmod infiltratorfs 2>/dev/null
            rm -rf "$work"
          }
          trap cleanup EXIT
          mkdir -p "$mnt"
          truncate -s 1G "$image"
          build/mkfs.infilfs "$image" >/dev/null
          loop="$(sudo losetup --find --show "$image")"
          sudo insmod kernel/infiltratorfs.ko
          sudo mount -t infiltratorfs "$loop" "$mnt"
          sudo python3 - "$mnt" <<'PY'
          import os, sys, time
          root = sys.argv[1]
          d = os.path.join(root, 'unlink-scale')
          os.mkdir(d)
          payload = b'x' * 4096
          count = 4000
          for i in range(count):
              p = os.path.join(d, f'f{i:05d}')
              with open(p, 'wb', buffering=0) as f:
                  f.write(payload)
          os.sync()
          start = time.monotonic()
          for i in range(count):
              os.unlink(os.path.join(d, f'f{i:05d}'))
          elapsed = time.monotonic() - start
          print(f'InfiltratorFS {count} unlinks: {elapsed:.3f}s')
          # This deliberately loose threshold rejects the former O(files)
          # ownership scan without pretending CI runner timing is a benchmark.
          if elapsed > 45.0:
              raise SystemExit(
                  f'unlink ownership path remains pathologically slow: {elapsed:.3f}s'
              )
          os.rmdir(d)
          os.sync()
          PY
          sudo umount "$mnt"
          sudo build/infilfs-scrub "$loop" | tee "$work/scrub.txt"
          grep -Fq 'Result:              CLEAN' "$work/scrub.txt"
          sudo losetup -d "$loop"
          loop=""
          sudo rmmod infiltratorfs
          trap - EXIT
          rm -rf "$work"

      - name: Commit qualified source fix
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add \
            kernel/infiltratorfs_internal.h \
            kernel/infiltratorfs_rw_data.inc \
            kernel/infiltratorfs_rw_namespace.inc \
            tests/native-unlink-ownership-index-policy.sh \
            tests/native-complete-qualification.sh \
            .github/workflows/ci.yml
          git commit -m 'Accelerate native shared-extent ownership lookup'
          git push origin HEAD:main
