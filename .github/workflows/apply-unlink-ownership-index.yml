# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply unlink ownership index fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-unlink-ownership-index.yml'

permissions:
  contents: write

jobs:
  qualify-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake kmod linux-headers-$(uname -r) \
            python3 util-linux

      - name: Apply shared-range ownership accelerator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              p.write_text(s.replace(old, new, 1))

          # Mount-private state. The retained index stores only ranges that were
          # observed with >=2 live file owners; authoritative metadata remains
          # the source of truth.
          replace_once(
              'kernel/infiltratorfs_internal.h',
              '''struct infilfs_native_directory_locator {\n    u32 hash;\n    u16 name_len;\n    bool valid;\n    u8 name[INFILFS_NAME_MAX];\n};\n\nstruct infilfs_native_pending {\n''',
              '''struct infilfs_native_directory_locator {\n    u32 hash;\n    u16 name_len;\n    bool valid;\n    u8 name[INFILFS_NAME_MAX];\n};\n\nstruct infilfs_native_shared_range {\n    u64 start;\n    u64 end;\n};\n\nstruct infilfs_native_pending {\n''',
              'shared range type')
          replace_once(
              'kernel/infiltratorfs_internal.h',
              '''    u32 directory_locator_capacity;\n    u32 directory_locator_count;\n    bool directory_locator_valid;\n    u64 pending_bytes;\n''',
              '''    u32 directory_locator_capacity;\n    u32 directory_locator_count;\n    bool directory_locator_valid;\n    struct infilfs_native_shared_range *shared_ranges;\n    size_t shared_range_count;\n    bool shared_range_index_valid;\n    u64 pending_bytes;\n''',
              'shared range state')

          # Failed operations conservatively invalidate acceleration state;
          # unmount releases it with the other pending-writer caches.
          replace_once(
              'kernel/infiltratorfs_rw_data.inc',
              '''    infilfs_native_index_locator_invalidate(pending);\n    infilfs_native_directory_locator_invalidate(pending);\n    if (first_error) {\n''',
              '''    infilfs_native_index_locator_invalidate(pending);\n    infilfs_native_directory_locator_invalidate(pending);\n    pending->shared_range_index_valid = false;\n    pending->shared_range_count = 0;\n    if (first_error) {\n''',
              'rollback invalidation')
          replace_once(
              'kernel/infiltratorfs_rw_data.inc',
              '''    kvfree(pending->undo);\n    kvfree(pending->index_locators);\n    kvfree(pending->directory_locators);\n    kfree(pending);\n''',
              '''    kvfree(pending->undo);\n    kvfree(pending->index_locators);\n    kvfree(pending->directory_locators);\n    kvfree(pending->shared_ranges);\n    kfree(pending);\n''',
              'ownership index destroy')

          ns = Path('kernel/infiltratorfs_rw_namespace.inc')
          s = ns.read_text()
          anchor = '''static int infilfs_ns_other_reference_cover(\n    struct super_block *sb, const u8 owner_id[16], u64 cursor, u64 end,\n    u64 *cover_end, u64 *next_start)\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'ownership scan anchor: expected one, found {s.count(anchor)}')

          accelerator = r'''/*
 * Volatile shared-range accelerator.
 *
 * The exact ownership scan below is authoritative but historically made every
 * unshared unlink walk every other live file. Build a compact sweep-line index
 * once from the same authoritative live-file extents. Only physical ranges
 * observed with at least two live file owners are retained. Absence from this
 * index therefore proves a range was unshared when the index was built.
 *
 * Ordinary CoW writes, truncates, deletes and defrag only retire references and
 * allocate fresh unique ranges. They can make this index over-conservative
 * (a formerly shared range may become unique) but cannot create a false
 * negative. A possibly shared range still uses the exact scan. The current
 * native VFS exposes no reflink/clone creation operation; any future operation
 * that introduces a second live owner must update or invalidate this index.
 * Snapshots are protected independently by the retained-snapshot allocation
 * union used when deferred frees are applied.
 */
struct infilfs_ns_shared_event {
    u64 position;
    s8 delta;
};

static int infilfs_ns_shared_event_compare(const void *a, const void *b)
{
    const struct infilfs_ns_shared_event *left = a;
    const struct infilfs_ns_shared_event *right = b;

    if (left->position < right->position)
        return -1;
    if (left->position > right->position)
        return 1;
    return 0;
}

static int infilfs_ns_shared_event_append(
    struct infilfs_ns_shared_event **events, size_t *count, size_t *capacity,
    u64 position, s8 delta)
{
    struct infilfs_ns_shared_event *grown;
    size_t next;

    if (*count == *capacity) {
        next = *capacity ? *capacity * 2u : 256u;
        if (next < *capacity || next > SIZE_MAX / sizeof(*grown))
            return -EOVERFLOW;
        grown = kvmalloc_array(next, sizeof(*grown), GFP_NOFS);
        if (!grown)
            return -ENOMEM;
        if (*count)
            memcpy(grown, *events, *count * sizeof(*grown));
        kvfree(*events);
        *events = grown;
        *capacity = next;
    }
    (*events)[*count].position = position;
    (*events)[*count].delta = delta;
    (*count)++;
    return 0;
}

static int infilfs_ns_shared_range_append(
    struct infilfs_native_shared_range **ranges, size_t *count,
    size_t *capacity, u64 start, u64 end)
{
    struct infilfs_native_shared_range *grown;
    size_t next;

    if (start >= end)
        return -EFSCORRUPTED;
    if (*count && (*ranges)[*count - 1u].end >= start) {
        if (end > (*ranges)[*count - 1u].end)
            (*ranges)[*count - 1u].end = end;
        return 0;
    }
    if (*count == *capacity) {
        next = *capacity ? *capacity * 2u : 64u;
        if (next < *capacity || next > SIZE_MAX / sizeof(*grown))
            return -EOVERFLOW;
        grown = kvmalloc_array(next, sizeof(*grown), GFP_NOFS);
        if (!grown)
            return -ENOMEM;
        if (*count)
            memcpy(grown, *ranges, *count * sizeof(*grown));
        kvfree(*ranges);
        *ranges = grown;
        *capacity = next;
    }
    (*ranges)[*count].start = start;
    (*ranges)[*count].end = end;
    (*count)++;
    return 0;
}

static int infilfs_ns_shared_range_index_build(
    struct infilfs_native_pending *pending)
{
    struct infilfs_index_entry_disk *entries = NULL;
    struct infilfs_ns_shared_event *events = NULL;
    struct infilfs_native_shared_range *ranges = NULL;
    size_t event_count = 0, event_capacity = 0;
    size_t range_count = 0, range_capacity = 0;
    s64 coverage = 0;
    u32 count = 0, i;
    size_t e = 0;
    u64 previous = 0;
    int ret;

    if (pending->shared_range_index_valid)
        return 0;

    ret = infilfs_ns_index_snapshot(pending->sb, &entries, &count);
    if (ret)
        goto out;

    for (i = 0; i < count; ++i) {
        struct infilfs_extent_disk *extents = NULL;
        u32 extent_count = 0, j;

        if (le16_to_cpu(entries[i].object_type) != INFILFS_OBJECT_FILE)
            continue;
        ret = infilfs_ns_read_file_extents(
            pending->sb, le64_to_cpu(entries[i].object_block),
            entries[i].object_id, &extents, &extent_count);
        if (ret) {
            kvfree(extents);
            goto out;
        }
        for (j = 0; j < extent_count; ++j) {
            u32 flags = le32_to_cpu(extents[j].flags);
            u32 logical_blocks = le32_to_cpu(extents[j].block_count);
            u64 physical;
            u64 blocks;
            u64 end;

            if (infilfs_extent_kind(flags) != INFILFS_EXTENT_NORMAL)
                continue;
            physical = le64_to_cpu(extents[j].physical_block);
            blocks = infilfs_extent_physical_blocks(logical_blocks, flags);
            if (!physical || !blocks || physical > U64_MAX - blocks) {
                ret = -EFSCORRUPTED;
                break;
            }
            end = physical + blocks;
            ret = infilfs_ns_shared_event_append(
                &events, &event_count, &event_capacity, physical, 1);
            if (!ret)
                ret = infilfs_ns_shared_event_append(
                    &events, &event_count, &event_capacity, end, -1);
            if (ret)
                break;
        }
        kvfree(extents);
        if (ret)
            goto out;
    }

    if (!event_count) {
        kvfree(pending->shared_ranges);
        pending->shared_ranges = NULL;
        pending->shared_range_count = 0;
        pending->shared_range_index_valid = true;
        ret = 0;
        goto out;
    }

    sort(events, event_count, sizeof(*events),
         infilfs_ns_shared_event_compare, NULL);
    previous = events[0].position;
    while (e < event_count) {
        u64 position = events[e].position;
        s64 delta = 0;

        if (position < previous) {
            ret = -EFSCORRUPTED;
            goto out;
        }
        if (position > previous && coverage >= 2) {
            ret = infilfs_ns_shared_range_append(
                &ranges, &range_count, &range_capacity,
                previous, position);
            if (ret)
                goto out;
        }
        while (e < event_count && events[e].position == position) {
            delta += events[e].delta;
            e++;
        }
        if ((delta < 0 && coverage < -delta) ||
            (delta > 0 && coverage > S64_MAX - delta)) {
            ret = -EFSCORRUPTED;
            goto out;
        }
        coverage += delta;
        if (coverage < 0) {
            ret = -EFSCORRUPTED;
            goto out;
        }
        previous = position;
    }
    if (coverage != 0) {
        ret = -EFSCORRUPTED;
        goto out;
    }

    kvfree(pending->shared_ranges);
    pending->shared_ranges = ranges;
    pending->shared_range_count = range_count;
    pending->shared_range_index_valid = true;
    ranges = NULL;
    ret = 0;
out:
    kvfree(ranges);
    kvfree(events);
    kvfree(entries);
    if (ret) {
        pending->shared_range_index_valid = false;
        pending->shared_range_count = 0;
    }
    return ret;
}

static bool infilfs_ns_shared_range_maybe_shared(
    const struct infilfs_native_pending *pending, u64 start, u64 end)
{
    size_t low = 0;
    size_t high = pending->shared_range_count;

    while (low < high) {
        size_t middle = low + (high - low) / 2u;
        const struct infilfs_native_shared_range *range =
            &pending->shared_ranges[middle];

        if (range->end <= start)
            low = middle + 1u;
        else
            high = middle;
    }
    return low < pending->shared_range_count &&
        pending->shared_ranges[low].start < end;
}

'''
          ns.write_text(s.replace(anchor, accelerator + anchor, 1))

          # Put the accelerator in front of the exact scan. Memory pressure or
          # impossible sizing falls back safely; metadata/I/O corruption still
          # fails closed instead of being hidden by the cache.
          p = ns
          s = p.read_text()
          old = '''    cursor = start;\n    end = start + count;\n    while (cursor < end) {\n'''
          new = '''    cursor = start;\n    end = start + count;\n\n    ret = infilfs_ns_shared_range_index_build(pending);\n    if (!ret &&\n        !infilfs_ns_shared_range_maybe_shared(pending, start, end))\n        return infilfs_rw_tx_defer_free(&pending->tx, start, count);\n    if (ret && ret != -ENOMEM && ret != -EOVERFLOW)\n        return ret;\n\n    while (cursor < end) {\n'''
          count_anchor = s.count(old)
          if count_anchor != 1:
              raise SystemExit(f'free-unshared fast-path anchor: expected one, found {count_anchor}')
          p.write_text(s.replace(old, new, 1))

          policy = Path('tests/native-unlink-ownership-index-policy.sh')
          policy.write_text(r'''#!/usr/bin/env bash
# SPDX-License-Identifier: GPL-3.0-or-later
set -euo pipefail
root="${1:-.}"
ns="$root/kernel/infiltratorfs_rw_namespace.inc"
state="$root/kernel/infiltratorfs_internal.h"
data="$root/kernel/infiltratorfs_rw_data.inc"

fail() { echo "native unlink ownership index policy: $*" >&2; exit 1; }
for file in "$ns" "$state" "$data"; do test -f "$file" || fail "missing $file"; done

grep -Fq 'struct infilfs_native_shared_range' "$state" || fail 'shared-range state missing'
grep -Fq 'shared_range_index_valid' "$state" || fail 'shared-range validity state missing'
grep -Fq 'infilfs_ns_shared_range_index_build' "$ns" || fail 'shared-range builder missing'
grep -Fq 'infilfs_ns_shared_range_maybe_shared' "$ns" || fail 'shared-range query missing'
grep -Fq 'infilfs_ns_other_reference_cover' "$ns" || fail 'exact ownership fallback missing'
grep -Fq 'kvfree(pending->shared_ranges);' "$data" || fail 'ownership index unmount cleanup missing'

python3 - "$ns" <<'PY2'
from pathlib import Path
import sys
s = Path(sys.argv[1]).read_text()
start = s.index('static int infilfs_ns_free_unshared_run(')
end = s.index('\nstatic int ', start + 1)
body = s[start:end]
build = body.find('infilfs_ns_shared_range_index_build(pending)')
query = body.find('infilfs_ns_shared_range_maybe_shared')
fastfree = body.find('return infilfs_rw_tx_defer_free(&pending->tx, start, count)')
scan = body.find('infilfs_ns_other_reference_cover(')
if min(build, query, fastfree, scan) < 0:
    raise SystemExit('unlink ownership fast/fallback sequence incomplete')
if not (build < query < fastfree < scan):
    raise SystemExit('whole-filesystem ownership scan is not behind the fast shared-range gate')
PY2

echo 'Native unlink ownership index policy guard passed.'
''')
          policy.chmod(0o755)

          # Keep the normal CI and complete qualification aware of the guard.
          replace_once(
              '.github/workflows/ci.yml',
              '''      - name: Guard native random-write optimizations\n        run: bash tests/native-random-write-optimization-policy.sh .\n      - name: Guard native sequential-write scaling\n''',
              '''      - name: Guard native random-write optimizations\n        run: bash tests/native-random-write-optimization-policy.sh .\n      - name: Guard native unlink ownership scaling\n        run: bash tests/native-unlink-ownership-index-policy.sh .\n      - name: Guard native sequential-write scaling\n''',
              'CI unlink guard')
          replace_once(
              'tests/native-complete-qualification.sh',
              '''bash tests/native-random-write-optimization-policy.sh .\nbash tests/native-sequential-write-scaling-policy.sh .\n''',
              '''bash tests/native-random-write-optimization-policy.sh .\nbash tests/native-unlink-ownership-index-policy.sh .\nbash tests/native-sequential-write-scaling-policy.sh .\n''',
              'complete qualification unlink guard')
          PY

          git diff --check
          bash tests/native-unlink-ownership-index-policy.sh .
          bash tests/native-kernel-maintainability-policy.sh .
          git diff --stat

      - name: Build candidate
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"

      - name: Run userspace conformance
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Prove bulk unlink scaling and clean reclaim
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          image="$work/unlink.img"
          mnt="$work/mnt"
          loop=""
          cleanup() {
            set +e
            sync
            mountpoint -q "$mnt" && sudo umount "$mnt"
            [[ -n "$loop" ]] && sudo losetup -d "$loop" 2>/dev/null
            sudo rmmod infiltratorfs 2>/dev/null
            rm -rf "$work"
          }
          trap cleanup EXIT
          mkdir -p "$mnt"
          truncate -s 1G "$image"
          build/mkfs.infilfs "$image" >/dev/null
          loop="$(sudo losetup --find --show "$image")"
          sudo insmod kernel/infiltratorfs.ko
          sudo mount -t infiltratorfs "$loop" "$mnt"
          sudo python3 - "$mnt" <<'PY'
          import os, sys, time
          root = sys.argv[1]
          d = os.path.join(root, 'unlink-scale')
          os.mkdir(d)
          payload = b'x' * 4096
          count = 4000
          for i in range(count):
              p = os.path.join(d, f'f{i:05d}')
              with open(p, 'wb', buffering=0) as f:
                  f.write(payload)
          os.sync()
          start = time.monotonic()
          for i in range(count):
              os.unlink(os.path.join(d, f'f{i:05d}'))
          elapsed = time.monotonic() - start
          print(f'InfiltratorFS {count} unlinks: {elapsed:.3f}s')
          # Very generous guard: it is intended to reject the former O(files)
          # ownership scan, not benchmark runner hardware.
          if elapsed > 45.0:
              raise SystemExit(f'unlink ownership path remains pathologically slow: {elapsed:.3f}s')
          os.rmdir(d)
          os.sync()
          PY
          sudo umount "$mnt"
          build/infilfs-scrub "$loop" | tee "$work/scrub.txt"
          grep -Fq 'Result:              CLEAN' "$work/scrub.txt"
          sudo losetup -d "$loop"
          loop=""
          sudo rmmod infiltratorfs
          trap - EXIT
          rm -rf "$work"

      - name: Commit qualified source fix
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add \
            kernel/infiltratorfs_internal.h \
            kernel/infiltratorfs_rw_data.inc \
            kernel/infiltratorfs_rw_namespace.inc \
            tests/native-unlink-ownership-index-policy.sh \
            tests/native-complete-qualification.sh \
            .github/workflows/ci.yml
          git commit -m 'Accelerate native shared-extent ownership lookup'
          git push origin HEAD:main
