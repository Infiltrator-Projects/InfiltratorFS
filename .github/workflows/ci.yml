# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and conformance

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Enforce main-only automatic immutable publishing
        shell: bash
        run: |
          set -euo pipefail
          release=.github/workflows/release-packages.yml
          grep -Fq '  workflow_run:' "$release"
          grep -Fq 'workflows: ["Build and conformance"]' "$release"
          grep -Fq "startsWith(github.event.workflow_run.head_commit.message, 'Release ')" "$release"
          grep -Fq "github.event.workflow_run.head_branch == 'main'" "$release"
          grep -Fq 'published releases are immutable' "$release"
          grep -Fq 'git tag --annotate' "$release"
          if grep -Eq '^  workflow_dispatch:|^  pull_request:|^  schedule:' "$release"; then
            echo "Release publication must be automatic from tested main only." >&2
            exit 1
          fi
          if grep -Eq -- '--clobber|gh release edit' "$release"; then
            echo "Published releases must never be modified in place." >&2
            exit 1
          fi

  desktop-formatter:
    name: GNOME Disks formatter integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out InfiltratorFS
        uses: actions/checkout@v6
      - name: Check out pinned desktop stack sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          fetch_exact() {
            local directory="$1" url="$2" commit="$3"
            git init -q "upstream/$directory"
            git -C "upstream/$directory" remote add origin "$url"
            git -C "upstream/$directory" fetch -q --depth=1 origin "$commit"
            git -C "upstream/$directory" checkout -q --detach FETCH_HEAD
            test "$(git -C "upstream/$directory" rev-parse HEAD)" = "$commit"
          }
          fetch_exact libblockdev https://github.com/storaged-project/libblockdev.git \
            7ce6c6e9b59fdf16cd5dffd602f954ef52588dbb
          fetch_exact udisks https://github.com/storaged-project/udisks.git \
            c731cee133bb3240a0b91b59f9995a42aafb0ac4
          fetch_exact gnome-disk-utility https://github.com/GNOME/gnome-disk-utility.git \
            dc2da843a7afc7f9e916999d5daeecb0d6adf84c
      - name: Apply integration patches exactly
        run: |
          set -euo pipefail
          git -C upstream/libblockdev apply --check "$PWD/packaging/libblockdev-infiltratorfs.patch"
          git -C upstream/libblockdev apply "$PWD/packaging/libblockdev-infiltratorfs.patch"
          git -C upstream/udisks apply --check "$PWD/packaging/udisks2-infiltratorfs-display.patch"
          git -C upstream/udisks apply "$PWD/packaging/udisks2-infiltratorfs-display.patch"
          git -C upstream/gnome-disk-utility apply --check "$PWD/packaging/gnome-disks-infiltratorfs.patch"
          git -C upstream/gnome-disk-utility apply "$PWD/packaging/gnome-disks-infiltratorfs.patch"
          git -C upstream/libblockdev diff --check
          git -C upstream/udisks diff --check
          git -C upstream/gnome-disk-utility diff --check
      - name: Build and execute the complete formatter contract
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace fedora:latest bash -euxo pipefail -c '
              dnf -y install dnf-plugins-core
              dnf -y builddep libblockdev udisks2 gnome-disk-utility
              dnf -y install cargo cmake gcc gcc-c++ git make rust \
                autoconf automake libtool \
                blueprint-compiler gettext-devel glib2-devel \
                gobject-introspection-devel gtk4-devel libadwaita-devel \
                gtk-doc meson ninja-build python3-bytesize python3-gobject

              cmake -S . -B build-desktop -DCMAKE_BUILD_TYPE=Release
              cmake --build build-desktop --parallel
              cmake --install build-desktop --prefix /usr/local

              cd upstream/libblockdev
              ./autogen.sh
              ./configure --prefix=/usr --without-gtk-doc
              make -j"$(nproc)"
              make install
              ldconfig
              cd /workspace
              PATH=/usr/local/bin:$PATH \
                python3 tests/libblockdev-formatter-smoke.py

              cd upstream/udisks
              ./autogen.sh --disable-gtk-doc --disable-man
              make -j"$(nproc)"

              cd /workspace/upstream/gnome-disk-utility
              meson setup build -Dgsd_plugin=false -Dman=false
              meson compile -C build
            '

  linux:
    name: Linux full suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Linux native adapter dependencies
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Validate Mint desktop integration
        run: desktop-file-validate packaging/infiltratorfs-manager.desktop
      - name: Validate Manager partition enumeration
        run: |
          grep -Fq 'lsblk -prno NAME,SIZE,TYPE,RM,PKNAME,TRAN' tools/infiltratorfs-manager
          ! grep -Fq 'lsblk -prndo NAME,SIZE,TYPE,RM,PKNAME,TRAN' tools/infiltratorfs-manager
      - name: Validate partition 22 torture-test shell syntax and safety gate
        run: |
          bash -n tests/native-partition22-full-test.sh
          bash -n tests/native-complete-qualification.sh
          grep -Fq 'TARGET="/dev/mmcblk0p22"' tests/native-partition22-full-test.sh
          grep -Fq 'EXPECTED_PARTNO="22"' tests/native-partition22-full-test.sh
          grep -Fq 'TARGET="/dev/mmcblk0p22"' tests/native-complete-qualification.sh
          grep -Fq 'ERASE /dev/mmcblk0p22 AND RUN COMPLETE QUALIFICATION' tests/native-complete-qualification.sh
      - name: Guard native random-write optimizations
        run: bash tests/native-random-write-optimization-policy.sh .
      - name: Guard native sequential-write scaling
        run: bash tests/native-sequential-write-scaling-policy.sh .
      - name: Guard native small-file scaling
        run: bash tests/native-small-file-scaling-policy.sh .
      - name: Guard native free-extent index
        run: bash tests/native-free-extent-index-policy.sh .
      - name: Guard native parallel allocation
        run: bash tests/native-parallel-allocation-policy.sh .
      - name: Guard native fragmentation/defrag
        run: |
          bash tests/native-defrag-policy.sh .
          bash -n tests/native-defrag-qualification.sh
      - name: Guard native object-index tree
        run: bash tests/native-index-tree-policy.sh .
      - name: Guard Format 0.17 object-index tree
        run: bash tests/index-tree-format-policy.sh .
      - name: Guard Format 0.17 sharded allocation tree
        run: bash tests/allocation-tree-format-policy.sh .
      - name: Guard portable directory tree core
        run: bash tests/directory-tree-policy.sh .
      - name: Guard native million-file/large-volume scale harness
        run: |
          bash tests/native-scale-policy.sh .
          bash -n tests/native-scale-qualification.sh
          python3 -m py_compile tests/native-scale-stress.py
      - name: Guard native near-full/endurance harness
        run: |
          bash tests/native-endurance-policy.sh .
          bash -n tests/native-endurance-qualification.sh
          python3 -m py_compile tests/native-endurance-stress.py
      - name: Smoke native mixed-workload generator
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/infiltratorfs-endurance-generator-smoke"
          manifest="$RUNNER_TEMP/infiltratorfs-endurance-generator-smoke.json"
          python3 tests/native-endurance-stress.py "$root" \
            --seconds 2 --workers 2 --skip-fill --manifest-out "$manifest"
          python3 tests/native-endurance-stress.py "$root" \
            --verify-manifest "$manifest"
      - name: Smoke scale workload generator
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/infiltratorfs-scale-generator-smoke"
          python3 tests/native-scale-stress.py "$root" \
            --files 5000 --directories 50 --workers 4 --churn-files 500
          python3 tests/native-scale-stress.py "$root" \
            --files 5000 --directories 50 --workers 4 --churn-files 500 --verify-only
      - name: Configure native-only userspace
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Reject FUSE build artifacts
        run: test ! -e build/infilfs-fuse
      - name: Build Linux-created cross-platform image
        run: |
          truncate -s 64M build/linux-cross-platform.img
          build/mkfs.infilfs -L LinuxCrossPlatform build/linux-cross-platform.img
          printf 'linux-to-windows-cross-platform\n' > build/linux-cross-platform.txt
          build/infilfs-tool build/linux-cross-platform.img put build/linux-cross-platform.txt /linux-cross-platform.txt
          build/infilfs-scrub build/linux-cross-platform.img
      - name: Upload Linux-created cross-platform image
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-Linux-CrossPlatform-TestImage
          path: build/linux-cross-platform.img
          if-no-files-found: error

  clang:
    name: Clang conformance
    runs-on: linux-native
    env:
      CC: clang
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure native-only userspace
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Reject FUSE build artifacts
        run: test ! -e build/infilfs-fuse

  sanitizers:
    name: ASan and UBSan
    runs-on: linux-native
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure sanitizers
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Reject FUSE build artifacts
        run: test ! -e build/infilfs-fuse

  analyzer:
    name: GCC static analyzer
    runs-on: linux-native
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure analyzer
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fanalyzer"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Reject FUSE build artifacts
        run: test ! -e build/infilfs-fuse


  local-userspace:
    name: Local Linux userspace qualification
    runs-on: linux-native
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Guard native allocation and transaction policies
        run: |
          bash tests/native-random-write-optimization-policy.sh .
          bash tests/native-sequential-write-scaling-policy.sh .
          bash tests/native-small-file-scaling-policy.sh .
          bash tests/native-free-extent-index-policy.sh .
          bash tests/native-parallel-allocation-policy.sh .
          bash tests/native-index-tree-policy.sh .
          bash tests/index-tree-format-policy.sh .
          bash tests/allocation-tree-format-policy.sh .
          bash tests/directory-tree-policy.sh .
      - name: Configure native-only userspace
        run: cmake -S . -B build-local -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-local --parallel
      - name: Test
        run: ctest --test-dir build-local --output-on-failure
      - name: Cross-platform image smoke
        run: |
          truncate -s 64M build-local/local-cross-platform.img
          build-local/mkfs.infilfs -L LocalCrossPlatform build-local/local-cross-platform.img
          printf 'local-linux-cross-platform\n' > build-local/local-cross-platform.txt
          build-local/infilfs-tool build-local/local-cross-platform.img put build-local/local-cross-platform.txt /local-cross-platform.txt
          build-local/infilfs-scrub build-local/local-cross-platform.img
      - name: Reject FUSE build artifacts
        run: test ! -e build-local/infilfs-fuse

  windows:
    name: Windows native app and portable core
    needs: [linux]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Download Linux-created cross-platform image
        uses: actions/download-artifact@v4
        with:
          name: InfiltratorFS-Linux-CrossPlatform-TestImage
          path: cross-platform
      - name: Configure MSVC
        run: cmake -S . -B build -A x64
      - name: Build Windows targets
        run: cmake --build build --config Release --parallel
      - name: Run Windows conformance tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Open Linux-created cross-platform image on Windows
        shell: pwsh
        run: '& .\build\Release\infilfs-win32-storage.exe .\cross-platform\linux-cross-platform.img'
      - name: Qualify driverless Windows Explorer bridge when ProjFS is available
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -ErrorAction SilentlyContinue
          if (!$feature -or $feature.State -ne 'Enabled') {
            Write-Host 'Client-ProjFS is not currently enabled on this hosted Windows image; attempting a no-restart enable.'
            $dism = Start-Process dism.exe -ArgumentList '/Online','/Enable-Feature','/FeatureName:Client-ProjFS','/NoRestart','/Quiet' -Wait -PassThru -NoNewWindow
            Write-Host "DISM exit code: $($dism.ExitCode)"
            $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -ErrorAction SilentlyContinue
          }
          $dll = Join-Path $env:SystemRoot 'System32\ProjectedFSLib.dll'
          if ($feature -and $feature.State -eq 'Enabled' -and (Test-Path $dll)) {
            Copy-Item .\cross-platform\linux-cross-platform.img .\cross-platform\windows-projfs-bridge.img
            & .\build\Release\infilfs-win32-projfs-bridge.exe .\cross-platform\windows-projfs-bridge.img
            if ($LASTEXITCODE -ne 0) {
              throw "Windows ProjFS bridge integration qualification failed with exit code $LASTEXITCODE"
            }
          } else {
            Write-Host '::notice::Client-ProjFS requires a reboot on this ephemeral runner; runtime bridge qualification is skipped, while compile/conformance coverage remains mandatory.'
          }
      - name: Verify Windows storage and transfer policy are compiled
        shell: pwsh
        run: |
          Select-String -Path tools/windows/infiltratorfs-windows-entry.c -Pattern 'desired_access == GENERIC_READ' -SimpleMatch
          Select-String -Path tools/windows/infiltratorfs-windows-entry.c -Pattern 'infs_volume_set_deferred_publish' -SimpleMatch
          Select-String -Path tools/windows/infiltratorfs-windows-entry.c -Pattern 'INFS_WINDOWS_TRANSFER_PUBLISH_BYTES' -SimpleMatch
          Select-String -Path tools/windows/infiltratorfs-windows-bridge.c -Pattern 'PrjStartVirtualizing' -SimpleMatch
          Select-String -Path tools/windows/infiltratorfs-windows-bridge.c -Pattern 'LoadLibraryW(L"ProjectedFSLib.dll")' -SimpleMatch
          Select-String -Path tests/win32-projfs-bridge.c -Pattern 'Windows ProjFS bridge cross-platform read/write/rename/' -SimpleMatch
          Select-String -Path tools/windows/infiltratorfs-windows-bridge.c -Pattern 'PrjWriteFileData' -SimpleMatch
          Select-String -Path tools/windows/infiltratorfs-windows-bridge.c -Pattern 'PRJ_NOTIFY_FILE_HANDLE_CLOSED_FILE_MODIFIED' -SimpleMatch
          Select-String -Path tools/windows/infiltratorfs-windows.c -Pattern 'Mount in Explorer' -SimpleMatch
          Select-String -Path src/platform/win32_partition_io.c -Pattern 'GLOBALROOT' -SimpleMatch
          Select-String -Path src/platform/win32_partition_io.c -Pattern 'IOCTL_DISK_GET_DRIVE_LAYOUT_EX' -SimpleMatch
      - name: Verify versioned Windows executable and metadata
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)') {
            throw 'Could not determine InfiltratorFS version from CMakeLists.txt'
          }
          $version = $Matches[1]
          $exe = "build\Release\InfiltratorFS-Windows-$version.exe"
          if (!(Test-Path $exe)) { throw "Versioned Windows executable was not built: $exe" }
          $info = (Get-Item $exe).VersionInfo
          if (!$info.FileVersion.StartsWith($version)) { throw "FileVersion '$($info.FileVersion)' does not match $version" }
          if (!$info.ProductVersion.StartsWith($version)) { throw "ProductVersion '$($info.ProductVersion)' does not match $version" }
      - name: Upload Windows transfer app
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-Windows
          path: build/Release/InfiltratorFS-Windows-*.exe
          if-no-files-found: error

  linux-packages:
    name: Native Linux packages
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake desktop-file-utils zenity policykit-1 xdg-utils
      - name: Configure native-only userspace
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Reject FUSE build artifacts
        run: test ! -e build/infilfs-fuse
      - name: Build Linux release packages from an arbitrary working directory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/packaging/build-linux-packages.sh" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/dist"
      - name: Validate native installer and Debian metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          installer="dist/infiltratorfs-${version}-linux-native.run"
          deb="dist/infiltratorfs_${version}_amd64.deb"
          "$installer" --verify
          "$installer" --dry-run | tee dist/native-installer-dry-run.txt
          grep -Fq 'Dry run only; no packages will be installed' dist/native-installer-dry-run.txt
          grep -Fq 'Native build commands:' dist/native-installer-dry-run.txt
          grep -Fq 'Native kernel module commands:' dist/native-installer-dry-run.txt
          test ! -e build/infilfs-fuse
          ! dpkg-deb --contents "$deb" | grep -q 'usr/bin/infilfs-fuse$'
          depends="$(dpkg-deb --field "$deb" Depends)"
          for dependency in dkms kmod policykit-1 util-linux xdg-utils zenity; do
            grep -Eq "(^|, )${dependency}([ ,]|$)" <<<"$depends"
          done
          ! grep -Eqi '(^|[, ])(fuse3|libfuse3-3)([, ]|$)' <<<"$depends"
          test "$(dpkg-deb --field "$deb" X-InfiltratorFS-Build)" = generic-apt
          grep -Fq '+native1' support/installer/bootstrap.sh
          grep -Fq 'INFILTRATORFS_BUILD_IDENTITY=native-local' support/installer/bootstrap.sh
          grep -Fq 'bash "$ROOT/packaging/build-linux-packages.sh"' support/installer/bootstrap.sh
          rm -f dist/native-installer-dry-run.txt
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-Linux
          path: dist/*
          if-no-files-found: error
