# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and conformance

on:
  push:
    branches:
      - main
      - "format-*"
      - "agent/*"
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux full suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux adapter dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang:
    name: Clang conformance
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure sanitizers
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  analyzer:
    name: GCC static analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure analyzer
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fanalyzer"

      - name: Build
        run: cmake --build build --parallel

  windows:
    name: Windows portable core
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSVC
        run: cmake -S . -B build -A x64

      - name: Build portable targets
        run: cmake --build build --config Release --parallel

      - name: Run portable conformance tests
        run: ctest --test-dir build -C Release --output-on-failure
