# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and conformance

on:
  push:
    branches:
      - main
      - "format-*"
      - "release/*"
      - "agent/*"
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux full suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Linux adapter dependencies
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libfuse3-dev fuse3
      - name: Validate Mint desktop integration
        run: desktop-file-validate packaging/infiltratorfs-manager.desktop
      - name: Validate Manager partition enumeration
        run: |
          grep -Fq 'lsblk -prno NAME,SIZE,TYPE,RM,PKNAME,TRAN' tools/infiltratorfs-manager
          ! grep -Fq 'lsblk -prndo NAME,SIZE,TYPE,RM,PKNAME,TRAN' tools/infiltratorfs-manager
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang:
    name: Clang conformance
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Linux adapter dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Linux adapter dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3
      - name: Configure sanitizers
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  analyzer:
    name: GCC static analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Linux adapter dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3
      - name: Configure analyzer
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fanalyzer"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows native app and portable core
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure MSVC
        run: cmake -S . -B build -A x64
      - name: Build Windows targets
        run: cmake --build build --config Release --parallel
      - name: Run Windows conformance tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows transfer app
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-Windows
          path: build/Release/InfiltratorFS-Windows.exe
          if-no-files-found: error

  linux-packages:
    name: Linux GUI packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake desktop-file-utils fuse3 libfuse3-dev pkg-config zenity policykit-1 xdg-utils
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Build Linux release packages
        run: bash packaging/build-linux-packages.sh build dist
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-Linux
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish 0.9.1
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, clang, sanitizers, analyzer, windows, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows executable
        uses: actions/download-artifact@v4
        with:
          name: InfiltratorFS-Windows
          path: dist
      - name: Download verified Linux installers
        uses: actions/download-artifact@v4
        with:
          name: InfiltratorFS-Linux
          path: dist
      - name: Create or update 0.9.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view v0.9.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create v0.9.1 \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "InfiltratorFS 0.9.1 — Desktop Write Batching" \
              --notes "Implementation 0.9.1 keeps InfiltratorFS Format 0.8 and fixes severe Linux desktop write amplification. The generic core now supports deferred publication with a bounded dirty-data threshold so ordinary creates, writes, truncates, metadata updates, renames, unlinks and reflinks can share one transaction instead of rewriting the full allocation bitmap for every small operation. The Linux FUSE adapter no longer treats flush/release as fsync; explicit fsync and unmount remain durability boundaries. A 64 MiB default batch cap prevents transactions growing without bound. Includes regression coverage for deferred publication and preserves scalable paged metadata, shared extents/reflinks, scrub and Windows compatibility. Experimental: use disposable or backed-up media only."
          fi
          gh release upload v0.9.1 dist/* \
            --repo "${GITHUB_REPOSITORY}" --clobber

  report-release:
    name: Report release gate
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, clang, sanitizers, analyzer, windows, linux-packages, publish-release]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish readable commit status
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RESULT: ${{ needs.linux.result }}
          CLANG_RESULT: ${{ needs.clang.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          ANALYZER_RESULT: ${{ needs.analyzer.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          PACKAGES_RESULT: ${{ needs.linux-packages.result }}
          RELEASE_RESULT: ${{ needs.publish-release.result }}
        run: |
          set -euo pipefail
          state=success
          description="v0.9.1 write-batching build verified and published"
          for result in "$LINUX_RESULT" "$CLANG_RESULT" "$SANITIZERS_RESULT" \
                        "$ANALYZER_RESULT" "$WINDOWS_RESULT" "$PACKAGES_RESULT" \
                        "$RELEASE_RESULT"; do
            if [ "$result" != "success" ]; then
              state=failure
              description="v0.9.1 build/release gate failed"
              break
            fi
          done
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="InfiltratorFS 0.9.1" \
            -f description="$description"
