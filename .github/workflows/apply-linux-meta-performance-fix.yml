# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply Linux metadata performance fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-linux-meta-performance-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python3 tools/apply-linux-meta-performance-fix.py

      - name: Verify source policy
        run: |
          git diff --check -- . ':!README.md'
          bash tests/native-small-file-scaling-policy.sh .

      - name: Build patched kernel module
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n1)"
          test -f "$KDIR/Makefile"
          make -C kernel clean KDIR="$KDIR"
          make -C kernel KDIR="$KDIR"
          test -s kernel/infiltratorfs.ko

      - name: Commit repair
        run: |
          git config user.name 'InfiltratorFS CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add kernel/infiltratorfs_internal.h kernel/infiltratorfs_linux_meta.inc kernel/infiltratorfs_core.c tests/native-small-file-scaling-policy.sh CMakeLists.txt README.md
          git diff --cached --check -- . ':!README.md'
          git commit -m 'Optimize native Linux metadata performance'
          git push origin HEAD:main
