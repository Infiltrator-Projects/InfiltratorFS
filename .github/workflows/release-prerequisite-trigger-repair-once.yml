name: Repair exact-source release prerequisite triggers once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair exact-source release prerequisite triggers'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove release-prerequisite path filters and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/kernel-module.yml'),
              Path('.github/workflows/root-volume-qualification.yml'),
              Path('.github/workflows/linux-metadata-qualification.yml'),
          ]
          for path in paths:
              lines = path.read_text().splitlines(keepends=True)
              out = []
              i = 0
              removed = False
              while i < len(lines):
                  if lines[i].startswith('    paths:'):
                      removed = True
                      i += 1
                      while i < len(lines) and not lines[i].startswith('  workflow_dispatch:'):
                          i += 1
                      continue
                  out.append(lines[i])
                  i += 1
              if not removed:
                  raise SystemExit(f'{path}: expected push paths filter not found')
              text = ''.join(out)
              if '  push:\n    branches:\n      - main\n  workflow_dispatch:\n' not in text:
                  raise SystemExit(f'{path}: repaired trigger shape not established')
              path.write_text(text)
          PY
          git rm .github/workflows/release-prerequisite-trigger-repair-once.yml
          git add .github/workflows/kernel-module.yml \
                  .github/workflows/root-volume-qualification.yml \
                  .github/workflows/linux-metadata-qualification.yml
          git diff --cached --check
          git commit -m 'Require exact-source release prerequisites on every main revision'
          git push origin HEAD:main
