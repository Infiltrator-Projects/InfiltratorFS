# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot LZ4 restoration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-lz4-restore.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev kmod python3 \
            "linux-headers-$(uname -r)"

      - name: Restore retained LZ4 codec support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"guard failed in {path}: {old[:120]!r}")
              s2 = s.replace(old, new, count)
              if s2 == s:
                  raise SystemExit(f"no change made in {path}")
              p.write_text(s2)

          cmake = Path('CMakeLists.txt')
          s = cmake.read_text()
          marker = '# Release 0.18.34 standardises InfiltratorFS desktop applications on the'
          lz4_block = '''# LZ4 codec identifier 1 remains a retained, non-default Format 0.18
          # interoperability representation. Pin it so every userspace adapter
          # decodes the same byte stream; automatic writes continue to use IAC1.
          include(FetchContent)
          set(LZ4_BUILD_CLI OFF CACHE BOOL "" FORCE)
          set(LZ4_BUNDLED_MODE ON CACHE BOOL "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(BUILD_STATIC_LIBS ON CACHE BOOL "" FORCE)
          FetchContent_Declare(infilfs_lz4
              GIT_REPOSITORY https://github.com/lz4/lz4.git
              GIT_TAG v1.10.0
              SOURCE_SUBDIR build/cmake
              GIT_SHALLOW TRUE)
          FetchContent_MakeAvailable(infilfs_lz4)

          '''
          if 'FetchContent_Declare(infilfs_lz4' not in s:
              if marker not in s:
                  raise SystemExit('CMake LZ4 insertion anchor changed')
              s = s.replace(marker, lz4_block + marker, 1)
          old_link = 'target_link_libraries(infilfs_core PUBLIC InfiltratrCommon::Portable)'
          new_link = 'target_link_libraries(infilfs_core PUBLIC InfiltratrCommon::Portable lz4_static)'
          if old_link in s:
              s = s.replace(old_link, new_link, 1)
          elif new_link not in s:
              raise SystemExit('infilfs_core link line changed')
          if 'infilfs-lz4-compat-test' not in s:
              s += '''\nadd_executable(infilfs-lz4-compat-test tests/lz4-compat.c)
          target_include_directories(infilfs-lz4-compat-test PRIVATE include)
          target_link_libraries(infilfs-lz4-compat-test PRIVATE lz4_static)
          infilfs_enable_warnings(infilfs-lz4-compat-test)
          add_test(NAME lz4-compat COMMAND infilfs-lz4-compat-test)
          '''
          cmake.write_text(s)

          replace('include/infilfs/format.h',
                  '#define INFS_COMPRESSION_NONE 0u\n#define INFS_COMPRESSION_IAC1 2u',
                  '#define INFS_COMPRESSION_NONE 0u\n#define INFS_COMPRESSION_LZ4  1u\n#define INFS_COMPRESSION_IAC1 2u')
          replace('kernel/infiltratorfs_format.h',
                  '#define INFILFS_COMPRESSION_NONE 0u\n#define INFILFS_COMPRESSION_IAC1 2u',
                  '#define INFILFS_COMPRESSION_NONE 0u\n#define INFILFS_COMPRESSION_LZ4 1u\n#define INFILFS_COMPRESSION_IAC1 2u')

          replace('src/volume.c', '#include <string.h>\n',
                  '#include <string.h>\n#include <lz4.h>\n')
          replace('src/volume.c',
                  '''    if (codec != INFS_COMPRESSION_IAC1 || !stored ||
                  logical_blocks > INFS_COMPRESSION_CLUSTER_BLOCKS ||''',
                  '''    if ((codec != INFS_COMPRESSION_LZ4 &&
                   codec != INFS_COMPRESSION_IAC1) || !stored ||
                  logical_blocks > INFS_COMPRESSION_CLUSTER_BLOCKS ||''')
          replace('src/volume/compression.inc',
                  '''    if (extent_codec(flags) == INFS_COMPRESSION_IAC1) {
                  decoded = (int)infs_iac1_decompress(
                      compressed, stored, plain, logical_bytes);''',
                  '''    if (extent_codec(flags) == INFS_COMPRESSION_LZ4) {
                  decoded = LZ4_decompress_safe(
                      (const char *)compressed, (char *)plain,
                      (int)stored, (int)logical_bytes);
              } else if (extent_codec(flags) == INFS_COMPRESSION_IAC1) {
                  decoded = (int)infs_iac1_decompress(
                      compressed, stored, plain, logical_bytes);''')

          replace('kernel/infiltratorfs_internal.h', '#include <linux/list.h>\n',
                  '#include <linux/list.h>\n#include <linux/lz4.h>\n')
          replace('kernel/infiltratorfs_core.c',
                  '''    if (codec != INFILFS_COMPRESSION_IAC1 || !stored ||
                  logical_blocks > INFILFS_COMPRESSION_CLUSTER_BLOCKS ||''',
                  '''    if ((codec != INFILFS_COMPRESSION_LZ4 &&
                   codec != INFILFS_COMPRESSION_IAC1) || !stored ||
                  logical_blocks > INFILFS_COMPRESSION_CLUSTER_BLOCKS ||''')
          replace('kernel/infiltratorfs_core.c',
                  '''    if (infilfs_extent_codec(flags) == INFILFS_COMPRESSION_IAC1) {
                  decoded = (int)infilfs_iac1_decompress(
                      compressed, stored, plain, plain_bytes);''',
                  '''    if (infilfs_extent_codec(flags) == INFILFS_COMPRESSION_LZ4) {
                  decoded = LZ4_decompress_safe(
                      (const char *)compressed, (char *)plain,
                      (int)stored, (int)plain_bytes);
              } else if (infilfs_extent_codec(flags) == INFILFS_COMPRESSION_IAC1) {
                  decoded = (int)infilfs_iac1_decompress(
                      compressed, stored, plain, plain_bytes);''')

          Path('tests/lz4-compat.c').write_text(r'''// SPDX-License-Identifier: GPL-3.0-or-later
          #include "infilfs/format.h"
          #include <lz4.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>

          int main(void)
          {
              uint8_t input[8192];
              char encoded[LZ4_COMPRESSBOUND(8192)];
              char decoded[8192];
              int encoded_bytes;
              int decoded_bytes;
              size_t i;

              if (INFS_COMPRESSION_LZ4 != 1u || INFS_COMPRESSION_IAC1 != 2u)
                  return 2;
              for (i = 0; i < sizeof(input); ++i)
                  input[i] = (uint8_t)((i / 32u) ^ (i & 7u));
              encoded_bytes = LZ4_compress_default(
                  (const char *)input, encoded, (int)sizeof(input),
                  (int)sizeof(encoded));
              if (encoded_bytes <= 0)
                  return 3;
              decoded_bytes = LZ4_decompress_safe(
                  encoded, decoded, encoded_bytes, (int)sizeof(decoded));
              if (decoded_bytes != (int)sizeof(input) ||
                  memcmp(input, decoded, sizeof(input)) != 0)
                  return 4;
              puts("LZ4 retained codec compatibility: PASS");
              return 0;
          }
          '''.replace('          ', ''))

          p = Path('README.md')
          t = p.read_text()
          t = t.replace(
              '- adaptive bounded per-extent compression using native IAC1 v1;',
              '- adaptive bounded per-extent compression using native IAC1 v1, with LZ4 retained as a non-default interoperability/reference representation;')
          p.write_text(t)

          p = Path('docs/COMPRESSION.md')
          t = p.read_text()
          t = t.replace(
              'IAC1 is the sole bounded compression codec accepted by Format 0.18.',
              'IAC1 is the InfiltratorFS-native bounded codec selected for Format 0.18. LZ4\n(codec identifier 1) remains supported as a development/reference and\ninteroperability codec, but new automatic writes do not select LZ4.')
          t = t.replace(
              'For Format 0.18, codec identifier 2 means IAC1 v1. Every other nonzero codec\nidentifier is invalid.',
              'For Format 0.18, codec identifier 2 means IAC1 v1 and codec identifier 1 means\nthe retained LZ4 representation.')
          t = t.replace('## Relationship to other codecs', '## Relationship to LZ4 and other codecs')
          p.write_text(t)

          for p in Path('docs').glob('*.md'):
              t = p.read_text()
              t = t.replace(
                  'Format 0.18 accepts IAC1 v1 (codec ID 2) as its sole compressed representation; other codec IDs are invalid.',
                  'Current automatic writes use IAC1 v1 (codec ID 2); LZ4 (codec ID 1) remains a supported non-default representation.')
              p.write_text(t)

          policy = Path('tests/root-readiness-policy.sh')
          t = policy.read_text()
          marker = "grep -Fq 'infilfs-compression' \"$root/CMakeLists.txt\"\n"
          if 'INFS_COMPRESSION_LZ4' not in t:
              if marker not in t:
                  raise SystemExit('root-readiness compression anchor changed')
              t = t.replace(marker, marker +
                  "grep -Fq 'INFS_COMPRESSION_LZ4' \"$root/include/infilfs/format.h\"\n", 1)
          policy.write_text(t)

          def add_modprobes(path, needle, root_mode=False, all_sites=False):
              p = Path(path)
              t = p.read_text()
              prefix = '' if root_mode else 'sudo '
              pos = 0
              changed = False
              while True:
                  idx = t.find(needle, pos)
                  if idx < 0:
                      break
                  line_start = t.rfind('\n', 0, idx) + 1
                  before = t[max(0, line_start - 180):line_start]
                  if 'modprobe lz4_decompress' not in before:
                      indent = t[line_start:idx]
                      ins = (f'{indent}{prefix}modprobe lz4_compress 2>/dev/null || true\n'
                             f'{indent}{prefix}modprobe lz4_decompress 2>/dev/null || true\n')
                      t = t[:line_start] + ins + t[line_start:]
                      pos = line_start + len(ins) + len(needle)
                      changed = True
                  else:
                      pos = idx + len(needle)
                  if not all_sites:
                      break
              if needle not in t:
                  raise SystemExit(f'insmod anchor missing in {path}')
              if changed:
                  p.write_text(t)

          add_modprobes('.github/workflows/heavy-qualification.yml',
                        'if ! sudo insmod kernel/infiltratorfs.ko; then', all_sites=True)
          add_modprobes('.github/workflows/kernel-module.yml',
                        'if ! sudo insmod kernel/infiltratorfs.ko; then', all_sites=True)
          add_modprobes('tests/native-complete-qualification.sh',
                        'if ! sudo insmod "$ROOT/kernel/infiltratorfs.ko"; then')
          add_modprobes('tests/native-defrag-qualification.sh',
                        'if ! sudo insmod "$MODULE"; then')
          add_modprobes('tests/native-media-placement-qualification.sh',
                        'if ! sudo insmod "$MODULE"; then')
          add_modprobes('tests/root-boot-qemu.sh', 'insmod "$module"', root_mode=True)
          PY

      - name: Build and test restored codec
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-lz4 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-lz4 --parallel
          ctest --test-dir build-lz4 --output-on-failure
          bash -n tests/root-boot-qemu.sh
          bash tests/root-readiness-policy.sh .
          kdir="/lib/modules/$(uname -r)/build"
          make -C kernel clean KDIR="$kdir" || true
          make -C kernel KDIR="$kdir"
          grep -Fq 'LZ4_decompress_safe' kernel/infiltratorfs_core.c
          grep -Fq 'INFS_COMPRESSION_LZ4' include/infilfs/format.h

      - name: Commit restored codec and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-lz4-restore.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          # Stage only tracked source modifications/deletions plus the one new
          # compatibility test. Kbuild creates untracked .cmd files that must
          # never enter a source commit.
          git add -u
          git add tests/lz4-compat.c
          if git diff --cached --name-only | grep -Eq '^kernel/\.'; then
            echo 'Refusing to commit generated Kbuild dotfiles.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Restore LZ4 as retained non-default codec'
          git push origin HEAD:main
