name: Finish root-volume integration fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/root-volume-fix-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply reviewed root-volume patch
        shell: bash
        run: |
          set -euo pipefail

          # Reuse the reviewed v1 patch through its known CMake stop point.
          # All kernel ACL/reserved-name changes and the new package templates
          # are created before that point.
          python3 <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/root-volume-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = [(line[10:] if line.startswith('          ') else line)
                  for line in lines[start:end]]
          Path('/tmp/root-volume-bootstrap.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/root-volume-bootstrap.py || true

          python3 <<'PY'
          from pathlib import Path

          def insert_before(path, anchor, addition):
              p = Path(path)
              text = p.read_text()
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor {anchor!r}, found {count}')
              p.write_text(text.replace(anchor, addition + anchor, 1))

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          # CMake: permanent root-integration policy test and initramfs hook.
          insert_before(
              'CMakeLists.txt',
              '    add_test(NAME infilfs-desktop-integration\n',
              '''    add_test(NAME infilfs-root-volume-integration-policy
                  COMMAND bash ${CMAKE_SOURCE_DIR}/tests/root-volume-integration-policy.sh
                               ${CMAKE_SOURCE_DIR})
          ''')
          insert_before(
              'CMakeLists.txt',
              '    install(FILES packaging/infiltratorfs-manager.desktop\n',
              '''    install(PROGRAMS packaging/initramfs/infiltratorfs-hook
                  DESTINATION share/initramfs-tools/hooks
                  RENAME infiltratorfs)
          ''')

          # The first draft contained one unsafe double-quoted grep that would
          # expand $1. Other checks cover the same policy, so remove it.
          p = Path('tests/root-volume-integration-policy.sh')
          p.write_text('\n'.join(
              line for line in p.read_text().splitlines()
              if 'grep -Fq "awk ' not in line
          ) + '\n')

          # Root upgrades must not delete the old on-disk DKMS driver before
          # the replacement has been built and the initramfs regenerated. Keep
          # stale versions on root upgrades as an additional recovery path.
          replace_once(
              'packaging/debian/preinst.in',
              'if command -v dkms >/dev/null 2>&1; then\n',
              'if [ "$root_active" -eq 0 ] && command -v dkms >/dev/null 2>&1; then\n')

          # Install root-aware maintainer templates immediately before package
          # creation. This intentionally leaves the historical heredocs above
          # intact while making the final archive use the reviewed scripts.
          p = Path('packaging/build-linux-packages.sh')
          text = p.read_text()
          build_anchor = 'dpkg-deb --root-owner-group --build "$package_root" "$dist_dir/$deb_name"\n'
          if text.count(build_anchor) != 1:
              raise SystemExit('package build anchor mismatch')
          template_install = '''for maintainer in preinst postinst prerm; do
              sed "s/@PACKAGE_VERSION@/${package_version}/g" \\
                  "packaging/debian/${maintainer}.in" > "$package_root/DEBIAN/$maintainer"
              chmod 0755 "$package_root/DEBIAN/$maintainer"
          done

          '''
          text = text.replace(build_anchor, template_install + build_anchor, 1)
          required = "    'usr/sbin/fsck.infiltratorfs$' \\\n"
          if text.count(required) != 1:
              raise SystemExit('package contents anchor mismatch')
          text = text.replace(
              required,
              required + "    'usr/share/initramfs-tools/hooks/infiltratorfs$' \\\n",
              1,
          )
          # initramfs-tools is a hard dependency for a package that advertises
          # Linux root-volume support.
          control = 'Depends: dkms, kmod, policykit-1, util-linux, xdg-utils, fontconfig, python3, python3-gi, gir1.2-gtk-3.0${desktop_depends}\n'
          if text.count(control) != 1:
              raise SystemExit('package Depends anchor mismatch')
          text = text.replace(
              control,
              'Depends: dkms, initramfs-tools, kmod, policykit-1, util-linux, xdg-utils, fontconfig, python3, python3-gi, gir1.2-gtk-3.0${desktop_depends}\n',
              1,
          )
          dep_loop = 'for dependency in dkms kmod policykit-1 util-linux xdg-utils fontconfig python3 python3-gi gir1.2-gtk-3.0; do\n'
          if text.count(dep_loop) != 1:
              raise SystemExit('package dependency validation anchor mismatch')
          text = text.replace(
              dep_loop,
              'for dependency in dkms initramfs-tools kmod policykit-1 util-linux xdg-utils fontconfig python3 python3-gi gir1.2-gtk-3.0; do\n',
              1,
          )
          p.write_text(text)

          # Native kernel CI: install real ACL tools, rsync and initramfs-tools,
          # and run the root-volume static policy before compiling.
          replace_once(
              '.github/workflows/kernel-module.yml',
              'sudo apt-get install -y build-essential cmake e2fsprogs kmod linux-headers-generic\n',
              'sudo apt-get install -y acl build-essential cmake e2fsprogs initramfs-tools kmod linux-headers-generic rsync\n')
          insert_before(
              '.github/workflows/kernel-module.yml',
              '      - name: Build InfiltratorFS kernel module\n',
              '''      - name: Guard root-volume integration
                  run: bash tests/root-volume-integration-policy.sh .

          ''')

          # Release CI installs initramfs-tools and proves the package-generated
          # image actually contains the native module.
          p = Path('.github/workflows/release-packages.yml')
          text = p.read_text()
          dependency_anchor = '            build-essential cmake desktop-file-utils dkms dwarves kmod \\\n'
          if text.count(dependency_anchor) != 1:
              raise SystemExit('release dependency anchor mismatch')
          text = text.replace(
              dependency_anchor,
              '            build-essential cmake desktop-file-utils dkms dwarves initramfs-tools kmod \\\n',
              1,
          )
          loop = '          for dependency in dkms kmod policykit-1 util-linux xdg-utils fontconfig python3 python3-gi gir1.2-gtk-3.0; do\n'
          if text.count(loop) != 1:
              raise SystemExit('release dependency loop anchor mismatch')
          text = text.replace(
              loop,
              '          for dependency in dkms initramfs-tools kmod policykit-1 util-linux xdg-utils fontconfig python3 python3-gi gir1.2-gtk-3.0; do\n',
              1,
          )
          install_line = '          sudo dpkg -i "$deb" | tee "$RUNNER_TEMP/native-release-upgrade.txt"\n'
          if text.count(install_line) != 1:
              raise SystemExit(f'release upgrade anchor count {text.count(install_line)}')
          initrd_check = '''          initrd="/boot/initrd.img-$(uname -r)"
              test -s "$initrd"
              lsinitramfs "$initrd" | grep -Eq '(^|/)infiltratorfs\\.ko(\\.(gz|xz|zst))?$'
          '''
          text = text.replace(install_line, install_line + initrd_check, 1)
          p.write_text(text)
          PY

          chmod +x packaging/initramfs/infiltratorfs-hook \
                   tests/root-volume-integration-policy.sh
          bash -n packaging/build-linux-packages.sh \
                  packaging/initramfs/infiltratorfs-hook \
                  packaging/debian/preinst.in \
                  packaging/debian/postinst.in \
                  packaging/debian/prerm.in \
                  tests/root-volume-integration-policy.sh
          python3 -m py_compile tests/native-posix-acl-qualification.py
          bash tests/root-volume-integration-policy.sh .

          # Verify the patch really exists before committing it.
          grep -Fq '&posix_acl_access_xattr_handler' kernel/infiltratorfs_linux_meta.inc
          grep -Fq '&posix_acl_default_xattr_handler' kernel/infiltratorfs_linux_meta.inc
          grep -Fq 'chmod ACL rollback failed' kernel/infiltratorfs_linux_meta.inc
          grep -Fq 'infilfs_ns_reserved_linux_meta_name' kernel/infiltratorfs_rw_namespace.inc
          grep -Fq 'manual_add_modules infiltratorfs' packaging/initramfs/infiltratorfs-hook
          grep -Fq 'root-volume upgrade staged safely' packaging/debian/postinst.in
          grep -Fq 'setfacl' tests/native-posix-acl-qualification.py

      - name: Commit root-volume implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/root-volume-fix.yml \
                 .github/workflows/root-volume-fix-v2.yml \
                 .github/workflows/root-volume-fix-v3.yml
          git add CMakeLists.txt \
                  .github/workflows/kernel-module.yml \
                  .github/workflows/release-packages.yml \
                  kernel/infiltratorfs_linux_meta.inc \
                  kernel/infiltratorfs_rw.inc \
                  kernel/infiltratorfs_rw_namespace.inc \
                  packaging/build-linux-packages.sh \
                  packaging/initramfs/infiltratorfs-hook \
                  packaging/debian/preinst.in \
                  packaging/debian/postinst.in \
                  packaging/debian/prerm.in \
                  tests/native-posix-acl-qualification.py \
                  tests/root-volume-integration-policy.sh
          git commit -m 'linux: make InfiltratorFS root-volume safe'
          git push origin HEAD:main
