# SPDX-License-Identifier: GPL-3.0-or-later
name: Desktop integration bundle

# Build and qualify the ABI-matched binaries carried inside the single
# InfiltratorFS package.  The distro GNOME Disks/libblockdev packages remain
# installed and retain package ownership; InfiltratorFS uses reversible
# dpkg-divert integration only while the filesystem package is installed.
# Re-running this workflow refreshes the raw bundle consumed by release gates.
on:
  push:
    branches: [main]
    paths:
      - packaging/libblockdev-3.1-infiltratorfs.patch
      - packaging/gnome-disks-46-infiltratorfs.patch
      - packaging/build-noble-desktop-integration.sh
      - packaging/infiltratorfs-os-integration
      - .github/workflows/desktop-integration-packages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-integration-bundle
  cancel-in-progress: true

jobs:
  build:
    name: Build ABI-matched Ubuntu/Mint integration bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable source packages and install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake devscripts dpkg-dev git libgtk-3-dev libssl-dev \
            udisks2 gnome-disk-utility libblockdev-fs3
          sudo apt-get build-dep -y libblockdev gnome-disk-utility

      - name: Build raw in-place integration bundle
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/build-noble-desktop-integration.sh "$RUNNER_TEMP/desktop-integration"
          dir="$RUNNER_TEMP/desktop-integration"
          test -x "$dir/gnome-disks"
          test -s "$dir/libbd_fs.so"
          test -s "$dir/manifest"
          test "$(sed -n 's/^target=//p' "$dir/manifest")" = ubuntu-24.04-linuxmint-22.x
          if find "$dir" -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            echo 'Desktop integration bundle must not contain replacement Debian packages.' >&2
            exit 1
          fi

      - name: Install and exercise single-package integration
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-integration -DCMAKE_BUILD_TYPE=Release
          cmake --build build-integration --parallel
          sudo cmake --install build-integration --prefix /usr

          stock_gdu_sha="$(sha256sum /usr/bin/gnome-disks | awk '{print $1}')"
          plugin="$(dpkg-query -L libblockdev-fs3 | grep -E '/libbd_fs\.so\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          test -n "$plugin"
          stock_plugin_sha="$(sha256sum "$plugin" | awk '{print $1}')"

          sudo install -d /usr/lib/infiltratorfs/os-integration
          sudo install -m 0755 "$RUNNER_TEMP/desktop-integration/gnome-disks" /usr/lib/infiltratorfs/os-integration/gnome-disks
          sudo install -m 0644 "$RUNNER_TEMP/desktop-integration/libbd_fs.so" /usr/lib/infiltratorfs/os-integration/libbd_fs.so
          sudo install -m 0644 "$RUNNER_TEMP/desktop-integration/manifest" /usr/lib/infiltratorfs/os-integration/manifest

          sudo /usr/lib/infiltratorfs/infiltratorfs-os-integration install
          # dpkg-divert intentionally changes path ownership reporting while the
          # InfiltratorFS integration is active.  Verify the distro packages are
          # still installed and that their originals are preserved by diversion
          # instead of incorrectly requiring dpkg-query -S to report the live path.
          dpkg-query -W -f='${Status}\n' libblockdev-fs3 | grep -Fxq 'install ok installed'
          dpkg-query -W -f='${Status}\n' gnome-disk-utility | grep -Fxq 'install ok installed'
          dpkg-divert --list | grep -Fq 'diversion of /usr/bin/gnome-disks'
          test -x /usr/bin/gnome-disks.distrib
          test -s "${plugin}.distrib"
          gdbus call --system --dest org.freedesktop.UDisks2 \
            --object-path /org/freedesktop/UDisks2/Manager \
            --method org.freedesktop.UDisks2.Manager.CanFormat infiltratorfs | grep -Fq true
          grep -aFq 'InfiltratorFS' /usr/bin/gnome-disks

          sudo /usr/lib/infiltratorfs/infiltratorfs-os-integration remove
          test "$(sha256sum /usr/bin/gnome-disks | awk '{print $1}')" = "$stock_gdu_sha"
          test "$(sha256sum "$plugin" | awk '{print $1}')" = "$stock_plugin_sha"
          if dpkg-divert --list | grep -Fq 'by infiltratorfs'; then
            echo 'InfiltratorFS diversion remained after integration removal.' >&2
            dpkg-divert --list | grep -F 'by infiltratorfs' >&2 || true
            exit 1
          fi

      - name: Publish qualified integration prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/desktop-integration"
          manifest="$dir/manifest"
          libver="$(sed -n 's/^libblockdev_source_version=//p' "$manifest")"
          gduver="$(sed -n 's/^gnome_disk_utility_source_version=//p' "$manifest")"
          patch="$(sed -n 's/^patch_sha256=//p' "$manifest")"
          safe_lib="$(printf '%s' "$libver" | tr ':~+/' '----')"
          safe_gdu="$(printf '%s' "$gduver" | tr ':~+/' '----')"
          tag="desktop-integration-ubuntu24.04-${safe_lib}-${safe_gdu}-${patch:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Qualified desktop integration prerelease already exists: $tag"
            exit 0
          fi
          gh release create "$tag" \
            "$dir/gnome-disks" "$dir/libbd_fs.so" "$manifest" \
            --target "$GITHUB_SHA" \
            --title "InfiltratorFS desktop integration for Ubuntu 24.04 / Mint 22.x" \
            --notes "ABI-matched in-place integration bundle for the single InfiltratorFS package. Distro GNOME Disks and libblockdev packages remain installed and are restored byte-for-byte on removal." \
            --prerelease --latest=false
