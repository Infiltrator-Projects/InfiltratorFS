name: Resume root-volume integration fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/root-volume-fix-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reapply completed portion and finish patch
        shell: bash
        run: |
          set -euo pipefail

          # Reuse the already-reviewed bootstrap script through the point where
          # it intentionally stopped on an overly strict CMake anchor.  All
          # filesystem/kernel/template edits occur before that anchor.
          python3 <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/root-volume-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/root-volume-bootstrap.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/root-volume-bootstrap.py || true

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count for {old!r} is {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # The first bootstrap deliberately stopped here.  Use single-line
          # unique anchors so whitespace-only CMake changes cannot break it.
          p = Path('CMakeLists.txt')
          text = p.read_text()
          anchor = '    add_test(NAME infilfs-desktop-integration\n'
          addition = '''    add_test(NAME infilfs-root-volume-integration-policy
              COMMAND bash ${CMAKE_SOURCE_DIR}/tests/root-volume-integration-policy.sh
                           ${CMAKE_SOURCE_DIR})
          '''
          if text.count(anchor) != 1:
              raise SystemExit('CMake test anchor mismatch')
          text = text.replace(anchor, addition + anchor, 1)
          anchor = '    install(FILES packaging/infiltratorfs-manager.desktop\n'
          addition = '''    install(PROGRAMS packaging/initramfs/infiltratorfs-hook
              DESTINATION share/initramfs-tools/hooks
              RENAME infiltratorfs)
          '''
          if text.count(anchor) != 1:
              raise SystemExit('CMake install anchor mismatch')
          p.write_text(text.replace(anchor, addition + anchor, 1))

          # The policy script's double-quoted awk pattern would expand $1 in
          # bash.  The other checks already prove non-root filtering, so remove
          # that redundant and unsafe static grep.
          p = Path('tests/root-volume-integration-policy.sh')
          lines = [line for line in p.read_text().splitlines()
                   if 'grep -Fq "awk ' not in line]
          p.write_text('\n'.join(lines) + '\n')

          # Overwrite the legacy generated Debian maintainer scripts with the
          # reviewed root-aware templates immediately before dpkg-deb runs.
          p = Path('packaging/build-linux-packages.sh')
          text = p.read_text()
          anchor = 'dpkg-deb --root-owner-group --build "$package_root" "$dist_dir/$deb_name"\n'
          injection = '''for maintainer in preinst postinst prerm; do
              sed "s/@PACKAGE_VERSION@/${package_version}/g" \\
                  "packaging/debian/${maintainer}.in" > "$package_root/DEBIAN/$maintainer"
              chmod 0755 "$package_root/DEBIAN/$maintainer"
          done

          '''
          if text.count(anchor) != 1:
              raise SystemExit('package build insertion anchor mismatch')
          text = text.replace(anchor, injection + anchor, 1)
          required = "    'usr/sbin/fsck.infiltratorfs$' \\\n"
          if text.count(required) != 1:
              raise SystemExit('package required-list anchor mismatch')
          text = text.replace(
              required,
              required + "    'usr/share/initramfs-tools/hooks/infiltratorfs$' \\\n",
              1,
          )
          p.write_text(text)

          replace_once(
              '.github/workflows/kernel-module.yml',
              'sudo apt-get install -y build-essential cmake e2fsprogs kmod linux-headers-generic\n',
              'sudo apt-get install -y acl build-essential cmake e2fsprogs initramfs-tools kmod linux-headers-generic rsync\n')
          replace_once(
              '.github/workflows/kernel-module.yml',
              '''      - name: Guard native quotas
              run: bash tests/native-quota-policy.sh .

          - name: Build InfiltratorFS kernel module
          ''',
              '''      - name: Guard native quotas
              run: bash tests/native-quota-policy.sh .

          - name: Guard root-volume integration
              run: bash tests/root-volume-integration-policy.sh .

          - name: Build InfiltratorFS kernel module
          ''')

          p = Path('.github/workflows/release-packages.yml')
          text = p.read_text()
          anchor = '''          sudo dpkg -i "$deb" | tee "$RUNNER_TEMP/native-release-upgrade.txt"
              ! findmnt -rn -t infiltratorfs,fuse.infilfs-fuse | grep -q .
          '''
          replacement = '''          sudo dpkg -i "$deb" | tee "$RUNNER_TEMP/native-release-upgrade.txt"
              initrd="/boot/initrd.img-$(uname -r)"
              test -s "$initrd"
              lsinitramfs "$initrd" | grep -Eq '(^|/)infiltratorfs\\.ko(\\.(gz|xz|zst))?$'
              ! findmnt -rn -t infiltratorfs,fuse.infilfs-fuse | grep -q .
          '''
          if text.count(anchor) != 1:
              raise SystemExit('release initramfs qualification anchor mismatch')
          p.write_text(text.replace(anchor, replacement, 1))
          PY

          chmod +x packaging/initramfs/infiltratorfs-hook \
                   tests/root-volume-integration-policy.sh
          bash -n packaging/build-linux-packages.sh \
                  packaging/initramfs/infiltratorfs-hook \
                  packaging/debian/preinst.in \
                  packaging/debian/postinst.in \
                  packaging/debian/prerm.in \
                  tests/root-volume-integration-policy.sh
          python3 -m py_compile tests/native-posix-acl-qualification.py
          bash tests/root-volume-integration-policy.sh .

      - name: Commit fixes and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/root-volume-fix.yml \
                 .github/workflows/root-volume-fix-v2.yml
          git add CMakeLists.txt \
                  .github/workflows/kernel-module.yml \
                  .github/workflows/release-packages.yml \
                  kernel/infiltratorfs_linux_meta.inc \
                  kernel/infiltratorfs_rw.inc \
                  kernel/infiltratorfs_rw_namespace.inc \
                  packaging/build-linux-packages.sh \
                  packaging/initramfs/infiltratorfs-hook \
                  packaging/debian/preinst.in \
                  packaging/debian/postinst.in \
                  packaging/debian/prerm.in \
                  tests/native-posix-acl-qualification.py \
                  tests/root-volume-integration-policy.sh
          git commit -m 'linux: make InfiltratorFS root-volume safe'
          git push origin HEAD:main
