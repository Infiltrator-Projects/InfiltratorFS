# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot RW legacy alias cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-rw-legacy-alias-cleanup.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make legacy implementation names explicit
        shell: python
        run: |
          from pathlib import Path
          import re

          legacy_path = Path('kernel/infiltratorfs_rw_legacy.inc')
          legacy = legacy_path.read_text()
          names = [
              'infilfs_rw_tx_begin',
              'infilfs_file_write_iter',
              'infilfs_rw_create',
              'infilfs_rw_mkdir',
              'infilfs_rw_setattr',
              'infilfs_rw_mount_init',
              'infilfs_rw_mount_destroy',
          ]
          for name in names:
              dest = name + '_legacy'
              if re.search(r'\b' + re.escape(dest) + r'\b', legacy):
                  raise SystemExit(f'{dest} already exists in raw legacy source')
              matches = len(re.findall(r'\b' + re.escape(name) + r'\b', legacy))
              if matches == 0:
                  raise SystemExit(f'expected at least one raw legacy token: {name}')
              legacy = re.sub(r'\b' + re.escape(name) + r'\b', dest, legacy)
          legacy_path.write_text(legacy)

          rw_path = Path('kernel/infiltratorfs_rw.inc')
          rw = rw_path.read_text()
          aliases = '''#define infilfs_rw_tx_begin infilfs_rw_tx_begin_legacy
          #define infilfs_file_write_iter infilfs_file_write_iter_legacy
          #define infilfs_rw_create infilfs_rw_create_legacy
          #define infilfs_rw_mkdir infilfs_rw_mkdir_legacy
          #define infilfs_rw_setattr infilfs_rw_setattr_legacy
          #define infilfs_rw_mount_init infilfs_rw_mount_init_legacy
          #define infilfs_rw_mount_destroy infilfs_rw_mount_destroy_legacy
          #include "infiltratorfs_rw_legacy.inc"
          #undef infilfs_rw_tx_begin
          #undef infilfs_file_write_iter
          #undef infilfs_rw_create
          #undef infilfs_rw_mkdir
          #undef infilfs_rw_setattr
          #undef infilfs_rw_mount_init
          #undef infilfs_rw_mount_destroy
          '''
          if rw.count(aliases) != 1:
              raise SystemExit(f'expected exactly one seven-alias legacy bridge, found {rw.count(aliases)}')
          rw_path.write_text(rw.replace(aliases, '#include "infiltratorfs_rw_legacy.inc"\n', 1))

          policy_path = Path('tests/native-kernel-maintainability-policy.sh')
          policy = policy_path.read_text()
          policy = policy.replace(
              '''mount_init_body="$(sed -n '/int infilfs_rw_mount_init(struct super_block \\*sb)/,/^}/p' "$kernel/infiltratorfs_rw_legacy.inc")"''',
              '''mount_init_body="$(sed -n '/int infilfs_rw_mount_init_legacy(struct super_block \\*sb)/,/^}/p' "$kernel/infiltratorfs_rw_legacy.inc")"''',
              1)
          start = policy.find('# Macro-renamed entry points are migration debt.')
          end_marker = 'grep -Fq \'#include "infiltratorfs_rw_data.inc"\' "$rw" || \\\n'
          end = policy.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('could not locate legacy-alias maintainability block')
          replacement = '''# The old include-time symbol-renaming bridge is retired. Legacy primitives that
# remain live must carry explicit _legacy names in their defining source, while
# the compositor includes that implementation directly. VFS callback wiring is
# likewise explicit in core.c rather than manufactured by preprocessor fields.
for name in \\
    infilfs_rw_tx_begin \\
    infilfs_file_write_iter \\
    infilfs_rw_create \\
    infilfs_rw_mkdir \\
    infilfs_rw_setattr \\
    infilfs_rw_mount_init \\
    infilfs_rw_mount_destroy; do
    ! grep -Eq "^#(define|undef)[[:space:]]+${name}([[:space:]]|$)" "$rw" || \\
        fail "retired legacy alias bridge returned for $name"
    grep -Fq "${name}_legacy" "$kernel/infiltratorfs_rw_legacy.inc" || \\
        fail "explicit legacy implementation name missing for $name"
done
! grep -Fq '#define simple_statfs infilfs_statfs' "$rw" || \\
    fail 'VFS statfs callback injection macro returned'
! grep -Fq '#define infilfs_get_link infilfs_get_link' "$rw" || \\
    fail 'VFS symlink callback injection macro returned'
grep -Fq '.statfs = infilfs_statfs,' "$driver" || \\
    fail 'superblock statfs callback is no longer explicit'
grep -Fq '.create = infilfs_posix_acl_create,' "$driver" || \\
    fail 'directory create callback is no longer explicit'
grep -Fq '.mknod = infilfs_posix_acl_mknod,' "$driver" || \\
    fail 'directory mknod callback is no longer explicit'
grep -Fq '.tmpfile = infilfs_posix_acl_tmpfile,' "$driver" || \\
    fail 'directory tmpfile callback is no longer explicit'
grep -Fq '.rename = infilfs_ns_rename,' "$driver" || \\
    fail 'directory rename callback is no longer explicit'

'''
          policy = policy[:start] + replacement + policy[end:]
          policy_path.write_text(policy)

      - name: Validate alias removal
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for name in \
            infilfs_rw_tx_begin \
            infilfs_file_write_iter \
            infilfs_rw_create \
            infilfs_rw_mkdir \
            infilfs_rw_setattr \
            infilfs_rw_mount_init \
            infilfs_rw_mount_destroy; do
            ! grep -Eq "^#(define|undef)[[:space:]]+${name}([[:space:]]|$)" kernel/infiltratorfs_rw.inc
            grep -Fq "${name}_legacy" kernel/infiltratorfs_rw_legacy.inc
          done
          bash tests/native-kernel-maintainability-policy.sh .
          git diff -- kernel/infiltratorfs_rw.inc kernel/infiltratorfs_rw_legacy.inc tests/native-kernel-maintainability-policy.sh

      - name: Commit source cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/one-shot-rw-legacy-alias-cleanup.yml
          git add kernel/infiltratorfs_rw.inc kernel/infiltratorfs_rw_legacy.inc tests/native-kernel-maintainability-policy.sh
          git diff --cached --check
          git commit -m 'kernel: retire RW legacy alias bridge'
          git push origin HEAD:main
