# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot quota sidecar deadlock fix

on:
  push:
    paths:
      - '.github/workflows/quota-sidecar-deadlock-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prevent recursive sidecar metadata lookup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('kernel/infiltratorfs_core.c')
          core = core_path.read_text()
          old = '''        ret = infilfs_linux_meta_get_special(inode->i_sb, ii->object_id,
                                              &special_mode, &special_rdev);
        if (ret)
            goto fail_private;
'''
          new = '''        /*
         * Internal Linux sidecar files must never recursively resolve sidecar
         * metadata.  Quota policy is persisted as a trusted xattr, so the
         * first quota write can create a hidden/system sidecar while
         * linux_meta_lock is already held.  Asking that sidecar inode for its
         * own special-node sidecar would recursively acquire linux_meta_lock
         * and deadlock.  Internal sidecars are ordinary regular files by
         * construction and never have sidecars of their own.
         */
        if ((le64_to_cpu(attributes->portable_flags) &
             (INFILFS_ATTR_HIDDEN | INFILFS_ATTR_SYSTEM)) !=
            (INFILFS_ATTR_HIDDEN | INFILFS_ATTR_SYSTEM)) {
            ret = infilfs_linux_meta_get_special(
                inode->i_sb, ii->object_id, &special_mode, &special_rdev);
            if (ret)
                goto fail_private;
        }
'''
          if core.count(old) != 1:
              raise SystemExit('expected special-metadata inode-population block not found exactly once')
          core_path.write_text(core.replace(old, new, 1))

          policy_path = Path('tests/native-quota-policy.sh')
          policy = policy_path.read_text()
          anchor = "grep -Fq 'return -EDQUOT' \"$root/kernel/infiltratorfs_quota.inc\"\n"
          extra = anchor + "grep -Fq 'Internal Linux sidecar files must never recursively resolve sidecar' \"$root/kernel/infiltratorfs_core.c\"\n"
          if anchor not in policy:
              raise SystemExit('quota policy anchor not found')
          if 'Internal Linux sidecar files must never recursively resolve sidecar' not in policy:
              policy = policy.replace(anchor, extra, 1)
          policy_path.write_text(policy)
          PY
          rm -f .github/workflows/quota-sidecar-deadlock-fix.yml
          git diff --check

      - name: Verify quota and kernel policies
        shell: bash
        run: |
          set -euo pipefail
          bash tests/native-quota-policy.sh .
          bash tests/native-sequential-write-scaling-policy.sh .
          bash tests/native-kernel-maintainability-policy.sh .
          bash -n tests/native-quota-qualification.sh

      - name: Build native kernel module
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic kmod
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n 1)"
          test -f "$KDIR/Makefile"
          make -C kernel KDIR="$KDIR"
          test -s kernel/infiltratorfs.ko
          test "$(modinfo -F name kernel/infiltratorfs.ko)" = infiltratorfs

      - name: Commit qualified fix
        shell: bash
        run: |
          set -euo pipefail
          find kernel -maxdepth 1 -type f \( \
            -name '*.o' -o -name '*.ko' -o -name '*.mod' -o \
            -name '*.mod.c' -o -name '*.cmd' -o -name '.*.cmd' -o \
            -name 'Module.symvers' -o -name 'modules.order' \
          \) -delete
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Linux: prevent quota sidecar metadata self-deadlock'
          git push origin HEAD:main
