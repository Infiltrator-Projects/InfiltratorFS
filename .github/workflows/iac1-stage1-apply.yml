# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply IAC1 stage-one selected encoder

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply IAC1 stage-one selected encoder'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded stage-one edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Add a bounded-output encoder primitive while preserving the existing
          # generic IAC1 encoder API and IAC1 v1 decode format.
          path = Path('include/infilfs/iac1.h')
          text = path.read_text()
          old = '''static inline infs_iac1_size infs_iac1_compress_mode(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
              infs_iac1_u8 *dst, infs_iac1_size capacity,
              struct infs_iac1_scratch *scratch, infs_iac1_u8 mode)
          {
              infs_iac1_size pos = 0;
              infs_iac1_size out = 0;
              if (!src || !dst || !scratch || !input_size ||
                  mode > INFS_IAC1_MODE_XOR4 || capacity < INFS_IAC1_HEADER_SIZE)
                  return 0;
          '''
          new = '''static inline infs_iac1_size infs_iac1_compress_mode_limit(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
              infs_iac1_u8 *dst, infs_iac1_size capacity,
              struct infs_iac1_scratch *scratch, infs_iac1_u8 mode,
              infs_iac1_size output_limit)
          {
              infs_iac1_size pos = 0;
              infs_iac1_size out = 0;
              if (output_limit && output_limit < capacity)
                  capacity = output_limit;
              if (!src || !dst || !scratch || !input_size ||
                  mode > INFS_IAC1_MODE_XOR4 || capacity < INFS_IAC1_HEADER_SIZE)
                  return 0;
          '''
          text = replace_once(text, old, new, 'iac1 compress-mode signature')

          marker = '''    return out;
          }

          static inline int infs_iac1_should_attempt(
          '''
          wrapper = '''    return out;
          }

          static inline infs_iac1_size infs_iac1_compress_mode(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
              infs_iac1_u8 *dst, infs_iac1_size capacity,
              struct infs_iac1_scratch *scratch, infs_iac1_u8 mode)
          {
              return infs_iac1_compress_mode_limit(
                  src, input_size, dst, capacity, scratch, mode, capacity);
          }

          static inline int infs_iac1_should_attempt(
          '''
          text = replace_once(text, marker, wrapper, 'iac1 legacy wrapper insertion')

          marker = '''static inline infs_iac1_size infs_iac1_compress(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
          '''
          selected = '''/*
           * Filesystem writers already classify the input and select a predictor.
           * Encode that predictor once, with a storage-usefulness ceiling.  If a
           * non-identity predictor cannot save the required space, make one
           * identity fallback attempt before giving up.  The stream format and
           * decoder are unchanged; only encoder work selection changes.
           */
          static inline infs_iac1_size infs_iac1_compress_selected(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
              infs_iac1_u8 *dst, infs_iac1_size capacity,
              struct infs_iac1_scratch *scratch, infs_iac1_u8 mode,
              infs_iac1_size useful_limit)
          {
              infs_iac1_size stored;

              stored = infs_iac1_compress_mode_limit(
                  src, input_size, dst, capacity, scratch, mode, useful_limit);
              if (!stored && mode != INFS_IAC1_MODE_IDENTITY)
                  stored = infs_iac1_compress_mode_limit(
                      src, input_size, dst, capacity, scratch,
                      INFS_IAC1_MODE_IDENTITY, useful_limit);
              return stored;
          }

          static inline infs_iac1_size infs_iac1_compress(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
          '''
          text = replace_once(text, marker, selected, 'iac1 selected encoder insertion')
          path.write_text(text)

          # Native Linux: remove the second candidate buffer and use the predictor
          # the caller already computed.  The output ceiling is exactly the most
          # bytes that can still save at least one 4 KiB filesystem block.
          path = Path('kernel/infiltratorfs_rw_data.inc')
          text = path.read_text()
          text = replace_once(text, '    u8 *candidate = NULL;\n', '', 'native candidate declaration')
          old = '''        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);
                  compressed = kvmalloc(bound, GFP_NOFS);
                  if (predictor_mode != INFS_IAC1_MODE_IDENTITY)
                      candidate = kvmalloc(bound, GFP_NOFS);
                  scratch = kvmalloc(sizeof(*scratch), GFP_NOFS);
                  if (!compressed || !scratch ||
                      (predictor_mode != INFS_IAC1_MODE_IDENTITY && !candidate)) {
                      ret = -ENOMEM;
                      goto out;
                  }
                  compressed_bytes = infs_iac1_compress(
                      plain, plain_bytes, compressed, bound,
                      candidate, candidate ? bound : 0u, scratch);
          '''
          new = '''        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);
                  compressed = kvmalloc(bound, GFP_NOFS);
                  scratch = kvmalloc(sizeof(*scratch), GFP_NOFS);
                  if (!compressed || !scratch) {
                      ret = -ENOMEM;
                      goto out;
                  }
                  compressed_bytes = infs_iac1_compress_selected(
                      plain, plain_bytes, compressed, bound, scratch,
                      predictor_mode,
                      (size_t)(logical_blocks - 1u) * INFILFS_DISK_BLOCK_SIZE);
          '''
          text = replace_once(text, old, new, 'native selected encoder block')
          text = replace_once(text, '    kvfree(candidate);\n', '', 'native candidate free')
          path.write_text(text)

          # Portable core: keep the same physical-block policy and stream format.
          path = Path('src/volume/compression.inc')
          text = path.read_text()
          text = replace_once(text, '    uint8_t *candidate = NULL;\n', '', 'portable candidate declaration')
          old = '''        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);
                  compressed = malloc(bound);
                  if (predictor_mode != INFS_IAC1_MODE_IDENTITY)
                      candidate = malloc(bound);
                  scratch = malloc(sizeof(*scratch));
                  if (!compressed || !scratch ||
                      (predictor_mode != INFS_IAC1_MODE_IDENTITY && !candidate)) {
                      free(scratch);
                      free(candidate);
                      free(compressed);
                      return INFS_STATUS_NO_MEMORY;
                  }
                  compressed_bytes = infs_iac1_compress(
                      plain, plain_bytes, compressed, bound,
                      candidate, candidate ? bound : 0u, scratch);
          '''
          new = '''        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);
                  compressed = malloc(bound);
                  scratch = malloc(sizeof(*scratch));
                  if (!compressed || !scratch) {
                      free(scratch);
                      free(compressed);
                      return INFS_STATUS_NO_MEMORY;
                  }
                  compressed_bytes = infs_iac1_compress_selected(
                      plain, plain_bytes, compressed, bound, scratch,
                      predictor_mode,
                      (size_t)(logical_blocks - 1u) * INFS_BLOCK_SIZE);
          '''
          text = replace_once(text, old, new, 'portable selected encoder block')
          candidate_frees = text.count('        free(candidate);\n') + text.count('    free(candidate);\n')
          text = text.replace('        free(candidate);\n', '')
          text = text.replace('    free(candidate);\n', '')
          if candidate_frees != 3:
              raise SystemExit(f'portable candidate frees: expected 3, found {candidate_frees}')
          path.write_text(text)

          # Fail closed if any candidate-buffer plumbing survived in filesystem
          # compression paths.
          for p in (Path('kernel/infiltratorfs_rw_data.inc'), Path('src/volume/compression.inc')):
              body = p.read_text()
              if 'candidate ? bound : 0u' in body:
                  raise SystemExit(f'{p}: stale candidate compression call remains')
          PY

      - name: Build and run compression qualifications before committing
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target \
            infilfs-compression-codec \
            infilfs-compression-extents \
            infilfs-compression-qualification
          ctest --test-dir build --output-on-failure \
            -R 'infilfs-compression-(codec|extents|qualification)'
          ./build/infilfs-compression-qualification

      - name: Commit exact guarded result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add include/infilfs/iac1.h kernel/infiltratorfs_rw_data.inc src/volume/compression.inc
          test -n "$(git status --porcelain)"
          git commit -m 'perf: make filesystem IAC1 encoding single-pass by default'
          git push origin HEAD:main
