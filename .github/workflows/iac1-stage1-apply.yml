# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply IAC1 stage-one selected encoder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'ci: apply IAC1 stage-one selected encoder'"
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded stage-one edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          # IAC1 v1 stream semantics stay unchanged. Add an encoder entry point
          # that can stop once output can no longer save a filesystem block.
          p = Path('include/infilfs/iac1.h')
          s = p.read_text()
          old = '''static inline infs_iac1_size infs_iac1_compress_mode(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
              infs_iac1_u8 *dst, infs_iac1_size capacity,
              struct infs_iac1_scratch *scratch, infs_iac1_u8 mode)
          {
              infs_iac1_size pos = 0;
              infs_iac1_size out = 0;
              if (!src || !dst || !scratch || !input_size ||
                  mode > INFS_IAC1_MODE_XOR4 || capacity < INFS_IAC1_HEADER_SIZE)
                  return 0;
          '''
          new = '''static inline infs_iac1_size infs_iac1_compress_mode_limit(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
              infs_iac1_u8 *dst, infs_iac1_size capacity,
              struct infs_iac1_scratch *scratch, infs_iac1_u8 mode,
              infs_iac1_size output_limit)
          {
              infs_iac1_size pos = 0;
              infs_iac1_size out = 0;
              if (output_limit && output_limit < capacity)
                  capacity = output_limit;
              if (!src || !dst || !scratch || !input_size ||
                  mode > INFS_IAC1_MODE_XOR4 || capacity < INFS_IAC1_HEADER_SIZE)
                  return 0;
          '''
          s = once(s, old, new, 'compress-mode signature')

          marker = '''    return out;
          }

          static inline int infs_iac1_should_attempt(
          '''
          wrapper = '''    return out;
          }

          static inline infs_iac1_size infs_iac1_compress_mode(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
              infs_iac1_u8 *dst, infs_iac1_size capacity,
              struct infs_iac1_scratch *scratch, infs_iac1_u8 mode)
          {
              return infs_iac1_compress_mode_limit(
                  src, input_size, dst, capacity, scratch, mode, capacity);
          }

          static inline int infs_iac1_should_attempt(
          '''
          s = once(s, marker, wrapper, 'legacy wrapper insertion')

          marker = '''static inline infs_iac1_size infs_iac1_compress(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
          '''
          selected = '''/* Filesystem hot path: one selected full encode by default. */
          static inline infs_iac1_size infs_iac1_compress_selected(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
              infs_iac1_u8 *dst, infs_iac1_size capacity,
              struct infs_iac1_scratch *scratch, infs_iac1_u8 mode,
              infs_iac1_size useful_limit)
          {
              infs_iac1_size stored = infs_iac1_compress_mode_limit(
                  src, input_size, dst, capacity, scratch, mode, useful_limit);

              /* Predictor selection is heuristic. Preserve a safe identity
               * fallback if the selected non-identity mode cannot save a block. */
              if (!stored && mode != INFS_IAC1_MODE_IDENTITY)
                  stored = infs_iac1_compress_mode_limit(
                      src, input_size, dst, capacity, scratch,
                      INFS_IAC1_MODE_IDENTITY, useful_limit);
              return stored;
          }

          static inline infs_iac1_size infs_iac1_compress(
              const infs_iac1_u8 *src, infs_iac1_size input_size,
          '''
          s = once(s, marker, selected, 'selected encoder insertion')
          p.write_text(s)

          # Native mounted writer: use its already-computed predictor and remove
          # the second full-size candidate allocation/encode.
          p = Path('kernel/infiltratorfs_rw_data.inc')
          s = p.read_text()
          s = once(s, '    u8 *candidate = NULL;\n', '', 'native candidate declaration')
          old = '''        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);
                  compressed = kvmalloc(bound, GFP_NOFS);
                  if (predictor_mode != INFS_IAC1_MODE_IDENTITY)
                      candidate = kvmalloc(bound, GFP_NOFS);
                  scratch = kvmalloc(sizeof(*scratch), GFP_NOFS);
                  if (!compressed || !scratch ||
                      (predictor_mode != INFS_IAC1_MODE_IDENTITY && !candidate)) {
                      ret = -ENOMEM;
                      goto out;
                  }
                  compressed_bytes = infs_iac1_compress(
                      plain, plain_bytes, compressed, bound,
                      candidate, candidate ? bound : 0u, scratch);
          '''
          new = '''        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);
                  compressed = kvmalloc(bound, GFP_NOFS);
                  scratch = kvmalloc(sizeof(*scratch), GFP_NOFS);
                  if (!compressed || !scratch) {
                      ret = -ENOMEM;
                      goto out;
                  }
                  compressed_bytes = infs_iac1_compress_selected(
                      plain, plain_bytes, compressed, bound, scratch,
                      predictor_mode,
                      (size_t)(logical_blocks - 1u) * INFILFS_DISK_BLOCK_SIZE);
          '''
          s = once(s, old, new, 'native encoder block')
          s = once(s, '    kvfree(candidate);\n', '', 'native candidate cleanup')
          if 'candidate' in s[s.find('static int infilfs_native_stage_compression_candidate'):s.find('static int infilfs_native_append_chunk_locked')]:
              raise SystemExit('native compression candidate plumbing remains')
          p.write_text(s)

          # Portable writer gets the same encoder policy. There are four cleanup
          # paths for the one candidate buffer in file_store_extent_payload().
          p = Path('src/volume/compression.inc')
          s = p.read_text()
          s = once(s, '    uint8_t *candidate = NULL;\n', '', 'portable candidate declaration')
          old = '''        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);
                  compressed = malloc(bound);
                  if (predictor_mode != INFS_IAC1_MODE_IDENTITY)
                      candidate = malloc(bound);
                  scratch = malloc(sizeof(*scratch));
                  if (!compressed || !scratch ||
                      (predictor_mode != INFS_IAC1_MODE_IDENTITY && !candidate)) {
                      free(scratch);
                      free(candidate);
                      free(compressed);
                      return INFS_STATUS_NO_MEMORY;
                  }
                  compressed_bytes = infs_iac1_compress(
                      plain, plain_bytes, compressed, bound,
                      candidate, candidate ? bound : 0u, scratch);
          '''
          new = '''        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);
                  compressed = malloc(bound);
                  scratch = malloc(sizeof(*scratch));
                  if (!compressed || !scratch) {
                      free(scratch);
                      free(compressed);
                      return INFS_STATUS_NO_MEMORY;
                  }
                  compressed_bytes = infs_iac1_compress_selected(
                      plain, plain_bytes, compressed, bound, scratch,
                      predictor_mode,
                      (size_t)(logical_blocks - 1u) * INFS_BLOCK_SIZE);
          '''
          s = once(s, old, new, 'portable encoder block')
          n = s.count('free(candidate);')
          if n != 3:
              # One occurrence was part of the replaced allocation-failure block;
              # the remaining three are stored-buffer failure, compressed success,
              # and uncompressed fallback cleanup paths.
              raise SystemExit(f'portable remaining candidate cleanups: expected 3, found {n}')
          s = s.replace('            free(candidate);\n', '')
          s = s.replace('        free(candidate);\n', '')
          s = s.replace('    free(candidate);\n', '')
          lo = s.find('static int file_store_extent_payload(')
          if lo < 0 or 'candidate' in s[lo:]:
              raise SystemExit('portable compression candidate plumbing remains')
          p.write_text(s)
          PY

      - name: Qualify exact staged source before commit
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target \
            infilfs-compression-codec \
            infilfs-compression-extents \
            infilfs-compression-qualification
          ctest --test-dir build --output-on-failure \
            -R 'infilfs-compression-(codec|extents|qualification)'
          ./build/infilfs-compression-qualification

      - name: Commit only qualified source edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add include/infilfs/iac1.h kernel/infiltratorfs_rw_data.inc src/volume/compression.inc
          test -n "$(git status --porcelain)"
          git commit -m 'perf: make filesystem IAC1 encoding single-pass by default'
          git push origin HEAD:main
