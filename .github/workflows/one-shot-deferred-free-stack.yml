# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot deferred-free stack cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-deferred-free-stack.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move bounded deferred-free scratch off kernel stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('kernel/infiltratorfs_rw_legacy.inc')
          text = path.read_text()
          start = text.index('int infilfs_rw_tx_apply_deferred(struct infilfs_rw_tx *tx)')
          end = text.index('\n\n#define INFILFS_RW_DEPENDENCY_BATCH_BLOCKS', start)
          body = text[start:end]

          old_decl = '    struct infilfs_rw_free_range freed[INFILFS_RW_DEFERRED_INCREMENTAL_BLOCKS];'
          new_decl = '    struct infilfs_rw_free_range *freed = NULL;'
          if body.count(old_decl) != 1:
              raise SystemExit('deferred-free stack array declaration changed')
          body = body.replace(old_decl, new_decl, 1)

          lock_marker = '\n    write_lock(&tx->sbi->bitmap_lock);'
          if body.count(lock_marker) != 1:
              raise SystemExit('deferred-free bitmap lock marker changed')
          allocation = '''
          if (incremental && deferred_blocks) {
              freed = kmalloc_array((size_t)deferred_blocks, sizeof(*freed),
                                    GFP_NOFS);
              if (!freed)
                  incremental = false;
          }
          '''
          allocation = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in allocation.splitlines()
          )
          body = body.replace(lock_marker, allocation + lock_marker, 1)

          body, substitutions = re.subn(
              r'} else if \(freed_count <\s*INFILFS_RW_DEFERRED_INCREMENTAL_BLOCKS\) \{',
              '} else if (freed_count < deferred_blocks) {',
              body,
              count=1,
          )
          if substitutions != 1:
              raise SystemExit('deferred-free range bound changed')

          tail = '\n    return 0;\n}'
          if body.count(tail) != 1:
              raise SystemExit('deferred-free function tail changed')
          body = body.replace(tail, '\n    kfree(freed);\n    return 0;\n}', 1)
          text = text[:start] + body + text[end:]
          path.write_text(text)
          PY

      - name: Validate stack cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          body="$(sed -n '/^int infilfs_rw_tx_apply_deferred(/,/^}/p' kernel/infiltratorfs_rw_legacy.inc)"
          ! grep -Fq 'freed[INFILFS_RW_DEFERRED_INCREMENTAL_BLOCKS]' <<<"$body"
          grep -Fq 'struct infilfs_rw_free_range *freed = NULL;' <<<"$body"
          grep -Fq 'kmalloc_array((size_t)deferred_blocks, sizeof(*freed),' <<<"$body"
          grep -Fq 'kfree(freed);' <<<"$body"
          bash tests/native-kernel-maintainability-policy.sh .
          bash tests/native-free-extent-index-policy.sh .
          git diff -- kernel/infiltratorfs_rw_legacy.inc

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/one-shot-deferred-free-stack.yml
          git add kernel/infiltratorfs_rw_legacy.inc
          git diff --cached --check
          git commit -m 'kernel: move deferred-free scratch off stack'
          git push origin HEAD:main
