# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify private POSIX in-place index handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qualify-posix-private-inplace.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake kmod libcap2-bin \
            linux-headers-$(uname -r) rsync util-linux
      - name: Apply candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs_rw.inc')
          s = p.read_text()
          old_store = '''    ret = infilfs_rw_tx_alloc(&pending->tx, 1, &new_block);\n    if (ret)\n        goto finish;\n    ret = infilfs_native_stage_block(inode->i_sb, new_block, object);\n    if (ret)\n        goto finish;\n    ret = infilfs_rw_tx_defer_free(&pending->tx, old_block, 1);\n    if (ret)\n        goto finish;\n'''
          new_store = '''    /* A transaction-private inode object must not be CoW/deferred again. */\n    ret = infilfs_native_store_private_or_cow(\n        pending, old_block, object, &new_block);\n    if (ret)\n        goto finish;\n'''
          if s.count(old_store) != 1:
              raise SystemExit(f'POSIX store anchor count {s.count(old_store)}')
          s = s.replace(old_store, new_store, 1)
          old_index = '''    memset(&change, 0, sizeof(change));\n    memcpy(change.object_id, ii->object_id, sizeof(change.object_id));\n    change.object_block = new_block;\n    change.object_type = ii->object_type;\n    change.action = INFILFS_NS_REPOINT;\n\n    if (memcmp(ii->object_id, pending->tx.sbi->disk.root_object_id, 16) == 0)\n        pending->tx.next_sb.root_object_block = cpu_to_le64(new_block);\n\n    ret = infilfs_ns_rebuild_index(pending, &change, 1);\n'''
          new_index = '''    /*\n     * If private_or_cow updated the transaction-private object in place, the\n     * object index already names the correct block. Repointing the same block\n     * needlessly mutates the index and can make a later operation defer its own\n     * still-private index state. Only committed-object CoW needs a repoint.\n     */\n    if (new_block != old_block) {\n        memset(&change, 0, sizeof(change));\n        memcpy(change.object_id, ii->object_id, sizeof(change.object_id));\n        change.object_block = new_block;\n        change.object_type = ii->object_type;\n        change.action = INFILFS_NS_REPOINT;\n\n        if (memcmp(ii->object_id, pending->tx.sbi->disk.root_object_id, 16) == 0)\n            pending->tx.next_sb.root_object_block = cpu_to_le64(new_block);\n\n        ret = infilfs_ns_rebuild_index(pending, &change, 1);\n    } else {\n        ret = 0;\n    }\n'''
          if s.count(old_index) != 1:
              raise SystemExit(f'POSIX index anchor count {s.count(old_index)}')
          p.write_text(s.replace(old_index, new_index, 1))
          PY
          git diff --check
          git diff -- kernel/infiltratorfs_rw.inc
      - name: Build
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub infilfs-tool infiltratorfs-quota
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
      - name: Quota ACL remount scrub
        env:
          INFILFS_REQUIRE_SETFACL: '1'
        run: sudo -E bash tests/native-quota-qualification.sh build kernel/infiltratorfs.ko
      - name: Root metadata remount scrub
        run: sudo env RUNNER_TEMP="$RUNNER_TEMP" bash tests/native-root-metadata-qualification.sh build kernel/infiltratorfs.ko
      - name: Xattr bounded performance and scrub
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; image="$work/test.img"; mnt="$work/mnt"; loop=""
          cleanup(){ set +e; sync; mountpoint -q "$mnt" && sudo umount "$mnt"; [[ -n "$loop" ]] && sudo losetup -d "$loop" 2>/dev/null; sudo rmmod infiltratorfs 2>/dev/null; rm -rf "$work"; }
          trap cleanup EXIT
          mkdir -p "$mnt"; truncate -s 2G "$image"; build/mkfs.infilfs "$image" >/dev/null
          loop="$(sudo losetup --find --show "$image")"; sudo insmod kernel/infiltratorfs.ko; sudo mount -t infiltratorfs "$loop" "$mnt"
          sudo python3 - "$mnt" <<'PY'
          import os, sys, time
          root=sys.argv[1]; paths=[]
          for i in range(2000):
              p=os.path.join(root,f'f{i:05d}')
              with open(p,'wb',buffering=0) as f: f.write(b'x'*4096)
              paths.append(p)
          t=time.monotonic()
          for p in paths: os.setxattr(p,b'user.ifsbench',b'1')
          elapsed=time.monotonic()-t
          print(f'2000 xattr sets: {elapsed:.3f}s')
          if elapsed > 30: raise SystemExit(f'xattr path too slow: {elapsed:.3f}s')
          PY
          sync; sudo umount "$mnt"; build/infilfs-scrub "$loop" | tee "$work/scrub.txt"; grep -Fq 'Result:              CLEAN' "$work/scrub.txt"
          sudo losetup -d "$loop"; loop=""; sudo rmmod infiltratorfs; trap - EXIT; rm -rf "$work"
      - name: Commit qualified fix
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_rw.inc
          git commit -m 'Fix transaction-private POSIX metadata updates'
          git push origin HEAD:main
