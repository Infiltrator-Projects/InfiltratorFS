# SPDX-License-Identifier: GPL-3.0-or-later
name: Prepare 0.18.46 unlink-fix release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-release-metadata-gate.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Create exact release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          grep -Fq 'project(InfiltratorFS VERSION 0.18.45 LANGUAGES C)' CMakeLists.txt
          grep -Fq '**Current source version:** 0.18.45 (Format 0.18)<br>' README.md
          test -f tools/apply-unlink-ownership-index.py

          sed -i 's/project(InfiltratorFS VERSION 0\.18\.45 LANGUAGES C)/project(InfiltratorFS VERSION 0.18.46 LANGUAGES C)/' CMakeLists.txt
          sed -i 's/# Development qualification anchor: 0\.18\.45/# Development qualification anchor: 0.18.46/' CMakeLists.txt
          sed -i 's/\*\*Current source version:\*\* 0\.18\.45 (Format 0\.18)<br>/\*\*Current source version:\*\* 0.18.46 (Format 0.18)<br>/' README.md
          sed -i 's/\*\*Current source:\*\* 0\.18\.45  /\*\*Current source:\*\* 0.18.46  /' README.md
          sed -i 's/\*\*Latest published release:\*\* v0\.18\.42  /\*\*Latest published release:\*\* v0.18.46  /' README.md
          printf '0.18.46\n' > .github/release-trigger
          sed -i 's/0\.18\.45/0.18.46/g' tests/root-boot-qemu.sh
          rm tools/apply-unlink-ownership-index.py

          git diff --check
          grep -Fq 'project(InfiltratorFS VERSION 0.18.46 LANGUAGES C)' CMakeLists.txt
          grep -Fq '**Current source version:** 0.18.46 (Format 0.18)<br>' README.md
          grep -Fq '**Current source:** 0.18.46  ' README.md
          grep -Fq '**Latest published release:** v0.18.46  ' README.md
          test "$(cat .github/release-trigger)" = 0.18.46
          test ! -e tools/apply-unlink-ownership-index.py
          bash tests/native-unlink-ownership-index-policy.sh .
          bash tests/native-kernel-maintainability-policy.sh .

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add CMakeLists.txt README.md .github/release-trigger tests/root-boot-qemu.sh tools/apply-unlink-ownership-index.py
          git commit -m 'Release 0.18.46: accelerate native unlink ownership lookup'
          git push origin HEAD:main
