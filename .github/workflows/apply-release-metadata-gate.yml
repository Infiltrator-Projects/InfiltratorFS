# SPDX-License-Identifier: GPL-3.0-or-later
name: Repair 0.18.46 reflink ownership index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-release-metadata-gate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Patch reflink ownership cache and regression guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          grep -Fq 'project(InfiltratorFS VERSION 0.18.46 LANGUAGES C)' CMakeLists.txt

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'kernel/infiltratorfs_defrag.inc',
              '''    if (file_repoint) {\n        memcpy(file_change.object_id, destination_ii->object_id, 16);\n        file_change.object_block = new_file_block;\n        file_change.object_type = INFILFS_OBJECT_FILE;\n        ret = infilfs_native_index_update(pending, &file_change, 1);\n        if (ret)\n            goto finish;\n    }\n    pending->tx.next_sb.generation = cpu_to_le64(pending->tx.generation);\n''',
              '''    if (file_repoint) {\n        memcpy(file_change.object_id, destination_ii->object_id, 16);\n        file_change.object_block = new_file_block;\n        file_change.object_type = INFILFS_OBJECT_FILE;\n        ret = infilfs_native_index_update(pending, &file_change, 1);\n        if (ret)\n            goto finish;\n    }\n\n    /*\n     * A non-inline reflink has just introduced a second live owner for the\n     * source physical ranges.  Any ownership snapshot built before this clone\n     * can now contain false negatives, so it must never survive the operation.\n     * Rebuild lazily on the next release/free query under write_lock.\n     */\n    if (!source_inline) {\n        kvfree(pending->shared_ranges);\n        pending->shared_ranges = NULL;\n        pending->shared_range_count = 0;\n        pending->shared_range_index_valid = false;\n    }\n    pending->tx.next_sb.generation = cpu_to_le64(pending->tx.generation);\n''',
              'reflink invalidation')

          replace_once(
              'kernel/infiltratorfs_rw_namespace.inc',
              ''' * negative. A possibly shared range still uses the exact scan. The current\n * native VFS exposes no reflink/clone creation operation; any future operation\n * that introduces a second live owner must update or invalidate this index.\n * Snapshots are protected independently by the retained-snapshot allocation\n''',
              ''' * negative. A possibly shared range still uses the exact scan. Native\n * reflink/clone creation is the operation that introduces a second live owner;\n * it invalidates this index before the transaction becomes visible so the next\n * ownership query rebuilds from authoritative metadata. Snapshots are protected\n * independently by the retained-snapshot allocation\n''',
              'ownership comment')

          p = Path('tests/native-unlink-ownership-index-policy.sh')
          text = p.read_text()
          old = '''data="$root/kernel/infiltratorfs_rw_data.inc"\n\nfail() { echo "native unlink ownership index policy: $*" >&2; exit 1; }\nfor file in "$ns" "$state" "$data"; do test -f "$file" || fail "missing $file"; done\n'''
          new = '''data="$root/kernel/infiltratorfs_rw_data.inc"\nreflink="$root/kernel/infiltratorfs_defrag.inc"\n\nfail() { echo "native unlink ownership index policy: $*" >&2; exit 1; }\nfor file in "$ns" "$state" "$data" "$reflink"; do test -f "$file" || fail "missing $file"; done\n'''
          if text.count(old) != 1:
              raise SystemExit('policy file-list anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''grep -Fq 'kvfree(pending->shared_ranges);' "$data" || fail 'ownership index unmount cleanup missing'\n\npython3 - "$ns" <<'PY'\n'''
          new = '''grep -Fq 'kvfree(pending->shared_ranges);' "$data" || fail 'ownership index unmount cleanup missing'\ngrep -Fq 'A non-inline reflink has just introduced a second live owner' "$reflink" || fail 'reflink invalidation rationale missing'\n\npython3 - "$reflink" <<'PY'\nfrom pathlib import Path\nimport sys\ns = Path(sys.argv[1]).read_text()\nstart = s.index('static int infilfs_native_reflink_full(')\nend = s.index('\\nstatic loff_t infilfs_file_remap_file_range(', start)\nbody = s[start:end]\nclone = body.find('infilfs_native_build_file_object(')\nfree_ranges = body.find('kvfree(pending->shared_ranges);')\nclear_ptr = body.find('pending->shared_ranges = NULL;', free_ranges)\nclear_count = body.find('pending->shared_range_count = 0;', clear_ptr)\ninvalidate = body.find('pending->shared_range_index_valid = false;', clear_count)\nfinish = body.find('infilfs_ns_finish(pending, ret)')\nif min(clone, free_ranges, clear_ptr, clear_count, invalidate, finish) < 0:\n    raise SystemExit('reflink ownership-index invalidation sequence incomplete')\nif not (clone < free_ranges < clear_ptr < clear_count < invalidate < finish):\n    raise SystemExit('reflink ownership index is not invalidated before publication')\nPY\n\npython3 - "$ns" <<'PY'\n'''
          if text.count(old) != 1:
              raise SystemExit('policy invalidation anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          bash tests/native-unlink-ownership-index-policy.sh .
          bash tests/native-kernel-maintainability-policy.sh .

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_defrag.inc kernel/infiltratorfs_rw_namespace.inc tests/native-unlink-ownership-index-policy.sh
          git rm .github/workflows/apply-release-metadata-gate.yml
          git commit -m 'Release 0.18.46: preserve CoW after reflink ownership changes'
          git push origin HEAD:main
