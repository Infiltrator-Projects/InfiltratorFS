# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply deferred POSIX metadata CoW fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-posix-private-cow-fix.yml'

permissions:
  contents: write

jobs:
  qualify-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake kmod libcap2-bin \
            linux-headers-$(uname -r) rsync util-linux

      - name: Apply private-aware POSIX object rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs_rw.inc')
          s = p.read_text()
          old = '''    ret = infilfs_rw_tx_alloc(&pending->tx, 1, &new_block);\n    if (ret)\n        goto finish;\n    ret = infilfs_native_stage_block(inode->i_sb, new_block, object);\n    if (ret)\n        goto finish;\n    ret = infilfs_rw_tx_defer_free(&pending->tx, old_block, 1);\n    if (ret)\n        goto finish;\n'''
          new = '''    /*\n     * POSIX metadata updates can revisit an inode whose current object block\n     * was allocated by this still-unpublished native transaction.  Blindly\n     * allocating another CoW replacement and deferring that private block for\n     * free leaves the transaction with a stale/deferred object dependency.\n     * Reuse the native private-or-CoW primitive: committed objects remain CoW,\n     * while transaction-private objects are updated in place with the existing\n     * operation undo log preserving syscall rollback semantics.\n     */\n    ret = infilfs_native_store_private_or_cow(\n        pending, old_block, object, &new_block);\n    if (ret)\n        goto finish;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one POSIX rewrite anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- kernel/infiltratorfs_rw.inc

      - name: Build candidate
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target \
            mkfs.infilfs infilfs-scrub infilfs-tool infiltratorfs-quota
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"

      - name: Prove quota ACL remount and scrub durability
        env:
          INFILFS_REQUIRE_SETFACL: '1'
        run: |
          sudo -E bash tests/native-quota-qualification.sh \
            build kernel/infiltratorfs.ko

      - name: Prove full Linux root metadata semantics
        run: |
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            bash tests/native-root-metadata-qualification.sh \
              build kernel/infiltratorfs.ko

      - name: Prove xattr path is bounded and scrub-clean
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          image="$work/meta-perf.img"
          mnt="$work/mnt"
          loop=""
          cleanup() {
            set +e
            sync
            mountpoint -q "$mnt" && sudo umount "$mnt"
            [[ -n "$loop" ]] && sudo losetup -d "$loop" 2>/dev/null
            sudo rmmod infiltratorfs 2>/dev/null
            rm -rf "$work"
          }
          trap cleanup EXIT
          mkdir -p "$mnt"
          truncate -s 2G "$image"
          build/mkfs.infilfs "$image" >/dev/null
          loop="$(sudo losetup --find --show "$image")"
          sudo insmod kernel/infiltratorfs.ko
          sudo mount -t infiltratorfs "$loop" "$mnt"
          sudo python3 - "$mnt" <<'PY'
          import os, sys, time
          root = sys.argv[1]
          n = 2000
          paths = []
          for i in range(n):
              p = os.path.join(root, f'f{i:05d}')
              with open(p, 'wb', buffering=0) as f:
                  f.write(b'x' * 4096)
              paths.append(p)
          start = time.monotonic()
          for p in paths:
              os.setxattr(p, b'user.ifsbench', b'1')
          elapsed = time.monotonic() - start
          print(f'InfiltratorFS 2000 xattr sets: {elapsed:.3f}s')
          if elapsed > 30.0:
              raise SystemExit(f'xattr path remains pathologically slow: {elapsed:.3f}s')
          PY
          sync
          sudo umount "$mnt"
          build/infilfs-scrub "$loop" | tee "$work/scrub.txt"
          grep -Fq 'Result:              CLEAN' "$work/scrub.txt"
          sudo losetup -d "$loop"
          loop=""
          sudo rmmod infiltratorfs
          trap - EXIT
          rm -rf "$work"

      - name: Commit qualified source fix
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_rw.inc
          git commit -m 'Fix deferred POSIX metadata CoW'
          git push origin HEAD:main
