# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply CI duration policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ci-duration-policy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the ten-minute automatic CI rule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          workflows = root / '.github' / 'workflows'

          heavy = workflows / 'heavy-qualification.yml'
          s = heavy.read_text()
          s = s.replace(
              '# Million-file/1 TiB and long endurance testing is milestone evidence, not\n'
              '# ordinary development CI. Run it weekly for regression coverage or explicitly\n'
              '# when a maintainer wants a new heavy qualification record.\n'
              'on:\n'
              '  schedule:\n'
              '    - cron: "43 2 * * 0"\n'
              '  workflow_dispatch:\n',
              '# Million-file/1 TiB and long endurance testing is milestone evidence, not\n'
              '# ordinary development CI. It is manual-only because it intentionally exceeds\n'
              '# the ten-minute automatic CI ceiling.\n'
              'on:\n'
              '  workflow_dispatch:\n'
          )
          if 'schedule:' in s.split('permissions:', 1)[0]:
              raise SystemExit('heavy qualification still has an automatic schedule')
          heavy.write_text(s)

          root_boot = workflows / 'root-boot-qualification.yml'
          s = root_boot.read_text()
          marker = '\npermissions:\n'
          if marker not in s:
              raise SystemExit('root boot permissions marker missing')
          before, after = s.split(marker, 1)
          header = before.split('\non:\n', 1)[0]
          s = header + '\non:\n  workflow_dispatch:\n' + marker + after
          root_boot.write_text(s)

          ci = workflows / 'ci.yml'
          s = ci.read_text()
          start_token = '  desktop-formatter:\n'
          end_token = '\n  linux:\n'
          start = s.find(start_token)
          end = s.find(end_token, start)
          if start < 0 or end < 0:
              raise SystemExit('desktop formatter job anchors missing')
          desktop_job = s[start:end]
          s = s[:start] + s[end:]
          old_guard = "grep -Fq 'workflows: [\"Build and conformance\"]' \"$release\""
          new_guard = "grep -Fq 'workflows: [\"Linux root boot qualification\"]' \"$release\""
          if old_guard not in s:
              raise SystemExit('release trigger policy guard anchor missing')
          s = s.replace(old_guard, new_guard, 1)
          checkout_anchor = "      - name: Check out source\n        uses: actions/checkout@v6\n"
          policy_step = checkout_anchor + "      - name: Enforce ten-minute automatic CI policy\n        run: python3 tests/ci-duration-policy.py\n"
          if checkout_anchor not in s:
              raise SystemExit('release-policy checkout anchor missing')
          s = s.replace(checkout_anchor, policy_step, 1)
          ci.write_text(s)

          desktop = workflows / 'desktop-formatter-qualification.yml'
          desktop.write_text(
              '# SPDX-License-Identifier: GPL-3.0-or-later\n'
              'name: GNOME Disks formatter qualification\n\n'
              '# Full upstream desktop-stack compilation intentionally exceeds the automatic\n'
              '# CI ceiling. Run manually only when formatter/desktop integration changes\n'
              '# or when release qualification specifically needs it.\n'
              'on:\n'
              '  workflow_dispatch:\n\n'
              'permissions:\n'
              '  contents: read\n\n'
              'jobs:\n' + desktop_job
          )

          automatic_test_workflows = [
              'ci.yml',
              'kernel-module.yml',
              'linux-metadata-qualification.yml',
              'resize-qualification.yml',
              'root-volume-qualification.yml',
              'windows-bridge.yml',
          ]

          def cap_jobs(text: str, filename: str) -> str:
              lines = text.splitlines()
              try:
                  jobs_index = next(i for i, line in enumerate(lines) if line == 'jobs:')
              except StopIteration:
                  raise SystemExit(f'{filename}: jobs section missing')
              starts = []
              for i in range(jobs_index + 1, len(lines)):
                  if re.match(r'^  [A-Za-z0-9_-]+:\s*$', lines[i]):
                      starts.append(i)
              for n in range(len(starts) - 1, -1, -1):
                  a = starts[n]
                  b = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = lines[a:b]
                  run_idx = next((j for j, line in enumerate(block) if line.startswith('    runs-on:')), None)
                  if run_idx is None:
                      continue
                  timeout_idx = next((j for j, line in enumerate(block) if line.startswith('    timeout-minutes:')), None)
                  if timeout_idx is None:
                      block.insert(run_idx + 1, '    timeout-minutes: 10')
                  else:
                      value = int(block[timeout_idx].split(':', 1)[1].strip())
                      if value > 10:
                          block[timeout_idx] = '    timeout-minutes: 10'
                  lines[a:b] = block
              return '\n'.join(lines) + '\n'

          for name in automatic_test_workflows:
              p = workflows / name
              p.write_text(cap_jobs(p.read_text(), name))

          release = workflows / 'release-packages.yml'
          s = release.read_text()
          old = '    workflows: ["Build and conformance"]'
          new = '    workflows: ["Linux root boot qualification"]'
          if old not in s:
              raise SystemExit('release workflow trigger anchor missing')
          s = s.replace(old, new, 1)
          old = "      github.event.workflow_run.event == 'push' &&"
          new = "      github.event.workflow_run.event == 'workflow_dispatch' &&"
          if old not in s:
              raise SystemExit('release workflow event guard anchor missing')
          s = s.replace(old, new, 1)
          step_start = s.find('      - name: Require Linux release qualifications for the same commit\n')
          step_end = s.find('      - name: Check out exact tested main commit\n', step_start)
          if step_start < 0 or step_end < 0:
              raise SystemExit('release qualification wait step anchors missing')
          expected_expr = '$' + '{{ github.event.workflow_run.head_sha }}'
          token_expr = '$' + '{{ github.token }}'
          replacement = '''      - name: Require fast Linux release qualifications for the same commit\n        timeout-minutes: 5\n        env:\n          EXPECTED_SHA: __EXPECTED_EXPR__\n          GH_TOKEN: __TOKEN_EXPR__\n        shell: bash\n        run: |\n          set -euo pipefail\n          api="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&per_page=100"\n          json="$(gh api "$api")"\n          required=(\n            "Build and conformance"\n            "Native Linux kernel module"\n            "Linux root-volume qualification"\n            "Linux metadata qualification"\n          )\n          for workflow in "${required[@]}"; do\n            state="$(jq -r --arg name "$workflow" \\\n              '[.workflow_runs[] | select(.name == $name and .event == "push")][0] | [(.status // ""), (.conclusion // ""), (.html_url // "")] | @tsv' \\\n              <<<"$json")"\n            IFS=$'\\t' read -r status conclusion run_url <<<"$state"\n            if [[ "$status" != completed || "$conclusion" != success ]]; then\n              printf '%s is not green for %s: status=%s conclusion=%s %s\\n' \\\n                "$workflow" "$EXPECTED_SHA" "${status:-missing}" "${conclusion:-missing}" "$run_url" >&2\n              exit 1\n            fi\n          done\n          printf 'Fast automatic release qualifications are green for %s; manual root-boot qualification just passed.\\n' \\\n            "$EXPECTED_SHA"\n\n'''
          replacement = replacement.replace('__EXPECTED_EXPR__', expected_expr).replace('__TOKEN_EXPR__', token_expr)
          s = s[:step_start] + replacement + s[step_end:]
          release.write_text(s)

          obsolete = [
              'apply-linux-meta-empty-sidecar-fix.yml',
              'apply-posix-private-cow-fix.yml',
              'apply-special-otrunc-fix.yml',
              'diagnose-linux-meta-publication.yml',
              'kernel-checksum-cache-object-refactor.yml',
              'qualify-posix-private-inplace.yml',
              'qualify-quota-ctime-isolation.yml',
          ]
          for name in obsolete:
              p = workflows / name
              if p.exists():
                  p.unlink()

          policy = root / 'tests' / 'ci-duration-policy.py'
          policy.write_text(r'''#!/usr/bin/env python3
          from pathlib import Path
          import re

          root = Path(__file__).resolve().parents[1]
          wf = root / '.github' / 'workflows'

          manual_long = {
              'heavy-qualification.yml',
              'root-boot-qualification.yml',
              'desktop-formatter-qualification.yml',
          }
          automatic_tests = {
              'ci.yml',
              'kernel-module.yml',
              'linux-metadata-qualification.yml',
              'resize-qualification.yml',
              'root-volume-qualification.yml',
              'windows-bridge.yml',
          }
          obsolete = {
              'apply-linux-meta-empty-sidecar-fix.yml',
              'apply-posix-private-cow-fix.yml',
              'apply-special-otrunc-fix.yml',
              'diagnose-linux-meta-publication.yml',
              'kernel-checksum-cache-object-refactor.yml',
              'qualify-posix-private-inplace.yml',
              'qualify-quota-ctime-isolation.yml',
          }

          for name in manual_long:
              text = (wf / name).read_text()
              on_block = text.split('on:\n', 1)[1].split('\npermissions:', 1)[0]
              if 'workflow_dispatch:' not in on_block:
                  raise SystemExit(f'{name}: manual dispatch missing')
              for trigger in ('push:', 'schedule:', 'pull_request:', 'workflow_run:'):
                  if trigger in on_block:
                      raise SystemExit(f'{name}: long qualification has automatic trigger {trigger}')

          for name in automatic_tests:
              text = (wf / name).read_text()
              lines = text.splitlines()
              jobs = lines.index('jobs:')
              starts = [i for i in range(jobs + 1, len(lines)) if re.match(r'^  [A-Za-z0-9_-]+:\s*$', lines[i])]
              for n, a in enumerate(starts):
                  b = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = lines[a:b]
                  job = block[0].strip()[:-1]
                  if not any(line.startswith('    runs-on:') for line in block):
                      continue
                  timeout = next((line for line in block if line.startswith('    timeout-minutes:')), None)
                  if timeout is None:
                      raise SystemExit(f'{name}:{job}: automatic job has no timeout')
                  minutes = int(timeout.split(':', 1)[1].strip())
                  if minutes > 10:
                      raise SystemExit(f'{name}:{job}: automatic timeout is {minutes} minutes')

          for name in obsolete:
              if (wf / name).exists():
                  raise SystemExit(f'obsolete one-shot workflow remains: {name}')

          print('CI duration policy: PASS')
          ''')
          policy.chmod(0o755)

          docs = root / 'docs' / 'QUALIFICATION.md'
          if docs.exists():
              d = docs.read_text()
              marker = '## CI duration policy'
              section = '''\n\n## CI duration policy\n\nAutomatic qualification and conformance jobs are hard-capped at 10 minutes. Tests that intentionally exceed that ceiling are manual-only and are run only when their coverage is warranted. The manual long-running set is the real UEFI/root crash-recovery qualification, the full GNOME/libblockdev/UDisks formatter build, and the million-file/1 TiB plus endurance qualification. A release is finalized only after a manually dispatched root-boot qualification succeeds for the exact Release commit; the shorter automatic Linux qualifications must already be green for that same commit.\n'''
              if marker not in d:
                  docs.write_text(d.rstrip() + section + '\n')

          self_path = workflows / 'apply-ci-duration-policy.yml'
          if self_path.exists():
              self_path.unlink()
          PY

          python3 tests/ci-duration-policy.py
          git diff --check

      - name: Commit policy cleanup directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Enforce manual-only long qualification policy'
          git push origin HEAD:main
