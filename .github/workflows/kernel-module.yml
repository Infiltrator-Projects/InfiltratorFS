# SPDX-License-Identifier: GPL-3.0-or-later
name: Native Linux kernel module

on:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'tests/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - '.github/workflows/kernel-module.yml'
      - '.github/release-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-module:
    name: Build and qualify out-of-tree VFS module
    concurrency:
      group: native-kernel-hosted-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake e2fsprogs kmod linux-headers-generic

      - name: Resolve kernel header trees
        id: headers
        shell: bash
        run: |
          set -euo pipefail
          generic_kdir="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n 1)"
          test -n "$generic_kdir"
          test -f "$generic_kdir/Makefile"
          printf 'generic_kdir=%s\n' "$generic_kdir" >> "$GITHUB_OUTPUT"
          printf 'Generic module build: %s\n' "$generic_kdir"

          runtime_release="$(uname -r)"
          runtime_kdir="/lib/modules/${runtime_release}/build"
          if [[ ! -f "$runtime_kdir/Makefile" ]]; then
            if sudo apt-get install -y "linux-headers-${runtime_release}"; then
              :
            fi
          fi
          if [[ -f "$runtime_kdir/Makefile" ]]; then
            printf 'runtime_kdir=%s\n' "$runtime_kdir" >> "$GITHUB_OUTPUT"
            printf 'Runtime mount qualification available: %s\n' "$runtime_kdir"
          else
            printf 'runtime_kdir=\n' >> "$GITHUB_OUTPUT"
            printf 'Runtime headers for %s are unavailable; load/mount test will be skipped.\n' "$runtime_release"
          fi

      - name: Guard native free-extent index
        run: bash tests/native-free-extent-index-policy.sh .

      - name: Guard native workload-aware placement
        run: bash tests/native-workload-placement-policy.sh .

      - name: Guard native media-aware placement
        run: bash tests/native-media-placement-policy.sh .

      - name: Guard Format 0.17 sharded allocation tree
        run: bash tests/allocation-tree-format-policy.sh .
      - name: Guard native transaction durability
        run: bash tests/native-transaction-durability-policy.sh .

      - name: Build InfiltratorFS kernel module
        env:
          KDIR: ${{ steps.headers.outputs.generic_kdir }}
        run: make -C kernel KDIR="$KDIR"

      - name: Reproduce DKMS source-root invocation
        shell: bash
        env:
          KDIR: ${{ steps.headers.outputs.generic_kdir }}
        run: |
          set -euo pipefail
          dkms_src="$(mktemp -d)"
          trap 'rm -rf "$dkms_src"' EXIT
          cp kernel/Makefile \
             kernel/infiltratorfs.c \
             kernel/infiltratorfs_format.h \
             kernel/infiltratorfs_allocation_map.inc \
             kernel/infiltratorfs_allocation_publish.inc \
             kernel/infiltratorfs_parallel_alloc.inc \
             kernel/infiltratorfs_index_tree.inc \
             kernel/infiltratorfs_directory_tree.inc \
             kernel/infiltratorfs_rw.inc \
             kernel/infiltratorfs_rw_legacy.inc \
             kernel/infiltratorfs_rw_data.inc \
             kernel/infiltratorfs_rw_namespace.inc \
             kernel/infiltratorfs_rw_read_cache.inc \
             kernel/infiltratorfs_pagecache.inc \
             kernel/infiltratorfs_linux_meta.inc \
             kernel/infiltratorfs_defrag.inc \
             kernel/infiltratorfs_ioctl.h \
             "$dkms_src/"
          cp include/infilfs/iac1.h "$dkms_src/iac1.h"
          release="$(make -sC "$KDIR" kernelrelease)"
          KERNELRELEASE="$release" make -C "$dkms_src" KDIR="$KDIR"
          test -s "$dkms_src/infiltratorfs.ko"

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s kernel/infiltratorfs.ko
          test "$(modinfo -F name kernel/infiltratorfs.ko)" = infiltratorfs
          test "$(modinfo -F license kernel/infiltratorfs.ko)" = GPL
          modinfo kernel/infiltratorfs.ko
          cp kernel/infiltratorfs.ko kernel/infiltratorfs-generic.ko

      - name: Build userspace image tools for native mount test
        if: steps.headers.outputs.runtime_kdir != ''
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-tool infilfs-scrub infilfs-forensic infilfs-optimize

      - name: Build module for the running kernel
        if: steps.headers.outputs.runtime_kdir != ''
        env:
          KDIR: ${{ steps.headers.outputs.runtime_kdir }}
        run: |
          make -C kernel clean KDIR="$KDIR"
          make -C kernel KDIR="$KDIR"
          test "$(modinfo -F vermagic kernel/infiltratorfs.ko | awk '{print $1}')" = "$(uname -r)"

      - name: Native read-write mount transaction and scrub qualification
        if: steps.headers.outputs.runtime_kdir != ''
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/infiltratorfs-kernel-test.img"
          mountpoint="$RUNNER_TEMP/infiltratorfs-kernel-mnt"
          inline_src="$RUNNER_TEMP/infiltratorfs-inline.txt"
          extent_src="$RUNNER_TEMP/infiltratorfs-extent.bin"
          large_src="$RUNNER_TEMP/infiltratorfs-native-large.bin"
          crash_image="$RUNNER_TEMP/infiltratorfs-crash-recovery.img"
          crash_mount="$RUNNER_TEMP/infiltratorfs-crash-mnt"
          checkpoint_image="$RUNNER_TEMP/infiltratorfs-checkpoint-recovery.img"
          checkpoint_mount="$RUNNER_TEMP/infiltratorfs-checkpoint-mnt"
          cycle_image="$RUNNER_TEMP/infiltratorfs-tree-alias-corruption.img"
          cycle_mount="$RUNNER_TEMP/infiltratorfs-tree-alias-mnt"
          loopdev=""
          crash_loopdev=""
          checkpoint_loopdev=""
          cycle_loopdev=""
          holder_pid=""
          holder_child_pid=""
          mounted=0
          crash_mounted=0
          checkpoint_mounted=0
          cycle_mounted=0
          loaded=0
          cleanup() {
            set +e
            if [[ -n "$holder_child_pid" ]]; then sudo kill -KILL "$holder_child_pid" 2>/dev/null || true; fi
            if [[ -n "$holder_pid" ]]; then sudo kill -KILL "$holder_pid" 2>/dev/null || true; fi
            if [[ "$cycle_mounted" = 1 ]]; then timeout 10s sudo umount -l "$cycle_mount" || true; fi
            if [[ -n "$cycle_loopdev" ]]; then timeout 10s sudo losetup -d "$cycle_loopdev" || true; fi
            if [[ "$checkpoint_mounted" = 1 ]]; then timeout 10s sudo umount -l "$checkpoint_mount" || true; fi
            if [[ -n "$checkpoint_loopdev" ]]; then timeout 10s sudo losetup -d "$checkpoint_loopdev" || true; fi
            if [[ "$crash_mounted" = 1 ]]; then timeout 10s sudo umount -l "$crash_mount" || true; fi
            if [[ -n "$crash_loopdev" ]]; then timeout 10s sudo losetup -d "$crash_loopdev" || true; fi
            if [[ "$mounted" = 1 ]]; then timeout 10s sudo umount -l "$mountpoint" || true; fi
            if [[ -n "$loopdev" ]]; then timeout 10s sudo losetup -d "$loopdev" || true; fi
            if [[ "$loaded" = 1 ]]; then timeout 10s sudo rmmod infiltratorfs || true; fi
          }
          diagnostics() {
            set +e
            printf '\n--- native qualification diagnostics ---\n' >&2
            findmnt -T "$mountpoint" >&2 || true
            sudo dmesg | tail -n 120 >&2 || true
          }
          trap cleanup EXIT

          # Use enough checksum-chain depth to reproduce the real sha256sum
          # regression: before the cursor cache, a 1 GiB read on Hyper-V spent
          # minutes repeatedly walking the checksum-chain prefix from block 0.
          truncate -s 1G "$image"
          # Real block formatting is normally elevated.  Explicitly model sudo
          # here and verify mkfs preserves the invoking desktop identity.
          sudo env SUDO_UID="$(id -u)" SUDO_GID="$(id -g)" \
              build/mkfs.infilfs -L NativeKernelCI "$image" >/dev/null
          build/infilfs-forensic "$image" > "$RUNNER_TEMP/native-format-records.tsv"
          awk -F '\t' '$2 == "current" && $3 == "object" &&
              $5 == "index" && $6 == 3 { found = 1 } END { exit !found }' \
              "$RUNNER_TEMP/native-format-records.tsv"
          awk -F '\t' '$2 == "current" && $3 == "object" &&
              $5 == "directory" && $6 == 3 { found = 1 } END { exit !found }' \
              "$RUNNER_TEMP/native-format-records.tsv"
          printf 'native-kernel-inline\n' > "$inline_src"
          python3 - "$extent_src" "$large_src" <<'PY'
          import sys
          extent_path, large_path = sys.argv[1:]
          with open(extent_path, 'wb') as f:
              f.write(bytes((i * 37 + 11) & 0xff for i in range(32768)))
          pattern = bytes((i * 73 + 19) & 0xff for i in range(1024 * 1024))
          with open(large_path, 'wb') as f:
              for _ in range(512):
                  f.write(pattern)
          PY
          large_source_sha="$(sha256sum "$large_src" | awk '{print $1}')"
          build/infilfs-tool "$image" mkdir /docs
          build/infilfs-tool "$image" put "$inline_src" /docs/inline.txt
          build/infilfs-tool "$image" put "$extent_src" /docs/extent.bin
          build/infilfs-tool "$image" symlink docs/inline.txt /current
          build/infilfs-tool "$image" snapshot-create before-native-rw

          sudo modprobe lz4_compress 2>/dev/null || true
          sudo modprobe lz4_decompress 2>/dev/null || true
          if ! sudo insmod kernel/infiltratorfs.ko; then
            sudo dmesg | tail -n 80 >&2 || true
            exit 1
          fi
          loaded=1
          loopdev="$(sudo losetup --find --show "$image")"
          mkdir -p "$mountpoint"
          if ! sudo mount -t infiltratorfs -o rw "$loopdev" "$mountpoint"; then
            diagnostics
            exit 1
          fi
          mounted=1

          test "$(findmnt -n -o FSTYPE -T "$mountpoint")" = infiltratorfs
          findmnt -n -o OPTIONS -T "$mountpoint" | grep -Eq '(^|,)rw(,|$)'
          test "$(stat -f -c '%l' "$mountpoint")" = 1023
          test "$(stat -c '%u:%g' "$mountpoint")" = "$(id -u):$(id -g)"

          # Format 0.17 namespace boundary: native VFS must match the portable
          # 1023-byte component limit and reject byte 1024 with ENAMETOOLONG.
          python3 - "$mountpoint" <<'PY'
          import errno
          import os
          import sys

          root = sys.argv[1]
          name1023 = "n" * 1023
          name1024 = name1023 + "n"
          path1023 = os.path.join(root, name1023)
          with open(path1023, "wb") as f:
              f.write(b"1023-byte-name\n")
              f.flush()
              os.fsync(f.fileno())
          with open(path1023, "rb") as f:
              assert f.read() == b"1023-byte-name\n"
          assert name1023 in os.listdir(root)
          try:
              fd = os.open(os.path.join(root, name1024),
                           os.O_CREAT | os.O_WRONLY | os.O_EXCL, 0o600)
          except OSError as exc:
              assert exc.errno == errno.ENAMETOOLONG, exc
          else:
              os.close(fd)
              raise AssertionError("1024-byte filename unexpectedly succeeded")
          os.unlink(path1023)
          PY

          cmp "$inline_src" "$mountpoint/docs/inline.txt"
          cmp "$extent_src" "$mountpoint/docs/extent.bin"
          test "$(readlink "$mountpoint/current")" = 'docs/inline.txt'

          # A retained snapshot must not force the native mount read-only.
          # Modify every live namespace kind while the snapshot continues to
          # own the original generation; the offline checks below verify both.
          printf 'native-snapshot-live-edit\n' > "$mountpoint/docs/inline.txt"
          mv "$mountpoint/docs/extent.bin" "$mountpoint/docs/extent-moved.bin"
          rm "$mountpoint/current"

          # Exercise the exact desktop failure that exposed the POSIX bridge
          # bug: an ordinary user must be able to create at the filesystem root,
          # and creator ownership must not be silently rewritten to root.
          mkdir "$mountpoint/user-owned"
          printf 'ordinary-user-write\n' > "$mountpoint/user-owned/file.txt"
          test "$(stat -c '%u:%g' "$mountpoint/user-owned")" = "$(id -u):$(id -g)"
          test "$(stat -c '%u:%g' "$mountpoint/user-owned/file.txt")" = "$(id -u):$(id -g)"
          chmod 0640 "$mountpoint/user-owned/file.txt"
          test "$(stat -c '%a' "$mountpoint/user-owned/file.txt")" = 640
          touch -m -d '2026-01-02 03:04:05 UTC' "$mountpoint/user-owned/file.txt"
          test "$(stat -c '%Y' "$mountpoint/user-owned/file.txt")" = 1767323045
          cp -p "$mountpoint/user-owned/file.txt" "$mountpoint/user-owned/preserved.txt"
          test "$(stat -c '%u:%g' "$mountpoint/user-owned/preserved.txt")" = "$(id -u):$(id -g)"
          test "$(stat -c '%a' "$mountpoint/user-owned/preserved.txt")" = 640
          test "$(stat -c '%Y' "$mountpoint/user-owned/preserved.txt")" = 1767323045
          sudo chown 0:0 "$mountpoint/user-owned/preserved.txt"
          test "$(stat -c '%u:%g' "$mountpoint/user-owned/preserved.txt")" = 0:0
          sudo chown "$(id -u):$(id -g)" "$mountpoint/user-owned/preserved.txt"
          test "$(stat -c '%u:%g' "$mountpoint/user-owned/preserved.txt")" = "$(id -u):$(id -g)"
          chmod 0700 "$mountpoint"
          test "$(stat -c '%a' "$mountpoint")" = 700
          chmod 0755 "$mountpoint"

          # Persist the FUSE-era Linux metadata surface through the native VFS.
          if ! python3 - "$mountpoint/user-owned/file.txt" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          os.setxattr(path, b'user.infiltratorfs-ci', b'created', os.XATTR_CREATE)
          os.setxattr(path, b'user.infiltratorfs-ci', b'replaced', os.XATTR_REPLACE)
          os.setxattr(path, b'user.infiltratorfs-remove', b'temporary')
          os.removexattr(path, b'user.infiltratorfs-remove')
          assert os.getxattr(path, b'user.infiltratorfs-ci') == b'replaced'
          assert 'user.infiltratorfs-ci' in os.listxattr(path)
          assert 'user.infiltratorfs-remove' not in os.listxattr(path)
          os.setxattr(os.path.dirname(path), b'user.infiltratorfs-dir', b'directory')
          PY
          then
            diagnostics
            exit 1
          fi
          sudo python3 - "$mountpoint/user-owned/file.txt" <<'PY'
          import errno
          import os
          import sys

          path = sys.argv[1]
          os.setxattr(path, b'trusted.infiltratorfs-ci', b'trusted')
          assert os.getxattr(path, b'trusted.infiltratorfs-ci') == b'trusted'
          assert 'trusted.infiltratorfs-ci' in os.listxattr(path)
          # security.* and system.* authorization is owned by the active LSM
          # and VFS ACL layer.  When the host permits a custom name, prove the
          # native handler persists it; policy rejections are not filesystem
          # failures.
          for name in (b'security.infiltratorfs-ci', b'system.infiltratorfs-ci'):
              try:
                  os.setxattr(path, name, b'native')
              except OSError as exc:
                  if exc.errno not in (errno.EPERM, errno.EACCES,
                                       errno.EINVAL, errno.EOPNOTSUPP):
                      raise
              else:
                  assert os.getxattr(path, name) == b'native'
                  assert os.fsdecode(name) in os.listxattr(path)
          PY
          python3 - "$mountpoint/user-owned/file.txt" <<'PY'
          import os
          import sys
          assert 'trusted.infiltratorfs-ci' not in os.listxattr(sys.argv[1])
          PY

          sudo mkdir "$mountpoint/native-rw"
          printf 'native-kernel-rw\n' | sudo tee "$mountpoint/native-rw/created.txt" >/dev/null
          test "$(cat "$mountpoint/native-rw/created.txt")" = 'native-kernel-rw'
          sudo sh -c "printf 'rewritten-through-vfs\\n' > '$mountpoint/native-rw/created.txt'"
          test "$(cat "$mountpoint/native-rw/created.txt")" = 'rewritten-through-vfs'
          sudo truncate -s 8 "$mountpoint/native-rw/created.txt"
          test "$(cat "$mountpoint/native-rw/created.txt")" = 'rewritte'

          # Qualify native namespace mutation before the large data workload.
          sudo mv "$mountpoint/native-rw/created.txt" "$mountpoint/native-rw/renamed.txt"
          test "$(cat "$mountpoint/native-rw/renamed.txt")" = 'rewritte'
          sudo ln "$mountpoint/native-rw/renamed.txt" "$mountpoint/native-rw/hard.txt"
          test "$(stat -c '%i' "$mountpoint/native-rw/renamed.txt")" = \
               "$(stat -c '%i' "$mountpoint/native-rw/hard.txt")"
          sudo rm "$mountpoint/native-rw/renamed.txt"
          test "$(cat "$mountpoint/native-rw/hard.txt")" = 'rewritte'
          sudo mv "$mountpoint/native-rw/hard.txt" "$mountpoint/native-rw/created.txt"
          sudo ln -s created.txt "$mountpoint/native-rw/current-link"
          test "$(readlink "$mountpoint/native-rw/current-link")" = 'created.txt'
          test "$(cat "$mountpoint/native-rw/current-link")" = 'rewritte'
          test "$(stat -c '%b' "$mountpoint/native-rw/current-link")" -eq 8
          sudo rm "$mountpoint/native-rw/current-link"

          # Directories and symlinks consume metadata blocks even when they
          # contain no file data.  Grow a directory beyond one metadata page,
          # then shrink it again to prove i_blocks follows each committed COW.
          sudo mkdir "$mountpoint/native-rw/allocation-dir"
          test "$(stat -c '%b' "$mountpoint/native-rw/allocation-dir")" -eq 8
          sudo python3 - "$mountpoint/native-rw/allocation-dir" <<'PY'
          import os
          import sys
          directory = sys.argv[1]
          for index in range(180):
              fd = os.open(os.path.join(directory, f'entry-{index:03d}'),
                           os.O_CREAT | os.O_WRONLY | os.O_EXCL, 0o600)
              os.close(fd)
          PY
          test "$(stat -c '%b' "$mountpoint/native-rw/allocation-dir")" -gt 8
          sudo find "$mountpoint/native-rw/allocation-dir" -mindepth 1 -maxdepth 1 \
            -type f -delete
          test "$(stat -c '%b' "$mountpoint/native-rw/allocation-dir")" -eq 8
          sudo rmdir "$mountpoint/native-rw/allocation-dir"
          sudo mkdir "$mountpoint/native-rw/allocation-persist"
          sudo ln -s created.txt "$mountpoint/native-rw/allocation-link"
          test "$(stat -c '%b' "$mountpoint/native-rw/allocation-persist")" -eq 8
          test "$(stat -c '%b' "$mountpoint/native-rw/allocation-link")" -eq 8

          # Keep a branched directory live through scrub/remount so the mounted
          # test proves both current persistent tree implementations are used.
          sudo mkdir "$mountpoint/native-rw/tree-persist"
          sudo python3 - "$mountpoint/native-rw/tree-persist" <<'PY'
          import os
          import sys
          directory = sys.argv[1]
          for index in range(180):
              path = os.path.join(directory, f'persistent-tree-entry-{index:03d}')
              fd = os.open(path, os.O_CREAT | os.O_WRONLY | os.O_EXCL, 0o600)
              os.close(fd)
          PY
          test "$(find "$mountpoint/native-rw/tree-persist" -mindepth 1 \
              -maxdepth 1 -type f | wc -l)" -eq 180

          # POSIX requires an unlinked file to remain fully usable through an
          # already-open descriptor until the final close.  Exercise both read
          # and write after unlink; subsequent allocation then helps expose any
          # premature extent reuse.
          sudo python3 - "$mountpoint/native-rw/open-unlink.txt" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          fd = os.open(path, os.O_CREAT | os.O_RDWR | os.O_EXCL, 0o600)
          try:
              os.write(fd, b"before-unlink\n")
              os.fsync(fd)
              os.unlink(path)
              os.lseek(fd, 0, os.SEEK_SET)
              assert os.read(fd, 14) == b"before-unlink\n"
              os.lseek(fd, 0, os.SEEK_END)
              os.write(fd, b"after-unlink\n")
              os.fsync(fd)
              os.lseek(fd, 0, os.SEEK_SET)
              assert os.read(fd, 27) == b"before-unlink\nafter-unlink\n"
          finally:
              os.close(fd)
          assert not os.path.exists(path)
          PY
          printf 'post-unlink-allocation\n' | sudo tee \
            "$mountpoint/native-rw/post-unlink.txt" >/dev/null
          test "$(cat "$mountpoint/native-rw/post-unlink.txt")" = \
            'post-unlink-allocation'

          # Restore the complete mounted open-handle matrix from the former
          # FUSE regression: open rename, replacement of an open destination,
          # truncate after unlink, and parent-directory rename.
          sudo python3 - "$mountpoint/native-rw" <<'PY'
          import os
          import sys

          root = sys.argv[1]
          original = os.path.join(root, 'open-rename-source')
          renamed = os.path.join(root, 'open-rename-target')
          fd = os.open(original, os.O_CREAT | os.O_RDWR | os.O_EXCL, 0o600)
          os.write(fd, b'open-before-rename')
          os.fsync(fd)
          os.rename(original, renamed)
          os.lseek(fd, 0, os.SEEK_END)
          os.write(fd, b'-after')
          os.fsync(fd)
          os.lseek(fd, 0, os.SEEK_SET)
          assert os.read(fd, 64) == b'open-before-rename-after'
          os.close(fd)
          with open(renamed, 'rb') as stream:
              assert stream.read() == b'open-before-rename-after'

          source = os.path.join(root, 'replace-source')
          destination = os.path.join(root, 'replace-destination')
          with open(source, 'wb') as stream:
              stream.write(b'new-destination')
              stream.flush()
              os.fsync(stream.fileno())
          old_fd = os.open(destination, os.O_CREAT | os.O_RDWR | os.O_EXCL, 0o600)
          os.write(old_fd, b'old-open-destination')
          os.fsync(old_fd)
          os.rename(source, destination)
          os.lseek(old_fd, 0, os.SEEK_SET)
          assert os.read(old_fd, 64) == b'old-open-destination'
          os.ftruncate(old_fd, 7)
          os.fsync(old_fd)
          os.close(old_fd)
          with open(destination, 'rb') as stream:
              assert stream.read() == b'new-destination'

          parent = os.path.join(root, 'open-parent')
          moved_parent = os.path.join(root, 'open-parent-moved')
          os.mkdir(parent)
          child = os.path.join(parent, 'child')
          child_fd = os.open(child, os.O_CREAT | os.O_RDWR | os.O_EXCL, 0o600)
          os.write(child_fd, b'before-parent-rename')
          os.fsync(child_fd)
          os.rename(parent, moved_parent)
          os.lseek(child_fd, 0, os.SEEK_END)
          os.write(child_fd, b'-after')
          os.fsync(child_fd)
          os.unlink(os.path.join(moved_parent, 'child'))
          os.lseek(child_fd, 0, os.SEEK_SET)
          assert os.read(child_fd, 64) == b'before-parent-rename-after'
          os.close(child_fd)
          os.rmdir(moved_parent)
          PY

          # Exercise the native global write-serialization contract under
          # real process contention before crash/recovery qualification.
          for concurrency_round in 1 2 3 4; do
            sudo python3 tests/native-concurrency-qualification.py \
              "$mountpoint/native-rw/concurrency-${concurrency_round}"
          done

          # Capture a power-loss image while an unlinked descriptor is still
          # open.  The clone contains the durable zero-link indexed object but
          # never observes final close/eviction; its later writable mount must
          # recover that orphan before scrub.
          orphan_ready="$RUNNER_TEMP/infiltratorfs-orphan-ready"
          orphan_pid="$RUNNER_TEMP/infiltratorfs-orphan-pid"
          sudo python3 - "$mountpoint/native-rw/crash-held-unlinked" \
            "$orphan_ready" "$orphan_pid" <<'PY' &
          import os
          import sys
          import time

          path, ready, pid_path = sys.argv[1:]
          fd = os.open(path, os.O_CREAT | os.O_RDWR | os.O_EXCL, 0o600)
          os.write(fd, b'durable-open-orphan')
          os.fsync(fd)
          os.unlink(path)
          directory_fd = os.open(os.path.dirname(path), os.O_RDONLY)
          os.fsync(directory_fd)
          os.close(directory_fd)
          with open(pid_path, 'w', encoding='ascii') as marker:
              marker.write(f'{os.getpid()}\n')
              marker.flush()
              os.fsync(marker.fileno())
          with open(ready, 'w', encoding='ascii') as marker:
              marker.write('ready\n')
              marker.flush()
              os.fsync(marker.fileno())
          while True:
              time.sleep(60)
          PY
          holder_pid="$!"
          for _ in $(seq 1 200); do
            [[ -f "$orphan_ready" ]] && break
            sleep 0.1
          done
          test -f "$orphan_ready"
          test -f "$orphan_pid"
          holder_child_pid="$(<"$orphan_pid")"
          [[ "$holder_child_pid" =~ ^[0-9]+$ ]]
          sync
          sudo blockdev --flushbufs "$loopdev"
          cp --reflink=auto --sparse=always "$image" "$crash_image"
          sudo kill -KILL "$holder_child_pid"
          wait "$holder_pid" 2>/dev/null || true
          holder_child_pid=""
          holder_pid=""
          sync

          sudo mkdir "$mountpoint/native-rw/source-dir" "$mountpoint/native-rw/dest-dir"
          printf 'cross-directory-rename\n' | sudo tee "$mountpoint/native-rw/source-dir/item" >/dev/null
          sudo mv "$mountpoint/native-rw/source-dir/item" "$mountpoint/native-rw/dest-dir/item"
          test "$(cat "$mountpoint/native-rw/dest-dir/item")" = 'cross-directory-rename'
          sudo rm "$mountpoint/native-rw/dest-dir/item"
          sudo rmdir "$mountpoint/native-rw/source-dir" "$mountpoint/native-rw/dest-dir"

          # FIFO, Unix socket and device-node identity use the same portable
          # sidecar representation as the final FUSE implementation.
          sudo mkfifo "$mountpoint/native-rw/native.fifo"
          sudo python3 - "$mountpoint/native-rw/native.socket" <<'PY'
          import socket
          import sys

          sock = socket.socket(socket.AF_UNIX)
          try:
              sock.bind(sys.argv[1])
          finally:
              sock.close()
          PY
          sudo mknod "$mountpoint/native-rw/native.char" c 1 3
          sudo mknod "$mountpoint/native-rw/native.block" b 7 0
          test -p "$mountpoint/native-rw/native.fifo"
          test -S "$mountpoint/native-rw/native.socket"
          test -c "$mountpoint/native-rw/native.char"
          test -b "$mountpoint/native-rw/native.block"
          test "$(stat -c '%t:%T' "$mountpoint/native-rw/native.char")" = '1:3'
          test "$(stat -c '%t:%T' "$mountpoint/native-rw/native.block")" = '7:0'

          # MAP_SHARED writes must use verified page-cache reads, dirty-folio
          # writeback and fsync durability rather than bypassing native CoW.
          sudo python3 - "$mountpoint/native-rw/mmap.bin" <<'PY'
          import hashlib
          import mmap
          import os
          import sys

          path = sys.argv[1]
          expected = bytearray((i * 61 + 17) & 0xff for i in range(8 * 1024 * 1024))
          with open(path, 'wb') as stream:
              stream.write(expected)
              stream.flush()
              os.fsync(stream.fileno())
          patches = (
              (123, b'mmap-first-page'),
              (3 * 1024 * 1024 + 211, b'mmap-middle-page'),
              (len(expected) - 32, b'mmap-final-page'),
          )
          with open(path, 'r+b') as stream:
              with mmap.mmap(stream.fileno(), 0, access=mmap.ACCESS_WRITE) as mapped:
                  for offset, payload in patches:
                      mapped[offset:offset + len(payload)] = payload
                      expected[offset:offset + len(payload)] = payload
                  mapped.flush()
              os.fsync(stream.fileno())
          with open(path, 'rb') as stream:
              assert stream.read() == expected
              stream.seek(0)
              with mmap.mmap(stream.fileno(), 0, access=mmap.ACCESS_READ) as mapped:
                  assert hashlib.sha256(mapped).digest() == hashlib.sha256(expected).digest()
          PY

          # Use deterministic non-zero data and 4 MiB write syscalls. This
          # exercises the native extent path directly without GNU cp sparse-file
          # heuristics obscuring whether write_iter itself is healthy.
          printf 'Starting native 512 MiB extent write...\n'
          write_start="$(date +%s%N)"
          if ! sudo timeout --signal=TERM --kill-after=10s 240s \
              dd if="$large_src" of="$mountpoint/native-rw/large.bin" \
                 bs=4M status=none; then
            diagnostics
            exit 1
          fi
          write_end="$(date +%s%N)"
          large_logical="$(stat -c '%s' "$mountpoint/native-rw/large.bin")"
          large_allocated="$(( $(stat -c '%b' "$mountpoint/native-rw/large.bin") * 512 ))"
          printf 'Native compressed allocation: %s logical bytes, %s allocated bytes\n' \
              "$large_logical" "$large_allocated"
          test "$large_allocated" -lt "$large_logical"
          # The deterministic source has a short repeating byte period. Native
          # IAC1 should therefore win decisively rather than merely by one block.
          test "$large_allocated" -lt "$((large_logical / 2))"
          python3 - "$write_start" "$write_end" <<'PY'
          import sys
          elapsed = (int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000
          mib = 512.0
          print(f"Native 512 MiB mounted write: {elapsed:.3f} s ({mib/elapsed:.2f} MiB/s)")
          PY

          # Reproduce the user-observed workload exactly: many sequential
          # read() syscalls from sha256sum.  The old implementation reset its
          # checksum cursor per syscall and degraded toward quadratic chain
          # walking.  Keep this bounded so that regression can never hide as a
          # merely 'slow' successful build.
          printf 'Timing live native 512 MiB verified sha256 read...\n'
          read_start="$(date +%s%N)"
          if ! mounted_sha="$(sudo timeout --signal=TERM --kill-after=10s 90s \
              sha256sum "$mountpoint/native-rw/large.bin" | awk '{print $1}')"; then
            diagnostics
            exit 1
          fi
          read_end="$(date +%s%N)"
          test "$mounted_sha" = "$large_source_sha"
          python3 - "$read_start" "$read_end" <<'PY'
          import sys
          elapsed = (int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000
          mib = 512.0
          print(f"Native 512 MiB verified read: {elapsed:.3f} s ({mib/elapsed:.2f} MiB/s)")
          PY
          cmp "$large_src" "$mountpoint/native-rw/large.bin"

          # Compression mutation parity: truncate and hole-punch may split a
          # codec cluster at their logical boundary. Exercise both while the
          # source extents are still genuinely compressed, then verify them
          # again after the final cold remount below.
          compressed_mutation_src="$RUNNER_TEMP/native-compressed-mutation-source.bin"
          compressed_truncate_expected="$RUNNER_TEMP/native-compressed-truncate-expected.bin"
          compressed_punch_expected="$RUNNER_TEMP/native-compressed-punch-expected.bin"
          python3 - "$compressed_mutation_src" <<'PY'
          import sys
          path = sys.argv[1]
          phrase = b'InfiltratorFS compressed mutation boundary regression\n'
          size = 2 * 1024 * 1024
          data = (phrase * ((size + len(phrase) - 1) // len(phrase)))[:size]
          with open(path, 'wb') as stream:
              stream.write(data)
          PY
          cp "$compressed_mutation_src" "$compressed_truncate_expected"
          cp "$compressed_mutation_src" "$compressed_punch_expected"
          sudo dd if="$compressed_mutation_src"               of="$mountpoint/native-rw/compressed-truncate.bin"               bs=1M status=none
          sudo dd if="$compressed_mutation_src"               of="$mountpoint/native-rw/compressed-punch.bin"               bs=1M status=none
          for compressed_file in compressed-truncate.bin compressed-punch.bin; do
            logical="$(stat -c '%s' "$mountpoint/native-rw/$compressed_file")"
            allocated="$(( $(stat -c '%b' "$mountpoint/native-rw/$compressed_file") * 512 ))"
            test "$allocated" -lt "$((logical / 2))"
          done

          compressed_truncate_size="$((41 * 4096 + 123))"
          sudo truncate -s "$compressed_truncate_size"               "$mountpoint/native-rw/compressed-truncate.bin"
          python3 - "$compressed_truncate_expected" "$compressed_truncate_size" <<'PY'
          import sys
          with open(sys.argv[1], 'r+b') as stream:
              stream.truncate(int(sys.argv[2]))
          PY
          cmp "$compressed_truncate_expected"               "$mountpoint/native-rw/compressed-truncate.bin"
          compressed_regrow_size=600000
          sudo truncate -s "$compressed_regrow_size"               "$mountpoint/native-rw/compressed-truncate.bin"
          python3 - "$compressed_truncate_expected" "$compressed_regrow_size" <<'PY'
          import sys
          with open(sys.argv[1], 'r+b') as stream:
              stream.truncate(int(sys.argv[2]))
          PY
          cmp "$compressed_truncate_expected"               "$mountpoint/native-rw/compressed-truncate.bin"

          compressed_punch_offset=12345
          compressed_punch_length=700000
          sudo fallocate -p -o "$compressed_punch_offset"               -l "$compressed_punch_length"               "$mountpoint/native-rw/compressed-punch.bin"
          python3 - "$compressed_punch_expected"               "$compressed_punch_offset" "$compressed_punch_length" <<'PY'
          import sys
          path, offset, length = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          with open(path, 'r+b') as stream:
              stream.seek(offset)
              stream.write(bytes(length))
          PY
          cmp "$compressed_punch_expected"               "$mountpoint/native-rw/compressed-punch.bin"

          # Native parity: extent-backed files must permit bounded random
          # overwrite without changing their length or invalidating checksums.
          sudo python3 - "$large_src" "$mountpoint/native-rw/large.bin" <<'PY'
          import os
          import sys

          expected, mounted = sys.argv[1:]
          patches = (
              (3 * 1024 * 1024 + 137, bytes((i * 29 + 7) & 0xff for i in range(1024 * 1024))),
              (477 * 1024 * 1024 + 19, bytes((i * 43 + 5) & 0xff for i in range(512 * 1024))),
          )
          for path in (expected, mounted):
              fd = os.open(path, os.O_RDWR)
              try:
                  before = os.fstat(fd).st_size
                  for offset, payload in patches:
                      assert os.pwrite(fd, payload, offset) == len(payload)
                  os.fsync(fd)
                  assert os.fstat(fd).st_size == before
              finally:
                  os.close(fd)
          PY
          large_source_sha="$(sha256sum "$large_src" | awk '{print $1}')"
          test "$(sha256sum "$mountpoint/native-rw/large.bin" | awk '{print $1}')" = \
               "$large_source_sha"

          # Reinstate the former 4,000-write mounted stress workload with
          # deterministic 4 KiB overwrites and periodic durability barriers.
          # Dump blocked-task/kernel diagnostics immediately if the loop fails
          # so iterator/locking regressions are actionable from CI alone.
          random_write_start="$(date +%s%N)"
          if ! sudo python3 - "$large_src" "$mountpoint/native-rw/large.bin" <<'PY'
          import os
          import random
          import sys

          expected_path, mounted_path = sys.argv[1:]
          size = os.path.getsize(expected_path)
          rng = random.Random(0x1F51A7E)
          expected_fd = os.open(expected_path, os.O_RDWR)
          mounted_fd = os.open(mounted_path, os.O_RDWR)
          try:
              for iteration in range(4000):
                  offset = rng.randrange(size // 4096) * 4096
                  payload = bytes(((iteration * 17 + i * 31 + 9) & 0xff)
                                  for i in range(4096))
                  assert os.pwrite(expected_fd, payload, offset) == len(payload)
                  assert os.pwrite(mounted_fd, payload, offset) == len(payload)
                  if iteration % 50 == 49:
                      os.fsync(mounted_fd)
              os.fsync(expected_fd)
              os.fsync(mounted_fd)
              assert os.fstat(mounted_fd).st_size == size
          finally:
              os.close(mounted_fd)
              os.close(expected_fd)
          PY
          then
            diagnostics
            exit 1
          fi
          random_write_end="$(date +%s%N)"
          python3 - "$random_write_start" "$random_write_end" <<'PY'
          import sys
          elapsed = (int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000
          print(f"Native 4,000x4KiB random overwrite phase: {elapsed:.3f} s "
                f"({4000.0/elapsed:.1f} writes/s)")
          PY
          large_source_sha="$(sha256sum "$large_src" | awk '{print $1}')"
          test "$(sha256sum "$mountpoint/native-rw/large.bin" | awk '{print $1}')" = \
               "$large_source_sha"

          # Hyper-V qualification formerly published 200 explicit fsync
          # generations.  Preserve that exact mounted durability pressure.
          fsync_pressure_start="$(date +%s%N)"
          sudo python3 - "$mountpoint/native-rw/fsync-publications.bin" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          fd = os.open(path, os.O_CREAT | os.O_RDWR | os.O_EXCL, 0o600)
          expected = bytearray(200 * 4096)
          try:
              for iteration in range(200):
                  payload = bytes(((iteration * 23 + i * 7 + 3) & 0xff)
                                  for i in range(4096))
                  offset = iteration * 4096
                  assert os.pwrite(fd, payload, offset) == len(payload)
                  expected[offset:offset + 4096] = payload
                  os.fsync(fd)
              os.lseek(fd, 0, os.SEEK_SET)
              assert os.read(fd, len(expected)) == expected
          finally:
              os.close(fd)
          PY
          fsync_pressure_end="$(date +%s%N)"
          python3 - "$fsync_pressure_start" "$fsync_pressure_end" <<'PY'
          import sys
          elapsed = (int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000
          print(f"Native 200-fsync durability phase: {elapsed:.3f} s "
                f"({200.0/elapsed:.1f} fsyncs/s)")
          PY


          # Standard sparse-discovery and FIEMAP interfaces must expose the
          # InfiltratorFS extent map rather than generic byte-only fallbacks.
          sudo python3 - "$mountpoint/native-rw/seek-map.bin" <<'PY'
          import os, sys
          path = sys.argv[1]
          fd = os.open(path, os.O_CREAT | os.O_RDWR | os.O_EXCL, 0o600)
          try:
              os.pwrite(fd, b'A' * 4096, 0)
              os.pwrite(fd, b'B' * 4096, 512 * 1024)
              os.ftruncate(fd, 1024 * 1024)
              os.fsync(fd)
              assert os.lseek(fd, 0, os.SEEK_DATA) == 0
              assert os.lseek(fd, 0, os.SEEK_HOLE) == 4096
              assert os.lseek(fd, 4096, os.SEEK_DATA) == 512 * 1024
              assert os.lseek(fd, 512 * 1024, os.SEEK_HOLE) == 516 * 1024
              assert os.lseek(fd, 516 * 1024, os.SEEK_HOLE) == 516 * 1024
          finally:
              os.close(fd)
          PY
          sudo filefrag -v "$mountpoint/native-rw/seek-map.bin" |
            tee "$RUNNER_TEMP/infiltratorfs-fiemap.txt"
          grep -Eq '[0-9]+ extent(s)? found|extent found' \
            "$RUNNER_TEMP/infiltratorfs-fiemap.txt"

          # Standard Linux whole-file reflink exposure. --reflink=always must
          # fail rather than silently copy if FICLONE is unsupported, so this
          # directly gates the native shared-extent path. Mutating the clone
          # then proves CoW leaves the source unchanged.
          sudo python3 - "$mountpoint/native-rw/reflink-source.bin" <<'PY'
          import hashlib
          import os
          import sys
          path = sys.argv[1]
          with open(path, "xb", buffering=0) as f:
              for i in range(32768):
                  f.write(hashlib.sha256(i.to_bytes(8, "little")).digest())
              os.fsync(f.fileno())
          PY
          reflink_source_hash="$(sudo sha256sum "$mountpoint/native-rw/reflink-source.bin" | awk '{print $1}')"
          sudo cp --reflink=always             "$mountpoint/native-rw/reflink-source.bin"             "$mountpoint/native-rw/reflink-clone.bin"
          sudo cmp "$mountpoint/native-rw/reflink-source.bin"             "$mountpoint/native-rw/reflink-clone.bin"
          sudo python3 - "$mountpoint/native-rw/reflink-clone.bin" <<'PY'
          import os
          import sys
          fd = os.open(sys.argv[1], os.O_RDWR | os.O_CLOEXEC)
          try:
              assert os.pwrite(fd, b'R' * 4096, 0) == 4096
              os.fsync(fd)
          finally:
              os.close(fd)
          PY
          test "$(sudo sha256sum "$mountpoint/native-rw/reflink-source.bin" | awk '{print $1}')" =             "$reflink_source_hash"
          if sudo cmp -s "$mountpoint/native-rw/reflink-source.bin"               "$mountpoint/native-rw/reflink-clone.bin"; then
            echo "Native reflink clone did not CoW after mutation." >&2
            exit 1
          fi

          # Native parity: sparse high-offset growth, extent truncate,
          # preallocation and hole punching must survive the offline scrub.
          # Keep these values visible in the hosted log: this path is both a
          # correctness gate and the fastest way to distinguish logical-size,
          # allocation-accounting and high-offset-write regressions.
          printf 'Qualifying 1 TiB sparse growth/truncate...\n'
          sudo truncate -s 1T "$mountpoint/native-rw/sparse-1t.bin"
          sparse_size="$(stat -c '%s' "$mountpoint/native-rw/sparse-1t.bin")"
          sparse_blocks="$(stat -c '%b' "$mountpoint/native-rw/sparse-1t.bin")"
          printf 'Sparse growth state: size=%s bytes blocks=%s (512-byte units)\n' \
              "$sparse_size" "$sparse_blocks"
          if [[ "$sparse_size" != 1099511627776 ]]; then
            echo "Sparse growth logical-size regression: $sparse_size" >&2
            diagnostics
            exit 1
          fi
          if [[ "$sparse_blocks" -ne 0 ]]; then
            echo "Sparse growth allocation regression: $sparse_blocks blocks" >&2
            diagnostics
            exit 1
          fi
          printf 'sparse-tail\n' | sudo dd \
              of="$mountpoint/native-rw/sparse-1t.bin" bs=1 seek=1099511623680 \
              conv=notrunc status=none
          sparse_tail="$(sudo dd if="$mountpoint/native-rw/sparse-1t.bin" bs=1 \
              skip=1099511623680 count=12 status=none)"
          if [[ "$sparse_tail" != 'sparse-tail' ]]; then
            echo "Sparse high-offset data regression: '$sparse_tail'" >&2
            diagnostics
            exit 1
          fi
          sudo truncate -s 134217728 "$mountpoint/native-rw/sparse-1t.bin"
          sparse_truncated_size="$(stat -c '%s' "$mountpoint/native-rw/sparse-1t.bin")"
          printf 'Sparse truncated state: size=%s bytes blocks=%s (512-byte units)\n' \
              "$sparse_truncated_size" \
              "$(stat -c '%b' "$mountpoint/native-rw/sparse-1t.bin")"
          if [[ "$sparse_truncated_size" != 134217728 ]]; then
            echo "Sparse truncate logical-size regression: $sparse_truncated_size" >&2
            diagnostics
            exit 1
          fi

          # Exercise the allocator's true write-beyond-EOF workload class.
          # Unlike truncate-then-write, this reaches the in-lock SPARSE
          # classifier with pos > old_size and must survive remount/scrub.
          sudo python3 - "$mountpoint/native-rw/direct-sparse.bin" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          offset = 64 * 1024 * 1024 + 123
          payload = b'infiltratorfs-direct-sparse-placement'
          fd = os.open(path, os.O_CREAT | os.O_RDWR | os.O_EXCL, 0o600)
          try:
              assert os.pwrite(fd, payload, offset) == len(payload)
              os.fsync(fd)
              assert os.fstat(fd).st_size == offset + len(payload)
              assert os.pread(fd, len(payload), offset) == payload
              assert os.pread(fd, 4096, 0) == bytes(4096)
          finally:
              os.close(fd)
          PY

          sudo fallocate -l 16M "$mountpoint/native-rw/preallocated.bin"
          preallocated_blocks="$(stat -c '%b' "$mountpoint/native-rw/preallocated.bin")"
          test "$preallocated_blocks" -ge 32768
          sudo fallocate -p -o 4M -l 8M \
              "$mountpoint/native-rw/preallocated.bin"
          punched_blocks="$(stat -c '%b' "$mountpoint/native-rw/preallocated.bin")"
          test "$punched_blocks" -lt "$preallocated_blocks"
          test "$(sudo dd if="$mountpoint/native-rw/preallocated.bin" bs=1M \
              skip=4 count=8 status=none | tr -d '\0' | wc -c)" -eq 0

          sudo chmod 000 "$mountpoint/native-rw/post-unlink.txt"
          test "$(stat -c '%a' "$mountpoint/native-rw/post-unlink.txt")" = 0
          sudo ln "$mountpoint/native-rw/large.bin" "$mountpoint/native-rw/large-hard.bin"
          sudo rm "$mountpoint/native-rw/large.bin"
          cmp "$large_src" "$mountpoint/native-rw/large-hard.bin"
          sudo mv "$mountpoint/native-rw/large-hard.bin" "$mountpoint/native-rw/large.bin"

          # statfs must account for the live deferred transaction, not merely
          # the last committed checkpoint. Keep this probe below the minimum
          # 16 MiB publication threshold and use deterministic high-entropy data:
          # a zero-filled probe is legitimately compressed now and therefore no
          # longer consumes its logical byte count in physical free space.
          sudo python3 - "$mountpoint/native-rw" <<'PY'
          import os
          import sys

          root = sys.argv[1]
          path = os.path.join(root, 'statfs-pending-probe.bin')
          before = os.statvfs(root).f_bavail
          state = 0x51A7E123
          payload = bytearray(1024 * 1024)
          for i in range(len(payload)):
              state = (state * 1664525 + 1013904223) & 0xffffffff
              payload[i] = state >> 24
          payload = bytes(payload)
          fd = os.open(path, os.O_CREAT | os.O_WRONLY | os.O_EXCL, 0o600)
          try:
              for _ in range(8):
                  view = memoryview(payload)
                  while view:
                      written = os.write(fd, view)
                      view = view[written:]
          finally:
              os.close(fd)
          after = os.statvfs(root).f_bavail
          assert after < before, (before, after)
          assert before - after >= (8 * 1024 * 1024) // 4096, (before, after)
          os.unlink(path)
          os.sync()
          PY

          # Drive the allocator close to a bounded free-space floor, punch
          # alternating 4 MiB holes into that population, then refill with
          # smaller extents. This qualifies split/merge/reuse behaviour under
          # realistic mounted fragmentation without risking an intentional
          # ENOSPC against the CI image.
          sudo mkdir "$mountpoint/native-rw/allocator-stress"
          sudo python3 - "$mountpoint/native-rw/allocator-stress" <<'PY'
          import os
          import sys

          root = sys.argv[1]
          reserve = 128 * 1024 * 1024
          coarse_size = 4 * 1024 * 1024
          refill_size = 2 * 1024 * 1024
          payload = bytes((index * 47 + 13) & 0xff
                          for index in range(1024 * 1024))

          def free_bytes():
              stat = os.statvfs(root)
              return stat.f_bavail * stat.f_frsize

          def write_file(path, size):
              fd = os.open(path, os.O_CREAT | os.O_WRONLY | os.O_EXCL, 0o600)
              try:
                  left = size
                  while left:
                      chunk = payload if left >= len(payload) else payload[:left]
                      written = os.write(fd, chunk)
                      assert written == len(chunk)
                      left -= written
              finally:
                  os.close(fd)

          coarse = []
          for index in range(128):
              if free_bytes() <= reserve + coarse_size:
                  break
              path = os.path.join(root, f'coarse-{index:03d}.bin')
              write_file(path, coarse_size)
              coarse.append(path)
          assert len(coarse) >= 8
          os.sync()

          # Free alternating allocations so the free-space cache must split,
          # merge and select among many physical runs.
          for path in coarse[::2]:
              os.unlink(path)
          os.sync()

          refill = []
          for index in range(256):
              if free_bytes() <= reserve + refill_size:
                  break
              path = os.path.join(root, f'refill-{index:03d}.bin')
              write_file(path, refill_size)
              refill.append(path)
          assert refill
          os.sync()

          # Leave one deterministic extent alive through offline scrub and the
          # final read-only remount; remove the churn population first so those
          # frees are also committed and reusable.
          proof = os.path.join(root, 'proof.bin')
          write_file(proof, 8 * 1024 * 1024)
          os.sync()
          for path in coarse:
              if os.path.exists(path):
                  os.unlink(path)
          for path in refill:
              os.unlink(path)
          os.sync()

          print(f'allocator stress: coarse={len(coarse)} refill={len(refill)} '
                f'free_after_cleanup={free_bytes()}')
          PY
          allocator_stress_sha="$(sudo sha256sum               "$mountpoint/native-rw/allocator-stress/proof.bin" | awk '{print $1}')"
          test -n "$allocator_stress_sha"

          # A compile-time sharding check cannot establish parallelism. Start
          # sixteen writers together, verify their disjoint data, and after
          # unmount require the driver's peak-active counter to prove that at
          # least two volatile reservations overlapped before write_lock.
          sudo python3 - "$mountpoint/native-rw/parallel-allocation-ci" <<'PY'
          import hashlib
          import multiprocessing as mp
          import os
          import sys

          root = sys.argv[1]
          os.mkdir(root)
          workers = 16
          size = 4 * 1024 * 1024
          start = mp.Event()

          def writer(index):
              byte = bytes([(index * 29 + 7) & 0xff])
              start.wait()
              path = os.path.join(root, f'writer-{index:02d}.bin')
              with open(path, 'wb', buffering=0) as stream:
                  stream.write(byte * size)
                  os.fsync(stream.fileno())

          processes = [mp.Process(target=writer, args=(index,))
                       for index in range(workers)]
          for process in processes:
              process.start()
          start.set()
          for process in processes:
              process.join(180)
              assert process.exitcode == 0, (process.pid, process.exitcode)
          for index in range(workers):
              expected = bytes([(index * 29 + 7) & 0xff]) * size
              path = os.path.join(root, f'writer-{index:02d}.bin')
              with open(path, 'rb') as stream:
                  actual = stream.read()
              assert hashlib.sha256(actual).digest() == \
                  hashlib.sha256(expected).digest()
          PY

          printf 'Publishing durability barrier...\n'
          sync_start="$(date +%s%N)"
          if ! timeout --signal=TERM --kill-after=10s 120s sync; then
            diagnostics
            exit 1
          fi
          sync_end="$(date +%s%N)"
          python3 - "$sync_start" "$sync_end" <<'PY'
          import sys
          elapsed = (int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000
          print(f"Native durability sync: {elapsed:.3f} s")
          PY

          printf 'Unmounting and scrubbing native result...\n'
          sudo umount "$mountpoint"
          mounted=0
          allocator_log="$(sudo dmesg | \
              grep 'InfiltratorFS: allocator reservations=' | tail -n1 || true)"
          printf '%s\n' "$allocator_log"
          allocator_peak="$(sed -nE \
              's/.*peak_active=([0-9]+).*/\1/p' <<<"$allocator_log")"
          workload_seq="$(sed -nE \
              's/.*workload_seq=([0-9]+).*/\1/p' <<<"$allocator_log")"
          workload_random="$(sed -nE \
              's/.*workload_random=([0-9]+).*/\1/p' <<<"$allocator_log")"
          workload_sparse="$(sed -nE \
              's/.*workload_sparse=([0-9]+).*/\1/p' <<<"$allocator_log")"
          locality_scored="$(sed -nE \
              's/.*locality_scored=([0-9]+).*/\1/p' <<<"$allocator_log")"
          best_fit="$(sed -nE \
              's/.*best_fit=([0-9]+).*/\1/p' <<<"$allocator_log")"
          media_profile="$(sed -nE \
              's/.*media=([^ ]+).*/\1/p' <<<"$allocator_log")"
          media_rotational_scored="$(sed -nE \
              's/.*media_rotational_scored=([0-9]+).*/\1/p' <<<"$allocator_log")"
          media_nonrotational_scored="$(sed -nE \
              's/.*media_nonrotational_scored=([0-9]+).*/\1/p' <<<"$allocator_log")"
          media_balanced_scored="$(sed -nE \
              's/.*media_balanced_scored=([0-9]+).*/\1/p' <<<"$allocator_log")"
          for value in "$allocator_peak" "$workload_seq" "$workload_random" \
                       "$workload_sparse" "$locality_scored" "$best_fit" \
                       "$media_profile" "$media_rotational_scored" \
                       "$media_nonrotational_scored" "$media_balanced_scored"; do
            test -n "$value"
          done
          test "$allocator_peak" -ge 2
          test "$workload_seq" -ge 1
          test "$workload_random" -ge 1
          test "$workload_sparse" -ge 1
          test "$locality_scored" -ge 1
          case "$media_profile" in
            rotational)
              test "$media_rotational_scored" -ge 1
              ;;
            nonrotational)
              test "$media_nonrotational_scored" -ge 1
              test "$best_fit" -ge 1
              ;;
            balanced)
              test "$media_balanced_scored" -ge 1
              test "$best_fit" -ge 1
              ;;
            *)
              echo "Unexpected allocator media profile: $media_profile" >&2
              exit 1
              ;;
          esac
          test "$(build/infilfs-tool "$image" cat /native-rw/created.txt)" = 'rewritte'
          test "$(build/infilfs-tool "$image" cat /docs/inline.txt)" = \
               'native-snapshot-live-edit'
          cmp "$extent_src" <(build/infilfs-tool "$image" cat /docs/extent-moved.bin)
          test "$(build/infilfs-tool "$image" snapshot-cat before-native-rw \
              /docs/inline.txt)" = 'native-kernel-inline'
          cmp "$extent_src" <(build/infilfs-tool "$image" snapshot-cat \
              before-native-rw /docs/extent.bin)
          build/infilfs-scrub "$image" | tee "$RUNNER_TEMP/native-rw-scrub.txt"
          grep -Fq 'Result:              CLEAN' "$RUNNER_TEMP/native-rw-scrub.txt"
          build/infilfs-forensic "$image" > "$RUNNER_TEMP/native-tree-records.tsv"
          grep -Fq $'current\tindex-branch-page' \
              "$RUNNER_TEMP/native-tree-records.tsv"
          grep -Fq $'current\tdirectory-branch-page' \
              "$RUNNER_TEMP/native-tree-records.tsv"

          printf 'Recovering the crash-cloned open-file orphan...\n'
          mkdir -p "$crash_mount"
          crash_loopdev="$(sudo losetup --find --show "$crash_image")"
          sudo mount -t infiltratorfs -o rw "$crash_loopdev" "$crash_mount"
          crash_mounted=1
          test ! -e "$crash_mount/native-rw/crash-held-unlinked"
          printf 'post-crash-recovery\n' | sudo tee \
            "$crash_mount/native-rw/post-crash-recovery" >/dev/null
          sudo umount "$crash_mount"
          crash_mounted=0
          sudo losetup -d "$crash_loopdev"
          crash_loopdev=""
          build/infilfs-scrub "$crash_image" | \
            tee "$RUNNER_TEMP/native-crash-recovery-scrub.txt"
          grep -Fq 'Result:              CLEAN' \
            "$RUNNER_TEMP/native-crash-recovery-scrub.txt"

          # Manufacture a structurally valid, higher-generation checkpoint
          # whose declared root points at the checkpoint block itself.  The
          # native mount must reject that graph, select an older good replica,
          # and heal all three checkpoint locations byte-for-byte.
          cp --reflink=auto --sparse=always "$image" "$checkpoint_image"
          python3 - "$checkpoint_image" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          block_size = 4096
          checksum_offset = 220
          checksum_size = 32
          polynomial = 0x42F0E1EBA9EA3693

          with open(path, 'r+b', buffering=0) as image:
              block = bytearray(image.read(block_size))
              generation = struct.unpack_from('<Q', block, 20)[0]
              struct.pack_into('<Q', block, 20, generation + 1)
              struct.pack_into('<Q', block, 68, 0)
              block[checksum_offset:checksum_offset + checksum_size] = bytes(checksum_size)
              crc = 0
              for byte in block:
                  crc ^= byte << 56
                  for _ in range(8):
                      crc = ((crc << 1) ^ polynomial) & 0xffffffffffffffff \
                          if crc & (1 << 63) else (crc << 1) & 0xffffffffffffffff
              struct.pack_into('<Q', block, checksum_offset, crc)
              image.seek(0)
              image.write(block)
              image.flush()
          PY
          mkdir -p "$checkpoint_mount"
          checkpoint_loopdev="$(sudo losetup --find --show "$checkpoint_image")"
          sudo mount -t infiltratorfs -o rw "$checkpoint_loopdev" "$checkpoint_mount"
          checkpoint_mounted=1
          test "$(cat "$checkpoint_mount/native-rw/created.txt")" = 'rewritte'
          sudo umount "$checkpoint_mount"
          checkpoint_mounted=0
          sudo losetup -d "$checkpoint_loopdev"
          checkpoint_loopdev=""
          python3 - "$checkpoint_image" <<'PY'
          import os
          import struct
          import sys

          path = sys.argv[1]
          block_size = 4096
          total_blocks = os.path.getsize(path) // block_size
          locations = (0, total_blocks // 2, total_blocks - 1)
          with open(path, 'rb') as image:
              checkpoints = []
              for location in locations:
                  image.seek(location * block_size)
                  checkpoints.append(image.read(block_size))
          assert checkpoints[0] == checkpoints[1] == checkpoints[2]
          assert struct.unpack_from('<Q', checkpoints[0], 68)[0] != 0
          PY
          build/infilfs-scrub "$checkpoint_image" | \
            tee "$RUNNER_TEMP/native-checkpoint-recovery-scrub.txt"
          grep -Fq 'Result:              CLEAN' \
            "$RUNNER_TEMP/native-checkpoint-recovery-scrub.txt"

          # A higher candidate can pass checkpoint/root validation while one
          # non-root index leaf is marked free.  Candidate selection must walk
          # the complete tree, fall back, and heal before exposing a RW mount.
          python3 tests/native-checkpoint-free-child.py "$checkpoint_image"
          checkpoint_loopdev="$(sudo losetup --find --show "$checkpoint_image")"
          sudo mount -t infiltratorfs -o rw "$checkpoint_loopdev" "$checkpoint_mount"
          checkpoint_mounted=1
          test "$(cat "$checkpoint_mount/native-rw/created.txt")" = 'rewritte'
          sudo umount "$checkpoint_mount"
          checkpoint_mounted=0
          sudo losetup -d "$checkpoint_loopdev"
          checkpoint_loopdev=""
          python3 - "$checkpoint_image" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          block_size = 4096
          total_blocks = os.path.getsize(path) // block_size
          locations = (0, total_blocks // 2, total_blocks - 1)
          with open(path, 'rb') as image:
              checkpoints = []
              for location in locations:
                  image.seek(location * block_size)
                  checkpoints.append(image.read(block_size))
          assert checkpoints[0] == checkpoints[1] == checkpoints[2]
          PY
          build/infilfs-scrub "$checkpoint_image" | \
            tee "$RUNNER_TEMP/native-deep-checkpoint-recovery-scrub.txt"
          grep -Fq 'Result:              CLEAN' \
            "$RUNNER_TEMP/native-deep-checkpoint-recovery-scrub.txt"

          # All three checkpoints can agree while a deeper checksummed metadata
          # graph is still malicious. Manufacture a heavily aliased directory
          # DAG that used to make full native tree walkers revisit the same
          # blocks millions of times. The mount must fail quickly with
          # corruption rather than wedge the kernel.
          cp --reflink=auto --sparse=always "$image" "$cycle_image"
          python3 tests/native-tree-alias-corruption.py "$cycle_image"
          mkdir -p "$cycle_mount"
          cycle_loopdev="$(sudo losetup --find --show "$cycle_image")"
          set +e
          timeout --signal=TERM --kill-after=5s 10s \
            sudo mount -t infiltratorfs -o ro "$cycle_loopdev" "$cycle_mount"
          cycle_rc=$?
          set -e
          if [[ "$cycle_rc" -eq 0 ]]; then
            cycle_mounted=1
            echo 'Aliased directory metadata unexpectedly mounted successfully.' >&2
            diagnostics
            exit 1
          fi
          if [[ "$cycle_rc" -eq 124 || "$cycle_rc" -eq 137 ]]; then
            echo 'Aliased directory metadata caused the native mount to hang.' >&2
            diagnostics
            exit 1
          fi
          sudo losetup -d "$cycle_loopdev"
          cycle_loopdev=""

          printf 'Remounting read-only for final byte comparison...\n'
          sudo mount -t infiltratorfs -o ro "$loopdev" "$mountpoint"
          mounted=1
          test "$(cat "$mountpoint/native-rw/created.txt")" = 'rewritte'
          test "$(stat -c '%a' "$mountpoint/native-rw/post-unlink.txt")" = 0
          test "$(cat "$mountpoint/docs/inline.txt")" = 'native-snapshot-live-edit'
          cmp "$extent_src" "$mountpoint/docs/extent-moved.bin"
          test ! -e "$mountpoint/docs/extent.bin"
          test ! -e "$mountpoint/current"
          if ! python3 - "$mountpoint/user-owned/file.txt" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          assert os.getxattr(path, b'user.infiltratorfs-ci') == b'replaced'
          assert 'user.infiltratorfs-ci' in os.listxattr(path)
          assert os.getxattr(os.path.dirname(path), b'user.infiltratorfs-dir') == b'directory'
          PY
          then
            diagnostics
            exit 1
          fi
          sudo python3 - "$mountpoint/user-owned/file.txt" <<'PY'
          import os
          import sys
          path = sys.argv[1]
          assert os.getxattr(path, b'trusted.infiltratorfs-ci') == b'trusted'
          assert 'trusted.infiltratorfs-ci' in os.listxattr(path)
          PY
          test "$(stat -c '%b' "$mountpoint/native-rw/allocation-persist")" -eq 8
          test "$(stat -c '%b' "$mountpoint/native-rw/allocation-link")" -eq 8
          test "$(find "$mountpoint/native-rw/tree-persist" -mindepth 1 \
              -maxdepth 1 -type f | wc -l)" -eq 180
          test "$(sudo sha256sum               "$mountpoint/native-rw/allocator-stress/proof.bin" | awk '{print $1}')" =               "$allocator_stress_sha"
          test -p "$mountpoint/native-rw/native.fifo"
          test -S "$mountpoint/native-rw/native.socket"
          test -c "$mountpoint/native-rw/native.char"
          test -b "$mountpoint/native-rw/native.block"
          test "$(stat -c '%t:%T' "$mountpoint/native-rw/native.char")" = '1:3'
          test "$(stat -c '%t:%T' "$mountpoint/native-rw/native.block")" = '7:0'
          sudo python3 - "$mountpoint/native-rw/mmap.bin" <<'PY'
          import hashlib
          import mmap
          import sys

          path = sys.argv[1]
          expected = bytearray((i * 61 + 17) & 0xff for i in range(8 * 1024 * 1024))
          for offset, payload in (
              (123, b'mmap-first-page'),
              (3 * 1024 * 1024 + 211, b'mmap-middle-page'),
              (len(expected) - 32, b'mmap-final-page'),
          ):
              expected[offset:offset + len(payload)] = payload
          with open(path, 'rb') as stream:
              with mmap.mmap(stream.fileno(), 0, access=mmap.ACCESS_READ) as mapped:
                  assert hashlib.sha256(mapped).digest() == hashlib.sha256(expected).digest()
          PY

          # Unmount invalidates the checksum cache.  Time a second hash after a
          # fresh read-only mount to prove the fix does not depend on the writer
          # having pre-populated the cache.
          remount_read_start="$(date +%s%N)"
          if ! remounted_sha="$(sudo timeout --signal=TERM --kill-after=10s 90s \
              sha256sum "$mountpoint/native-rw/large.bin" | awk '{print $1}')"; then
            diagnostics
            exit 1
          fi
          remount_read_end="$(date +%s%N)"
          test "$remounted_sha" = "$large_source_sha"
          cmp "$compressed_truncate_expected"               "$mountpoint/native-rw/compressed-truncate.bin"
          cmp "$compressed_punch_expected"               "$mountpoint/native-rw/compressed-punch.bin"
          sudo python3 - "$mountpoint/native-rw/fsync-publications.bin" <<'PY'
          import os
          import sys

          with open(sys.argv[1], 'rb') as stream:
              data = stream.read()
          assert len(data) == 200 * 4096
          for iteration in range(200):
              expected = bytes(((iteration * 23 + i * 7 + 3) & 0xff)
                               for i in range(4096))
              offset = iteration * 4096
              assert data[offset:offset + 4096] == expected
          PY
          python3 - "$remount_read_start" "$remount_read_end" <<'PY'
          import sys
          elapsed = (int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000
          mib = 512.0
          print(f"Native 512 MiB cold-cursor remount read: {elapsed:.3f} s ({mib/elapsed:.2f} MiB/s)")
          PY
          test "$(stat -c '%u:%g' "$mountpoint/user-owned/file.txt")" = "$(id -u):$(id -g)"
          test "$(stat -c '%a' "$mountpoint/user-owned/file.txt")" = 640
          test "$(stat -c '%Y' "$mountpoint/user-owned/file.txt")" = 1767323045
          printf 'Native kernel RW snapshot/xattr/special-node/mmap/'
          printf 'extent/remount/scrub qualification passed on %s\n' "$(uname -r)"

      - name: Native media-aware rotational/non-rotational placement
        if: steps.headers.outputs.runtime_kdir != ''
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          bash tests/native-media-placement-policy.sh .
          bash -n tests/native-media-placement-qualification.sh
          bash tests/native-media-placement-qualification.sh build kernel/infiltratorfs.ko

      - name: Native fragmentation metrics and online defragmentation
        if: steps.headers.outputs.runtime_kdir != ''
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y attr
          bash tests/native-defrag-policy.sh .
          bash -n tests/native-defrag-qualification.sh
          bash tests/native-defrag-qualification.sh build kernel/infiltratorfs.ko

      - name: Report runtime mount test availability
        if: steps.headers.outputs.runtime_kdir == ''
        run: echo 'Native module compiled successfully; runtime load/mount skipped because matching hosted-runner kernel headers were unavailable.'
  local-kernel-compile:
    # This is intentionally an opt-in check for Shannon's exact local kernel.
    # Normal push/release qualification must not depend on a home runner.
    if: github.event_name == 'workflow_dispatch'
    name: Local running-kernel compile qualification
    concurrency:
      group: native-kernel-local-${{ github.ref }}
      cancel-in-progress: true
    runs-on: linux-native
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Resolve local running-kernel headers
        id: local_headers
        shell: bash
        run: |
          set -euo pipefail
          kdir="/lib/modules/$(uname -r)/build"
          test -f "$kdir/Makefile"
          printf 'kdir=%s\n' "$kdir" >> "$GITHUB_OUTPUT"
          printf 'Compiling against local running kernel %s\n' "$(uname -r)"
      - name: Guard native allocation and transaction policies
        run: |
          bash tests/native-free-extent-index-policy.sh .
          bash tests/native-workload-placement-policy.sh .
          bash tests/native-media-placement-policy.sh .
          bash tests/allocation-tree-format-policy.sh .
          bash tests/native-transaction-durability-policy.sh .
      - name: Compile module for local running kernel
        env:
          KDIR: ${{ steps.local_headers.outputs.kdir }}
        run: |
          make -C kernel clean KDIR="$KDIR"
          make -C kernel KDIR="$KDIR"
          test -s kernel/infiltratorfs.ko
          if command -v modinfo >/dev/null 2>&1; then
            test "$(modinfo -F name kernel/infiltratorfs.ko)" = infiltratorfs
            test "$(modinfo -F license kernel/infiltratorfs.ko)" = GPL
            test "$(modinfo -F vermagic kernel/infiltratorfs.ko | awk '{print $1}')" = "$(uname -r)"
          fi
      - name: Do not load the experimental module on the workstation
        run: echo 'Local qualification is compile-only; load/mount coverage remains on the isolated hosted runner.'
