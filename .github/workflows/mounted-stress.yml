# SPDX-License-Identifier: GPL-3.0-or-later
name: Mounted Hyper-V stress

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mounted-stress:
    name: Exact mounted stress regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install FUSE dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Isolate classic-to-paged random overwrite
        run: bash tests/fuse-paged-random-minimal.sh build
      - name: Reproduce installed Hyper-V workload
        run: bash tests/hyperv-mounted-stress.sh build
