name: Metadata and compression quick wins

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metadata-compression-quickwins-once.yml

permissions:
  contents: write

jobs:
  qualify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply five low-risk metadata/compression improvements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Development version after the immutable v0.18.41 release.
          replace_once(
              'CMakeLists.txt',
              'project(InfiltratorFS VERSION 0.18.41 LANGUAGES C)\n# Development qualification anchor: 0.18.41',
              'project(InfiltratorFS VERSION 0.18.42 LANGUAGES C)\n# Development qualification anchor: 0.18.42')
          replace_once(
              'README.md',
              '**Current source version:** 0.18.41 (Format 0.18)<br>\n-->\n**Current source:** 0.18.41  \n**On-disk format:** 0.18  \n**Latest published release:** v0.18.39',
              '**Current source version:** 0.18.42 (Format 0.18)<br>\n-->\n**Current source:** 0.18.42  \n**On-disk format:** 0.18  \n**Latest published release:** v0.18.41')

          # 1+2: Linux xattr correctness and canonical bounds hardening.
          replace_once(
              'kernel/infiltratorfs_linux_meta.inc',
              '''        if (value_length >\n            size - offset - sizeof(*record) - name_length)\n            return -EFSCORRUPTED;\n        record_size = sizeof(*record) + name_length + value_length;''',
              '''        if (value_length >\n            size - offset - sizeof(*record) - name_length)\n            return -EFSCORRUPTED;\n        if (name_length > XATTR_NAME_MAX ||\n            value_length > XATTR_SIZE_MAX ||\n            memchr(blob + offset + sizeof(*record), '\\0', name_length))\n            return -EFSCORRUPTED;\n        record_size = sizeof(*record) + name_length + value_length;''')
          replace_once(
              'kernel/infiltratorfs_linux_meta.inc',
              '''    prefix = strlen(handler->prefix);\n    suffix = strnlen(name, U16_MAX);\n    if (!suffix || suffix >= U16_MAX ||\n        prefix >= U16_MAX || suffix > U16_MAX - prefix)\n        return -EINVAL;''',
              '''    prefix = strlen(handler->prefix);\n    suffix = strnlen(name, XATTR_NAME_MAX + 1u);\n    if (!suffix)\n        return -EINVAL;\n    if (prefix > XATTR_NAME_MAX || suffix > XATTR_NAME_MAX ||\n        suffix > XATTR_NAME_MAX - prefix)\n        return -ERANGE;''')
          replace_once(
              'kernel/infiltratorfs_linux_meta.inc',
              '''    if (value_size > U32_MAX) {\n        kfree(full);\n        return -E2BIG;\n    }''',
              '''    if (value_size > XATTR_SIZE_MAX || value_size > U32_MAX) {\n        kfree(full);\n        return -E2BIG;\n    }''')
          replace_once(
              'kernel/infiltratorfs_linux_meta.inc',
              '''    if (!ret) {\n        struct iattr attr;\n        memset(&attr, 0, sizeof(attr));\n        attr.ia_valid = ATTR_CTIME;\n        attr.ia_ctime = current_time(inode);\n        ret = infilfs_posix_rewrite_inode(inode, &attr);\n        if (!ret)\n            inode_set_ctime_to_ts(inode, attr.ia_ctime);\n    }\n    return ret;''',
              '''    if (!ret) {\n        struct iattr attr;\n        int ctime_ret;\n\n        memset(&attr, 0, sizeof(attr));\n        attr.ia_valid = ATTR_CTIME;\n        attr.ia_ctime = current_time(inode);\n        ctime_ret = infilfs_posix_rewrite_inode(inode, &attr);\n        if (!ctime_ret)\n            inode_set_ctime_to_ts(inode, attr.ia_ctime);\n        else\n            pr_warn_ratelimited(\n                "InfiltratorFS: xattr committed but ctime persistence failed for inode %lu: %d\\n",\n                inode->i_ino, ctime_ret);\n    }\n    return ret;''')

          # 3+4: adaptive compression gets a real physical-savings floor.
          replace_once(
              'include/infilfs/iac1.h',
              '#define INFS_IAC1_WINDOW_MAX 65535u\n',
              '''#define INFS_IAC1_WINDOW_MAX 65535u\n#define INFS_IAC1_MIN_SAVINGS_DIVISOR 16u\n\n/* Require at least 1/16 of the logical filesystem blocks to be saved.\n * For clusters up to 16 blocks this is the historical one-block minimum;\n * larger clusters must earn proportionally more space before paying the\n * ongoing decode cost. This is a write policy only, never stream metadata. */\nstatic inline int infs_iac1_savings_worthwhile(\n    infs_iac1_size logical_blocks, infs_iac1_size stored_blocks)\n{\n    infs_iac1_size required;\n\n    if (!logical_blocks || !stored_blocks || stored_blocks >= logical_blocks)\n        return 0;\n    required = logical_blocks / INFS_IAC1_MIN_SAVINGS_DIVISOR +\n        ((logical_blocks % INFS_IAC1_MIN_SAVINGS_DIVISOR) != 0);\n    return logical_blocks - stored_blocks >= required;\n}\n''')

          # 5: avoid the second codec-sized candidate buffer when the selected
          # predictor is identity; preserve identical output/format semantics.
          replace_once(
              'src/volume/compression.inc',
              '''    struct infs_iac1_scratch *scratch = NULL;\n    size_t compressed_bytes = 0;''',
              '''    struct infs_iac1_scratch *scratch = NULL;\n    uint8_t predictor_mode = INFS_IAC1_MODE_IDENTITY;\n    size_t compressed_bytes = 0;''')
          replace_once(
              'src/volume/compression.inc',
              '''        bound = infs_iac1_bound(plain_bytes);\n        compressed = malloc(bound);\n        candidate = malloc(bound);\n        scratch = malloc(sizeof(*scratch));\n        if (!compressed || !candidate || !scratch) {''',
              '''        bound = infs_iac1_bound(plain_bytes);\n        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);\n        compressed = malloc(bound);\n        if (predictor_mode != INFS_IAC1_MODE_IDENTITY)\n            candidate = malloc(bound);\n        scratch = malloc(sizeof(*scratch));\n        if (!compressed || !scratch ||\n            (predictor_mode != INFS_IAC1_MODE_IDENTITY && !candidate)) {''')
          replace_once(
              'src/volume/compression.inc',
              '''            plain, plain_bytes, compressed, bound,\n            candidate, bound, scratch);''',
              '''            plain, plain_bytes, compressed, bound,\n            candidate, candidate ? bound : 0u, scratch);''')
          replace_once(
              'src/volume/compression.inc',
              '''            if (stored_blocks >= logical_blocks)\n                stored_blocks = 0;''',
              '''            if (!infs_iac1_savings_worthwhile(\n                    logical_blocks, stored_blocks))\n                stored_blocks = 0;''')

          replace_once(
              'kernel/infiltratorfs_rw_data.inc',
              '''    struct infs_iac1_scratch *scratch = NULL;\n    size_t compressed_bytes = 0;\n    u32 stored_blocks = 0;''',
              '''    struct infs_iac1_scratch *scratch = NULL;\n    u8 predictor_mode = INFS_IAC1_MODE_IDENTITY;\n    size_t compressed_bytes = 0;\n    u32 stored_blocks = 0;''')
          replace_once(
              'kernel/infiltratorfs_rw_data.inc',
              '''        logical_blocks <= INFILFS_COMPRESSION_CLUSTER_BLOCKS &&\n        (le64_to_cpu(pending->tx.next_sb.incompat_flags) &''',
              '''        logical_blocks <= INFILFS_COMPRESSION_CLUSTER_BLOCKS &&\n        pending->tx.sbi->compression_enabled &&\n        (le64_to_cpu(pending->tx.next_sb.incompat_flags) &''')
          replace_once(
              'kernel/infiltratorfs_rw_data.inc',
              '''        bound = infs_iac1_bound(plain_bytes);\n        compressed = kvmalloc(bound, GFP_NOFS);\n        candidate = kvmalloc(bound, GFP_NOFS);''',
              '''        bound = infs_iac1_bound(plain_bytes);\n        predictor_mode = infs_iac1_predictor_mode(plain, plain_bytes);\n        compressed = kvmalloc(bound, GFP_NOFS);\n        if (predictor_mode != INFS_IAC1_MODE_IDENTITY)\n            candidate = kvmalloc(bound, GFP_NOFS);''')
          replace_once(
              'kernel/infiltratorfs_rw_data.inc',
              '''        if (!compressed || !candidate || !scratch) {''',
              '''        if (!compressed || !scratch ||\n            (predictor_mode != INFS_IAC1_MODE_IDENTITY && !candidate)) {''')
          replace_once(
              'kernel/infiltratorfs_rw_data.inc',
              '''            plain, plain_bytes, compressed, bound,\n            candidate, bound, scratch);''',
              '''            plain, plain_bytes, compressed, bound,\n            candidate, candidate ? bound : 0u, scratch);''')
          replace_once(
              'kernel/infiltratorfs_rw_data.inc',
              '''            if (stored_blocks >= logical_blocks)\n                stored_blocks = 0;''',
              '''            if (!infs_iac1_savings_worthwhile(\n                    logical_blocks, stored_blocks))\n                stored_blocks = 0;''')

          # 3: native mount policy lets a root-install/debug mount stop creating
          # new compressed extents while retaining full read support.
          replace_once(
              'kernel/infiltratorfs_internal.h',
              '''enum infilfs_media_override {\n    INFILFS_MEDIA_OVERRIDE_AUTO = 0,\n    INFILFS_MEDIA_OVERRIDE_BALANCED,\n    INFILFS_MEDIA_OVERRIDE_ROTATIONAL,\n    INFILFS_MEDIA_OVERRIDE_NONROTATIONAL,\n};\n\nstruct infilfs_fs_context {\n    enum infilfs_media_override media_override;\n};''',
              '''enum infilfs_media_override {\n    INFILFS_MEDIA_OVERRIDE_AUTO = 0,\n    INFILFS_MEDIA_OVERRIDE_BALANCED,\n    INFILFS_MEDIA_OVERRIDE_ROTATIONAL,\n    INFILFS_MEDIA_OVERRIDE_NONROTATIONAL,\n};\n\nenum infilfs_compression_mode {\n    INFILFS_COMPRESSION_MODE_AUTO = 0,\n    INFILFS_COMPRESSION_MODE_OFF,\n};\n\nstruct infilfs_fs_context {\n    enum infilfs_media_override media_override;\n    enum infilfs_compression_mode compression_mode;\n};''')
          replace_once(
              'kernel/infiltratorfs_internal.h',
              '''    enum infilfs_media_profile media_profile;\n    bool media_profile_overridden;\n    bool rw_enabled;''',
              '''    enum infilfs_media_profile media_profile;\n    bool media_profile_overridden;\n    bool compression_enabled;\n    bool rw_enabled;''')

          replace_once(
              'kernel/infiltratorfs_core.c',
              '''    if (sbi)\n        seq_printf(seq, ",media=%s", infilfs_media_profile_name(\n            sbi->media_profile));\n    return 0;''',
              '''    if (sbi) {\n        seq_printf(seq, ",media=%s", infilfs_media_profile_name(\n            sbi->media_profile));\n        seq_printf(seq, ",compress=%s",\n                   sbi->compression_enabled ? "auto" : "off");\n    }\n    return 0;''')
          replace_once(
              'kernel/infiltratorfs_core.c',
              '''enum {\n    Opt_media,\n};''',
              '''enum {\n    Opt_media,\n    Opt_compress,\n};''')
          replace_once(
              'kernel/infiltratorfs_core.c',
              '''static const struct fs_parameter_spec infilfs_fs_parameters[] = {\n    fsparam_enum("media", Opt_media, infilfs_media_param_values),\n    {}\n};''',
              '''static const struct constant_table infilfs_compression_param_values[] = {\n    { "auto", INFILFS_COMPRESSION_MODE_AUTO },\n    { "off", INFILFS_COMPRESSION_MODE_OFF },\n    {}\n};\n\nstatic const struct fs_parameter_spec infilfs_fs_parameters[] = {\n    fsparam_enum("media", Opt_media, infilfs_media_param_values),\n    fsparam_enum("compress", Opt_compress, infilfs_compression_param_values),\n    {}\n};''')
          replace_once(
              'kernel/infiltratorfs_core.c',
              '''    case Opt_media:\n        ctx->media_override =\n            (enum infilfs_media_override)result.uint_32;\n        return 0;\n    default:''',
              '''    case Opt_media:\n        ctx->media_override =\n            (enum infilfs_media_override)result.uint_32;\n        return 0;\n    case Opt_compress:\n        ctx->compression_mode =\n            (enum infilfs_compression_mode)result.uint_32;\n        return 0;\n    default:''')
          replace_once(
              'kernel/infiltratorfs_core.c',
              '''    ctx->media_override = INFILFS_MEDIA_OVERRIDE_AUTO;\n    fc->fs_private = ctx;''',
              '''    ctx->media_override = INFILFS_MEDIA_OVERRIDE_AUTO;\n    ctx->compression_mode = INFILFS_COMPRESSION_MODE_AUTO;\n    fc->fs_private = ctx;''')
          replace_once(
              'kernel/infiltratorfs_core.c',
              '''    sbi->device_blocks = bytes >> INFILFS_DISK_BLOCK_SHIFT;\n    ret = infilfs_resolve_media_profile(sb, ctx, sbi);''',
              '''    sbi->device_blocks = bytes >> INFILFS_DISK_BLOCK_SHIFT;\n    sbi->compression_enabled =\n        !ctx || ctx->compression_mode != INFILFS_COMPRESSION_MODE_OFF;\n    ret = infilfs_resolve_media_profile(sb, ctx, sbi);''')
          replace_once(
              'kernel/infiltratorfs_core.c',
              '''    pr_info("InfiltratorFS: native %s mount Format %u.%u generation %llu media=%s media_source=%s\\n",\n            sb_rdonly(sb) ? "read-only" : "read-write",\n            INFILFS_FORMAT_MAJOR, INFILFS_FORMAT_MINOR,\n            (unsigned long long)le64_to_cpu(sbi->disk.generation),\n            infilfs_media_profile_name(sbi->media_profile),\n            sbi->media_profile_overridden ? "override" : "auto");''',
              '''    pr_info("InfiltratorFS: native %s mount Format %u.%u generation %llu media=%s media_source=%s compress=%s\\n",\n            sb_rdonly(sb) ? "read-only" : "read-write",\n            INFILFS_FORMAT_MAJOR, INFILFS_FORMAT_MINOR,\n            (unsigned long long)le64_to_cpu(sbi->disk.generation),\n            infilfs_media_profile_name(sbi->media_profile),\n            sbi->media_profile_overridden ? "override" : "auto",\n            sbi->compression_enabled ? "auto" : "off");''')

          replace_once(
              'tests/compression-codec.c',
              '''    expect(source && compressed && candidate && decoded && again &&\n               scratch && scratch2,\n           "allocate codec buffers");\n\n    memset(source, 0, TEST_BYTES);''',
              '''    expect(source && compressed && candidate && decoded && again &&\n               scratch && scratch2,\n           "allocate codec buffers");\n    expect(infs_iac1_savings_worthwhile(16u, 15u),\n           "one-block saving accepted for 16-block cluster");\n    expect(!infs_iac1_savings_worthwhile(64u, 61u),\n           "shallow saving rejected for 64-block cluster");\n    expect(infs_iac1_savings_worthwhile(64u, 60u),\n           "one-sixteenth saving accepted for 64-block cluster");\n\n    memset(source, 0, TEST_BYTES);''')

          replace_once(
              'docs/COMPRESSION.md',
              '''The compressed representation is selected only when it consumes fewer\nfilesystem blocks. Otherwise the data is stored normally.''',
              '''The compressed representation is selected only when it saves at least\none-sixteenth (6.25 percent) of the logical filesystem blocks in the bounded\ncluster. Clusters up to 16 blocks retain the historical one-block minimum.\nOtherwise the data is stored normally, avoiding decode cost for marginal wins.''')
          replace_once(
              'docs/COMPRESSION.md',
              '''Linux mounted writes apply compression to eligible sequential EOF clusters.\nPortable-core writes use the same IAC1 format and selection rules. Persistent\ndecoding never depends on the volatile workload classifier or media-placement\npolicy.''',
              '''Linux mounted writes apply compression to eligible sequential EOF clusters.\nThe native mount option `compress=auto` is the default; `compress=off` stops\ncreating new compressed extents while retaining full decode support for existing\nones. Portable-core writes use the same IAC1 format and savings rules. Persistent\ndecoding never depends on the volatile workload classifier, mount compression\npolicy or media-placement policy.''')

          # Static sanity: only the intended development version changed.
          if 'INFS_FORMAT_MINOR 18u' not in Path('include/infilfs/format.h').read_text():
              raise SystemExit('Format changed unexpectedly')
          PY

      - name: Check patch hygiene
        run: |
          git diff --check
          git diff --stat
          grep -F 'project(InfiltratorFS VERSION 0.18.42' CMakeLists.txt
          grep -F 'compress=off' docs/COMPRESSION.md
          grep -F 'infs_iac1_savings_worthwhile' include/infilfs/iac1.h
          grep -F 'xattr committed but ctime persistence failed' kernel/infiltratorfs_linux_meta.inc

      - name: Build portable core
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake liblz4-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Build generic native kernel module
        run: |
          sudo apt-get install -y linux-headers-generic
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$KDIR"
          make -C kernel KDIR="$KDIR" -j2

      - name: Commit qualified source changes
        run: |
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add CMakeLists.txt README.md docs/COMPRESSION.md \
            include/infilfs/iac1.h src/volume/compression.inc \
            kernel/infiltratorfs_linux_meta.inc kernel/infiltratorfs_internal.h \
            kernel/infiltratorfs_core.c kernel/infiltratorfs_rw_data.inc \
            tests/compression-codec.c
          git diff --cached --check
          git commit -m "Harden metadata and adaptive compression"
          git push origin HEAD:main
