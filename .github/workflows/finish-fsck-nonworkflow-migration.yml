# SPDX-License-Identifier: GPL-3.0-or-later
name: Finish fsck non-workflow migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-fsck-nonworkflow-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Convert remaining non-workflow callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def r(p): return Path(p).read_text(encoding='utf-8')
          def w(p, s): Path(p).write_text(s, encoding='utf-8')
          def need(s, old, new, label):
              if old not in s: raise SystemExit(f'missing pattern: {label}')
              return s.replace(old, new)

          p='tests/root-boot-qemu.sh'; s=r(p)
          s=need(s,'"$build/infilfs-scrub" ','"$build/fsck.infiltratorfs" --scrub ','root boot scrub')
          w(p,s)

          p='tests/native-complete-qualification.sh'; s=r(p)
          s=need(s,'"$BUILD/infilfs-scrub" ','"$BUILD/fsck.infiltratorfs" --scrub ','native complete scrub')
          w(p,s)

          p='tests/native-partition22-qualification.sh'; s=r(p)
          s=s.replace('command -v infilfs-scrub','command -v fsck.infiltratorfs')
          s=s.replace('infilfs-scrub "$TARGET"','fsck.infiltratorfs --scrub "$TARGET"')
          s=s.replace('fsck wrapper is clean','structural fsck is clean').replace('fsck wrapper failed','structural fsck failed')
          if 'infilfs-scrub' in s: raise SystemExit('partition22 still has retired scrub command')
          w(p,s)

          p='tools/infiltratorfs-manager-helper'; s=r(p)
          old='''    scrub-block)\n        (( $# == 1 )) || fail "scrub-block requires a target"\n        validate_partition "$1"\n        [[ -z "$(findmnt -rn -S "$1")" ]] || fail "unmount the partition before running integrity verification"\n        exec /usr/sbin/fsck.infiltratorfs --scrub "$1"\n        ;;\n'''
          new='''    check-block)\n        (( $# == 1 )) || fail "check-block requires a target"\n        validate_partition "$1"\n        [[ -z "$(findmnt -rn -S "$1")" ]] || fail "unmount the partition before running filesystem checking"\n        exec /usr/sbin/fsck.infiltratorfs "$1"\n        ;;\n    scrub-block)\n        (( $# == 1 )) || fail "scrub-block requires a target"\n        validate_partition "$1"\n        [[ -z "$(findmnt -rn -S "$1")" ]] || fail "unmount the partition before running deep integrity verification"\n        exec /usr/sbin/fsck.infiltratorfs --scrub "$1"\n        ;;\n'''
          s=need(s,old,new,'manager helper')
          w(p,s)

          p='tools/infiltratorfs-manager'; s=r(p)
          s=need(s,'    "scrub": "/usr/bin/infilfs-scrub",','    "fsck": "/usr/sbin/fsck.infiltratorfs",','manager tool map')
          old='''        self.scrub = self._action_row(\n            maintenance,\n            "emblem-ok-symbolic",\n            "Verify integrity",\n            "Run the read-only scrub and integrity checker.",\n            "Verify",\n            self.do_scrub,\n        )\n'''
          new='''        self.check = self._action_row(\n            maintenance,\n            "emblem-ok-symbolic",\n            "Check filesystem",\n            "Run the fast structural consistency check without reading every file payload.",\n            "Check",\n            self.do_check,\n        )\n        self.scrub = self._action_row(\n            maintenance,\n            "system-run-symbolic",\n            "Deep scrub",\n            "Read file payloads, recompute checksums and verify retained generations.",\n            "Scrub",\n            self.do_scrub,\n        )\n'''
          s=need(s,old,new,'manager actions')
          s=need(s,'        for button in (self.inspect, self.scrub, self.forensic):','        for button in (self.inspect, self.check, self.scrub, self.forensic):','manager enable')
          old='''    def tool_command(self, blockop, tool):\n        if not self.target:\n            return None\n        return (\n            ["pkexec", HELPER, blockop, self.target.path]\n            if self.target.block\n            else [tool, self.target.path]\n        )\n'''
          new='''    def tool_command(self, blockop, tool, *tool_args):\n        if not self.target:\n            return None\n        return (\n            ["pkexec", HELPER, blockop, self.target.path]\n            if self.target.block\n            else [tool, *tool_args, self.target.path]\n        )\n'''
          s=need(s,old,new,'manager tool args')
          old='''    def do_scrub(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("scrub-block", TOOLS["scrub"])\n        if command:\n            self.run("Verify filesystem", [command], "Integrity check completed.")\n'''
          new='''    def do_check(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("check-block", TOOLS["fsck"])\n        if command:\n            self.run("Check filesystem", [command], "Structural filesystem check completed.")\n\n    def do_scrub(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("scrub-block", TOOLS["fsck"], "--scrub")\n        if command:\n            self.run("Deep scrub", [command], "Deep integrity scrub completed.")\n'''
          s=need(s,old,new,'manager handlers')
          w(p,s)

          p='README.md'; s=r(p)
          s=need(s,'The standalone `infilfs-scrub` command remains available for forensic, qualification and deliberate deep-integrity work.','There is no separate scrub executable: deep verification is intentionally a secondary mode of `fsck.infiltratorfs`.','README contract')
          s=s.replace('inspection/scrub/forensic tools, `mount.infiltratorfs`, `fsck.infiltratorfs`','inspection/forensic tools, the unified `fsck.infiltratorfs` checker with optional `--scrub`, `mount.infiltratorfs`')
          w(p,s)

          for p in ('docs/FORENSICS.md','docs/ON_DISK_FORMAT.md'):
              s=r(p); s=need(s,'`infilfs-scrub`','`fsck.infiltratorfs --scrub`',p); w(p,s)
          PY
          python3 -m py_compile tools/infiltratorfs-manager
          bash -n tools/infiltratorfs-manager-helper tests/root-boot-qemu.sh tests/native-complete-qualification.sh tests/native-partition22-qualification.sh
          git diff --check
      - name: Commit converted callers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add README.md docs/FORENSICS.md docs/ON_DISK_FORMAT.md \
                  tools/infiltratorfs-manager tools/infiltratorfs-manager-helper \
                  tests/root-boot-qemu.sh tests/native-complete-qualification.sh \
                  tests/native-partition22-qualification.sh
          git commit -m 'Finish fsck scrub command consolidation'
          git push origin HEAD:main
