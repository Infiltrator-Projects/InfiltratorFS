name: Stage InfiltratorFS 0.18.48 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-0.18.48.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare 0.18.48 release commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'CMakeLists.txt': [
                  ('project(InfiltratorFS VERSION 0.18.47 LANGUAGES C)',
                   'project(InfiltratorFS VERSION 0.18.48 LANGUAGES C)'),
                  ('# Development qualification anchor: 0.18.47',
                   '# Development qualification anchor: 0.18.48'),
              ],
              'README.md': [
                  ('**Current source version:** 0.18.47 (Format 0.18)<br>',
                   '**Current source version:** 0.18.48 (Format 0.18)<br>'),
                  ('**Current source:** 0.18.47<br>',
                   '**Current source:** 0.18.48<br>'),
                  ('**Latest published release:** v0.18.47<br>',
                   '**Latest published release:** v0.18.48<br>'),
              ],
              'tests/root-boot-qemu.sh': [
                  ('0.18.47', '0.18.48'),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{name}: expected release string not found: {old}')
                  text = text.replace(old, new)
              path.write_text(text)

          Path('.github/release-trigger').write_text(
              '0.18.48\nqualification=51e6ce68caa1163beb397245124b8ad015a0f8df\n'
          )
          PY

          git diff --check
          grep -Fq 'project(InfiltratorFS VERSION 0.18.48 LANGUAGES C)' CMakeLists.txt
          grep -Fq '**Current source:** 0.18.48<br>' README.md
          grep -Fq '**Latest published release:** v0.18.48<br>' README.md
          grep -Fq '0.18.48+native1' tests/root-boot-qemu.sh
          test "$(head -n1 .github/release-trigger)" = '0.18.48'

      - name: Commit release directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add CMakeLists.txt README.md tests/root-boot-qemu.sh .github/release-trigger
          git commit -m 'Release 0.18.48'
          git push origin HEAD:main
