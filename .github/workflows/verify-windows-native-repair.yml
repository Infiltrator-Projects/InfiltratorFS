# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify repaired native Windows driver

on:
  push:
    branches:
      - fix/windows-native-build-0.18.94

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/windows-native-build-0.18.94
      - name: Configure x64 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Restore and build native filesystem driver
        shell: pwsh
        run: |
          $project = '.\windows-driver\infiltratorfs-native.vcxproj'
          msbuild $project /restore /t:Restore /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "WDK NuGet restore failed with exit code $LASTEXITCODE" }

          $wdkRoot = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windows.wdk.x64'
          $stampInf = Get-ChildItem $wdkRoot -Recurse -Filter stampinf.exe -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$stampInf) { throw "Official WDK NuGet restore did not provide stampinf.exe under $wdkRoot" }
          $env:PATH = "$($stampInf.Directory.FullName);$env:PATH"

          msbuild $project /t:Build /m /p:Configuration=Release /p:Platform=x64 /p:RestoreIgnoreFailedSources=true
          if ($LASTEXITCODE -ne 0) { throw "Native Windows filesystem driver build failed with exit code $LASTEXITCODE" }

          if (!(Test-Path .\windows-driver\x64\Release\infiltratorfs-native.sys) -and
              !(Test-Path .\windows-driver\Release\infiltratorfs-native.sys)) {
            throw 'Native Windows filesystem driver binary was not produced.'
          }
