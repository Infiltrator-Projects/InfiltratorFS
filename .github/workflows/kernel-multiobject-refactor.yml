# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot kernel multi-object refactor

on:
  push:
    paths:
      - '.github/workflows/kernel-multiobject-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply deterministic refactor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/kernel-multiobject-refactor.py')
          data = path.read_text()
          old = "Path('.github/workflows/kernel-multiobject-refactor.yml')}"
          new = "Path('.github/workflows/kernel-multiobject-refactor.yml'), Path('tests/native-kernel-maintainability-policy.sh')}"
          assert old in data
          path.write_text(data.replace(old, new, 1))
          PY
          python3 tools/kernel-multiobject-refactor.py
          rm -f tools/kernel-multiobject-refactor.py
          rm -f .github/workflows/kernel-multiobject-refactor.yml
          git diff --check

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic kmod

      - name: Verify maintainability and format policies
        run: |
          set -euo pipefail
          bash tests/native-kernel-maintainability-policy.sh .
          bash tests/allocation-tree-format-policy.sh .
          bash tests/native-parallel-allocation-policy.sh .

      - name: Build composite kernel module
        shell: bash
        run: |
          set -euo pipefail
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n 1)"
          test -f "$KDIR/Makefile"
          make -C kernel KDIR="$KDIR"
          test -s kernel/infiltratorfs.ko
          test "$(modinfo -F name kernel/infiltratorfs.ko)" = infiltratorfs

      - name: Commit qualified refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Kernel: split allocation map into Kbuild object'
          git push origin HEAD:main
