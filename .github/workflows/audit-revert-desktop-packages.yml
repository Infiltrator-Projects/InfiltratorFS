# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply single-package desktop integration migration

on:
  push:
    branches: [fix/remove-obsolete-desktop-replacements]
    paths:
      - .github/workflows/audit-revert-desktop-packages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply and validate migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/migrate-desktop-integration.py')
          lines = p.read_text().splitlines()
          hits = [i for i, line in enumerate(lines) if 'INFILTRATORFS_REQUIRE_OS_INTEGRATION must be 0 or 1.' in line]
          if len(hits) != 1:
              raise SystemExit(f'migration generator correction expected one line, found {len(hits)}')
          lines[hits[0]] = "    '    *) echo \"INFILTRATORFS_REQUIRE_OS_INTEGRATION must be 0 or 1.\" >&2; exit 1 ;;\\nesac\\n'"
          p.write_text('\n'.join(lines) + '\n')
          PY
          python3 -m py_compile tools/migrate-desktop-integration.py
          python3 tools/migrate-desktop-integration.py
          bash -n packaging/build-linux-packages.sh
          bash -n support/installer/bootstrap.sh
          bash -n packaging/infiltratorfs-os-integration
          bash -n packaging/build-noble-desktop-integration.sh
          python3 -m py_compile tests/ci-duration-policy.py
          bash -n tests/desktop-integration.sh
          git diff --check
      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add packaging/build-linux-packages.sh support/installer/bootstrap.sh \
                  tests/desktop-integration.sh tests/ci-duration-policy.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'packaging: return desktop integration to single package'
          git push origin HEAD:fix/remove-obsolete-desktop-replacements
