# SPDX-License-Identifier: GPL-3.0-or-later
name: Baseline 0.18.44 metadata qualifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qualify-release-01844-metadata.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c75cb788735e60ed1b59295d2cdd64f68c51fb4b
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl attr build-essential cmake kmod libcap2-bin linux-headers-$(uname -r) rsync util-linux
      - name: Build 0.18.44
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub infilfs-tool infiltratorfs-quota
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
      - name: 0.18.44 quota ACL remount scrub
        env:
          INFILFS_REQUIRE_SETFACL: '1'
        run: sudo -E bash tests/native-quota-qualification.sh build kernel/infiltratorfs.ko
      - name: 0.18.44 root metadata remount scrub
        run: sudo env RUNNER_TEMP="$RUNNER_TEMP" bash tests/native-root-metadata-qualification.sh build kernel/infiltratorfs.ko
