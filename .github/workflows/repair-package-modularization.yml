name: Repair package modularization manifest

on:
  push:
    paths:
      - '.github/workflows/repair-package-modularization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair package manifests
        run: python3 tools/repair-package-modularization-manifest.py

      - name: Validate package script syntax and paths
        shell: bash
        run: |
          bash -n packaging/build-linux-packages.sh
          grep -Fq 'infiltratorfs_checksum_cache.c$"' packaging/build-linux-packages.sh
          grep -Fq 'usr/src/infiltratorfs-${package_version}/infiltratorfs_rw_data.inc$' packaging/build-linux-packages.sh
          grep -Fq 'kernel/infiltratorfs_checksum_cache.c' packaging/build-linux-packages.sh
          grep -Fq 'kernel/infiltratorfs_rw_data.inc' packaging/build-linux-packages.sh
          ! grep -Fq 'usr/src/infiltratorfs-${package_version}/infiltratorfs_checksum_cache.c infiltratorfs_rw_data.inc$' packaging/build-linux-packages.sh
          ! grep -Fq 'kernel/infiltratorfs_checksum_cache.c infiltratorfs_rw_data.inc' packaging/build-linux-packages.sh

      - name: Commit repaired source manifest to main
        shell: bash
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add packaging/build-linux-packages.sh tools/kernel-checksum-cache-object-refactor.py
          git diff --cached --quiet && { echo 'No package repair changes produced.'; exit 1; }
          git commit -m 'Repair modularized Linux package manifest'
          git push origin HEAD:main
