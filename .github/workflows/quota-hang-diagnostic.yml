# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot native quota hang diagnostic

on:
  push:
    paths:
      - '.github/workflows/quota-hang-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Apply complete quota fixes in worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          quota = Path('kernel/infiltratorfs_quota.inc')
          q = quota.read_text()

          old_capture = '''static int infilfs_quota_capture_inode(
              struct inode *inode, struct infilfs_quota_reservation *reservation)
          {
              struct infilfs_sb_info *sbi = INFILFS_SB(inode->i_sb);
              int ret;

              if (!sbi) {
                  memset(reservation, 0, sizeof(*reservation));
                  return 0;
              }
              mutex_lock(&sbi->quota_lock);
              ret = infilfs_quota_capture_inode_locked(inode, reservation);
              mutex_unlock(&sbi->quota_lock);
              return ret;
          }
          '''
          new_capture = '''static int infilfs_quota_capture_inode(
              struct inode *inode, struct infilfs_quota_reservation *reservation)
          {
              struct infilfs_sb_info *sbi = INFILFS_SB(inode->i_sb);
              struct infilfs_inode_info *ii = INFILFS_I(inode);
              int ret;

              /* Internal SYSTEM sidecars never participate in quota usage. */
              if (!sbi || !ii || (ii->portable_flags & INFILFS_ATTR_SYSTEM)) {
                  memset(reservation, 0, sizeof(*reservation));
                  return 0;
              }
              mutex_lock(&sbi->quota_lock);
              ret = infilfs_quota_capture_inode_locked(inode, reservation);
              mutex_unlock(&sbi->quota_lock);
              return ret;
          }
          '''
          if old_capture not in q:
              raise SystemExit('quota capture source not found')
          q = q.replace(old_capture, new_capture, 1)

          marker = 'static int infilfs_quota_rebuild_usage_locked(struct super_block *sb)\n{\n'
          helper = r'''struct infilfs_quota_alias_scan {
              u8 object_id[16];
              u64 aliases;
          };

          static int infilfs_quota_alias_visitor(
              const struct infilfs_dirent_disk *entry, const u8 *name, void *arg)
          {
              struct infilfs_quota_alias_scan *scan = arg;

              (void)name;
              if (memcmp(entry->object_id, scan->object_id, 16) != 0)
                  return 0;
              if (le16_to_cpu(entry->object_type) != INFILFS_OBJECT_FILE)
                  return -EFSCORRUPTED;
              if (scan->aliases == U64_MAX)
                  return -EOVERFLOW;
              scan->aliases++;
              return 0;
          }

          /*
           * Hard-linked files intentionally have no single parent_id.  Project
           * quota ownership is therefore reconstructed from every directory
           * alias.  Cross-project links are rejected at mutation time; finding
           * disagreeing aliases on disk is corruption and must fail closed.
           */
          static int infilfs_quota_alias_project_from_index_locked(
              struct super_block *sb, const u8 object_id[16], u64 expected_links,
              const struct infilfs_index_entry_disk *entries, u32 count,
              u32 *project_out)
          {
              u64 aliases = 0;
              u32 resolved_project = 0;
              bool have_project = false;
              u32 i;

              *project_out = 0;
              if (!expected_links)
                  return 0;

              for (i = 0; i < count; ++i) {
                  struct infilfs_quota_alias_scan scan = {0};
                  struct infilfs_object_header_disk *header;
                  struct inode *dir;
                  u8 *object;
                  u32 directory_project = 0;
                  u16 type = le16_to_cpu(entries[i].object_type);
                  int ret;

                  if (type != INFILFS_OBJECT_DIRECTORY)
                      continue;
                  object = kmalloc(INFILFS_DISK_BLOCK_SIZE, GFP_NOFS);
                  if (!object)
                      return -ENOMEM;
                  ret = infilfs_read_object(
                      sb, le64_to_cpu(entries[i].object_block), type,
                      entries[i].object_id, object);
                  if (ret) {
                      kfree(object);
                      return ret;
                  }
                  header = (struct infilfs_object_header_disk *)object;
                  dir = infilfs_get_inode(
                      sb, le64_to_cpu(entries[i].object_block), type,
                      entries[i].object_id);
                  if (IS_ERR(dir)) {
                      ret = PTR_ERR(dir);
                      kfree(object);
                      return ret;
                  }
                  memcpy(scan.object_id, object_id, 16);
                  ret = infilfs_for_each_dirent(
                      dir, infilfs_quota_alias_visitor, &scan);
                  iput(dir);
                  if (ret) {
                      kfree(object);
                      return ret;
                  }
                  if (!scan.aliases) {
                      kfree(object);
                      continue;
                  }
                  ret = infilfs_quota_effective_project_locked(
                      sb, header->object_id, header->parent_id,
                      &directory_project);
                  kfree(object);
                  if (ret)
                      return ret;
                  if (have_project && directory_project != resolved_project)
                      return -EFSCORRUPTED;
                  resolved_project = directory_project;
                  have_project = true;
                  if (aliases > U64_MAX - scan.aliases)
                      return -EOVERFLOW;
                  aliases += scan.aliases;
              }

              if (!have_project || aliases != expected_links)
                  return -EFSCORRUPTED;
              *project_out = resolved_project;
              return 0;
          }

          static int infilfs_quota_object_project_from_index_locked(
              struct super_block *sb,
              const struct infilfs_object_header_disk *header,
              const struct infilfs_index_entry_disk *entries, u32 count,
              u32 *project_out)
          {
              if (le16_to_cpu(header->object_type) == INFILFS_OBJECT_FILE) {
                  const struct infilfs_file_payload_disk *file =
                      (const struct infilfs_file_payload_disk *)(header + 1);
                  u64 links = le64_to_cpu(file->attributes.link_count);

                  if (links &&
                      (links > 1u || !memchr_inv(header->parent_id, 0, 16)))
                      return infilfs_quota_alias_project_from_index_locked(
                          sb, header->object_id, links, entries, count,
                          project_out);
              }
              return infilfs_quota_effective_project_locked(
                  sb, header->object_id, header->parent_id, project_out);
          }

          static int infilfs_quota_object_project_locked(
              struct super_block *sb,
              const struct infilfs_object_header_disk *header,
              u32 *project_out)
          {
              struct infilfs_index_entry_disk *entries = NULL;
              u32 count = 0;
              int ret;

              ret = infilfs_ns_index_snapshot(sb, &entries, &count);
              if (!ret)
                  ret = infilfs_quota_object_project_from_index_locked(
                      sb, header, entries, count, project_out);
              kvfree(entries);
              return ret;
          }

          '''
          if marker not in q:
              raise SystemExit('quota rebuild marker not found')
          q = q.replace(marker, helper + marker, 1)

          old_project = '''ret = infilfs_quota_effective_project_locked(
                      sb, header->object_id, header->parent_id, &project);'''
          new_project = '''ret = infilfs_quota_object_project_from_index_locked(
                      sb, header, entries, count, &project);'''
          occurrences = q.count(old_project)
          if occurrences < 2:
              raise SystemExit(f'expected at least two project rebuild calls, found {occurrences}')
          q = q.replace(old_project, new_project)

          old_inode_project = '''ret = infilfs_quota_effective_project_locked(
                      inode->i_sb, ii->object_id, header->parent_id, project_out);'''
          new_inode_project = '''ret = infilfs_quota_object_project_locked(
                      inode->i_sb, header, project_out);'''
          if old_inode_project not in q:
              raise SystemExit('inode project call not found')
          q = q.replace(old_inode_project, new_inode_project, 1)
          quota.write_text(q)

          core = Path('kernel/infiltratorfs_core.c')
          c = core.read_text()
          old_core = '''    if (reclaiming) {
                  released_bytes = (u64)i_size_read(inode);
                  ret = infilfs_quota_capture_inode(inode, &released_quota);
                  if (ret) {
                      pr_err("InfiltratorFS: could not capture quota ownership for inode %lu: %d\\n",
                             inode->i_ino, ret);
                      released_quota.active = false;
                      ret = 0;
                  }
                  ret = infilfs_linux_meta_remove_object(inode->i_sb, ii->object_id);
                  if (ret)
                      pr_err("InfiltratorFS: could not remove Linux metadata for inode %lu: %d\\n",
                             inode->i_ino, ret);
              }
              if (!ret)
                  ret = infilfs_ns_evict_unlinked_file(inode);
              if (!ret && reclaiming)
                  infilfs_quota_apply_release(&released_quota, released_bytes, 1);
          '''
          new_core = '''    if (reclaiming && !(ii->portable_flags & INFILFS_ATTR_SYSTEM)) {
                  released_bytes = (u64)i_size_read(inode);
                  ret = infilfs_quota_capture_inode(inode, &released_quota);
                  if (ret) {
                      pr_err("InfiltratorFS: could not capture quota ownership for inode %lu: %d\\n",
                             inode->i_ino, ret);
                      released_quota.active = false;
                      ret = 0;
                  }
                  ret = infilfs_linux_meta_remove_object(inode->i_sb, ii->object_id);
                  if (ret)
                      pr_err("InfiltratorFS: could not remove Linux metadata for inode %lu: %d\\n",
                             inode->i_ino, ret);
              }
              if (!ret)
                  ret = infilfs_ns_evict_unlinked_file(inode);
              if (!ret && reclaiming && !(ii->portable_flags & INFILFS_ATTR_SYSTEM))
                  infilfs_quota_apply_release(&released_quota, released_bytes, 1);
          '''
          if old_core not in c:
              raise SystemExit('core eviction source not found')
          core.write_text(c.replace(old_core, new_core, 1))

          test = Path('tests/native-quota-qualification.sh')
          t = test.read_text()
          hardlink = '''sudo ln "$mnt/project-a/data.bin" "$mnt/project-a/sub/same-project-link"
          test "$(stat -c '%i' "$mnt/project-a/data.bin")" = \\
               "$(stat -c '%i' "$mnt/project-a/sub/same-project-link")"
          '''
          hardlink_extra = hardlink + '''if append_once "$mnt/project-a/data.bin" $((2 * 1024 * 1024)) \\
                  2>"$work/hardlink-project-edquot"; then
              echo "hard-linked project file escaped byte quota" >&2
              exit 1
          fi
          grep -Eqi 'quota|Disk quota exceeded' "$work/hardlink-project-edquot"
          test "$(stat -c '%s' "$mnt/project-a/data.bin")" -eq $((4 * 1024 * 1024))
          '''
          if hardlink not in t:
              raise SystemExit('hardlink qualification insertion point missing')
          t = t.replace(hardlink, hardlink_extra, 1)
          test.write_text(t)
          PY
          bash tests/native-quota-policy.sh .
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake kmod linux-headers-$(uname -r)
      - name: Build exact running-kernel module and quota tools
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub infiltratorfs-quota
          make -C kernel clean KDIR="/lib/modules/$(uname -r)/build"
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
      - name: Run complete mounted quota qualification
        shell: bash
        run: |
          set -euo pipefail
          bash tests/native-quota-qualification.sh build kernel/infiltratorfs.ko
