# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot native quota hang diagnostic

on:
  push:
    paths:
      - '.github/workflows/quota-hang-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake kmod linux-headers-$(uname -r)
      - name: Build exact running-kernel module and quota tools
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub infiltratorfs-quota
          make -C kernel clean KDIR="/lib/modules/$(uname -r)/build"
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
      - name: Trace full mounted quota qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'QUOTA-DIAG: launching full qualification with shell trace'
          bash -x tests/native-quota-qualification.sh build kernel/infiltratorfs.ko &
          qpid=$!
          for second in $(seq 1 210); do
            if ! kill -0 "$qpid" 2>/dev/null; then
              set +e
              wait "$qpid"
              rc=$?
              set -e
              echo "QUOTA-DIAG: full qualification exited rc=$rc within=${second}s"
              exit "$rc"
            fi
            sleep 1
          done
          echo "QUOTA-DIAG: STUCK full qualification pid=$qpid"
          echo '===== process tree ====='
          ps -eLo pid,ppid,tid,stat,wchan:48,comm,args | grep -E 'native-quota|infiltratorfs-quota|dd|truncate|touch|ln|chown|mkdir|mv|cp|sudo|python3' || true
          echo '===== all blocked tasks ====='
          ps -eLo pid,ppid,tid,stat,wchan:48,comm,args | awk '$4 ~ /^D/ {print}' || true
          echo '===== sysrq blocked-task dump ====='
          sudo sh -c 'echo w > /proc/sysrq-trigger' 2>/dev/null || true
          sudo dmesg --color=never | tail -n 500 || true
          exit 1
