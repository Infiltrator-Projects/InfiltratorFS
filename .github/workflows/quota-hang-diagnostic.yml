# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot native quota hang diagnostic

on:
  push:
    paths:
      - '.github/workflows/quota-hang-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Apply sidecar fixes and accounting diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          quota = Path('kernel/infiltratorfs_quota.inc')
          q = quota.read_text()
          old_q = '''static int infilfs_quota_capture_inode(
              struct inode *inode, struct infilfs_quota_reservation *reservation)
          {
              struct infilfs_sb_info *sbi = INFILFS_SB(inode->i_sb);
              int ret;

              if (!sbi) {
                  memset(reservation, 0, sizeof(*reservation));
                  return 0;
              }
              mutex_lock(&sbi->quota_lock);
              ret = infilfs_quota_capture_inode_locked(inode, reservation);
              mutex_unlock(&sbi->quota_lock);
              return ret;
          }
          '''
          new_q = '''static int infilfs_quota_capture_inode(
              struct inode *inode, struct infilfs_quota_reservation *reservation)
          {
              struct infilfs_sb_info *sbi = INFILFS_SB(inode->i_sb);
              struct infilfs_inode_info *ii = INFILFS_I(inode);
              int ret;

              if (!sbi || !ii || (ii->portable_flags & INFILFS_ATTR_SYSTEM)) {
                  memset(reservation, 0, sizeof(*reservation));
                  return 0;
              }
              mutex_lock(&sbi->quota_lock);
              ret = infilfs_quota_capture_inode_locked(inode, reservation);
              mutex_unlock(&sbi->quota_lock);
              return ret;
          }
          '''
          if old_q not in q:
              raise SystemExit('quota patch source not found')
          quota.write_text(q.replace(old_q, new_q, 1))

          core = Path('kernel/infiltratorfs_core.c')
          c = core.read_text()
          old_c = '''    if (reclaiming) {
                  released_bytes = (u64)i_size_read(inode);
                  ret = infilfs_quota_capture_inode(inode, &released_quota);
                  if (ret) {
                      pr_err("InfiltratorFS: could not capture quota ownership for inode %lu: %d\\n",
                             inode->i_ino, ret);
                      released_quota.active = false;
                      ret = 0;
                  }
                  ret = infilfs_linux_meta_remove_object(inode->i_sb, ii->object_id);
                  if (ret)
                      pr_err("InfiltratorFS: could not remove Linux metadata for inode %lu: %d\\n",
                             inode->i_ino, ret);
              }
              if (!ret)
                  ret = infilfs_ns_evict_unlinked_file(inode);
              if (!ret && reclaiming)
                  infilfs_quota_apply_release(&released_quota, released_bytes, 1);
          '''
          new_c = '''    if (reclaiming && !(ii->portable_flags & INFILFS_ATTR_SYSTEM)) {
                  released_bytes = (u64)i_size_read(inode);
                  ret = infilfs_quota_capture_inode(inode, &released_quota);
                  if (ret) {
                      pr_err("InfiltratorFS: could not capture quota ownership for inode %lu: %d\\n",
                             inode->i_ino, ret);
                      released_quota.active = false;
                      ret = 0;
                  }
                  ret = infilfs_linux_meta_remove_object(inode->i_sb, ii->object_id);
                  if (ret)
                      pr_err("InfiltratorFS: could not remove Linux metadata for inode %lu: %d\\n",
                             inode->i_ino, ret);
              }
              if (!ret)
                  ret = infilfs_ns_evict_unlinked_file(inode);
              if (!ret && reclaiming && !(ii->portable_flags & INFILFS_ATTR_SYSTEM))
                  infilfs_quota_apply_release(&released_quota, released_bytes, 1);
          '''
          if old_c not in c:
              raise SystemExit('core patch source not found')
          core.write_text(c.replace(old_c, new_c, 1))

          test = Path('tests/native-quota-qualification.sh')
          t = test.read_text()
          needle = '''after42="$(field used_bytes "$mnt" project 42)"
          test "$after42" -eq "$before42"
          '''
          replacement = '''after42="$(field used_bytes "$mnt" project 42)"
          before42_objects="$(field used_objects "$mnt" project 42)"
          printf 'QUOTA-DIAG: project42 before_bytes=%s after_bytes=%s after_objects=%s\\n' "$before42" "$after42" "$before42_objects" >&2
          test "$after42" -eq "$before42"
          '''
          if needle not in t:
              raise SystemExit('accounting diagnostic insertion point not found')
          test.write_text(t.replace(needle, replacement, 1))
          PY
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake kmod linux-headers-$(uname -r)
      - name: Build exact running-kernel module and quota tools
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub infiltratorfs-quota
          make -C kernel clean KDIR="/lib/modules/$(uname -r)/build"
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
      - name: Run mounted quota qualification to remount comparison
        shell: bash
        run: |
          set -euo pipefail
          bash tests/native-quota-qualification.sh build kernel/infiltratorfs.ko
