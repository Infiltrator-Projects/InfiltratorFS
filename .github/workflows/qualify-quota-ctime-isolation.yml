# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify internal quota ctime isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qualify-quota-ctime-isolation.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake kmod libcap2-bin \
            linux-headers-$(uname -r) rsync util-linux
      - name: Skip ctime only for the internal quota database
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs_linux_meta.inc')
          s = p.read_text()
          old = '''    if (!ret) {\n        struct iattr attr;\n        int ctime_ret;\n'''
          new = '''    if (!ret &&\n        !(handler && handler->prefix &&\n          strcmp(handler->prefix, XATTR_TRUSTED_PREFIX) == 0 &&\n          strcmp(name, "infiltratorfs.quota-db") == 0)) {\n        struct iattr attr;\n        int ctime_ret;\n'''
          if s.count(old) != 1:
              raise SystemExit('xattr ctime anchor changed')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Build candidate
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target \
            mkfs.infilfs infilfs-scrub infilfs-tool infiltratorfs-quota
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
      - name: Prove quota ACL remount and scrub durability
        env:
          INFILFS_REQUIRE_SETFACL: '1'
        run: |
          sudo -E bash tests/native-quota-qualification.sh \
            build kernel/infiltratorfs.ko
      - name: Prove full Linux root metadata semantics
        run: |
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            bash tests/native-root-metadata-qualification.sh \
              build kernel/infiltratorfs.ko
