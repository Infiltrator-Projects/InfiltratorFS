name: Metadata and compression quick wins rerun

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metadata-compression-quickwins-rerun.yml

permissions:
  contents: write

jobs:
  qualify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse the reviewed patch payload
        run: |
          python3 <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/metadata-compression-quickwins-once.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          lines = src[start:end]
          Path('/tmp/apply-quickwins.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          python3 /tmp/apply-quickwins.py

      - name: Check patch hygiene
        run: |
          # README intentionally uses Markdown hard-break spaces; check every code/doc file except it.
          git diff --check -- . ':!README.md'
          git diff --stat
          grep -F 'project(InfiltratorFS VERSION 0.18.42' CMakeLists.txt
          grep -F 'compress=off' docs/COMPRESSION.md
          grep -F 'infs_iac1_savings_worthwhile' include/infilfs/iac1.h
          grep -F 'xattr committed but ctime persistence failed' kernel/infiltratorfs_linux_meta.inc

      - name: Build portable core
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake liblz4-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Build generic native kernel module
        run: |
          sudo apt-get install -y linux-headers-generic
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$KDIR"
          make -C kernel KDIR="$KDIR" -j2

      - name: Commit qualified source changes
        run: |
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add CMakeLists.txt README.md docs/COMPRESSION.md \
            include/infilfs/iac1.h src/volume/compression.inc \
            kernel/infiltratorfs_linux_meta.inc kernel/infiltratorfs_internal.h \
            kernel/infiltratorfs_core.c kernel/infiltratorfs_rw_data.inc \
            tests/compression-codec.c
          git diff --cached --check -- . ':!README.md'
          git commit -m "Harden metadata and adaptive compression"
          git push origin HEAD:main
