# SPDX-License-Identifier: GPL-3.0-or-later
name: Fix manager mounted maintenance handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-manager-mounted-maintenance.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply manager safety and diagnostics fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/infiltratorfs-manager')
          s = p.read_text()

          old = '''    def enable(self):\n        available = self.target is not None and not self.busy\n        mounted = bool(self.target and self.target.mountpoint)\n        for button in (self.inspect, self.scrub, self.forensic):\n            button.set_sensitive(available)\n        self.format.set_sensitive(available and not mounted)\n        self.mount.set_sensitive(available)\n        self.unmount.set_sensitive(available and mounted)\n        self.mount.set_label("Open in Files" if mounted else "Mount and Open")\n'''
          new = '''    def enable(self):\n        available = self.target is not None and not self.busy\n        mounted = bool(self.target and self.target.mountpoint)\n        maintenance_available = available and not mounted\n        for button in (self.inspect, self.scrub, self.forensic):\n            button.set_sensitive(maintenance_available)\n            button.set_tooltip_text(\n                "Unmount the volume before running offline filesystem maintenance."\n                if available and mounted else None\n            )\n        self.format.set_sensitive(available and not mounted)\n        self.mount.set_sensitive(available)\n        self.unmount.set_sensitive(available and mounted)\n        self.mount.set_label("Open in Files" if mounted else "Mount and Open")\n'''
          if s.count(old) != 1:
              raise SystemExit(f'enable anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''        def worker():\n            failure = ""\n            for command in commands:\n                GLib.idle_add(self.log, "$ " + " ".join(command) + "\\n")\n                try:\n                    process = subprocess.Popen(\n                        command,\n                        stdout=subprocess.PIPE,\n                        stderr=subprocess.STDOUT,\n                        text=True,\n                        bufsize=1,\n                    )\n                except OSError as exc:\n                    failure = str(exc)\n                    break\n                for line in process.stdout or ():\n                    GLib.idle_add(self.log, line)\n                if process.wait():\n                    failure = f"Command exited with status {process.returncode}."\n                    break\n'''
          new = '''        def worker():\n            failure = ""\n            for command in commands:\n                GLib.idle_add(self.log, "$ " + " ".join(command) + "\\n")\n                output_tail = []\n                try:\n                    process = subprocess.Popen(\n                        command,\n                        stdout=subprocess.PIPE,\n                        stderr=subprocess.STDOUT,\n                        text=True,\n                        bufsize=1,\n                    )\n                except OSError as exc:\n                    failure = str(exc)\n                    break\n                for line in process.stdout or ():\n                    GLib.idle_add(self.log, line)\n                    text = line.strip()\n                    if text:\n                        output_tail.append(text)\n                        if len(output_tail) > 20:\n                            del output_tail[0]\n                if process.wait():\n                    detail = output_tail[-1] if output_tail else ""\n                    failure = detail or f"Command exited with status {process.returncode}."\n                    break\n'''
          if s.count(old) != 1:
              raise SystemExit(f'worker anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    def do_inspect(self, *_):\n        command = self.tool_command("inspect-block", TOOLS["inspect"])\n        if command:\n            self.run("Inspect filesystem", [command], "Inspection completed.")\n\n    def do_scrub(self, *_):\n        command = self.tool_command("scrub-block", TOOLS["scrub"])\n        if command:\n            self.run("Verify filesystem", [command], "Integrity check completed.")\n\n    def do_forensic(self, *_):\n        command = self.tool_command("forensic-block", TOOLS["forensic"])\n        if command:\n            self.run("Forensic scan", [command], "Forensic scan completed.")\n'''
          new = '''    def _require_offline_maintenance(self):\n        if not self.target:\n            return False\n        self.show_target()\n        if self.target.mountpoint:\n            self.error(\n                "Unmount the volume before running inspect, verify, or forensic maintenance. "\n                "These tools examine a stable on-disk checkpoint and must not race a live mount."\n            )\n            return False\n        return True\n\n    def do_inspect(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("inspect-block", TOOLS["inspect"])\n        if command:\n            self.run("Inspect filesystem", [command], "Inspection completed.")\n\n    def do_scrub(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("scrub-block", TOOLS["scrub"])\n        if command:\n            self.run("Verify filesystem", [command], "Integrity check completed.")\n\n    def do_forensic(self, *_):\n        if not self._require_offline_maintenance():\n            return\n        command = self.tool_command("forensic-block", TOOLS["forensic"])\n        if command:\n            self.run("Forensic scan", [command], "Forensic scan completed.")\n'''
          if s.count(old) != 1:
              raise SystemExit(f'maintenance anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''        command = ["pkexec", HELPER, op, str(os.getuid()), point]\n'''
          new = '''        command = (\n            ["pkexec", HELPER, op, self.target.path, str(os.getuid()), point]\n            if self.target.block\n            else ["pkexec", HELPER, op, str(os.getuid()), point]\n        )\n'''
          if s.count(old) != 1:
              raise SystemExit(f'unmount command anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          h = Path('tools/infiltratorfs-manager-helper')
          s = h.read_text()
          for operation, message in (
              ('inspect-block', 'inspection'),
              ('scrub-block', 'integrity verification'),
              ('forensic-block', 'forensic maintenance'),
          ):
              old = f'''    {operation})\n        (( $# == 1 )) || fail "{operation} requires a target"\n        validate_partition "$1"\n'''
              new = old + f'''        [[ -z "$(findmnt -rn -S "$1")" ]] || fail "unmount the partition before running {message}"\n'''
              if s.count(old) != 1:
                  raise SystemExit(f'{operation} anchor count={s.count(old)}')
              s = s.replace(old, new, 1)

          old = '''    unmount-block|unmount-image)\n        (( $# == 2 )) || fail "$operation requires uid and mount point"\n        user_id="$1"\n        mount_point="$2"\n        username=$(username_for_uid "$user_id")\n        home=$(home_for_uid "$user_id")\n        [[ -n "$username" ]] || fail "unknown user identifier"\n        if [[ "$operation" == "unmount-block" ]]; then\n            [[ "$mount_point" == "/media/$username/InfiltratorFS" ]] || fail "invalid mount point"\n        else\n            [[ "$mount_point" == "$home/InfiltratorFS" ]] || fail "invalid mount point"\n        fi\n        /usr/bin/mountpoint -q "$mount_point" || fail "mount point is not active"\n        [[ "$(findmnt -nro FSTYPE -T "$mount_point" 2>/dev/null || true)" == "infiltratorfs" ]] ||\n            fail "refusing to unmount a non-native filesystem"\n        exec /bin/umount "$mount_point"\n        ;;\n'''
          new = '''    unmount-block)\n        (( $# == 3 )) || fail "unmount-block requires target, uid and mount point"\n        block_target="$1"\n        user_id="$2"\n        mount_point="$3"\n        validate_partition "$block_target"\n        username=$(username_for_uid "$user_id")\n        [[ -n "$username" ]] || fail "unknown user identifier"\n        /usr/bin/mountpoint -q "$mount_point" || fail "mount point is not active"\n        [[ "$(findmnt -nro FSTYPE -T "$mount_point" 2>/dev/null || true)" == "infiltratorfs" ]] ||\n            fail "refusing to unmount a non-native filesystem"\n        mounted_source="$(findmnt -nro SOURCE -T "$mount_point" 2>/dev/null || true)"\n        [[ -n "$mounted_source" ]] || fail "could not resolve mounted source"\n        [[ "$(readlink -f -- "$mounted_source")" == "$(readlink -f -- "$block_target")" ]] ||\n            fail "mount point does not belong to the selected partition"\n        exec /bin/umount "$mount_point"\n        ;;\n    unmount-image)\n        (( $# == 2 )) || fail "unmount-image requires uid and mount point"\n        user_id="$1"\n        mount_point="$2"\n        username=$(username_for_uid "$user_id")\n        home=$(home_for_uid "$user_id")\n        [[ -n "$username" ]] || fail "unknown user identifier"\n        [[ "$mount_point" == "$home/InfiltratorFS" ]] || fail "invalid mount point"\n        /usr/bin/mountpoint -q "$mount_point" || fail "mount point is not active"\n        [[ "$(findmnt -nro FSTYPE -T "$mount_point" 2>/dev/null || true)" == "infiltratorfs" ]] ||\n            fail "refusing to unmount a non-native filesystem"\n        exec /bin/umount "$mount_point"\n        ;;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'unmount helper anchor count={s.count(old)}')
          h.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          python3 -m py_compile tools/infiltratorfs-manager
          bash -n tools/infiltratorfs-manager-helper

      - name: Verify mounted-maintenance policy
        run: |
          set -euo pipefail
          grep -Fq 'maintenance_available = available and not mounted' tools/infiltratorfs-manager
          grep -Fq 'Unmount the volume before running inspect, verify, or forensic maintenance.' tools/infiltratorfs-manager
          grep -Fq 'mount point does not belong to the selected partition' tools/infiltratorfs-manager-helper
          grep -Fq 'unmount the partition before running integrity verification' tools/infiltratorfs-manager-helper

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add tools/infiltratorfs-manager tools/infiltratorfs-manager-helper
          git commit -m 'Fix manager maintenance on mounted volumes'
          git push origin HEAD:main
