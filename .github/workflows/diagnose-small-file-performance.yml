# SPDX-License-Identifier: GPL-3.0-or-later
name: Diagnose small-file performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-small-file-performance.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake linux-headers-$(uname -r)
      - name: Build userspace and module
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          make -C kernel KDIR=/lib/modules/$(uname -r)/build -j"$(nproc)"
      - name: Qualify 1 TiB transaction start and small-file creation
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          img="$work/fs.img"
          mnt="$work/mnt"
          loop=""
          cleanup() {
            set +e
            mountpoint -q "$mnt" && sudo umount "$mnt"
            [[ -n "$loop" ]] && sudo losetup -d "$loop"
            grep -qw infiltratorfs /proc/filesystems && sudo rmmod infiltratorfs
            rm -rf "$work"
          }
          trap cleanup EXIT
          mkdir -p "$mnt"
          truncate -s 1T "$img"
          /usr/bin/time -f 'mkfs 1TiB: %e s' build/mkfs.infilfs --force -L LargeVolumeDiag "$img" >/dev/null
          sudo insmod kernel/infiltratorfs.ko
          loop="$(sudo losetup --find --show "$img")"
          sudo mount -t infiltratorfs -o rw,compress=auto "$loop" "$mnt"

          sudo python3 - "$mnt" <<'PY'
          import os, sys, time
          root=sys.argv[1]

          t=time.monotonic()
          os.mkdir(os.path.join(root,'bench'))
          first=time.monotonic()-t
          print(f'1TiB first mkdir/transaction start: {first:.3f}s', flush=True)
          if first > 5.0:
              raise SystemExit(f'first transaction start too slow on 1TiB image: {first:.3f}s')

          p=os.path.join(root,'bench')
          n=1000
          t=time.monotonic()
          for i in range(n):
              fd=os.open(os.path.join(p,f'f{i:05d}'), os.O_CREAT|os.O_EXCL|os.O_WRONLY, 0o644)
              os.close(fd)
          elapsed=time.monotonic()-t
          print(f'1TiB 1000 empty creates: {elapsed:.3f}s ({n/elapsed:.1f} ops/s)', flush=True)
          if elapsed > 15.0:
              raise SystemExit(f'1000 creates too slow on 1TiB image: {elapsed:.3f}s')
          os.sync()
          PY

          sudo umount "$mnt"
          sudo losetup -d "$loop"
          loop=""
          build/infilfs-scrub "$img" | tee "$work/scrub.txt"
          grep -Fq 'Result:              CLEAN' "$work/scrub.txt"
