# SPDX-License-Identifier: GPL-3.0-or-later
name: Fix project reparent live size

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-project-reparent-live-size.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use live inode size for project transfer preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs_quota.inc')
          text = p.read_text(encoding='utf-8')
          fn = text.index('static int infilfs_quota_prepare_reparent_locked(')
          site = text.index('        logical = le64_to_cpu(attributes->logical_size);\n', fn)
          insertion = "        logical = le64_to_cpu(attributes->logical_size);\n        if (type == INFILFS_OBJECT_FILE) {\n            struct infilfs_iget_args live_args = {\n                .ino = infilfs_object_ino(entries[i].object_id),\n                .object_id = entries[i].object_id,\n            };\n            struct inode *live_inode;\n\n            /*\n             * Buffered writes may have advanced i_size before writeback has\n             * published the new logical_size to the object block. Project\n             * reparent quota admission must use the live logical size or a\n             * dirty subtree can cross the destination project limit. Dirty\n             * mappings keep their inode resident, so ilookup5() observes the\n             * authoritative VFS size without instantiating a new inode. If the\n             * inode is not resident there can be no dirty page-cache state and\n             * the persisted logical size above is authoritative.\n             */\n            live_inode = ilookup5(\n                source->i_sb, (unsigned long)live_args.ino,\n                infilfs_inode_matches_id, &live_args);\n            if (live_inode) {\n                loff_t live_size = i_size_read(live_inode);\n\n                if (live_size < 0) {\n                    iput(live_inode);\n                    kfree(object);\n                    ret = -EFSCORRUPTED;\n                    break;\n                }\n                logical = (u64)live_size;\n                iput(live_inode);\n            }\n        }\n"
          line = '        logical = le64_to_cpu(attributes->logical_size);\n'
          text = text[:site] + insertion + text[site + len(line):]
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-project-reparent-live-size.yml
          git diff --check
          grep -Fq 'live_inode = ilookup5(' kernel/infiltratorfs_quota.inc
          grep -Fq 'Buffered writes may have advanced i_size' kernel/infiltratorfs_quota.inc
          bash tests/native-quota-policy.sh .
          bash tests/native-kernel-maintainability-policy.sh .
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Account dirty buffered data in project reparent quotas'
          git push origin HEAD:main
