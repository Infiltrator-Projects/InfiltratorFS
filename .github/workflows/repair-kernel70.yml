# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot Linux 7.0 DKMS repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-kernel70.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Port native module to current VFS mount API and harden DKMS install
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # Linux 7.0 removed the legacy file_system_type.mount field and mount_bdev().
          # Use the fs_context/get_tree_bdev API that is also available on the older
          # kernels used by CI and by supported Mint/Ubuntu installations.
          replace_once(
              "kernel/infiltratorfs.c",
              "#include <linux/fs.h>\n",
              "#include <linux/fs.h>\n#include <linux/fs_context.h>\n",
          )
          replace_once(
              "kernel/infiltratorfs.c",
              "    .drop_inode = generic_delete_inode,\n",
              "    .drop_inode = inode_just_drop,\n",
          )
          replace_once(
              "kernel/infiltratorfs.c",
              "static int infilfs_fill_super(struct super_block *sb, void *data, int silent)\n{\n",
              "static int infilfs_fill_super(struct super_block *sb, struct fs_context *fc)\n{\n",
          )
          replace_once(
              "kernel/infiltratorfs.c",
              "    (void)data;\n    (void)silent;\n\n",
              "    (void)fc;\n\n",
          )
          replace_once(
              "kernel/infiltratorfs.c",
              '''static struct dentry *infilfs_mount(struct file_system_type *fs_type,\n                                    int flags, const char *dev_name,\n                                    void *data)\n{\n    return mount_bdev(fs_type, flags, dev_name, data, infilfs_fill_super);\n}\n\nstatic struct file_system_type infilfs_type = {\n    .owner = THIS_MODULE,\n    .name = INFILTRATORFS_NAME,\n    .mount = infilfs_mount,\n    .kill_sb = kill_block_super,\n    .fs_flags = FS_REQUIRES_DEV,\n};\n''',
              '''static int infilfs_get_tree(struct fs_context *fc)\n{\n    /* The native adapter is intentionally read-only. Reject writable mounts\n     * before get_tree_bdev() attempts to open the block device for writing. */\n    if (!(fc->sb_flags & SB_RDONLY))\n        return -EROFS;\n    return get_tree_bdev(fc, infilfs_fill_super);\n}\n\nstatic const struct fs_context_operations infilfs_context_operations = {\n    .get_tree = infilfs_get_tree,\n};\n\nstatic int infilfs_init_fs_context(struct fs_context *fc)\n{\n    fc->ops = &infilfs_context_operations;\n    return 0;\n}\n\nstatic struct file_system_type infilfs_type = {\n    .owner = THIS_MODULE,\n    .name = INFILTRATORFS_NAME,\n    .init_fs_context = infilfs_init_fs_context,\n    .kill_sb = kill_block_super,\n    .fs_flags = FS_REQUIRES_DEV,\n};\n''',
          )

          # A DKMS failure must not leave the whole userspace package half-configured.
          # The package remains usable through FUSE and prints the recovery command.
          replace_once(
              "packaging/build-linux-packages.sh",
              '''        dkms build -m "\\$module" -v "\\$version" -k "\\$kernel"\n        dkms install -m "\\$module" -v "\\$version" -k "\\$kernel" --force\n''',
              '''        if dkms build -m "\\$module" -v "\\$version" -k "\\$kernel" && \\\n           dkms install -m "\\$module" -v "\\$version" -k "\\$kernel" --force; then\n            :\n        else\n            echo "InfiltratorFS: WARNING: native kernel module build failed for \\$kernel." >&2\n            echo "The userspace tools and FUSE adapter are installed and remain usable." >&2\n            echo "After installing compatible headers/source, retry: sudo dkms autoinstall" >&2\n        fi\n''',
          )

          # Release 0.16.11: implementation-only change; on-disk Format 0.12 is unchanged.
          replace_once(
              "CMakeLists.txt",
              "project(InfiltratorFS VERSION 0.16.10 LANGUAGES C)",
              "project(InfiltratorFS VERSION 0.16.11 LANGUAGES C)",
          )
          replace_once(
              "README.md",
              "**Current implementation:** 0.16.10<br>",
              "**Current implementation:** 0.16.11<br>",
          )
          replace_once(
              "README.md",
              "The Windows release contains a versioned executable such as `InfiltratorFS-Windows-0.16.10.exe`.",
              "The Windows release contains a versioned executable such as `InfiltratorFS-Windows-0.16.11.exe`.",
          )
          replace_once(
              "README.md",
              "chmod +x infiltratorfs-0.16.10-linux-native.run\n./infiltratorfs-0.16.10-linux-native.run --dry-run",
              "chmod +x infiltratorfs-0.16.11-linux-native.run\n./infiltratorfs-0.16.11-linux-native.run --dry-run",
          )
          readme = Path("README.md")
          text = readme.read_text()
          note = "\n\nImplementation 0.16.11 ports the packaged native Linux read-only module to the current fs_context/get_tree_bdev VFS mount API used by Linux 7.0, replaces the removed generic_delete_inode drop hook with inode_just_drop, and makes a DKMS build failure non-fatal to installation of the userspace/FUSE tools. Format 0.12 is unchanged.\n"
          if note.strip() not in text:
              readme.write_text(text.rstrip() + note)

          replace_once(
              "kernel/README.md",
              "Release 0.16.10 packages the source through DKMS",
              "Release 0.16.11 packages the source through DKMS",
          )
          PY

      - name: Publish repair commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add kernel/infiltratorfs.c packaging/build-linux-packages.sh CMakeLists.txt README.md kernel/README.md
          git diff --cached --check
          git commit -m "Release 0.16.11: support Linux 7.0 VFS mount API"
          git push origin HEAD:main
