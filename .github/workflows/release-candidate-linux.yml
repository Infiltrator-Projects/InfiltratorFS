# SPDX-License-Identifier: GPL-3.0-or-later
name: Release candidate Linux

# While the current semantic version is newer than the newest published tag,
# every main revision is a potential release source. Running on every main push
# prevents a justified post-bump correction from inheriting release artifacts
# qualified against an older SHA. The semantic resolver makes published/no-op
# revisions cheap by skipping all release work once no release is requested.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-candidate-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify Linux release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      requested: ${{ steps.release.outputs.requested }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve semantic release request
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash tools/release/resolve-request.sh . "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.release.outputs.requested == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake desktop-file-utils libgtk-3-dev libssl-dev \
            pkg-config policykit-1 xdg-utils python3

      - name: Guard native Linux policies
        if: steps.release.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fsck-structural-policy.sh .
          bash tests/native-random-write-optimization-policy.sh .
          bash tests/native-sequential-write-scaling-policy.sh .
          bash tests/native-cpu-parallelism-policy.sh .
          bash tests/native-small-file-scaling-policy.sh .
          bash tests/native-free-extent-index-policy.sh .
          bash tests/native-parallel-allocation-policy.sh .
          bash tests/native-workload-placement-policy.sh .
          bash tests/native-media-placement-policy.sh .
          bash tests/native-index-tree-policy.sh .
          bash tests/index-tree-format-policy.sh .
          bash tests/allocation-tree-format-policy.sh .
          bash tests/directory-tree-policy.sh .

      - name: Configure and build
        if: steps.release.outputs.requested == 'true'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.release.outputs.requested == 'true'
        run: cmake --build build --parallel

      - name: Test
        if: steps.release.outputs.requested == 'true'
        run: ctest --test-dir build --output-on-failure

      - name: Require accelerated SHA-256 and no FUSE artifact
        if: steps.release.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ldd build/infilfs-checksum-test | grep -Fq libcrypto
          test ! -e build/infilfs-fuse

      - name: Download pinned desktop integration bundle
        if: steps.release.outputs.requested == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(head -n1 .github/desktop-integration-release | tr -d '[:space:]')"
          test -n "$tag"
          [[ "$tag" == desktop-integration-ubuntu24.04-* ]]
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = true

          dir="$RUNNER_TEMP/desktop-integration"
          mkdir -p "$dir"
          gh release download "$tag" --dir "$dir" \
            --pattern 'gnome-disks' \
            --pattern 'libbd_fs.so' \
            --pattern 'manifest'

          for required in gnome-disks libbd_fs.so manifest; do
            test -s "$dir/$required"
          done
          expected_patch="$(cat packaging/libblockdev-3.1-infiltratorfs.patch packaging/gnome-disks-46-infiltratorfs.patch packaging/build-noble-desktop-integration.sh | sha256sum | awk '{print $1}')"
          test "$(sed -n 's/^patch_sha256=//p' "$dir/manifest")" = "$expected_patch"
          test "$(sed -n 's/^target=//p' "$dir/manifest")" = ubuntu-24.04-linuxmint-22.x
          if find "$dir" -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            echo 'Qualified desktop integration must not contain replacement Debian packages.' >&2
            exit 1
          fi

      - name: Build and validate final Linux release packages once
        if: steps.release.outputs.requested == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          INFILTRATORFS_EMIT_RUN: "1"
          INFILTRATORFS_OS_INTEGRATION_BUNDLE_DIR: ${{ runner.temp }}/desktop-integration
          INFILTRATORFS_REQUIRE_OS_INTEGRATION: "1"
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/build-linux-packages.sh build dist
          installer="dist/infiltratorfs-${VERSION}-linux-native.run"
          deb="dist/infiltratorfs_${VERSION}_amd64.deb"
          test -s "$installer"
          test -s "$deb"
          "$installer" --verify
          test "$(dpkg-deb --field "$deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$deb" X-InfiltratorFS-Desktop-Integration)" = ubuntu24.04-mint22-bundled

          contents="$RUNNER_TEMP/infiltratorfs-release-candidate-contents.txt"
          dpkg-deb --contents "$deb" > "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/gnome-disks$' "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/libbd_fs.so$' "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/manifest$' "$contents"
          ! grep -q 'usr/bin/infilfs-fuse$' "$contents"

          depends="$(dpkg-deb --field "$deb" Depends)"
          for dependency in udisks2 gnome-disk-utility libblockdev-fs3; do
            grep -Eq "(^|, )${dependency}([ ,|]|$)" <<<"$depends"
          done
          ! grep -Eq '(^|, )infiltratorfs-(desktop-integration|gnome-disk-utility|libblockdev-fs3)([ ,]|$)' <<<"$depends"

          (
            cd dist
            sha256sum \
              "infiltratorfs_${VERSION}_amd64.deb" \
              "infiltratorfs-${VERSION}-linux-native.run" \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          rm -f "$deb.sha256" "$installer.sha256"

          expected="$(printf '%s\n' \
            "SHA256SUMS.txt" \
            "infiltratorfs-${VERSION}-linux-native.run" \
            "infiltratorfs_${VERSION}_amd64.deb" | sort)"
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"

      - name: Upload exact final Linux release artifacts
        if: steps.release.outputs.requested == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-Linux
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  install-verify:
    name: Install and verify exact candidate package
    needs: qualify
    if: needs.qualify.outputs.requested == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.qualify.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Download exact candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: InfiltratorFS-Linux
          path: dist

      - name: Verify checksums and installed integration
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c SHA256SUMS.txt
          )
          deb="$(readlink -f "dist/infiltratorfs_${VERSION}_amd64.deb")"
          test -s "$deb"
          test "$(dpkg-deb --field "$deb" X-InfiltratorFS-Desktop-Integration)" = ubuntu24.04-mint22-bundled
          sudo apt-get update
          sudo apt-get install -y "$deb"
          dpkg-query -W -f='${Status}\n' infiltratorfs | grep -Fxq 'install ok installed'
          dpkg-query -W -f='${Status}\n' gnome-disk-utility | grep -Fxq 'install ok installed'
          dpkg-query -W -f='${Status}\n' libblockdev-fs3 | grep -Fxq 'install ok installed'
          sudo /usr/lib/infiltratorfs/infiltratorfs-os-integration verify
          test -x /usr/share/initramfs-tools/hooks/infiltratorfs
          grep -Fq 'manual_add_modules infiltratorfs' /usr/share/initramfs-tools/hooks/infiltratorfs
          dkms status -m infiltratorfs -v "$VERSION" | grep -q .
