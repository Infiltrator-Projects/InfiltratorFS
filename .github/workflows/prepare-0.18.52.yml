name: Prepare 0.18.52 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.18.52.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact 0.18.52 release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          sed -i 's/project(InfiltratorFS VERSION 0\.18\.51 LANGUAGES C)/project(InfiltratorFS VERSION 0.18.52 LANGUAGES C)/' CMakeLists.txt
          sed -i 's/# Development qualification anchor: 0\.18\.51/# Development qualification anchor: 0.18.52/' CMakeLists.txt
          sed -i 's/\*\*Current source version:\*\* 0\.18\.51 (Format 0\.18)<br>/\*\*Current source version:\*\* 0.18.52 (Format 0.18)<br>/' README.md
          sed -i 's/\*\*Current source:\*\* 0\.18\.51<br>/\*\*Current source:\*\* 0.18.52<br>/' README.md
          sed -i 's/\*\*Latest published release:\*\* v0\.18\.50<br>/\*\*Latest published release:\*\* v0.18.51<br>/' README.md
          cat > .github/release-trigger <<'EOF'
          0.18.52
          qualification=58b7f1af0accf2daf98b4826006b163166752e4a
          publication-gate=event-driven-v5
          EOF
          git rm .github/workflows/prepare-0.18.52.yml
          grep -Fq 'project(InfiltratorFS VERSION 0.18.52 LANGUAGES C)' CMakeLists.txt
          grep -Fq '# Development qualification anchor: 0.18.52' CMakeLists.txt
          grep -Fq '**Current source version:** 0.18.52 (Format 0.18)<br>' README.md
          grep -Fq '**Current source:** 0.18.52<br>' README.md
          grep -Fq '**Latest published release:** v0.18.51<br>' README.md
          grep -Fq 'qualification=58b7f1af0accf2daf98b4826006b163166752e4a' .github/release-trigger

      - name: Commit release source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release 0.18.52: optimize scrub performance and progress'
          git push origin HEAD:main
