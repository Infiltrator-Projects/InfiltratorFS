# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply special-file O_TRUNC fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-special-otrunc-fix.py'
      - '.github/workflows/apply-special-otrunc-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake kmod linux-headers-$(uname -r) python3 util-linux
      - name: Apply source fix
        run: |
          set -euo pipefail
          python3 tools/apply-special-otrunc-fix.py
      - name: Build native module and mkfs
        run: |
          set -euo pipefail
          kdir="/lib/modules/$(uname -r)/build"
          make -C kernel clean KDIR="$kdir" || true
          make -C kernel KDIR="$kdir"
          cmake -S . -B build-special-otrunc -DCMAKE_BUILD_TYPE=Release
          cmake --build build-special-otrunc --parallel --target mkfs.infilfs
      - name: Prove special-file open semantics
        run: |
          set -euo pipefail
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            bash tests/native-device-node-open-qualification.sh \
              build-special-otrunc kernel/infiltratorfs.ko
      - name: Commit validated kernel change
        run: |
          set -euo pipefail
          kdir="/lib/modules/$(uname -r)/build"
          make -C kernel clean KDIR="$kdir" || true
          rm -rf build-special-otrunc
          git status --short
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -Fq 'kernel/infiltratorfs_rw.inc'
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_rw.inc
          git commit -m 'Fix O_TRUNC semantics for special files'
          git pull --rebase origin main
          git push origin HEAD:main
