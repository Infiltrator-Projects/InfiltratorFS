# SPDX-License-Identifier: GPL-3.0-or-later
name: Release artifacts

# Release construction is automatic, but every job is hard-capped at ten minutes.
# Reuse the already-qualified desktop integration bundle when its source inputs
# are unchanged; a changed desktop integration requires the manual heavyweight
# GNOME formatter qualification instead of rebuilding it in automatic release CI.
on:
  workflow_run:
    workflows: ["Build and conformance"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  package:
    name: Assemble tested release artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact main and reusable desktop integration inputs
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          subject="$(git log -1 --format=%s "$EXPECTED_SHA")"
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          [[ "$subject" == "Release ${version}" || "$subject" == "Release ${version}:"* ]]
          integration_inputs=(
            packaging/libblockdev-infiltratorfs.patch
            packaging/udisks2-infiltratorfs-display.patch
            packaging/gnome-disks-infiltratorfs.patch
            packaging/build-noble-desktop-integration.sh
            packaging/infiltratorfs-os-integration
          )
          if ! git diff --quiet v0.18.47 "$EXPECTED_SHA" -- "${integration_inputs[@]}"; then
            echo 'Desktop integration inputs changed since v0.18.47; run the manual GNOME formatter qualification and establish a new qualified bundle baseline.' >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install fast package build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake desktop-file-utils libssl-dev

      - name: Download exact tested build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --name InfiltratorFS-Linux --dir "$RUNNER_TEMP/build-linux"
          gh run download "$SOURCE_RUN_ID" --name InfiltratorFS-Windows --dir "$RUNNER_TEMP/build-windows"
          installer="$RUNNER_TEMP/build-linux/infiltratorfs-${VERSION}-linux-native.run"
          test -s "$installer"
          chmod 0755 "$installer"
          test -s "$RUNNER_TEMP/build-windows/InfiltratorFS-Windows-${VERSION}.exe"

      - name: Reuse qualified v0.18.47 desktop integration bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/integration-baseline"
          root="$RUNNER_TEMP/integration-root"
          bundle="$RUNNER_TEMP/infiltratorfs-os-integration"
          mkdir -p "$baseline" "$root" "$bundle"
          gh release download v0.18.47 --pattern 'infiltratorfs_0.18.47_amd64.deb' --dir "$baseline"
          dpkg-deb -x "$baseline/infiltratorfs_0.18.47_amd64.deb" "$root"
          for file in gnome-disks libbd_fs.so manifest; do
            test -s "$root/usr/lib/infiltratorfs/os-integration/$file"
            cp "$root/usr/lib/infiltratorfs/os-integration/$file" "$bundle/$file"
          done
          chmod 0755 "$bundle/gnome-disks"

      - name: Build current integrated Debian package
        env:
          INFILTRATORFS_OS_INTEGRATION_BUNDLE_DIR: ${{ runner.temp }}/infiltratorfs-os-integration
          INFILTRATORFS_REQUIRE_OS_INTEGRATION: "1"
          INFILTRATORFS_EMIT_RUN: "0"
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ldd build-release/infilfs-checksum-test | grep -Fq libcrypto
          bash packaging/build-linux-packages.sh build-release dist

      - name: Assemble and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          windows="InfiltratorFS-Windows-${VERSION}.exe"
          cp "dist/$deb" release-assets/
          cp "$RUNNER_TEMP/build-linux/$installer" release-assets/
          cp "$RUNNER_TEMP/build-windows/$windows" release-assets/
          chmod 0755 "release-assets/$installer"
          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "release-assets/$deb" X-InfiltratorFS-Desktop-Integration)" = ubuntu24.04-mint22-bundled
          contents="$RUNNER_TEMP/release-contents.txt"
          dpkg-deb --contents "release-assets/$deb" > "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/gnome-disks$' "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/libbd_fs.so$' "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/manifest$' "$contents"
          ! grep -q 'usr/bin/infilfs-fuse$' "$contents"
          "release-assets/$installer" --verify
          test -s "release-assets/$windows"

      - name: Preserve exact release assets
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-assets
          path: |
            release-assets/infiltratorfs_${{ env.VERSION }}_amd64.deb
            release-assets/infiltratorfs-${{ env.VERSION }}-linux-native.run
            release-assets/InfiltratorFS-Windows-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 30
