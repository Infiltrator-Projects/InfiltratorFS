# SPDX-License-Identifier: GPL-3.0-or-later
name: Release artifacts

on:
  workflow_run:
    workflows: ["Release candidate Linux"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  package:
    name: Assemble tested release artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact main and release identity
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          subject="$(git log -1 --format=%s "$EXPECTED_SHA")"
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          [[ "$subject" == "Release ${version}" || "$subject" == "Release ${version}:"* ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install fast package build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake desktop-file-utils libgtk-3-dev libssl-dev pkg-config

      - name: Download exact tested Linux build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --name InfiltratorFS-Linux --dir "$RUNNER_TEMP/build-linux"
          installer="$RUNNER_TEMP/build-linux/infiltratorfs-${VERSION}-linux-native.run"
          test -s "$installer"
          chmod 0755 "$installer"

      - name: Download qualified desktop integration bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.prerelease == true and (.tag_name | startswith("desktop-integration-ubuntu24.04-"))) | [.published_at, .tag_name] | @tsv' |
              LC_ALL=C sort |
              tail -n 1 |
              cut -f2-
          )"
          if [[ -z "$tag" ]]; then
            echo "::error::No qualified desktop integration prerelease found matching desktop-integration-ubuntu24.04-*"
            exit 1
          fi
          dir="$RUNNER_TEMP/desktop-integration"
          mkdir -p "$dir"
          gh release download "$tag" --dir "$dir" \
            --pattern 'gnome-disks' \
            --pattern 'libbd_fs.so' \
            --pattern 'manifest'
          for required in gnome-disks libbd_fs.so manifest; do
            test -s "$dir/$required"
          done
          expected_patch="$(cat packaging/libblockdev-3.1-infiltratorfs.patch packaging/gnome-disks-46-infiltratorfs.patch packaging/build-noble-desktop-integration.sh | sha256sum | awk '{print $1}')"
          test "$(sed -n 's/^patch_sha256=//p' "$dir/manifest")" = "$expected_patch"
          test "$(sed -n 's/^target=//p' "$dir/manifest")" = ubuntu-24.04-linuxmint-22.x
          if find "$dir" -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            echo 'Qualified desktop integration must not contain replacement Debian packages.' >&2
            exit 1
          fi

      - name: Build current single Debian package and self-contained native installer
        env:
          INFILTRATORFS_EMIT_RUN: "1"
          INFILTRATORFS_OS_INTEGRATION_BUNDLE_DIR: ${{ runner.temp }}/desktop-integration
          INFILTRATORFS_REQUIRE_OS_INTEGRATION: "1"
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ldd build-release/infilfs-checksum-test | grep -Fq libcrypto
          bash packaging/build-linux-packages.sh build-release dist

      - name: Assemble and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          cp "dist/$deb" release-assets/
          cp "dist/$installer" release-assets/
          chmod 0755 "release-assets/$installer"

          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "release-assets/$deb" X-InfiltratorFS-Desktop-Integration)" = ubuntu24.04-mint22-bundled
          contents="$RUNNER_TEMP/release-contents.txt"
          dpkg-deb --contents "release-assets/$deb" > "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/gnome-disks$' "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/libbd_fs.so$' "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/manifest$' "$contents"
          ! grep -q 'usr/bin/infilfs-fuse$' "$contents"

          depends="$(dpkg-deb --field "release-assets/$deb" Depends)"
          for dependency in udisks2 gnome-disk-utility libblockdev-fs3; do
            grep -Eq "(^|, )${dependency}([ ,|]|$)" <<<"$depends"
          done
          ! grep -Eq '(^|, )infiltratorfs-(desktop-integration|gnome-disk-utility|libblockdev-fs3)([ ,]|$)' <<<"$depends"

          "release-assets/$installer" --verify
          payload_start="$(awk '/^__INFILTRATORFS_NATIVE_PAYLOAD__$/ { print NR + 1; exit }' "release-assets/$installer")"
          test -n "$payload_start"
          tail -n +"$payload_start" "release-assets/$installer" | tar -tzf - | \
            grep -Fxq './infiltratorfs-os-integration-bundle.tar'

          if find release-assets -maxdepth 1 -type f \
              \( -name 'infiltratorfs-desktop-integration_*.deb' \
                 -o -name 'infiltratorfs-gnome-disk-utility_*.deb' \
                 -o -name 'infiltratorfs-libblockdev-fs3_*.deb' \) \
              -print -quit | grep -q .; then
            echo 'Obsolete desktop replacement package reached release assets.' >&2
            exit 1
          fi

      - name: Preserve exact release assets
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
