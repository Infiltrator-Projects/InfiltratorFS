# SPDX-License-Identifier: GPL-3.0-or-later
name: Release artifacts

on:
  workflow_run:
    workflows: ["Release candidate Linux"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and promote exact tested release artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify exact main and release identity
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          subject="$(git log -1 --format=%s "$EXPECTED_SHA")"
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          [[ "$subject" == "Release ${version}" || "$subject" == "Release ${version}:"* ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download exact tested final Linux release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/build-linux"
          gh run download "$SOURCE_RUN_ID" --name InfiltratorFS-Linux --dir "$dir"

          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          for required in "$deb" "$installer" SHA256SUMS.txt; do
            test -s "$dir/$required"
          done
          chmod 0755 "$dir/$installer"

          expected="$(printf '%s\n' "SHA256SUMS.txt" "$deb" "$installer" | sort)"
          actual="$(find "$dir" -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          (
            cd "$dir"
            sha256sum -c SHA256SUMS.txt
          )

      - name: Assemble and validate exact release assets
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/build-linux"
          mkdir -p release-assets
          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          cp "$source_dir/$deb" release-assets/
          cp "$source_dir/$installer" release-assets/
          cp "$source_dir/SHA256SUMS.txt" release-assets/
          chmod 0755 "release-assets/$installer"

          (
            cd release-assets
            sha256sum -c SHA256SUMS.txt
          )

          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "release-assets/$deb" X-InfiltratorFS-Desktop-Integration)" = ubuntu24.04-mint22-bundled
          contents="$RUNNER_TEMP/release-contents.txt"
          dpkg-deb --contents "release-assets/$deb" > "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/gnome-disks$' "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/libbd_fs.so$' "$contents"
          grep -q 'usr/lib/infiltratorfs/os-integration/manifest$' "$contents"
          ! grep -q 'usr/bin/infilfs-fuse$' "$contents"

          depends="$(dpkg-deb --field "release-assets/$deb" Depends)"
          for dependency in udisks2 gnome-disk-utility libblockdev-fs3; do
            grep -Eq "(^|, )${dependency}([ ,|]|$)" <<<"$depends"
          done
          ! grep -Eq '(^|, )infiltratorfs-(desktop-integration|gnome-disk-utility|libblockdev-fs3)([ ,]|$)' <<<"$depends"

          "release-assets/$installer" --verify
          payload_start="$(awk '/^__INFILTRATORFS_NATIVE_PAYLOAD__$/ { print NR + 1; exit }' "release-assets/$installer")"
          test -n "$payload_start"
          tail -n +"$payload_start" "release-assets/$installer" | tar -tzf - | \
            grep -Fxq './infiltratorfs-os-integration-bundle.tar'

          expected="$(printf '%s\n' "SHA256SUMS.txt" "$deb" "$installer" | sort)"
          actual="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"

      - name: Install and verify exact integrated release package
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail
          deb="$(readlink -f "release-assets/infiltratorfs_${VERSION}_amd64.deb")"
          test -s "$deb"
          test "$(dpkg-deb --field "$deb" X-InfiltratorFS-Desktop-Integration)" = ubuntu24.04-mint22-bundled
          sudo apt-get update
          sudo apt-get install -y "$deb"
          dpkg-query -W -f='${Status}\n' infiltratorfs | grep -Fxq 'install ok installed'
          dpkg-query -W -f='${Status}\n' gnome-disk-utility | grep -Fxq 'install ok installed'
          dpkg-query -W -f='${Status}\n' libblockdev-fs3 | grep -Fxq 'install ok installed'
          sudo /usr/lib/infiltratorfs/infiltratorfs-os-integration verify
          test -x /usr/share/initramfs-tools/hooks/infiltratorfs
          grep -Fq 'manual_add_modules infiltratorfs' /usr/share/initramfs-tools/hooks/infiltratorfs
          dkms status -m infiltratorfs -v "$VERSION" | grep -q .

      - name: Preserve exact release assets unchanged
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
