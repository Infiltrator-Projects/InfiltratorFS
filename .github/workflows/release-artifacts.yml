# SPDX-License-Identifier: GPL-3.0-or-later
name: Release artifacts

on:
  workflow_run:
    workflows: ["Build and conformance"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  package:
    name: Assemble tested release artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact main and release identity
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          subject="$(git log -1 --format=%s "$EXPECTED_SHA")"
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          [[ "$subject" == "Release ${version}" || "$subject" == "Release ${version}:"* ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install fast package build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake desktop-file-utils libssl-dev

      - name: Download exact tested build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --name InfiltratorFS-Linux --dir "$RUNNER_TEMP/build-linux"
          gh run download "$SOURCE_RUN_ID" --name InfiltratorFS-Windows --dir "$RUNNER_TEMP/build-windows"
          installer="$RUNNER_TEMP/build-linux/infiltratorfs-${VERSION}-linux-native.run"
          test -s "$installer"
          chmod 0755 "$installer"
          test -s "$RUNNER_TEMP/build-windows/InfiltratorFS-Windows-${VERSION}.exe"

      - name: Download qualified managed desktop integration packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release list --limit 100 --json tagName,isPrerelease,publishedAt --jq '[.[] | select(.isPrerelease == true and (.tagName | startswith("desktop-integration-ubuntu24.04-")))] | sort_by(.publishedAt) | last | .tagName')"
          test -n "$tag"
          dir="$RUNNER_TEMP/desktop-integration"
          mkdir -p "$dir"
          gh release download "$tag" --dir "$dir"             --pattern 'infiltratorfs-libblockdev-fs3_*.deb'             --pattern 'infiltratorfs-gnome-disk-utility_*.deb'             --pattern 'infiltratorfs-desktop-integration_*.deb'             --pattern 'infiltratorfs-desktop-integration.manifest'
          manifest="$dir/infiltratorfs-desktop-integration.manifest"
          test -s "$manifest"
          expected_patch="$(cat packaging/libblockdev-3.1-infiltratorfs.patch packaging/gnome-disks-46-infiltratorfs.patch packaging/build-noble-desktop-packages.sh | sha256sum | awk '{print $1}')"
          test "$(sed -n 's/^patch_sha256=//p' "$manifest")" = "$expected_patch"
          test "$(sed -n 's/^target=//p' "$manifest")" = ubuntu-24.04-linuxmint-22.x
          for pattern in 'infiltratorfs-libblockdev-fs3_*.deb' 'infiltratorfs-gnome-disk-utility_*.deb' 'infiltratorfs-desktop-integration_*.deb'; do
            file="$(find "$dir" -maxdepth 1 -name "$pattern" -print -quit)"
            test -s "$file"
            dpkg-deb --info "$file" >/dev/null
          done

      - name: Build current core Debian package
        env:
          INFILTRATORFS_EMIT_RUN: "0"
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ldd build-release/infilfs-checksum-test | grep -Fq libcrypto
          bash packaging/build-linux-packages.sh build-release dist

      - name: Assemble and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          windows="InfiltratorFS-Windows-${VERSION}.exe"
          cp "dist/$deb" release-assets/
          cp "$RUNNER_TEMP/build-linux/$installer" release-assets/
          cp "$RUNNER_TEMP/build-windows/$windows" release-assets/
          cp "$RUNNER_TEMP/desktop-integration/"*.deb release-assets/
          cp "$RUNNER_TEMP/desktop-integration/infiltratorfs-desktop-integration.manifest" release-assets/
          chmod 0755 "release-assets/$installer"
          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "release-assets/$deb" X-InfiltratorFS-Desktop-Integration)" = managed-packages
          contents="$RUNNER_TEMP/release-contents.txt"
          dpkg-deb --contents "release-assets/$deb" > "$contents"
          ! grep -q 'usr/lib/infiltratorfs/os-integration/gnome-disks$' "$contents"
          ! grep -q 'usr/lib/infiltratorfs/os-integration/libbd_fs.so$' "$contents"
          ! grep -q 'usr/bin/infilfs-fuse$' "$contents"
          dpkg-deb --field "release-assets/$deb" Recommends | grep -Fq infiltratorfs-desktop-integration
          "release-assets/$installer" --verify
          test -s "release-assets/$windows"

      - name: Preserve exact release assets
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
