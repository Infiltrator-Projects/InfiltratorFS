# SPDX-License-Identifier: GPL-3.0-or-later
name: CI duration policy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'tools/apply-buffered-writeback-repair.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-duration-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Apply buffered writeback repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply repair and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-buffered-writeback-repair.py
          git checkout HEAD^ -- .github/workflows/ci-duration-policy.yml
          rm -f tools/apply-buffered-writeback-repair.py
          git diff --check
          bash tests/native-sequential-write-scaling-policy.sh .
          bash tests/native-small-file-scaling-policy.sh .
          bash tests/native-deferred-publication-policy.sh .
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git commit -m "Use buffered clustered native writeback"
          git push origin HEAD:main
