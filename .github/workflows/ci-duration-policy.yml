# SPDX-License-Identifier: GPL-3.0-or-later
name: CI duration policy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'tests/ci-duration-policy.py'
      - 'docs/QUALIFICATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-duration-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Enforce automatic/manual qualification boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Enforce qualification duration policy
        run: python3 tests/ci-duration-policy.py
