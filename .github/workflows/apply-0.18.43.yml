# SPDX-License-Identifier: GPL-3.0-or-later
# One-shot development helper; removes itself after applying the patch.
name: Apply 0.18.43 POSIX ACL patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply patch
        run: python3 tools/apply_0_18_43.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- . ':!README.md'
          bash tests/native-posix-acl-policy.sh .
          grep -Fq 'project(InfiltratorFS VERSION 0.18.43 LANGUAGES C)' CMakeLists.txt
          grep -Fq '**On-disk format:** 0.18' README.md

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-0.18.43.yml tools/apply_0_18_43.py
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check -- . ':!README.md'
          git commit -m 'Linux: add POSIX ACL support and restore block-saving compression'
          git push origin HEAD:main
