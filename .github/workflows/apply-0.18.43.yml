# SPDX-License-Identifier: GPL-3.0-or-later
# One-shot development helper; removes itself after applying the patch.
name: Apply 0.18.43 POSIX ACL patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply deterministic patch
        run: python3 tools/apply_0_18_43.py

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-0.18.43.yml tools/apply_0_18_43.py
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Linux: add POSIX ACL support and restore block-saving compression'
          git push origin HEAD:main
