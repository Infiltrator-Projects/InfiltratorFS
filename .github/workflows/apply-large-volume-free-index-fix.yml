# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply large-volume free-index repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-large-volume-free-index-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace per-block free-index rebuild with bitmap word scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/infiltratorfs_rw_legacy.inc')
          s = p.read_text()
          old = '''static int infilfs_rw_free_extent_index_rebuild(struct infilfs_rw_tx *tx)\n{\n    u64 total;\n    u64 block = 0;\n    size_t count = 0;\n    int ret;\n\n    if (!tx || !tx->bitmap || !tx->sbi)\n        return -EINVAL;\n    total = infilfs_volume_blocks(tx->sbi);\n\n    while (block < total) {\n        while (block < total && infilfs_rw_bitmap_get(tx->bitmap, block))\n            block++;\n        if (block == total)\n            break;\n        count++;\n        while (block < total && !infilfs_rw_bitmap_get(tx->bitmap, block))\n            block++;\n    }\n\n    ret = infilfs_rw_free_extent_index_reserve(tx, count ? count : 1u);\n    if (ret) {\n        infilfs_rw_free_extent_index_invalidate(tx);\n        return ret;\n    }\n\n    block = 0;\n    count = 0;\n    while (block < total) {\n        u64 start;\n\n        while (block < total && infilfs_rw_bitmap_get(tx->bitmap, block))\n            block++;\n        if (block == total)\n            break;\n        start = block;\n        while (block < total && !infilfs_rw_bitmap_get(tx->bitmap, block))\n            block++;\n        tx->free_extents[count].start = start;\n        tx->free_extents[count].count = block - start;\n        count++;\n    }\n\n    tx->free_extent_count = count;\n    tx->free_extent_index_valid = true;\n    return 0;\n}\n'''
          new = '''static int infilfs_rw_free_extent_index_rebuild(struct infilfs_rw_tx *tx)\n{\n    const unsigned long *bitmap;\n    unsigned long total;\n    unsigned long block = 0;\n    size_t count = 0;\n    int ret;\n\n    if (!tx || !tx->bitmap || !tx->sbi)\n        return -EINVAL;\n    if (infilfs_volume_blocks(tx->sbi) > ULONG_MAX)\n        return -EOVERFLOW;\n    total = (unsigned long)infilfs_volume_blocks(tx->sbi);\n    bitmap = (const unsigned long *)tx->bitmap;\n\n    /*\n     * The allocation bitmap is already a kernel bitmap.  The old rebuild\n     * called infilfs_rw_bitmap_get() once for every filesystem block, twice.\n     * On a 1 TiB/4 KiB volume that meant more than half a billion scalar bit\n     * tests whenever a deferred transaction started.  Use the kernel's\n     * word-at-a-time bitmap scanners instead; work now scales with bitmap\n     * words and free-run boundaries rather than logical block count.\n     */\n    while (block < total) {\n        block = find_next_zero_bit(bitmap, total, block);\n        if (block >= total)\n            break;\n        count++;\n        block = find_next_bit(bitmap, total, block);\n    }\n\n    ret = infilfs_rw_free_extent_index_reserve(tx, count ? count : 1u);\n    if (ret) {\n        infilfs_rw_free_extent_index_invalidate(tx);\n        return ret;\n    }\n\n    block = 0;\n    count = 0;\n    while (block < total) {\n        unsigned long start;\n\n        block = find_next_zero_bit(bitmap, total, block);\n        if (block >= total)\n            break;\n        start = block;\n        block = find_next_bit(bitmap, total, block);\n        tx->free_extents[count].start = (u64)start;\n        tx->free_extents[count].count = (u64)(block - start);\n        count++;\n    }\n\n    tx->free_extent_count = count;\n    tx->free_extent_index_valid = true;\n    return 0;\n}\n'''
          if s.count(old) != 1:
              raise SystemExit(f'free-index rebuild anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          t = Path('tests/native-free-extent-index-policy.sh')
          q = t.read_text()
          marker = "grep -Fq 'infilfs_rw_free_extent_index_rebuild' \"$legacy\"\n"
          addition = marker + "rebuild=\"$(sed -n '/static int infilfs_rw_free_extent_index_rebuild(/,/^}/p' \"$legacy\")\"\ngrep -Fq 'find_next_zero_bit' <<<\"$rebuild\"\ngrep -Fq 'find_next_bit' <<<\"$rebuild\"\n! grep -Fq 'infilfs_rw_bitmap_get(tx->bitmap, block)' <<<\"$rebuild\"\n"
          if q.count(marker) != 1:
              raise SystemExit(f'policy anchor count={q.count(marker)}')
          t.write_text(q.replace(marker, addition, 1))
          PY
          git diff --check
          bash tests/native-free-extent-index-policy.sh .

      - name: Compile module
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r)
          make -C kernel clean
          make -C kernel KDIR=/lib/modules/$(uname -r)/build -j"$(nproc)"

      - name: Commit repair
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_rw_legacy.inc tests/native-free-extent-index-policy.sh
          git commit -m 'Scale free-extent rebuild on large volumes'
          git push origin HEAD:main
