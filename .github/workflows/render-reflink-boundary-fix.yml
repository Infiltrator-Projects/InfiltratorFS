# SPDX-License-Identifier: GPL-3.0-or-later
name: Render reflink boundary fix

on:
  push:
    branches:
      - main
    paths:
      - 'tools/apply-reflink-boundary-fix.py'
      - '.github/workflows/render-reflink-boundary-fix.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Apply focused repair
        run: python3 tools/apply-reflink-boundary-fix.py
      - name: Validate policy and formatting
        run: |
          bash tests/native-reflink-scaling-policy.sh .
          git diff --check
      - name: Upload repaired files
        uses: actions/upload-artifact@v4
        with:
          name: reflink-boundary-fix
          path: |
            kernel/infiltratorfs_defrag.inc
            tests/native-reflink-scaling-policy.sh
