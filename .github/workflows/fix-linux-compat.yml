name: Temporary Linux compatibility repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Recover tested repair script
        shell: bash
        run: |
          git show 909a32862ec79113029badb67b0ed90e79cfebd7:.github/workflows/fix-linux-compat.yml \
            | sed -n "/python3 - <<'PY'/,/^          PY$/p" \
            | tail -n +2 | sed '$d' | sed 's/^          //' > /tmp/infiltratorfs-repair.py
          test -s /tmp/infiltratorfs-repair.py

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libfuse3-dev fuse3

      - name: Apply Linux compatibility repair
        run: python3 /tmp/infiltratorfs-repair.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit repaired implementation directly to main
        shell: bash
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/fix-linux-compat.yml
          git add fuse/infilfs_fuse.c tests/mint-sparse-fuse.sh
          git commit -m 'Fix Linux desktop filesystem compatibility'
          git push origin HEAD:main
