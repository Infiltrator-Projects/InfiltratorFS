          s = s.replace(old, new, 1)

          old = '''    cfg->hard_remove = 1;\n'''
          new = '''    cfg->hard_remove = 1;\n    cfg->use_ino = 1;\n    cfg->attr_timeout = 0.0;\n'''
          if old not in s:
              raise SystemExit('init config anchor not found')
          s = s.replace(old, new, 1)

          old = '''    .readdir = infs_readdir_cb,\n    .mkdir = infs_mkdir_cb,\n'''
          new = '''    .readdir = infs_readdir_cb,\n    .mknod = infs_mknod_cb,\n    .mkdir = infs_mkdir_cb,\n'''
          if old not in s:
              raise SystemExit('ops mknod anchor not found')
          s = s.replace(old, new, 1)

          old = '''    .chown = infs_chown_cb,\n    .utimens = infs_utimens_cb,\n    .statfs = infs_statfs_cb,\n'''
          new = '''    .chown = infs_chown_cb,\n    .utimens = infs_utimens_cb,\n    .setxattr = infs_setxattr_cb,\n    .getxattr = infs_getxattr_cb,\n    .listxattr = infs_listxattr_cb,\n    .removexattr = infs_removexattr_cb,\n    .statfs = infs_statfs_cb,\n'''
          if old not in s:
