# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_run:
    workflows: ["Build and conformance"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve exact release source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve exact current main and version
        id: source
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          if [[ "$head_commit" != "$EXPECTED_SHA" || "$main_commit" != "$EXPECTED_SHA" ]]; then
            printf 'Release source %s is not exact current main %s.\n' "$head_commit" "$main_commit" >&2
            exit 1
          fi
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          subject="$(git log -1 --format=%s "$head_commit")"
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            printf 'Release commit subject must begin with Release %s.\n' "$version" >&2
            exit 1
          fi
          echo "sha=$main_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-release:
    name: Linux release packages
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source is still current main
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]]; then
            printf 'Current main moved after release verification; publication stops.\n' >&2
            exit 1
          fi

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake desktop-file-utils fuse3 libfuse3-dev \
            pkg-config policykit-1 xdg-utils zenity

      - name: Configure, build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          desktop-file-validate packaging/infiltratorfs-manager.desktop

      - name: Build Linux packages
        env:
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$source_version" = "$VERSION"

          bash packaging/build-linux-packages.sh build dist

          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          test -f "dist/$deb"
          test -x "dist/$installer"
          test "$(dpkg-deb --field "dist/$deb" Version)" = "$VERSION"
          "dist/$installer" --verify
          "dist/$installer" --dry-run | tee dist/native-installer-dry-run.txt
          grep -Fq 'Dry run only; no packages will be installed' dist/native-installer-dry-run.txt
          grep -Fq 'Native build commands:' dist/native-installer-dry-run.txt
          rm -f dist/native-installer-dry-run.txt
          for dependency in fuse3 libfuse3-3 policykit-1 util-linux xdg-utils zenity; do
            dpkg-deb --field "dist/$deb" Depends | grep -Eq "(^|, )${dependency}([ ,]|$)"
          done

      - name: Preserve Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-linux
          path: |
            dist/infiltratorfs_${{ needs.source.outputs.version }}_amd64.deb
            dist/infiltratorfs-${{ needs.source.outputs.version }}-linux-native.run
          if-no-files-found: error
          retention-days: 30

      - name: Build Linux-created cross-platform image
        run: |
          truncate -s 64M build/linux-format08.img
          build/mkfs.infilfs -L LinuxCrossPlatform build/linux-format08.img
          printf 'linux-to-windows-format-0.11\n' > build/linux-cross-platform.txt
          build/infilfs-tool build/linux-format08.img put build/linux-cross-platform.txt /linux-cross-platform.txt
          build/infilfs-scrub build/linux-format08.img

      - name: Preserve cross-platform test image
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-test-image
          path: build/linux-format08.img
          if-no-files-found: error
          retention-days: 1

  windows-release:
    name: Windows release executable
    needs: [source, linux-release]
    runs-on: windows-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source is still current main
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          git fetch origin main --tags
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($head -ne $env:EXPECTED_SHA) { throw "Release checkout $head does not match approved source $env:EXPECTED_SHA." }
          if ($main -ne $env:EXPECTED_SHA) { throw 'Current main moved after release verification; publication stops.' }

      - name: Download Linux-created Format 0.11 image
        uses: actions/download-artifact@v4
        with:
          name: InfiltratorFS-release-test-image
          path: cross-platform

      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          & .\build\Release\infilfs-win32-storage.exe .\cross-platform\linux-format08.img

      - name: Verify Windows executable and version metadata
        shell: pwsh
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)') {
            throw 'Could not determine InfiltratorFS version from CMakeLists.txt'
          }
          if ($Matches[1] -ne $env:VERSION) { throw "Source version '$($Matches[1])' does not match release version '$env:VERSION'." }
          $exe = "build\Release\InfiltratorFS-Windows-$env:VERSION.exe"
          if (!(Test-Path $exe)) { throw "Versioned Windows executable was not built: $exe" }
          $info = (Get-Item $exe).VersionInfo
          if (!$info.FileVersion.StartsWith($env:VERSION)) { throw "FileVersion '$($info.FileVersion)' does not match $env:VERSION" }
          if (!$info.ProductVersion.StartsWith($env:VERSION)) { throw "ProductVersion '$($info.ProductVersion)' does not match $env:VERSION" }

      - name: Preserve Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-windows
          path: build/Release/InfiltratorFS-Windows-${{ needs.source.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable release
    needs: [source, linux-release, windows-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: InfiltratorFS-release-*
          path: release-assets
          merge-multiple: true

      - name: Create exact tag and publish all assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          if [[ "$main_commit" != "$EXPECTED_SHA" ]]; then
            printf 'Current main moved after release verification; publication stops.\n' >&2
            exit 1
          fi
          source_version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$source_version" = "$VERSION"
          tag="v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'Release tag %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi

          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          windows="InfiltratorFS-Windows-${VERSION}.exe"
          for asset in "$deb" "$installer" "$windows"; do
            test -s "release-assets/$asset"
          done
          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"

          (
            cd release-assets
            sha256sum "$deb" "$installer" "$windows" > SHA256SUMS.txt
          )

          git tag "$tag" "$EXPECTED_SHA"
          git push origin "$tag"

          gh release create "$tag" \
            "release-assets/$deb" \
            "release-assets/$installer" \
            "release-assets/$windows" \
            "release-assets/SHA256SUMS.txt" \
            --verify-tag \
            --target "$EXPECTED_SHA" \
            --title "InfiltratorFS $VERSION" \
            --generate-notes \
            --latest

          expected_assets=$(printf '%s\n%s\n%s\n%s\n' \
            "$deb" "$installer" "$windows" SHA256SUMS.txt | sort)
          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
            printf 'Expected:\n%s\nPublished:\n%s\n' "$expected_assets" "$published_assets" >&2
            exit 1
          fi
