# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

# published releases are immutable; this workflow only creates a new exact tag
# after the tested current main commit has passed every release qualification.

on:
  workflow_run:
    workflows: ["Build and conformance"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve exact release source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Require native kernel qualification for the same commit
        timeout-minutes: 35
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&event=push&per_page=20"
          for attempt in $(seq 1 180); do
            mapfile -t native < <(
              gh api "$api" --jq '
                first(.workflow_runs[] |
                  select(.name == "Native Linux kernel module")) |
                .status, (.conclusion // ""), .html_url'
            )
            status="${native[0]:-}"
            conclusion="${native[1]:-}"
            run_url="${native[2]:-}"
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" != success ]]; then
                printf 'Native qualification failed for %s: %s (%s)\n' \
                  "$EXPECTED_SHA" "$conclusion" "$run_url" >&2
                exit 1
              fi
              printf 'Native qualification passed for %s: %s\n' \
                "$EXPECTED_SHA" "$run_url"
              exit 0
            fi
            sleep 10
          done
          printf 'Timed out waiting for native qualification of %s.\n' \
            "$EXPECTED_SHA" >&2
          exit 1

      - name: Check out exact tested main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve exact current main and version
        id: source
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          if [[ "$head_commit" != "$EXPECTED_SHA" || "$main_commit" != "$EXPECTED_SHA" ]]; then
            printf 'Release source %s is not exact current main %s.\n' "$head_commit" "$main_commit" >&2
            exit 1
          fi
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          subject="$(git log -1 --format=%s "$head_commit")"
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            printf 'Release commit subject must begin with Release %s.\n' "$version" >&2
            exit 1
          fi
          echo "sha=$main_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-release:
    name: Native Linux release packages
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source is still current main
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Install native build and runtime dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake desktop-file-utils dkms dwarves kmod \
            policykit-1 util-linux udev udisks2 gnome-disk-utility libblockdev-fs3 \
            xdg-utils python3 python3-gi gir1.2-gtk-3.0 libglib2.0-bin xvfb \
            devscripts dpkg-dev linux-headers-generic
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"
          test -f "/lib/modules/$(uname -r)/build/Makefile"
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y libblockdev gnome-disk-utility

      - name: Configure, build and test without FUSE discovery
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=TRUE
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          desktop-file-validate packaging/infiltratorfs-manager.desktop
          test ! -e build/infilfs-fuse

      - name: Build Ubuntu 24.04 / Linux Mint 22 desktop integration bundle
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/build-noble-desktop-integration.sh "$RUNNER_TEMP/infiltratorfs-os-integration"
          test -x "$RUNNER_TEMP/infiltratorfs-os-integration/gnome-disks"
          test -s "$RUNNER_TEMP/infiltratorfs-os-integration/libbd_fs.so"
          test -s "$RUNNER_TEMP/infiltratorfs-os-integration/manifest"

      - name: Build and validate native-only Linux packages
        env:
          VERSION: ${{ needs.source.outputs.version }}
          INFILTRATORFS_OS_INTEGRATION_BUNDLE_DIR: ${{ runner.temp }}/infiltratorfs-os-integration
          INFILTRATORFS_REQUIRE_OS_INTEGRATION: "1"
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$source_version" = "$VERSION"
          (
            cd "$RUNNER_TEMP"
            bash "$GITHUB_WORKSPACE/packaging/build-linux-packages.sh" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/dist"
          )

          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          test -f "dist/$deb"
          test -x "dist/$installer"
          test "$(dpkg-deb --field "dist/$deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "dist/$deb" X-InfiltratorFS-Desktop-Integration)" = ubuntu24.04-mint22-bundled
          deb_contents_file="$RUNNER_TEMP/infiltratorfs-release-deb-contents.txt"
          dpkg-deb --contents "dist/$deb" > "$deb_contents_file"
          grep -q 'usr/lib/infiltratorfs/os-integration/gnome-disks$' "$deb_contents_file"
          grep -q 'usr/lib/infiltratorfs/os-integration/libbd_fs.so$' "$deb_contents_file"
          grep -q 'usr/lib/infiltratorfs/os-integration/manifest$' "$deb_contents_file"
          ! grep -q 'usr/bin/infilfs-fuse$' "$deb_contents_file"
          ! dpkg-deb --field "dist/$deb" Depends | grep -Eqi '(^|[, ])(fuse3|libfuse3-3)([, ]|$)'
          for dependency in dkms kmod policykit-1 util-linux xdg-utils fontconfig python3 python3-gi gir1.2-gtk-3.0; do
            dpkg-deb --field "dist/$deb" Depends | grep -Eq "(^|, )${dependency}([ ,]|$)"
          done
          "dist/$installer" --verify
          "dist/$installer" --dry-run | tee dist/native-installer-dry-run.txt
          grep -Fq 'Native kernel module commands:' dist/native-installer-dry-run.txt
          grep -Fq 'Native package version:' dist/native-installer-dry-run.txt
          native_deb="$RUNNER_TEMP/infiltratorfs_${VERSION}+native1_amd64.deb"
          "dist/$installer" --build-only "$native_deb"
          test "$(dpkg-deb --field "$native_deb" Package)" = infiltratorfs
          test "$(dpkg-deb --field "$native_deb" Version)" = "${VERSION}+native1"
          test "$(dpkg-deb --field "$native_deb" X-InfiltratorFS-Build)" = native-local
          dpkg --compare-versions "${VERSION}+native1" gt "${VERSION}"
          test "$(dpkg-deb --field "dist/$deb" X-InfiltratorFS-Build)" = generic-apt
          rm -f dist/native-installer-dry-run.txt "$native_deb"

      - name: Install package and prove native kernel mounting
        env:
          VERSION: ${{ needs.source.outputs.version }}
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          deb="dist/infiltratorfs_${VERSION}_amd64.deb"
          stock_gnome_sha="$(sha256sum /usr/bin/gnome-disks | awk '{print $1}')"
          plugin_path=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ /libbd_fs\.so\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              plugin_path="$candidate"
              break
            fi
          done <<<"$(dpkg-query -L libblockdev-fs3)"
          if [[ -z "$plugin_path" ]]; then
            echo "Could not locate the versioned libblockdev filesystem plugin." >&2
            dpkg-query -L libblockdev-fs3 >&2
            exit 1
          fi
          stock_plugin_sha="$(sha256sum "$plugin_path" | awk '{print $1}')"

          sudo dpkg -i "$deb"
          sudo /usr/lib/infiltratorfs/infiltratorfs-os-integration verify
          dpkg-divert --list /usr/bin/gnome-disks | grep -Fq 'by infiltratorfs'
          dpkg-divert --list "$plugin_path" | grep -Fq 'by infiltratorfs'
          test "$(sha256sum /usr/bin/gnome-disks | awk '{print $1}')" != "$stock_gnome_sha"
          test "$(sha256sum "$plugin_path" | awk '{print $1}')" != "$stock_plugin_sha"
          grep -aFq InfiltratorFS /usr/bin/gnome-disks
          grep -aFq infiltratorfs "$plugin_path"

          manager_output="$(xvfb-run -a /usr/bin/infiltratorfs-manager --startup-check 2>&1)"
          printf '%s\n' "$manager_output"
          grep -Fq 'infiltratorfs-manager: GTK startup PASS' <<<"$manager_output"
          ! grep -Fq 'PyGIWarning' <<<"$manager_output"

          sudo systemctl restart udisks2.service 2>/dev/null || sudo service udisks2 restart 2>/dev/null || true
          can_format=""
          for attempt in $(seq 1 10); do
            can_format="$(gdbus call --system --dest org.freedesktop.UDisks2 \
              --object-path /org/freedesktop/UDisks2/Manager \
              --method org.freedesktop.UDisks2.Manager.CanFormat infiltratorfs 2>/dev/null || true)"
            [[ "$can_format" == *"true"* ]] && break
            sleep 1
          done
          [[ "$can_format" == *"true"* ]] || {
            echo "UDisks CanFormat did not advertise InfiltratorFS: $can_format" >&2
            exit 1
          }

          sudo dpkg -r infiltratorfs
          test -z "$(dpkg-divert --list /usr/bin/gnome-disks)"
          test "$(sha256sum /usr/bin/gnome-disks | awk '{print $1}')" = "$stock_gnome_sha"
          test "$(sha256sum "$plugin_path" | awk '{print $1}')" = "$stock_plugin_sha"
          sudo dpkg -i "$deb"
          sudo /usr/lib/infiltratorfs/infiltratorfs-os-integration verify
          test ! -e /usr/bin/infilfs-fuse
          ! command -v infilfs-fuse >/dev/null 2>&1
          grep -qw infiltratorfs /proc/filesystems
          modinfo infiltratorfs >/dev/null

          image="$RUNNER_TEMP/infiltratorfs-release-native.img"
          mountpoint="$RUNNER_TEMP/infiltratorfs-release-native-mnt"
          source_file="$RUNNER_TEMP/infiltratorfs-release-32m.bin"
          loopdev=""
          mounted=0
          cleanup() {
            set +e
            if [[ "$mounted" = 1 ]]; then sudo umount "$mountpoint" || true; fi
            if [[ -n "$loopdev" ]]; then sudo losetup -d "$loopdev" || true; fi
          }
          trap cleanup EXIT

          truncate -s 128M "$image"
          /usr/bin/mkfs.infilfs -L NativeRelease "$image" >/dev/null
          python3 - "$source_file" <<'PY'
          import sys
          pattern = bytes((i * 73 + 19) & 0xff for i in range(1024 * 1024))
          with open(sys.argv[1], 'wb') as f:
              for _ in range(32):
                  f.write(pattern)
          PY
          loopdev="$(sudo losetup --find --show "$image")"
          mkdir -p "$mountpoint"
          sudo mount -i -t infiltratorfs -o rw "$loopdev" "$mountpoint"
          mounted=1
          test "$(findmnt -n -o FSTYPE -T "$mountpoint")" = infiltratorfs
          sudo dd if="$source_file" of="$mountpoint/native-release.bin" bs=4M status=none
          cmp "$source_file" "$mountpoint/native-release.bin"
          sync

          # Reinstall the exact package while its filesystem is mounted.  The
          # Debian preinst must cleanly unmount it by itself before replacing
          # the live DKMS driver; no forced or lazy detach is permitted.
          sudo dpkg -i "$deb" | tee "$RUNNER_TEMP/native-release-upgrade.txt"
          ! findmnt -rn -t infiltratorfs,fuse.infilfs-fuse | grep -q .
          grep -Fq 'clean automatic unmount complete' "$RUNNER_TEMP/native-release-upgrade.txt"
          mounted=0

          /usr/bin/infilfs-scrub "$image" | tee "$RUNNER_TEMP/native-release-scrub.txt"
          grep -Fq 'Result:              CLEAN' "$RUNNER_TEMP/native-release-scrub.txt"
          if pgrep -af infilfs-fuse; then
            echo 'FUSE process detected during native release qualification.' >&2
            exit 1
          fi
          echo 'Installed package native RW mount/read/write/sync/unmount/scrub qualification passed.'

      - name: Preserve Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-linux
          path: |
            dist/infiltratorfs_${{ needs.source.outputs.version }}_amd64.deb
            dist/infiltratorfs-${{ needs.source.outputs.version }}-linux-native.run
          if-no-files-found: error
          retention-days: 30

      - name: Build Linux-created cross-platform image
        run: |
          truncate -s 64M build/linux-cross-platform.img
          build/mkfs.infilfs -L LinuxCrossPlatform build/linux-cross-platform.img
          printf 'linux-to-windows-cross-platform\n' > build/linux-cross-platform.txt
          build/infilfs-tool build/linux-cross-platform.img put build/linux-cross-platform.txt /linux-cross-platform.txt
          build/infilfs-scrub build/linux-cross-platform.img

      - name: Preserve cross-platform test image
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-test-image
          path: build/linux-cross-platform.img
          if-no-files-found: error
          retention-days: 1

  windows-release:
    name: Windows release executable
    needs: [source, linux-release]
    runs-on: windows-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source is still current main
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          git fetch origin main --tags
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($head -ne $env:EXPECTED_SHA) { throw "Release checkout $head does not match approved source $env:EXPECTED_SHA." }
          if ($main -ne $env:EXPECTED_SHA) { throw 'Current main moved after release verification; publication stops.' }

      - name: Download Linux-created cross-platform image
        uses: actions/download-artifact@v4
        with:
          name: InfiltratorFS-release-test-image
          path: cross-platform

      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          & .\build\Release\infilfs-win32-storage.exe .\cross-platform\linux-cross-platform.img

      - name: Verify Windows executable and version metadata
        shell: pwsh
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)') { throw 'Could not determine version' }
          if ($Matches[1] -ne $env:VERSION) { throw "Source version '$($Matches[1])' does not match $env:VERSION" }
          $exe = "build\Release\InfiltratorFS-Windows-$env:VERSION.exe"
          if (!(Test-Path $exe)) { throw "Versioned Windows executable was not built: $exe" }
          $info = (Get-Item $exe).VersionInfo
          if (!$info.FileVersion.StartsWith($env:VERSION)) { throw "FileVersion mismatch" }
          if (!$info.ProductVersion.StartsWith($env:VERSION)) { throw "ProductVersion mismatch" }

      - name: Preserve Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-windows
          path: build/Release/InfiltratorFS-Windows-${{ needs.source.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable release
    needs: [source, linux-release, windows-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: InfiltratorFS-release-*
          path: release-assets
          merge-multiple: true

      - name: Create exact tag and publish all assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          source_version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$source_version" = "$VERSION"
          tag="v${VERSION}"
          ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null
          ! gh release view "$tag" >/dev/null 2>&1

          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          windows="InfiltratorFS-Windows-${VERSION}.exe"
          for asset in "$deb" "$installer" "$windows"; do test -s "release-assets/$asset"; done
          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"
          published_deb_contents_file="$RUNNER_TEMP/infiltratorfs-published-deb-contents.txt"
          dpkg-deb --contents "release-assets/$deb" > "$published_deb_contents_file"
          ! grep -q 'usr/bin/infilfs-fuse$' "$published_deb_contents_file"
          for font in mb_corpo_a_cond_regular.ttf mb_corpo_s_bold.ttf mb_corpo_s_regular.ttf; do
            grep -q "usr/share/infiltratorfs/fonts/$font$" "$published_deb_contents_file"
          done
          dpkg-deb --field "release-assets/$deb" Depends | grep -Eq '(^|, )fontconfig([ ,]|$)'
          ! dpkg-deb --field "release-assets/$deb" Depends | grep -Eqi '(^|[, ])(fuse3|libfuse3-3)([, ]|$)'

          (cd release-assets && sha256sum "$deb" "$installer" "$windows" > SHA256SUMS.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$tag" "$EXPECTED_SHA" \
            --message "InfiltratorFS $VERSION"
          test "$(git cat-file -t "refs/tags/${tag}")" = tag
          git push origin "$tag"
          gh release create "$tag" \
            "release-assets/$deb" \
            "release-assets/$installer" \
            "release-assets/$windows" \
            "release-assets/SHA256SUMS.txt" \
            --verify-tag --target "$EXPECTED_SHA" \
            --title "InfiltratorFS $VERSION" --generate-notes --latest

          expected_assets=$(printf '%s\n%s\n%s\n%s\n' "$deb" "$installer" "$windows" SHA256SUMS.txt | sort)
          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$published_assets" = "$expected_assets"

      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
          APP_ID: infiltratorfs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository's five-minute safety refresh."
            fi
          else
            echo "::warning::Immediate APT dispatch token is unavailable; waiting for the repository's five-minute safety refresh."
          fi
          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done
          echo "::error::GitHub release was published, but the central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
