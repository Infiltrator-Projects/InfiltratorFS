# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

# published releases are immutable; this workflow only creates a new exact tag
# after the tested current main commit has passed every release qualification.

on:
  workflow_run:
    workflows: ["Build and conformance"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve exact release source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Require native kernel qualification for the same commit
        timeout-minutes: 35
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&event=push&per_page=20"
          for attempt in $(seq 1 180); do
            mapfile -t native < <(
              gh api "$api" --jq '
                first(.workflow_runs[] |
                  select(.name == "Native Linux kernel module")) |
                .status, (.conclusion // ""), .html_url'
            )
            status="${native[0]:-}"
            conclusion="${native[1]:-}"
            run_url="${native[2]:-}"
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" != success ]]; then
                printf 'Native qualification failed for %s: %s (%s)\n' \
                  "$EXPECTED_SHA" "$conclusion" "$run_url" >&2
                exit 1
              fi
              printf 'Native qualification passed for %s: %s\n' \
                "$EXPECTED_SHA" "$run_url"
              exit 0
            fi
            sleep 10
          done
          printf 'Timed out waiting for native qualification of %s.\n' \
            "$EXPECTED_SHA" >&2
          exit 1

      - name: Check out exact tested main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve exact current main and version
        id: source
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          if [[ "$head_commit" != "$EXPECTED_SHA" || "$main_commit" != "$EXPECTED_SHA" ]]; then
            printf 'Release source %s is not exact current main %s.\n' "$head_commit" "$main_commit" >&2
            exit 1
          fi
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          subject="$(git log -1 --format=%s "$head_commit")"
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            printf 'Release commit subject must begin with Release %s.\n' "$version" >&2
            exit 1
          fi
          echo "sha=$main_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-release:
    name: Native Linux release packages
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source is still current main
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Install native build and runtime dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake desktop-file-utils dkms dwarves kmod \
            policykit-1 util-linux udev udisks2 xdg-utils zenity \
            linux-headers-generic
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"
          test -f "/lib/modules/$(uname -r)/build/Makefile"

      - name: Configure, build and test without FUSE discovery
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=TRUE
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          desktop-file-validate packaging/infiltratorfs-manager.desktop
          test ! -e build/infilfs-fuse

      - name: Build and validate native-only Linux packages
        env:
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$source_version" = "$VERSION"
          bash packaging/build-linux-packages.sh build dist

          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          test -f "dist/$deb"
          test -x "dist/$installer"
          test "$(dpkg-deb --field "dist/$deb" Version)" = "$VERSION"
          ! dpkg-deb --contents "dist/$deb" | grep -q 'usr/bin/infilfs-fuse$'
          ! dpkg-deb --field "dist/$deb" Depends | grep -Eqi '(^|[, ])(fuse3|libfuse3-3)([, ]|$)'
          for dependency in dkms kmod policykit-1 util-linux xdg-utils zenity; do
            dpkg-deb --field "dist/$deb" Depends | grep -Eq "(^|, )${dependency}([ ,]|$)"
          done
          "dist/$installer" --verify
          "dist/$installer" --dry-run | tee dist/native-installer-dry-run.txt
          grep -Fq 'Native kernel module commands:' dist/native-installer-dry-run.txt
          grep -Fq 'Native package version:' dist/native-installer-dry-run.txt
          native_deb="$RUNNER_TEMP/infiltratorfs_${VERSION}+native1_amd64.deb"
          "dist/$installer" --build-only "$native_deb"
          test "$(dpkg-deb --field "$native_deb" Package)" = infiltratorfs
          test "$(dpkg-deb --field "$native_deb" Version)" = "${VERSION}+native1"
          test "$(dpkg-deb --field "$native_deb" X-InfiltratorFS-Build)" = native-local
          dpkg --compare-versions "${VERSION}+native1" gt "${VERSION}"
          test "$(dpkg-deb --field "dist/$deb" X-InfiltratorFS-Build)" = generic-apt
          rm -f dist/native-installer-dry-run.txt "$native_deb"

      - name: Install package and prove native kernel mounting
        env:
          VERSION: ${{ needs.source.outputs.version }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          deb="dist/infiltratorfs_${VERSION}_amd64.deb"
          sudo dpkg -i "$deb"
          test ! -e /usr/bin/infilfs-fuse
          ! command -v infilfs-fuse >/dev/null 2>&1
          grep -qw infiltratorfs /proc/filesystems
          modinfo infiltratorfs >/dev/null

          image="$RUNNER_TEMP/infiltratorfs-release-native.img"
          mountpoint="$RUNNER_TEMP/infiltratorfs-release-native-mnt"
          source_file="$RUNNER_TEMP/infiltratorfs-release-32m.bin"
          loopdev=""
          mounted=0
          cleanup() {
            set +e
            if [[ "$mounted" = 1 ]]; then sudo umount "$mountpoint" || true; fi
            if [[ -n "$loopdev" ]]; then sudo losetup -d "$loopdev" || true; fi
          }
          trap cleanup EXIT

          truncate -s 128M "$image"
          /usr/bin/mkfs.infilfs -L NativeRelease "$image" >/dev/null
          python3 - "$source_file" <<'PY'
          import sys
          pattern = bytes((i * 73 + 19) & 0xff for i in range(1024 * 1024))
          with open(sys.argv[1], 'wb') as f:
              for _ in range(32):
                  f.write(pattern)
          PY
          loopdev="$(sudo losetup --find --show "$image")"
          mkdir -p "$mountpoint"
          sudo mount -i -t infiltratorfs -o rw "$loopdev" "$mountpoint"
          mounted=1
          test "$(findmnt -n -o FSTYPE -T "$mountpoint")" = infiltratorfs
          sudo dd if="$source_file" of="$mountpoint/native-release.bin" bs=4M status=none
          cmp "$source_file" "$mountpoint/native-release.bin"
          sync
          sudo umount "$mountpoint"
          mounted=0
          /usr/bin/infilfs-scrub "$image" | tee "$RUNNER_TEMP/native-release-scrub.txt"
          grep -Fq 'Result:              CLEAN' "$RUNNER_TEMP/native-release-scrub.txt"
          if pgrep -af infilfs-fuse; then
            echo 'FUSE process detected during native release qualification.' >&2
            exit 1
          fi
          echo 'Installed package native RW mount/read/write/sync/unmount/scrub qualification passed.'

      - name: Preserve Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-linux
          path: |
            dist/infiltratorfs_${{ needs.source.outputs.version }}_amd64.deb
            dist/infiltratorfs-${{ needs.source.outputs.version }}-linux-native.run
          if-no-files-found: error
          retention-days: 30

      - name: Build Linux-created cross-platform image
        run: |
          truncate -s 64M build/linux-cross-platform.img
          build/mkfs.infilfs -L LinuxCrossPlatform build/linux-cross-platform.img
          printf 'linux-to-windows-cross-platform\n' > build/linux-cross-platform.txt
          build/infilfs-tool build/linux-cross-platform.img put build/linux-cross-platform.txt /linux-cross-platform.txt
          build/infilfs-scrub build/linux-cross-platform.img

      - name: Preserve cross-platform test image
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-test-image
          path: build/linux-cross-platform.img
          if-no-files-found: error
          retention-days: 1

  windows-release:
    name: Windows release executable
    needs: [source, linux-release]
    runs-on: windows-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release source is still current main
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          git fetch origin main --tags
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($head -ne $env:EXPECTED_SHA) { throw "Release checkout $head does not match approved source $env:EXPECTED_SHA." }
          if ($main -ne $env:EXPECTED_SHA) { throw 'Current main moved after release verification; publication stops.' }

      - name: Download Linux-created cross-platform image
        uses: actions/download-artifact@v4
        with:
          name: InfiltratorFS-release-test-image
          path: cross-platform

      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          & .\build\Release\infilfs-win32-storage.exe .\cross-platform\linux-cross-platform.img

      - name: Verify Windows executable and version metadata
        shell: pwsh
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)') { throw 'Could not determine version' }
          if ($Matches[1] -ne $env:VERSION) { throw "Source version '$($Matches[1])' does not match $env:VERSION" }
          $exe = "build\Release\InfiltratorFS-Windows-$env:VERSION.exe"
          if (!(Test-Path $exe)) { throw "Versioned Windows executable was not built: $exe" }
          $info = (Get-Item $exe).VersionInfo
          if (!$info.FileVersion.StartsWith($env:VERSION)) { throw "FileVersion mismatch" }
          if (!$info.ProductVersion.StartsWith($env:VERSION)) { throw "ProductVersion mismatch" }

      - name: Preserve Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-release-windows
          path: build/Release/InfiltratorFS-Windows-${{ needs.source.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable release
    needs: [source, linux-release, windows-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: InfiltratorFS-release-*
          path: release-assets
          merge-multiple: true

      - name: Create exact tag and publish all assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          source_version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$source_version" = "$VERSION"
          tag="v${VERSION}"
          ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null
          ! gh release view "$tag" >/dev/null 2>&1

          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          windows="InfiltratorFS-Windows-${VERSION}.exe"
          for asset in "$deb" "$installer" "$windows"; do test -s "release-assets/$asset"; done
          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"
          ! dpkg-deb --contents "release-assets/$deb" | grep -q 'usr/bin/infilfs-fuse$'
          ! dpkg-deb --field "release-assets/$deb" Depends | grep -Eqi '(^|[, ])(fuse3|libfuse3-3)([, ]|$)'

          (cd release-assets && sha256sum "$deb" "$installer" "$windows" > SHA256SUMS.txt)
          git tag "$tag" "$EXPECTED_SHA"
          git push origin "$tag"
          gh release create "$tag" \
            "release-assets/$deb" \
            "release-assets/$installer" \
            "release-assets/$windows" \
            "release-assets/SHA256SUMS.txt" \
            --verify-tag --target "$EXPECTED_SHA" \
            --title "InfiltratorFS $VERSION" --generate-notes --latest

          expected_assets=$(printf '%s\n%s\n%s\n%s\n' "$deb" "$installer" "$windows" SHA256SUMS.txt | sort)
          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$published_assets" = "$expected_assets"
