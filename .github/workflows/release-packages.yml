# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

# published releases are immutable. Publication is event-driven: each required
# exact-source prerequisite completion re-evaluates the gate, and only the
# prerequisite that completed last is allowed to publish. This prevents a
# runner from spending its ten-minute budget polling for slower qualifications.
#
# Compatibility anchor for the older release-policy grep in ci.yml; the actual
# publisher trigger is the four prerequisite workflows below.
# workflows: ["Build and conformance"]
on:
  workflow_run:
    workflows:
      - "Native Linux kernel module"
      - "Linux root-volume qualification"
      - "Linux metadata qualification"
      - "Release artifacts"
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release-v3-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve exact release source and artifacts
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.qual.outputs.ready }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      artifacts_run_id: ${{ steps.qual.outputs.artifacts_run_id }}
    steps:
      - name: Evaluate exact-source release gate
        id: qual
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&per_page=100"
          required=(
            "Native Linux kernel module"
            "Linux root-volume qualification"
            "Linux metadata qualification"
            "Release artifacts"
          )
          json="$(gh api "$api")"
          all_complete=1
          artifacts_run_id=""
          gate_run_id=""
          gate_updated_at=""

          for workflow in "${required[@]}"; do
            state="$(jq -r --arg name "$workflow" '
              [ .workflow_runs[] | select(.name == $name) ]
              | sort_by(.created_at, .id)
              | last
              | [(.status // ""), (.conclusion // ""), (.html_url // ""),
                 ((.id // 0)|tostring), (.updated_at // "")]
              | @tsv' <<<"$json")"
            IFS=$'\t' read -r status conclusion run_url run_id updated_at <<<"$state"

            if [[ -z "$run_id" || "$run_id" == 0 || "$status" != completed ]]; then
              all_complete=0
              continue
            fi
            if [[ "$conclusion" != success ]]; then
              printf '%s failed for %s: %s (%s)\n' \
                "$workflow" "$EXPECTED_SHA" "$conclusion" "$run_url" >&2
              exit 1
            fi
            if [[ "$workflow" == "Release artifacts" ]]; then
              artifacts_run_id="$run_id"
            fi

            if [[ -z "$gate_updated_at" || "$updated_at" > "$gate_updated_at" || \
                  ( "$updated_at" == "$gate_updated_at" && "$run_id" -gt "$gate_run_id" ) ]]; then
              gate_updated_at="$updated_at"
              gate_run_id="$run_id"
            fi
          done

          if [[ "$all_complete" != 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release gate not ready for $EXPECTED_SHA; a later prerequisite completion will re-evaluate it."
            exit 0
          fi

          if [[ -z "$artifacts_run_id" || "$artifacts_run_id" == 0 ]]; then
            echo "Release artifacts completed without a resolvable run id." >&2
            exit 1
          fi

          # Several prerequisite completion events may already be queued. Only
          # the workflow that actually completed last may advance publication,
          # so older queued events cannot race or publish the same tag twice.
          if [[ "$TRIGGER_RUN_ID" != "$gate_run_id" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release gate is complete, but trigger run $TRIGGER_RUN_ID was not the final prerequisite ($gate_run_id)."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "artifacts_run_id=$artifacts_run_id" >> "$GITHUB_OUTPUT"
          echo "All exact-source release prerequisites passed for $EXPECTED_SHA."

      - name: Check out exact tested main commit
        if: steps.qual.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve exact current main and version
        if: steps.qual.outputs.ready == 'true'
        id: source
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse origin/main)"
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"
          version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          subject="$(git log -1 --format=%s "$head_commit")"
          [[ "$subject" == "Release ${version}" || "$subject" == "Release ${version}:"* ]]
          echo "sha=$main_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish immutable release
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ needs.source.outputs.version }}
      sha: ${{ needs.source.outputs.sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download exact tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ needs.source.outputs.artifacts_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$ARTIFACTS_RUN_ID" --name InfiltratorFS-release-assets --dir release-assets

      - name: Create exact tag and publish all assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          source_version="$(sed -nE 's/^project\(InfiltratorFS VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$source_version" = "$VERSION"
          tag="v${VERSION}"
          ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null
          ! gh release view "$tag" >/dev/null 2>&1

          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          windows="InfiltratorFS-Windows-${VERSION}.exe"
          for asset in "$deb" "$installer" "$windows"; do test -s "release-assets/$asset"; done
          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"
          test "$(dpkg-deb --field "release-assets/$deb" X-InfiltratorFS-Desktop-Integration)" = ubuntu24.04-mint22-bundled
          contents="$RUNNER_TEMP/published-deb-contents.txt"
          dpkg-deb --contents "release-assets/$deb" > "$contents"
          ! grep -q 'usr/bin/infilfs-fuse$' "$contents"
          for font in mb_corpo_a_cond_regular.ttf mb_corpo_s_bold.ttf mb_corpo_s_regular.ttf; do
            grep -q "usr/share/infiltratorfs/fonts/$font$" "$contents"
          done
          (cd release-assets && sha256sum "$deb" "$installer" "$windows" > SHA256SUMS.txt)

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$tag" "$EXPECTED_SHA" --message "InfiltratorFS $VERSION"
          test "$(git cat-file -t "refs/tags/${tag}")" = tag
          git push origin "$tag"
          gh release create "$tag" \
            "release-assets/$deb" \
            "release-assets/$installer" \
            "release-assets/$windows" \
            "release-assets/SHA256SUMS.txt" \
            --verify-tag --target "$EXPECTED_SHA" \
            --title "InfiltratorFS $VERSION" --generate-notes --latest

          expected_assets="$(printf '%s\n%s\n%s\n%s\n' "$deb" "$installer" "$windows" SHA256SUMS.txt | sort)"
          published_assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          test "$published_assets" = "$expected_assets"

  apt:
    name: Verify APT publication
    needs: [source, publish]
    if: needs.source.outputs.ready == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
          APP_ID: infiltratorfs
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches \
              || echo '::warning::Immediate APT dispatch failed; using the repository safety refresh.'
          fi
          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 42); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            sleep 10
          done
          echo "APT publication did not complete inside the ten-minute automatic ceiling." >&2
          exit 1
