# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

# Published releases are immutable. Every required exact-source prerequisite
# completion re-evaluates the gate. Once all prerequisites are green for the
# same current main SHA, publication is safe to run; concurrency serializes
# duplicate gate evaluations and the publication step is deliberately
# idempotent. Completions from a superseded main SHA are clean no-ops.
on:
  workflow_run:
    workflows:
      - "Native Linux kernel module"
      - "Linux root-volume qualification"
      - "Linux metadata qualification"
      - "Release candidate Linux"
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release-v6-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve exact release source and artifacts
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.qual.outputs.ready }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      artifacts_run_id: ${{ steps.qual.outputs.artifacts_run_id }}
    steps:
      - name: Check out exact prerequisite source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve semantic release request
        id: release
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash tools/release/resolve-request.sh . "$GITHUB_OUTPUT"

      - name: Evaluate exact-source release gate
        if: steps.release.outputs.requested == 'true'
        id: qual
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$EXPECTED_SHA" != "$current_main_sha" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Superseded release source $EXPECTED_SHA; current main is $current_main_sha."
            exit 0
          fi

          api="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&per_page=100"
          required=(
            "Native Linux kernel module"
            "Linux root-volume qualification"
            "Linux metadata qualification"
            "Release candidate Linux"
          )
          json="$(gh api "$api")"
          all_complete=1
          artifacts_run_id=""

          for workflow in "${required[@]}"; do
            state="$(jq -r --arg name "$workflow" '
              [ .workflow_runs[] | select(.name == $name) ]
              | sort_by(.created_at, .id)
              | last
              | [(.status // ""), (.conclusion // ""), (.html_url // ""),
                 ((.id // 0)|tostring)]
              | @tsv' <<<"$json")"
            IFS=$'\t' read -r status conclusion run_url run_id <<<"$state"

            if [[ -z "$run_id" || "$run_id" == 0 || "$status" != completed || "$conclusion" == skipped ]]; then
              all_complete=0
              continue
            fi
            if [[ "$conclusion" != success ]]; then
              printf '%s failed for %s: %s (%s)\n' \
                "$workflow" "$EXPECTED_SHA" "$conclusion" "$run_url" >&2
              exit 1
            fi
            if [[ "$workflow" == "Release candidate Linux" ]]; then
              artifacts_run_id="$run_id"
            fi
          done

          if [[ "$all_complete" != 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release gate not ready for $EXPECTED_SHA; another prerequisite completion will re-evaluate it."
            exit 0
          fi
          if [[ -z "$artifacts_run_id" || "$artifacts_run_id" == 0 ]]; then
            echo "Release candidate completed without a resolvable run id." >&2
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "artifacts_run_id=$artifacts_run_id" >> "$GITHUB_OUTPUT"
          echo "All exact-source release prerequisites passed for $EXPECTED_SHA."

  publish:
    name: Publish immutable release
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ needs.source.outputs.version }}
      sha: ${{ needs.source.outputs.sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download exact tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ needs.source.outputs.artifacts_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$ARTIFACTS_RUN_ID" --name InfiltratorFS-Linux --dir release-assets
          test -s release-assets/SHA256SUMS.txt
          (
            cd release-assets
            sha256sum -c SHA256SUMS.txt
          )

      - name: Publish or verify exact immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source_version="$(bash tools/project-version.sh CMakeLists.txt)"
          test "$source_version" = "$VERSION"

          tag="v${VERSION}"
          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          for asset in "$deb" "$installer" SHA256SUMS.txt; do
            test -s "release-assets/$asset"
          done
          expected_assets="$(printf '%s\n' "SHA256SUMS.txt" "$deb" "$installer" | sort)"
          actual_assets="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual_assets" = "$expected_assets"
          (
            cd release-assets
            sha256sum -c SHA256SUMS.txt
          )

          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_sha" != "$EXPECTED_SHA" ]]; then
              echo "Existing tag $tag points to $tagged_sha, expected $EXPECTED_SHA." >&2
              exit 1
            fi
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$tag" "$EXPECTED_SHA" --message "InfiltratorFS $VERSION"
            test "$(git cat-file -t "refs/tags/${tag}")" = tag
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            state="$(gh release view "$tag" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"
            IFS=$'\t' read -r is_draft is_prerelease <<<"$state"
            test "$is_draft" = false
            test "$is_prerelease" = false
          else
            mapfile -t publish_assets < <(find release-assets -maxdepth 1 -type f -printf '%p\n' | sort)
            gh release create "$tag" "${publish_assets[@]}" \
              --verify-tag --target "$EXPECTED_SHA" \
              --title "InfiltratorFS $VERSION" --generate-notes --latest
          fi

          published_dir="$RUNNER_TEMP/published-release"
          rm -rf "$published_dir"
          mkdir -p "$published_dir"
          gh release download "$tag" --dir "$published_dir"
          published_assets="$(find "$published_dir" -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$published_assets" = "$expected_assets"
          for asset in "$deb" "$installer" SHA256SUMS.txt; do
            cmp -s "release-assets/$asset" "$published_dir/$asset" || {
              echo "Published asset $asset differs from the qualified artifact." >&2
              exit 1
            }
          done
          echo "Release $tag is published from exact qualified bytes for $EXPECTED_SHA."

  apt:
    name: Defer APT publication to central pull
    needs: [source, publish]
    if: needs.source.outputs.ready == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record pull-based APT publication
        shell: bash
        run: |
          set -euo pipefail
          echo "Central APT publication is pull-based."
          echo "Infiltrator-Repository will discover this immutable GitHub release on its own schedule."
