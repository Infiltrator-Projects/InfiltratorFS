# one-shot trigger
name: Apply Linux manager visual polish

on:
  push:
    paths:
      - '.github/workflows/apply-linux-manager-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply MBLINK-family visual hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/infiltratorfs-manager')
          text = path.read_text(encoding='utf-8')
          start = text.index('CSS = b"""')
          end = text.index('"""\n\n\nclass Manager', start) + 3
          css = r'''CSS = b"""
* {
    font-family: "MB Corpo S Title WEB";
    font-weight: 400;
    color: #eef1f3;
}
window, dialog, messagedialog, filechooser {
    background: #050608;
    color: #eef1f3;
}
headerbar {
    min-height: 42px;
    background-image: linear-gradient(to bottom, #24262a, #17191d);
    color: #eef1f3;
    border-bottom: 1px solid #3a4046;
    box-shadow: inset 0 -1px rgba(255,255,255,0.025);
}
headerbar .title {
    font-family: "MB Corpo A Title Cond WEB";
    font-size: 16px;
    font-weight: 400;
    color: #f1f3f5;
}
headerbar .subtitle {
    color: #aeb6bd;
    font-size: 11px;
}
button {
    min-height: 30px;
    padding: 0 12px;
    background-image: linear-gradient(to bottom, #1d2227, #14181c);
    color: #eef1f3;
    border: 1px solid #3b4249;
    border-radius: 4px;
    font-family: "MB Corpo S Title WEB";
    font-weight: 700;
}
button:hover {
    background-image: linear-gradient(to bottom, #252b31, #191e23);
    border-color: #56606a;
}
button:active, button:checked {
    background-image: none;
    background-color: #0c1014;
    border-color: #00adef;
}
button:disabled {
    background-image: none;
    background-color: #0d1014;
    color: #626a72;
    border-color: #262b30;
}
button.suggested-action {
    background-image: linear-gradient(to bottom, #17b8f3, #00a4e4);
    color: #031018;
    border-color: #2dc1f5;
}
button.suggested-action:hover {
    background-image: linear-gradient(to bottom, #39c7f7, #0aafea);
    border-color: #54cef8;
}
button.destructive-action {
    background-image: linear-gradient(to bottom, #2c171b, #1e1013);
    color: #f0c7ca;
    border-color: #71343a;
}
entry, spinbutton, textview, textview text {
    background-image: none;
    background-color: #0b0e11;
    color: #eef1f3;
    border-color: #353a40;
    caret-color: #00adef;
}
entry selection, textview text selection {
    background-color: #00adef;
    color: #031018;
}
stackswitcher button {
    background-image: none;
    background-color: transparent;
    color: #8f979e;
    border-color: transparent;
    border-radius: 0;
    padding: 0 14px;
}
stackswitcher button:checked {
    color: #eef1f3;
    border-bottom: 2px solid #00adef;
}
scrollbar trough { background-color: #090c0f; }
scrollbar slider {
    background-color: #353a40;
    border-color: #353a40;
}
scrollbar slider:hover { background-color: #4a525b; }
separator { background-color: #353a40; }

.sidebar {
    background-image: linear-gradient(to right, #11151a, #0c0f13);
    border-right: 1px solid #343a40;
}
.sidebar-header {
    padding: 20px 18px 12px 18px;
}
.sidebar-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.10em;
    color: #b7bec4;
}
.sidebar-count {
    padding: 10px 18px 14px 18px;
    color: #79828a;
    font-size: 11px;
}
.device-list { background: transparent; }
.device-list row {
    border: 1px solid transparent;
    border-radius: 5px;
    margin: 3px 10px;
}
.device-list row:hover {
    background: rgba(255,255,255,0.028);
}
.device-list row:selected {
    background-image: linear-gradient(to right, rgba(0,173,239,0.14), rgba(0,173,239,0.035));
    border-color: #293943;
    border-left-color: #00adef;
}
.device-list row:selected .device-name { color: #eef1f3; }
.device-list row:selected .device-meta { color: #9fdcf1; }
.device-row { padding: 11px 12px; }
.device-row image { color: #c7cdd2; opacity: 0.90; }
.device-list row:selected .device-row image { color: #00adef; opacity: 1; }
.device-name {
    font-size: 14px;
    font-weight: 700;
    color: #eef1f3;
}
.device-meta { color: #8f979e; font-size: 12px; }

.content { padding: 30px 34px 24px 34px; }
.hero { margin-bottom: 6px; }
.hero-icon {
    min-width: 54px;
    min-height: 54px;
    padding: 11px;
    border: 1px solid #3e464f;
    border-radius: 8px;
    background-image: linear-gradient(155deg, #20262c, #11161b 58%, #080a0d);
    color: #00adef;
}
.hero-title {
    color: #f1f3f5;
    font-family: "MB Corpo A Title Cond WEB";
    font-size: 27px;
    font-weight: 400;
}
.hero-path { color: #8f979e; font-size: 12px; }
.badge {
    padding: 4px 9px;
    border-radius: 999px;
    background: #14181c;
    border: 1px solid #3b4147;
    color: #9ca4ab;
    font-size: 11px;
    font-weight: 700;
}
.badge-mounted {
    background: rgba(0,173,239,0.10);
    border-color: rgba(0,173,239,0.46);
    color: #00adef;
}

.section-title { color: #edf0f2; font-size: 16px; font-weight: 700; }
.section-subtitle { color: #8f979e; font-size: 12px; }
.card {
    padding: 18px;
    border: 1px solid #353c43;
    border-radius: 8px;
    background-image: linear-gradient(155deg, #171c21, #0b0e11);
}
.stat-card {
    padding: 15px 16px;
    border: 1px solid #394149;
    border-radius: 7px;
    background-image: linear-gradient(155deg, #20262c, #11161b 58%, #080a0d);
}
.stat-caption { color: #7f8991; font-size: 10px; font-weight: 700; }
.stat-value { color: #f0f2f4; font-size: 17px; font-weight: 700; }
.detail-caption { color: #7e858c; font-size: 11px; }
.detail-value { color: #eef1f3; font-weight: 700; }

.action-row { padding: 12px 12px; border-radius: 5px; }
.action-row:hover { background: rgba(255,255,255,0.025); }
.action-row image { color: #aeb6bd; }
.action-title { color: #eef1f3; font-weight: 700; }
.action-description { color: #8f979e; font-size: 12px; }
.danger-zone {
    padding: 16px;
    border: 1px solid #663239;
    border-radius: 7px;
    background-image: linear-gradient(to right, #1b0f12, #120a0c);
}

.empty-state {
    min-width: 460px;
    padding: 36px 46px;
    border: 1px solid #3a424a;
    border-radius: 10px;
    background-image: linear-gradient(155deg, #181d22, #0d1115 62%, #080a0d);
    box-shadow: 0 18px 48px rgba(0,0,0,0.40);
}
.empty-state image {
    color: #cfd4d8;
    opacity: 0.92;
}
.empty-title {
    color: #f1f3f5;
    font-family: "MB Corpo A Title Cond WEB";
    font-size: 30px;
    font-weight: 400;
}
.empty-copy { color: #9ca4ab; font-size: 13px; }

.activity-frame {
    border: 1px solid #353c43;
    border-radius: 7px;
    background: #0b0e11;
}
.activity, .activity text {
    background: #0b0e11;
    color: #e8ecef;
    font-family: "MB Corpo S Title WEB";
    font-weight: 400;
}
.statusbar {
    padding: 8px 12px;
    border-top: 1px solid #2d3339;
    background: #0a0d10;
}
.status-text { color: #7f8991; font-size: 11px; }
"""'''
          text = text[:start] + css + text[end:]
          text = text.replace('self.set_default_size(1180, 760)', 'self.set_default_size(1220, 780)')
          text = text.replace('paned.set_position(310)', 'paned.set_position(286)')
          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile tools/infiltratorfs-manager
          python3 tests/ci-duration-policy.py
          grep -q 'min-width: 460px' tools/infiltratorfs-manager
          grep -q 'linear-gradient(155deg, #181d22' tools/infiltratorfs-manager
          grep -q 'paned.set_position(286)' tools/infiltratorfs-manager

      - name: Commit polished manager and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/apply-linux-manager-polish.yml
          git add tools/infiltratorfs-manager
          git commit -m 'Polish Linux manager visual hierarchy'
          git push origin HEAD:main
