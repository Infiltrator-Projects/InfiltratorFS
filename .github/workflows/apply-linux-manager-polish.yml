name: Apply Linux manager visual polish

on:
  push:
    paths:
      - 'tools/apply-linux-manager-polish.py'
      - '.github/workflows/apply-linux-manager-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply visual polish
        run: |
          set -euo pipefail
          python3 tools/apply-linux-manager-polish.py
          python3 -m py_compile tools/infiltratorfs-manager
          grep -q 'min-width: 460px' tools/infiltratorfs-manager
          grep -q 'paned.set_position(286)' tools/infiltratorfs-manager

      - name: Commit polished manager
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add tools/infiltratorfs-manager
          git commit -m 'Polish Linux manager visual hierarchy'
          git push origin HEAD:main
