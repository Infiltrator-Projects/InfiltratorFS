# SPDX-License-Identifier: GPL-3.0-or-later
name: Repair current compression integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-current-compression.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repair native compression paths and desktop regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          data = Path('kernel/infiltratorfs_rw_data.inc')
          text = data.read_text()
          old = '''        if (current_pos == (u64)i_size_read(inode) &&
            (current_pos & (INFILFS_DISK_BLOCK_SIZE - 1u)) == 0 &&
            (le64_to_cpu(sbi->disk.incompat_flags) &
             INFILFS_INCOMPAT_COMPRESSED_EXTENTS) != 0)
            chunk = min_t(size_t, chunk,
                (size_t)INFILFS_COMPRESSION_CLUSTER_BLOCKS <<
                    INFILFS_DISK_BLOCK_SHIFT);'''
          new = '''        if (current_pos == (u64)i_size_read(inode) &&
            (current_pos & (INFILFS_DISK_BLOCK_SIZE - 1u)) == 0 &&
            (le64_to_cpu(pending->tx.next_sb.incompat_flags) &
             INFILFS_INCOMPAT_COMPRESSED_EXTENTS) != 0)
            chunk = min_t(size_t, chunk,
                (size_t)INFILFS_COMPRESSION_CLUSTER_BLOCKS <<
                    INFILFS_DISK_BLOCK_SHIFT);'''
          if old not in text:
              raise SystemExit('native compression chunk-cap anchor not found')
          data.write_text(text.replace(old, new, 1))

          rw = Path('kernel/infiltratorfs_rw.inc')
          text = rw.read_text()
          old = '''    for (i = 0; i < count; ++i)
        if (le32_to_cpu(extents[i].flags) == INFILFS_EXTENT_NORMAL)
            allocated += le32_to_cpu(extents[i].block_count);
    return allocated;'''
          new = '''    for (i = 0; i < count; ++i) {
        u32 flags = le32_to_cpu(extents[i].flags);
        u32 blocks = le32_to_cpu(extents[i].block_count);

        if (infilfs_extent_kind(flags) == INFILFS_EXTENT_NORMAL)
            allocated += infilfs_extent_physical_blocks(blocks, flags);
    }
    return allocated;'''
          if old not in text:
              raise SystemExit('native allocation accounting anchor not found')
          rw.write_text(text.replace(old, new, 1))
          PY

          # The current desktop test was accidentally duplicated/corrupted by
          # the signature-wipe test commit. Restore the last qualified clean
          # version now; resize work will reintroduce its wipe/resize cases in
          # a clean, dedicated qualification rather than retaining invalid shell.
          git show 1f10bba58fac4c7ffa4edd0528b0b572a2605537:tests/desktop-integration.sh \
            > tests/desktop-integration.sh

          rm .github/workflows/repair-current-compression.yml
          git config user.name 'InfiltratorFS CI Repair'
          git config user.email 'infiltratorfs-ci@users.noreply.github.com'
          git add kernel/infiltratorfs_rw_data.inc kernel/infiltratorfs_rw.inc \
                  tests/desktop-integration.sh .github/workflows/repair-current-compression.yml
          git commit -m 'Compression: fix mounted native IAC1 integration'
          git push origin HEAD:main
