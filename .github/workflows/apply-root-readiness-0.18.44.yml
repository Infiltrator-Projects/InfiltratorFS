# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply 0.18.44 root readiness

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-root-readiness-0.18.44.py'
      - '.github/workflows/apply-root-readiness-0.18.44.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install qualification dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake dkms e2fsprogs kmod libcap2-bin \
            linux-headers-generic rsync python3
      - name: Apply root-readiness implementation
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply-root-readiness-0.18.44.py
          python3 tools/apply-root-readiness-0.18.44.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/root-readiness-policy.sh')
          s = p.read_text().replace(
              '"$root/kernel" "$root/src" "$root/include" "$root/tests"',
              '"$root/kernel" "$root/src" "$root/include"')
          p.write_text(s)

          p = Path('tests/compression-metrics.c')
          s = p.read_text()
          s = s.replace(
              '#include "infilfs/fs.h"\n#include "infilfs/volume.h"\n',
              '#include "infilfs/format_volume.h"\n#include "infilfs/fs.h"\n#include "infilfs/storage.h"\n#include "infilfs/volume.h"\n')
          old = '''struct image { unsigned char *bytes; size_t size; };
          static infs_status rd(void *c, uint64_t o, void *b, size_t s) {
              struct image *i=c; if (o>i->size || s>i->size-(size_t)o) return INFS_STATUS_IO_ERROR;
              memcpy(b,i->bytes+(size_t)o,s); return INFS_STATUS_OK;
          }
          static infs_status wr(void *c, uint64_t o, const void *b, size_t s) {
              struct image *i=c; if (o>i->size || s>i->size-(size_t)o) return INFS_STATUS_IO_ERROR;
              memcpy(i->bytes+(size_t)o,b,s); return INFS_STATUS_OK;
          }
          static infs_status fl(void *c){(void)c; return INFS_STATUS_OK;}
          '''
          new = '''struct image { unsigned char *bytes; size_t size; uint64_t random_state; };
          static infs_status rd(void *c, uint64_t o, void *b, size_t s) {
              struct image *i=c; if (o>i->size || s>i->size-(size_t)o) return INFS_STATUS_IO_ERROR;
              memcpy(b,i->bytes+(size_t)o,s); return INFS_STATUS_OK;
          }
          static infs_status wr(void *c, uint64_t o, const void *b, size_t s) {
              struct image *i=c; if (o>i->size || s>i->size-(size_t)o) return INFS_STATUS_IO_ERROR;
              memcpy(i->bytes+(size_t)o,b,s); return INFS_STATUS_OK;
          }
          static infs_status fl(void *c){(void)c; return INFS_STATUS_OK;}
          static infs_status sz(void *c, uint64_t *bytes, int *is_device) {
              struct image *i=c; *bytes=i->size; *is_device=0; return INFS_STATUS_OK;
          }
          static infs_status rnd(void *c, void *b, size_t s) {
              struct image *i=c; unsigned char *out=b;
              for (size_t n=0;n<s;++n) { i->random_state ^= i->random_state << 13; i->random_state ^= i->random_state >> 7; i->random_state ^= i->random_state << 17; out[n]=(unsigned char)i->random_state; }
              return INFS_STATUS_OK;
          }
          static infs_status now(void *c, struct infs_timestamp *t) {
              (void)c; t->seconds=1788249600; t->nanoseconds=0; return INFS_STATUS_OK;
          }
          static void cls(void *c){(void)c;}
          static const struct infs_storage_ops ops = {
              .read_at=rd, .write_at=wr, .flush=fl, .get_size=sz,
              .random_bytes=rnd, .current_time=now, .close=cls,
          };
          static struct infs_storage make_storage(struct image *i) {
              struct infs_storage st={ .ops=&ops, .context=i }; return st;
          }
          '''
          if old not in s:
              raise SystemExit('compression metrics helper anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              'struct image image = { calloc(1, 64u*1024u*1024u), 64u*1024u*1024u };',
              'struct image image = { calloc(1, 64u*1024u*1024u), 64u*1024u*1024u, UINT64_C(0x9e3779b97f4a7c15) };')
          old = '''struct infs_storage st = { .ctx=&image, .read=rd, .write=wr, .flush=fl,
                                         .size_bytes=image.size };
              expect(infs_format_storage(&st, "compression-metrics") == INFS_STATUS_OK, "format");
              struct infs_volume vol;
              expect(infs_volume_open_storage(&vol,&st,1) == INFS_STATUS_OK, "open");'''
          new = '''struct infs_storage st = make_storage(&image);
              expect(infs_format_storage(&st, "compression-metrics") == INFS_STATUS_OK, "format");
              struct infs_volume vol;
              st = make_storage(&image);
              expect(infs_volume_open_storage(&vol,&st,1) == INFS_STATUS_OK, "open");'''
          if old not in s:
              raise SystemExit('compression metrics storage anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n tests/native-root-metadata-qualification.sh
          bash -n tests/root-boot-qemu.sh
          bash -n tests/root-readiness-policy.sh
          bash tests/root-readiness-policy.sh .
      - name: Build and test portable code
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Compile native module
        run: |
          set -euo pipefail
          kdir="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n1)"
          test -f "$kdir/Makefile"
          make -C kernel KDIR="$kdir"
      - name: Commit validated non-workflow implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kdir="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n1)"
          make -C kernel clean KDIR="$kdir" || true
          rm -rf build tools/__pycache__
          git checkout -- .github/workflows/release-packages.yml \
                          .github/workflows/root-volume-qualification.yml
          rm -f .github/workflows/root-boot-qualification.yml
          git rm tools/apply-root-readiness-0.18.44.py \
                 .github/workflows/apply-root-readiness-0.18.44.yml
          git add -A
          test -z "$(git status --porcelain | grep -E 'kernel/(\.?.*\.o|\.?.*\.ko|\.?.*\.cmd|Module\.symvers|modules\.order|.*\.mod(\.c)?)|__pycache__|\.pyc$' || true)"
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git commit -m 'Complete Linux root readiness and compression telemetry'
          git push origin HEAD:main
