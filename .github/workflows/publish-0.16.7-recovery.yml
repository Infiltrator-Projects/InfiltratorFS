# SPDX-License-Identifier: GPL-3.0-or-later
name: Finalize qualified 0.16.8 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-0.16.7-recovery.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-infiltratorfs-0.16.8
  cancel-in-progress: true

env:
  RELEASE_SHA: c30c47b9fa1df00b292a36b0d2fafbafa4b99bfb
  VERSION: 0.16.8
  QUALIFIED_RUN_ID: '32788558349'

jobs:
  publish:
    name: Publish already-qualified 0.16.8 release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact 0.16.8 release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git log -1 --format=%s)" = "Release $VERSION"
          grep -Fq "project(InfiltratorFS VERSION $VERSION LANGUAGES C)" CMakeLists.txt

      - name: Download qualified Linux and Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: recover-0.16.8-*
          path: qualified-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.QUALIFIED_RUN_ID }}

      - name: Stage, verify, checksum and publish v0.16.8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          deb="infiltratorfs_${VERSION}_amd64.deb"
          installer="infiltratorfs-${VERSION}-linux-native.run"
          windows="InfiltratorFS-Windows-${VERSION}.exe"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to move it." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; refusing to modify it." >&2
            exit 1
          fi

          mkdir -p release-assets
          for asset in "$deb" "$installer" "$windows"; do
            source_path="$(find qualified-assets -type f -name "$asset" -print -quit)"
            test -n "$source_path"
            test -s "$source_path"
            cp "$source_path" "release-assets/$asset"
          done

          test "$(dpkg-deb --field "release-assets/$deb" Version)" = "$VERSION"
          bash "release-assets/$installer" --verify
          (
            cd release-assets
            sha256sum "$deb" "$installer" "$windows" > SHA256SUMS.txt
          )

          gh release create "$tag" \
            "release-assets/$deb" \
            "release-assets/$installer" \
            "release-assets/$windows" \
            "release-assets/SHA256SUMS.txt" \
            --target "$RELEASE_SHA" \
            --title "InfiltratorFS $VERSION" \
            --generate-notes \
            --latest

          expected_assets=$(printf '%s\n%s\n%s\n%s\n' \
            "$deb" "$installer" "$windows" SHA256SUMS.txt | sort)
          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Unexpected release asset set.\nExpected:\n%s\nPublished:\n%s\n' \
              "$expected_assets" "$published_assets" >&2
            exit 1
          fi
