# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply Linux metadata lifecycle repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-linux-meta-empty-sidecar-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Install mounted qualification dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake kmod libcap2-bin \
            linux-headers-$(uname -r) rsync util-linux

      - name: Apply audited repair
        run: |
          set -euo pipefail
          python3 tools/apply-linux-meta-empty-sidecar-fix.py
          bash tests/native-small-file-scaling-policy.sh .
          git diff --check

      - name: Build candidate userspace and running-kernel module
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target \
            mkfs.infilfs infilfs-scrub infilfs-tool infiltratorfs-quota
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
          test "$(modinfo -F name kernel/infiltratorfs.ko)" = infiltratorfs

      - name: Prove quota ACL remount and scrub durability
        env:
          INFILFS_REQUIRE_SETFACL: "1"
        run: |
          set -euo pipefail
          sudo -E bash tests/native-quota-qualification.sh \
            build kernel/infiltratorfs.ko

      - name: Prove full Linux root metadata semantics
        run: |
          set -euo pipefail
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            bash tests/native-root-metadata-qualification.sh \
              build kernel/infiltratorfs.ko

      - name: Commit qualified repair
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- kernel/infiltratorfs_linux_meta.inc tests/native-small-file-scaling-policy.sh)"
          git config user.name "InfiltratorFS CI"
          git config user.email "actions@users.noreply.github.com"
          git add kernel/infiltratorfs_linux_meta.inc tests/native-small-file-scaling-policy.sh
          git commit -m "Fix deferred Linux metadata sidecar lifecycle"
          git push origin HEAD:main
