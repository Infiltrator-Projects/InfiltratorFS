name: Qualify batched Linux metadata publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qualify-linux-meta-batched-publication.yml'

permissions:
  contents: write

jobs:
  qualify-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake kmod libcap2-bin \
            linux-headers-$(uname -r) rsync util-linux
      - name: Apply bounded metadata publication candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          h = Path('kernel/infiltratorfs_internal.h')
          s = h.read_text()
          old = '''    bool linux_meta_dir_cached;\n    u8 linux_meta_dir_object_id[16];\n    u64 linux_meta_dir_object_block;\n'''
          new = '''    bool linux_meta_dir_cached;\n    u8 linux_meta_dir_object_id[16];\n    u64 linux_meta_dir_object_block;\n    u32 linux_meta_mutations_since_publish;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'sbi anchor count={s.count(old)}')
          h.write_text(s.replace(old, new, 1))

          p = Path('kernel/infiltratorfs_linux_meta.inc')
          s = p.read_text()
          anchor = '''#define INFILFS_LINUX_META_MAX (1024u * 1024u)\n'''
          repl = '''#define INFILFS_LINUX_META_MAX (1024u * 1024u)\n/*\n * Keep deferred Linux metadata fast without allowing thousands of sidecar\n * namespace mutations to accumulate in one native transaction.  64 metadata\n * updates amortise checkpoint cost while bounding transaction-private index\n * and directory state well below the pathological workload seen in rsync -X.\n */\n#define INFILFS_LINUX_META_PUBLISH_BATCH 64u\n'''
          if s.count(anchor) != 1:
              raise SystemExit('constant anchor changed')
          s = s.replace(anchor, repl, 1)

          anchor = '''static void infilfs_linux_meta_init(struct infilfs_linux_meta_header *header)\n{\n    memset(header, 0, sizeof(*header));\n    memcpy(header->magic, INFILFS_LINUX_META_MAGIC, sizeof(header->magic));\n    header->version = cpu_to_le32(INFILFS_LINUX_META_VERSION);\n}\n\n'''
          repl = anchor + '''static int infilfs_linux_meta_note_mutation(struct super_block *sb)\n{\n    struct infilfs_sb_info *sbi = INFILFS_SB(sb);\n    int ret;\n\n    if (!sbi)\n        return -EINVAL;\n    if (++sbi->linux_meta_mutations_since_publish <\n        INFILFS_LINUX_META_PUBLISH_BATCH)\n        return 0;\n    ret = infilfs_native_pending_flush_sb(sb);\n    if (!ret)\n        sbi->linux_meta_mutations_since_publish = 0;\n    return ret;\n}\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit('init anchor changed')
          s = s.replace(anchor, repl, 1)

          old = '''    if (empty)\n        return infilfs_linux_meta_remove_object_locked(sb, object_id);\n'''
          new = '''    if (empty) {\n        ret = infilfs_linux_meta_remove_object_locked(sb, object_id);\n        if (!ret)\n            ret = infilfs_linux_meta_note_mutation(sb);\n        return ret;\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('empty store anchor changed')
          s = s.replace(old, new, 1)

          old = '''    ret = ii ? infilfs_linux_meta_cache_insert(\n        sbi, object_id, ii->object_id, ii->object_block) : -EIO;\nout:\n'''
          new = '''    ret = ii ? infilfs_linux_meta_cache_insert(\n        sbi, object_id, ii->object_id, ii->object_block) : -EIO;\n    if (!ret)\n        ret = infilfs_linux_meta_note_mutation(sb);\nout:\n'''
          if s.count(old) != 1:
              raise SystemExit('store completion anchor changed')
          s = s.replace(old, new, 1)

          old = '''    if (!ret) {\n        struct iattr attr;\n        int ctime_ret;\n'''
          new = '''    /* Internal quota database updates are not visible inode metadata. */\n    if (!ret &&\n        !(handler && handler->prefix &&\n          strcmp(handler->prefix, XATTR_TRUSTED_PREFIX) == 0 &&\n          strcmp(name, \"infiltratorfs.quota-db\") == 0)) {\n        struct iattr attr;\n        int ctime_ret;\n'''
          if s.count(old) != 1:
              raise SystemExit('ctime anchor changed')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- kernel/infiltratorfs_internal.h kernel/infiltratorfs_linux_meta.inc
      - name: Build candidate
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub infilfs-tool infiltratorfs-quota
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
      - name: Quota ACL remount and scrub
        env:
          INFILFS_REQUIRE_SETFACL: '1'
        run: sudo -E bash tests/native-quota-qualification.sh build kernel/infiltratorfs.ko
      - name: Five-thousand xattr throughput remount and scrub
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; image="$work/perf.img"; mnt="$work/mnt"; loop=""
          cleanup(){ set +e; sync; mountpoint -q "$mnt" && sudo umount "$mnt"; [[ -n "$loop" ]] && sudo losetup -d "$loop" 2>/dev/null; sudo rmmod infiltratorfs 2>/dev/null; rm -rf "$work"; }
          trap cleanup EXIT
          mkdir -p "$mnt"; truncate -s 4G "$image"; build/mkfs.infilfs "$image" >/dev/null
          loop="$(sudo losetup --find --show "$image")"; sudo insmod kernel/infiltratorfs.ko; sudo mount -t infiltratorfs "$loop" "$mnt"
          sudo python3 - "$mnt" <<'PY'
          import os, sys, time
          root=sys.argv[1]; n=5000; paths=[]
          t=time.monotonic()
          for i in range(n):
              p=os.path.join(root,f'f{i:05d}')
              with open(p,'wb',buffering=0) as f: f.write(b'x'*4096)
              paths.append(p)
          create=time.monotonic()-t
          t=time.monotonic()
          for p in paths: os.setxattr(p,b'user.ifsbench',b'1')
          xattr=time.monotonic()-t
          print(f'5000 create+4K: {create:.3f}s')
          print(f'5000 xattr sets: {xattr:.3f}s')
          if xattr > 60.0: raise SystemExit(f'xattr too slow: {xattr:.3f}s')
          PY
          sync; sudo umount "$mnt"
          build/infilfs-scrub "$loop" | tee "$work/scrub1.txt"
          grep -Fq 'Result:              CLEAN' "$work/scrub1.txt"
          sudo mount -t infiltratorfs "$loop" "$mnt"
          sudo python3 - "$mnt" <<'PY'
          import os,sys
          root=sys.argv[1]
          for i in range(0,5000,113): assert os.getxattr(os.path.join(root,f'f{i:05d}'),b'user.ifsbench') == b'1'
          print('xattr remount persistence: PASS')
          PY
          sync; sudo umount "$mnt"
          build/infilfs-scrub "$loop" | tee "$work/scrub2.txt"
          grep -Fq 'Result:              CLEAN' "$work/scrub2.txt"
          sudo losetup -d "$loop"; loop=""; sudo rmmod infiltratorfs; trap - EXIT; rm -rf "$work"
      - name: Commit qualified source fix
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_internal.h kernel/infiltratorfs_linux_meta.inc
          git commit -m 'Bound deferred Linux metadata publication'
          git push origin HEAD:main
