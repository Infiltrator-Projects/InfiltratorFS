name: One-shot Linux 7.0 inode repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux70-inode-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Linux 7.0 inode-state compatibility and release bump
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('kernel/infiltratorfs.c')
          text = source.read_text()

          include_old = '#include <linux/uio.h>\n'
          include_new = '#include <linux/uio.h>\n#include <linux/version.h>\n'
          if '#include <linux/version.h>' not in text:
              if include_old not in text:
                  raise SystemExit('expected uio include marker not found')
              text = text.replace(include_old, include_new, 1)

          infs_i = '''static struct infilfs_inode_info *INFILFS_I(struct inode *inode)\n{\n    return inode->i_private;\n}\n'''
          helper = '''\nstatic bool infilfs_inode_is_new(struct inode *inode)\n{\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(7, 0, 0)\n    return (inode_state_read_once(inode) & I_NEW) != 0;\n#else\n    return (READ_ONCE(inode->i_state) & I_NEW) != 0;\n#endif\n}\n'''
          if 'static bool infilfs_inode_is_new' not in text:
              if infs_i not in text:
                  raise SystemExit('expected INFILFS_I marker not found')
              text = text.replace(infs_i, infs_i + helper, 1)

          old_state = '    if (!(inode->i_state & I_NEW))\n'
          new_state = '    if (!infilfs_inode_is_new(inode))\n'
          if old_state in text:
              text = text.replace(old_state, new_state, 1)
          elif new_state not in text:
              raise SystemExit('expected inode I_NEW test not found')

          source.write_text(text)

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          old = 'project(InfiltratorFS VERSION 0.16.12 LANGUAGES C)'
          new = 'project(InfiltratorFS VERSION 0.16.13 LANGUAGES C)'
          if old not in text and new not in text:
              raise SystemExit('expected CMake version marker not found')
          cmake.write_text(text.replace(old, new, 1))

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('**Current implementation:** 0.16.12<br>',
                              '**Current implementation:** 0.16.13<br>', 1)
          text = text.replace('InfiltratorFS-Windows-0.16.12.exe',
                              'InfiltratorFS-Windows-0.16.13.exe', 1)
          text = text.replace('chmod +x infiltratorfs-0.16.12-linux-native.run',
                              'chmod +x infiltratorfs-0.16.13-linux-native.run', 1)
          text = text.replace('./infiltratorfs-0.16.12-linux-native.run --dry-run',
                              './infiltratorfs-0.16.13-linux-native.run --dry-run', 1)
          note = ('\n\nImplementation 0.16.13 adds the Linux 7.0 inode-state compatibility path. '
                  'Linux 7.0 changed `inode->i_state` from a directly bit-testable scalar to '
                  '`struct inode_state_flags`; the native adapter now uses the kernel '
                  '`inode_state_read_once()` accessor on 7.0+ while preserving the legacy '
                  'read path on earlier supported kernels. Format 0.12 is unchanged.')
          if 'Implementation 0.16.13 adds the Linux 7.0 inode-state compatibility path.' not in text:
              text = text.rstrip() + note + '\n'
          readme.write_text(text)

          kernel_readme = Path('kernel/README.md')
          text = kernel_readme.read_text()
          text = text.replace('Release 0.16.12 packages the source through DKMS',
                              'Release 0.16.13 packages the source through DKMS', 1)
          sentence = (' The adapter uses the Linux 7.0 inode-state accessor when building '
                      'against 7.0+ headers, while retaining the older scalar state path for '
                      'earlier supported kernels.')
          anchor = 'The result is `kernel/infiltratorfs.ko`. Loading it is a normal module operation (`insmod`/`modprobe`), not a kernel rebuild.'
          if sentence.strip() not in text:
              text = text.replace(anchor, anchor + sentence, 1)
          kernel_readme.write_text(text)
          PY

          git diff --check
          git diff -- kernel/infiltratorfs.c CMakeLists.txt README.md kernel/README.md

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs.c CMakeLists.txt README.md kernel/README.md
          git commit -m 'Release 0.16.13: support Linux 7.0 inode state'
          git push origin HEAD:main
