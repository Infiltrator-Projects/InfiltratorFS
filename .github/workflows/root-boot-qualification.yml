# SPDX-License-Identifier: GPL-3.0-or-later
name: Linux root boot qualification

# Release-time filesystem smoke only. Full distro/root-boot installation is
# deliberately manual: CI proves the filesystem itself can be formatted,
# mounted by the native driver, exercised, remounted and scrubbed clean.

on:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/release-trigger'
      - '.github/workflows/root-boot-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-boot:
    name: Native filesystem release smoke
    concurrency:
      group: root-boot-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install minimal filesystem qualification dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake kmod python3 util-linux
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"
          test -f "/lib/modules/$(uname -r)/build/Makefile"

      - name: Build native module and filesystem tools
        shell: bash
        run: |
          set -euo pipefail
          kdir="/lib/modules/$(uname -r)/build"
          make -C kernel clean KDIR="$kdir" || true
          make -C kernel KDIR="$kdir"
          test -s kernel/infiltratorfs.ko
          test "$(modinfo -F vermagic kernel/infiltratorfs.ko | awk '{print $1}')" = "$(uname -r)"
          cmake -S . -B build-root-boot -DCMAKE_BUILD_TYPE=Release
          cmake --build build-root-boot --parallel --target mkfs.infilfs infilfs-scrub

      - name: Format, mount, exercise, remount and scrub clean
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/native-device-node-open-qualification.sh
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            bash tests/native-device-node-open-qualification.sh \
              build-root-boot kernel/infiltratorfs.ko
          image="$RUNNER_TEMP/infiltratorfs-device-node-open/device-node.raw"
          test -s "$image"
          build-root-boot/infilfs-scrub "$image" | tee "$RUNNER_TEMP/infiltratorfs-release-smoke-scrub.txt"
          grep -Fq 'Result:              CLEAN' "$RUNNER_TEMP/infiltratorfs-release-smoke-scrub.txt"
          echo 'InfiltratorFS native filesystem release smoke: PASS'

      - name: Preserve filesystem smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InfiltratorFS-filesystem-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/infiltratorfs-release-smoke-scrub.txt
          if-no-files-found: warn
          retention-days: 30
