# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot dead file-block wrapper cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-remove-dead-map-wrapper.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove dead file-block wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core = Path('kernel/infiltratorfs_core.c')
          text = core.read_text()
          block = '''static int infilfs_map_file_block(
              struct inode *inode, const u8 *object, u64 logical,
              u64 *physical_out, u32 *flags_out)
          {
              return infilfs_map_file_block_detail(
                  inode, object, logical, physical_out, flags_out, NULL, NULL);
          }

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          if text.count(block) != 1:
              raise SystemExit('dead file-block wrapper shape changed')
          core.write_text(text.replace(block, '', 1))

          policy = Path('tests/native-kernel-maintainability-policy.sh')
          text = policy.read_text()
          anchor = '    infilfs_vfs_decode_time \\\n    infilfs_native_available_data_blocks; do\n'
          replacement = '    infilfs_vfs_decode_time \\\n    infilfs_map_file_block \\\n    infilfs_native_available_data_blocks; do\n'
          if text.count(anchor) != 1:
              raise SystemExit('retired helper list anchor changed')
          policy.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -Rq --include='*.c' --include='*.inc' 'infilfs_map_file_block(' kernel
          grep -Rq --include='*.c' --include='*.inc' 'infilfs_map_file_block_detail(' kernel
          bash tests/native-kernel-maintainability-policy.sh .

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The First Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/one-shot-remove-dead-map-wrapper.yml
          git add kernel/infiltratorfs_core.c tests/native-kernel-maintainability-policy.sh
          git diff --cached --check
          git commit -m 'kernel: remove dead file-block wrapper'
          git push origin HEAD:main
