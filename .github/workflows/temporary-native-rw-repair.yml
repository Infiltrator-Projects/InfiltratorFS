name: Temporary native RW implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-native-rw-repair.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libfuse3-dev fuse3 dkms kmod linux-headers-generic
      - name: Patch native RW integration
        shell: bash
        run: |
          python3 .github/native-rw-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs.c')
          s = p.read_text()
          marker = '#include <linux/random.h>\n'
          addition = marker + '#include <linux/sched.h>\n'
          if '#include <linux/sched.h>' not in s:
              if marker not in s:
                  raise SystemExit('random include marker not found')
              s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
      - name: Validate source edits
        run: |
          bash -n support/installer/bootstrap.sh
          bash -n packaging/build-linux-packages.sh
          git diff --check
      - name: Build userspace suite
        run: |
          cmake -S . -B build-rw -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rw --parallel
          ctest --test-dir build-rw --output-on-failure
      - name: Build native module against generic headers
        shell: bash
        run: |
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n1)"
          test -f "$KDIR/Makefile"
          make -C kernel clean KDIR="$KDIR" || true
          make -C kernel KDIR="$KDIR"
          test -s kernel/infiltratorfs.ko
      - name: Commit implementation
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs.c kernel/infiltratorfs_format.h kernel/infiltratorfs_rw.inc support/installer/bootstrap.sh packaging/build-linux-packages.sh CMakeLists.txt
          git commit -m 'Implement initial native Linux read-write path'
          git push origin HEAD:main
