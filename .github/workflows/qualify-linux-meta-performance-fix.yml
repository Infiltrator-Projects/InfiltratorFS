name: Qualify Linux metadata performance repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qualify-linux-meta-performance-fix.yml'

permissions:
  contents: write

jobs:
  qualify-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl attr build-essential cmake kmod libcap2-bin \
            linux-headers-$(uname -r) rsync util-linux
      - name: Isolate internal quota metadata from visible inode ctime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/infiltratorfs_linux_meta.inc')
          s = p.read_text()
          old = '''    if (!ret) {\n        struct iattr attr;\n        int ctime_ret;\n'''
          new = '''    /*\n     * trusted.infiltratorfs.quota-db is internal filesystem bookkeeping, not\n     * user-visible inode metadata.  Rewriting the host inode ctime for every\n     * quota database update both misstates POSIX semantics and interleaves a\n     * second object rewrite with the still-deferred quota sidecar transaction.\n     * Keep normal xattr ctime semantics for every externally visible xattr, but\n     * do not manufacture a ctime change for this private quota record.\n     */\n    if (!ret &&\n        !(handler && handler->prefix &&\n          strcmp(handler->prefix, XATTR_TRUSTED_PREFIX) == 0 &&\n          strcmp(name, \"infiltratorfs.quota-db\") == 0)) {\n        struct iattr attr;\n        int ctime_ret;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'xattr ctime anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- kernel/infiltratorfs_linux_meta.inc
      - name: Build candidate
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target mkfs.infilfs infilfs-scrub infilfs-tool infiltratorfs-quota
          make -C kernel KDIR="/lib/modules/$(uname -r)/build"
      - name: Prove quota ACL remount and scrub durability
        env:
          INFILFS_REQUIRE_SETFACL: '1'
        run: sudo -E bash tests/native-quota-qualification.sh build kernel/infiltratorfs.ko
      - name: Prove ordinary xattr throughput and scrub durability
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; image="$work/perf.img"; mnt="$work/mnt"; loop=""
          cleanup(){ set +e; sync; mountpoint -q "$mnt" && sudo umount "$mnt"; [[ -n "$loop" ]] && sudo losetup -d "$loop" 2>/dev/null; sudo rmmod infiltratorfs 2>/dev/null; rm -rf "$work"; }
          trap cleanup EXIT
          mkdir -p "$mnt"
          truncate -s 4G "$image"
          build/mkfs.infilfs "$image" >/dev/null
          loop="$(sudo losetup --find --show "$image")"
          sudo insmod kernel/infiltratorfs.ko
          sudo mount -t infiltratorfs "$loop" "$mnt"
          sudo python3 - "$mnt" <<'PY'
          import os, sys, time
          root=sys.argv[1]
          n=5000
          paths=[]
          t=time.monotonic()
          for i in range(n):
              p=os.path.join(root,f'f{i:05d}')
              with open(p,'wb',buffering=0) as f:
                  f.write(b'x'*4096)
              paths.append(p)
          create_elapsed=time.monotonic()-t
          t=time.monotonic()
          for p in paths:
              os.setxattr(p,b'user.ifsbench',b'1')
          xattr_elapsed=time.monotonic()-t
          print(f'5000 create+4K: {create_elapsed:.3f}s')
          print(f'5000 xattr sets: {xattr_elapsed:.3f}s')
          if xattr_elapsed > 60.0:
              raise SystemExit(f'xattr path remains pathological: {xattr_elapsed:.3f}s')
          for p in paths[::113]:
              assert os.getxattr(p,b'user.ifsbench') == b'1'
          PY
          sync
          sudo umount "$mnt"
          sudo mount -t infiltratorfs "$loop" "$mnt"
          sudo python3 - "$mnt" <<'PY'
          import os, sys
          root=sys.argv[1]
          for i in range(0,5000,113):
              assert os.getxattr(os.path.join(root,f'f{i:05d}'),b'user.ifsbench') == b'1'
          print('xattr remount persistence: PASS')
          PY
          sync
          sudo umount "$mnt"
          build/infilfs-scrub "$loop" | tee "$work/scrub.txt"
          grep -Fq 'Result:              CLEAN' "$work/scrub.txt"
          sudo losetup -d "$loop"; loop=""
          sudo rmmod infiltratorfs
          trap - EXIT
          rm -rf "$work"
      - name: Commit qualified source repair
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel/infiltratorfs_linux_meta.inc
          git commit -m 'Fix deferred Linux quota metadata persistence'
          git push origin HEAD:main
