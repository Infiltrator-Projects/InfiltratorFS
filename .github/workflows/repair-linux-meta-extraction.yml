name: Repair Linux metadata extraction

on:
  push:
    paths:
      - '.github/workflows/repair-linux-meta-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair codec/cache boundary
        run: python3 tools/repair-linux-meta-codec-boundary.py

      - name: Guard maintainability contract
        run: bash tests/native-kernel-maintainability-policy.sh .

      - name: Compile kernel module
        shell: bash
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends build-essential linux-headers-generic >/dev/null
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -print | sort -V | tail -n1)"
          test -f "$KDIR/Makefile"
          make -C kernel KDIR="$KDIR"

      - name: Commit repaired boundary to main
        shell: bash
        run: |
          # Do not include the one-shot workflow itself in the source commit.
          git checkout -- .github/workflows/repair-linux-meta-extraction.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add kernel tools tests packaging
          git diff --cached --quiet && { echo 'No repair changes produced.'; exit 1; }
          git commit -m 'Repair Linux metadata modularization boundary'
          git push origin HEAD:main
